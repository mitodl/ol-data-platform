    children: []
    id: MARKDOWN-feedbackintro
    meta:
      code: 'Learner feedback from Zendesk support tickets, the Learn AI tutor, discussion
        forums and in-course content feedback, grouped into categories by clustering
        similar conversations.


        - **Feedback Categories** counts conversations in each category. The axis
        uses a log scale.

        - Click a bar to filter **Feedback Cluster Conversations** to that category.

        - Category labels, descriptions and summaries are AI-generated. The **Conversation**
        column has the full text, with personal information removed.

        - For Zendesk, **Conversation ID** is the ticket ID. Open the ticket at
        https://odl.zendesk.com/agent/tickets/ followed by the ID.'
      height: 30
      width: 12
