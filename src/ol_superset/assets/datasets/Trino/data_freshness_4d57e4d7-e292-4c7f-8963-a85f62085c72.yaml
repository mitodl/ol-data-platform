schema: ol_warehouse_production_reporting
sql: |
  {#- When each table a dashboard reads was last built, read live from the table's
      Iceberg snapshots, for the dashboards' freshness tiles. A dbt table model is
      recreated on every build, so its latest commit is its last build; compaction
      (operation 'replace') rewrites files without new data, so it is skipped. Add a
      (layer, table) pair here when a governed dashboard starts reading a table. -#}
  {%- set dashboard_tables = [
      ("reporting", "chatbot_usage_report"),
      ("reporting", "course_staff_report"),
      ("dimensional", "dim_user"),
      ("reporting", "enrollment_detail_report"),
      ("mart", "marts__combined__orders"),
      ("mart", "marts__combined__products"),
      ("mart", "marts__combined_course_enrollment_detail"),
      ("mart", "marts__combined_coursesinprogram"),
      ("mart", "marts__combined_discounts"),
      ("reporting", "orders_with_product_report"),
  ] %}
  {%- for layer, table in dashboard_tables %}
  select
      '{{ table }}' as table_name
      , 'ol_warehouse_production_{{ layer }}' as table_schema
      , (
          select cast(max(committed_at) at time zone 'UTC' as timestamp(3))
          from ol_warehouse_production_{{ layer }}."{{ table }}$snapshots"
          where operation != 'replace'
      ) as last_built_at
  {%- if not loop.last %}
  union all
  {%- endif %}
  {%- endfor %}
table_name: data_freshness
