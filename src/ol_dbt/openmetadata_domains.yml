---
# OpenMetadata domain for each dbt model, snapshot, seed and source, and for
# the lake tables dbt does not declare.
#
# The lakehouse code applies these rules to manifest.json when it uploads the
# manifest for OpenMetadata (dg_projects/lakehouse/lakehouse/lib/
# openmetadata_domains.py), and the nightly om-ingest-dbt job sets each table's
# domain from the result. The lakehouse code uploads the rules too, and
# ol-infrastructure's om-ingest-domains job (open_metadata/scripts/
# domain_assignment.py) applies them by name to the raw and other lake tables
# that are not in the manifest. That job also gives each Superset dataset and
# dashboard the domain of the tables it reads, or none when they span several.
# Glue's copies of the lake tables, Dagster and Airbyte pipelines, and charts
# get no domain; see that script for why.
#
# The rules live here rather than in dbt_project.yml because the model folders
# are split by source platform, not business area, and dbt merges `meta`
# shallowly: a per-model `openmetadata` override would have to repeat owner and
# tier.
#
# Each node's name is matched against the rules in order, case-insensitively,
# with shell-style globs, and the first match wins. A node that sets
# `meta.openmetadata.domain` itself keeps it (it must also repeat owner and
# tier, see dbt_project.yml). `domain: null` marks a node as deliberately in no
# domain, e.g. a conformed dimension like dim_date that every domain shares.
# Nodes no rule matches are logged as unassigned on every upload.
#
# `domains` lists the domain names that exist in OpenMetadata. They are created
# by ol-infrastructure's om_server_config.py (DOMAIN_CONFIG); a name OpenMetadata
# does not know is skipped by the ingestion with a warning, so add it there first.
domains:
- learners-identity
- courses-content
- enrollments-progress
- commerce
- b2b
- feedback
- engagement

rules:
  # Shared reference data with no single owning business area.
- domain:
  match:
  - dim_date
  - dim_time
  - dim_platform
  - platforms
  - "*django_content_type"
  - "*reversion_*"
  - "*wagtailcore_*"
  - "*wagtailimages_*"
  - "*wagtail_page"

  # Courseware knowledge: concepts, claims and the concept graph extracted from
  # course content, with the Learn views that publish them. It sits ahead of the
  # broad patterns because "concept" matches none of them and a courseware name
  # can carry a word that one routes elsewhere (e.g. "assessment"). The prefixes
  # are explicit because "*courseware_*" would also take the Open edX
  # courseware_studentmodule tables, which are learner activity.
- domain: courses-content
  match:
  - int__courseware__*
  - courseware_*
  - dim_courseware_*
  - tfact_courseware_*
  - dim_concept*
  - bridge_concept_*
  - bridge_course_content_concept
  - bridge_courserun_concept
  - bridge_courserun_prerequisite_*
  - afact_concept_graph_*
  - snapshot_bridge_concept_*
  - integrations__learn__concepts
  - integrations__learn__resource_concepts
  - integrations__learn__resource_knowledge

  # Names that the broader patterns below would misfile.
- domain: courses-content
  match:
  - dim_course_content_progress_block
  - bridge_user_courserun_role
  - user_course_roles
  - "*course_staff*"
  - "*courseaccessrole*"
  - "*instructor*"
    # Open edX organizations are course publishers (MITx, MITxT), not customers.
  - "*openedx__mysql__organizations_*"
  - dim_discussion_topic
    # Calendar events published to MIT Learn, not tracking events.
  - "*__api__events"
- domain: enrollments-progress
  match:
  - "*program_entitlement*"
  - "*edxorg_to_mitxonline_enrollments"
  - "*edxorg_to_mitxonline_program_certificates"
  - "*program_learner_report*"
  - "*student_risk_probability*"
  - "*micromasters_summary*"
- domain: learners-identity
  match:
  - "*edxorg_to_mitxonline_users"
  - "*edxorg_mitlearn_user_mapping*"
  - "*learner_demographics*"
  - "*gender*"
- domain: engagement
  match:
  - "*user_courseactivit*"
  - "*userlist*"
  - "*percolatequery*"

- domain: feedback
  match:
  - "*feedback*"
  - "*sentiment*"
  - "*zendesk*"
  - "*chatresponserating*"

- domain: b2b
  match:
  - "*b2b*"
  - "*contract*"
  - "*organization*"
  - "*ecommerce_company*"
    # Salesforce holds xPRO's corporate sales opportunities.
  - "*salesforce*"

- domain: commerce
  match:
  - "*ecommerce*"
  - "*order*"
  - "*payment*"
  - "*discount*"
  - "*coupon*"
  - "*product*"
  - "*receipt*"
  - "*basket*"
