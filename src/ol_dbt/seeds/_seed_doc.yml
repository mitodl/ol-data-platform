---
version: 2

seeds:
- name: user_course_roles
  description: user access roles seed file used for row level access filters on Superset
  columns:
  - name: hashed_user_email
    description: str, user_email hashed in sha256 by generate_hash_id.
  - name: courserun_readable_id
    description: str, open edX Course ID formatted as course-v1:{org}+{course code}+{run_tag}
      for MITx Online courses, {org}/{course}/{run_tag} for edX.org courses.
  - name: courseaccess_role
    description: str, instructor or staff
  - name: organization
    description: str, organization that lists the course. e.g. MITx, MITxT
  - name: platform
    description: str, MITx Online or edX.org

- name: platforms
  description: Platform information about the technical system that a given event
    is executed within the context of.
  columns:
  - name: id
    description: string, unique identifier for the platform, e.g., mitxonline
    tests:
    - not_null
    - unique
  - name: platform_name
    description: string, name of the platform
    tests:
    - not_null
    - unique
  - name: platform_description
    description: string, description of the platform
    tests:
    - not_null
  - name: platform_domain
    description: string, domain name of the platform, e.g. mitxonline.mit.edu
    tests:
    - not_null

- name: edxorg_to_mitxonline_program_mapping
  description: Maps each edX.org MicroMasters program title, at the track level for
    Statistics and Data Science, to the MITx Online program it moved to. Keyed on
    the title because int__micromasters__program_certificates has no other column
    that tells SDS tracks apart, and mapped to the readable id, not the database id,
    so the seed does not depend on one environment's id sequence.
  columns:
  - name: edxorg_program_title
    description: string, program title on an edX.org MicroMasters program certificate,
      or the MicroMasters program title on an override certificate
    tests:
    - not_null
    - unique
  - name: mitxonline_program_readable_id
    description: string, readable id of the MITx Online program, formatted as program-v1:{org}+{code}
    tests:
    - not_null

- name: legacy_edx_certificate_revision_mapping
  description: Mapping edX certificates to MITx Online certificate revisions for legacy
    edX courses that were missing signatory information from edX course export.These
    signatories are manually created in the CMS.
  columns:
  - name: courserun_readable_id
    description: string, the open edX course run ID formatted as course-v1:{org}+{course
      code}+{run tag}
  - name: certificate_page_id
    description: int, the certificate page ID in mitxonline application
  - name: certificate_page_revision_id
    description: int, the certificate page revision ID in mitxonline application

- name: feedback_sources
  description: The feedback source systems that tfact_feedback aggregates. Hand-curated
    and near-static; seeds dim_feedback_source.
  columns:
  - name: source_slug
    description: string, stable machine key for the source. e.g. zendesk
    tests:
    - not_null
    - unique
  - name: source_name
    description: string, display name for the source
    tests:
    - not_null
  - name: source_medium
    description: string, the kind of artifact the source produces. e.g. support_ticket
    tests:
    - not_null
  - name: source_audience_scope
    description: string, the altitude the source serves - operational, course or strategic
    tests:
    - not_null
  - name: is_course_scoped
    description: boolean, whether courserun_fk applies to this source
    tests:
    - not_null
  - name: is_conversational
    description: boolean, whether conversation_id and turn_index are meaningful for
      this source
    tests:
    - not_null

- name: feedback_channels
  description: The conformed channel value set - how feedback arrived, normalized
    across sources. Seeds dim_feedback_channel.
  columns:
  - name: channel_slug
    description: string, the conformed channel value. e.g. email, web_form
    tests:
    - not_null
    - unique
  - name: channel_name
    description: string, display name for the channel
    tests:
    - not_null
  - name: is_solicited
    description: boolean, whether we asked for this feedback or the user volunteered
      it
    tests:
    - not_null

- name: sentiments
  description: The static sentiment buckets. Seeds dim_sentiment. Deliberately has
    no 'unknown' member - an unscored conversation carries a null sentiment_fk instead.
  columns:
  - name: sentiment_slug
    description: string, the sentiment value - positive, neutral or negative
    tests:
    - not_null
    - unique
  - name: polarity_score_bucket
    description: string, optional coarser grouping for trend rollups. Left empty until
      the sentiment task introduces a finer label set for it to collapse.

- name: learn_topics
  description: >
    The MIT Learn topic taxonomy. The data platform owns this definition so topic
    mapping for learning resource delivery (and any other consumer) happens here
    rather than inside MIT Learn. Until the MIT Learn ETL cutover, MIT Learn's own
    data_fixtures migrations still write the taxonomy, so
    tests/assert_learn_topic_seeds_match_mitlearn.sql fails on any drift between this
    seed and MIT Learn's replicated tables. int__learn__offeror_topic_lookup depends
    on the replicated tables too, so in `dbt build` a failure skips the lookup and
    the delivery models downstream of it. When it fails, update the seed to match.
    Generated from MIT Learn's production tables as replicated to the warehouse, not
    from topics.yaml or a fresh migrate: data_fixtures migrations 0022/0023 create
    topics with random UUIDs and later full-file upserts drop mappings that
    production kept, so neither reproduces production.
  config:
    column_types:
      topic_uuid: varchar
      topic_name: varchar
      parent_topic_uuid: varchar
  columns:
  - name: topic_uuid
    description: string, stable identifier for the topic (MIT Learn topic_uuid)
    tests:
    - not_null
    - unique
  - name: topic_name
    description: string, the topic name. MIT Learn matches topics by exact name.
    tests:
    - not_null
    - unique
  - name: parent_topic_uuid
    description: string, topic_uuid of the parent topic, empty for top-level topics
    tests:
    - relationships:
        arguments:
          to: ref('learn_topics')
          field: topic_uuid

- name: learn_topic_offeror_mappings
  description: >
    Per-offeror crosswalk from an offeror's own topic names to learn_topics. One
    offeror topic name can map to several topics. Kept in sync with MIT Learn's
    LearningResourceTopicMapping by tests/assert_learn_topic_seeds_match_mitlearn.sql
    until the MIT Learn ETL cutover. Production holds most mappings twice under
    different ids; the seed keeps the distinct set, which is all topic resolution
    reads.
  config:
    column_types:
      offeror_code: varchar
      offeror_topic_name: varchar
      topic_uuid: varchar
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - offeror_code
        - offeror_topic_name
        - topic_uuid
  columns:
  - name: offeror_code
    description: string, MIT Learn offeror code, e.g. mitx, ocw, mitpe
    tests:
    - not_null
  - name: offeror_topic_name
    description: string, the offeror's own topic name, e.g. an edX subject
    tests:
    - not_null
  - name: topic_uuid
    description: string, the learn_topics topic the offeror topic maps to
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('learn_topics')
          field: topic_uuid

- name: iso_4217_currencies
  description: >
    ISO 4217 currency codes, as pycountry 24.6.1 (the version MIT Learn pins) lists
    them. MIT Learn's transform_price keeps a price's currency only when
    pycountry.currencies knows it and falls back to USD otherwise; the Learn
    integrations models check against this seed to do the same. Regenerate from the
    pycountry version mit-learn pins.
  config:
    column_types:
      currency_code: varchar
      currency_name: varchar
  columns:
  - name: currency_code
    description: str, three-letter ISO 4217 code, e.g. USD
    tests:
    - not_null
    - unique
  - name: currency_name
    description: str, the currency's name
- name: courseware_extraction_allowlist
  description: >
    The course runs whose courseware is assembled for claim extraction, and the
    extractor version each is approved for. A run takes its own row, else its
    course's row, else its platform's row (course_readable_id and
    courserun_readable_id both empty), and a run matching no row is left out of
    int__courseware__extraction_sources and never extracted. The courseware
    extraction sensor observes a run only while its approved version is the one the
    deployed extractor runs, so a prompt or schema change extracts nothing until the
    rows here name the new version. Approve a run, or a new version, by editing this
    file. The version values are the ones dim_courseware_extraction shows.
  config:
    column_types:
      platform: varchar
      course_readable_id: varchar
      courserun_readable_id: varchar
      extractor_id: varchar
      prompt_version: varchar
      schema_version: varchar
  # Duplicates tie on match_rank in int__courseware__extraction_source_checksums,
  # and the build would pick one of their versions arbitrarily, so one bad row is
  # the failure and the project's >10 does not apply.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - platform
        - course_readable_id
        - courserun_readable_id
      config:
        error_if: ">0"
  # A row naming both would tie with the run's own row the same way.
  - dbt_utils.expression_is_true:
      expression: course_readable_id is null or courserun_readable_id is null
      config:
        error_if: ">0"
  columns:
  - name: platform
    description: str, mitxonline, mitxpro or residential
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [mitxonline, mitxpro, residential]
  - name: course_readable_id
    description: str, the course whose runs this row approves, as dim_course spells
      it (e.g. course-v1:UAI_SOURCE+UAI.4); empty for a run or platform row
  - name: courserun_readable_id
    description: str, the run this row approves; empty for a course or platform row
  - name: extractor_id
    description: str, the extractor version's id, e.g. courseware_claims_v1
    tests:
    - not_null:
        config:
          error_if: ">0"
  - name: prompt_version
    description: str, the first 12 hex digits of the system prompt's sha256
    tests:
    - not_null:
        config:
          error_if: ">0"
  - name: schema_version
    description: str, the first 12 hex digits of the output schema's sha256
    tests:
    - not_null:
        config:
          error_if: ">0"

- name: courseware_description_approval
  description: >
    The courseware concept description prompt version the description asset may
    describe under. The asset makes no model call when the deployed
    DESCRIPTION_PROMPT's version is not the one named here (a run automation
    requested logs why, any other run fails), so a prompt edit describes nothing
    until this row is promoted to it, and then describes every concept under it
    once. The promotion may deploy before or after the ml image carrying the
    prompt; whichever lands second requests the run that describes. At most one
    row; an empty file, or more than one row, approves nothing.
  config:
    column_types:
      prompt_version: varchar
  tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        max_value: 1
      config:
        # One extra row is the failure, so the project's >10 does not apply.
        error_if: ">0"
  columns:
  - name: prompt_version
    description: str, the first 12 hex digits of DESCRIPTION_PROMPT's sha256 (ml.lib.courseware.describe.DESCRIPTION_PROMPT_VERSION;
      a failed description run names the deployed one)
    tests:
    - not_null
