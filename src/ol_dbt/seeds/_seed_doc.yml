---
version: 2

seeds:
- name: user_course_roles
  description: user access roles seed file used for row level access filters on Superset
  columns:
  - name: hashed_user_email
    description: str, user_email hashed in sha256 by generate_hash_id.
  - name: courserun_readable_id
    description: str, open edX Course ID formatted as course-v1:{org}+{course code}+{run_tag}
      for MITx Online courses, {org}/{course}/{run_tag} for edX.org courses.
  - name: courseaccess_role
    description: str, instructor or staff
  - name: organization
    description: str, organization that lists the course. e.g. MITx, MITxT
  - name: platform
    description: str, MITx Online or edX.org

- name: platforms
  description: Platform information about the technical system that a given event
    is executed within the context of.
  columns:
  - name: id
    description: string, unique identifier for the platform, e.g., mitxonline
    tests:
    - not_null
    - unique
  - name: platform_name
    description: string, name of the platform
    tests:
    - not_null
    - unique
  - name: platform_description
    description: string, description of the platform
    tests:
    - not_null
  - name: platform_domain
    description: string, domain name of the platform, e.g. mitxonline.mit.edu
    tests:
    - not_null

- name: legacy_edx_certificate_revision_mapping
  description: Mapping edX certificates to MITx Online certificate revisions for legacy
    edX courses that were missing signatory information from edX course export.These
    signatories are manually created in the CMS.
  columns:
  - name: courserun_readable_id
    description: string, the open edX course run ID formatted as course-v1:{org}+{course
      code}+{run tag}
  - name: certificate_page_id
    description: int, the certificate page ID in mitxonline application
  - name: certificate_page_revision_id
    description: int, the certificate page revision ID in mitxonline application

- name: feedback_sources
  description: The feedback source systems that tfact_feedback aggregates. Hand-curated
    and near-static; seeds dim_feedback_source.
  columns:
  - name: source_slug
    description: string, stable machine key for the source. e.g. zendesk
    tests:
    - not_null
    - unique
  - name: source_name
    description: string, display name for the source
    tests:
    - not_null
  - name: source_medium
    description: string, the kind of artifact the source produces. e.g. support_ticket
    tests:
    - not_null
  - name: source_audience_scope
    description: string, the altitude the source serves - operational, course or strategic
    tests:
    - not_null
  - name: is_course_scoped
    description: boolean, whether courserun_fk applies to this source
    tests:
    - not_null
  - name: is_conversational
    description: boolean, whether conversation_id and turn_index are meaningful for
      this source
    tests:
    - not_null

- name: feedback_channels
  description: The conformed channel value set - how feedback arrived, normalized
    across sources. Seeds dim_feedback_channel.
  columns:
  - name: channel_slug
    description: string, the conformed channel value. e.g. email, web_form
    tests:
    - not_null
    - unique
  - name: channel_name
    description: string, display name for the channel
    tests:
    - not_null
  - name: is_solicited
    description: boolean, whether we asked for this feedback or the user volunteered
      it
    tests:
    - not_null

- name: sentiments
  description: The static sentiment buckets. Seeds dim_sentiment. Deliberately has
    no 'unknown' member - an unscored conversation carries a null sentiment_fk instead.
  columns:
  - name: sentiment_slug
    description: string, the sentiment value - positive, neutral or negative
    tests:
    - not_null
    - unique
  - name: polarity_score_bucket
    description: string, optional coarser grouping for trend rollups. Left empty until
      the sentiment task introduces a finer label set for it to collapse.

- name: learn_topics
  description: >
    The MIT Learn topic taxonomy. The data platform owns this definition so topic
    mapping for learning resource delivery (and any other consumer) happens here
    rather than inside MIT Learn. Until the MIT Learn ETL cutover, MIT Learn's own
    data_fixtures migrations still write the taxonomy, so
    tests/assert_learn_topic_seeds_match_mitlearn.sql fails on any drift between this
    seed and MIT Learn's replicated tables. int__learn__offeror_topic_lookup depends
    on the replicated tables too, so in `dbt build` a failure skips the lookup and
    the delivery models downstream of it. When it fails, update the seed to match.
    Generated from MIT Learn's production tables as replicated to the warehouse, not
    from topics.yaml or a fresh migrate: data_fixtures migrations 0022/0023 create
    topics with random UUIDs and later full-file upserts drop mappings that
    production kept, so neither reproduces production.
  config:
    column_types:
      topic_uuid: varchar
      topic_name: varchar
      parent_topic_uuid: varchar
  columns:
  - name: topic_uuid
    description: string, stable identifier for the topic (MIT Learn topic_uuid)
    tests:
    - not_null
    - unique
  - name: topic_name
    description: string, the topic name. MIT Learn matches topics by exact name.
    tests:
    - not_null
    - unique
  - name: parent_topic_uuid
    description: string, topic_uuid of the parent topic, empty for top-level topics
    tests:
    - relationships:
        arguments:
          to: ref('learn_topics')
          field: topic_uuid

- name: learn_topic_offeror_mappings
  description: >
    Per-offeror crosswalk from an offeror's own topic names to learn_topics. One
    offeror topic name can map to several topics. Kept in sync with MIT Learn's
    LearningResourceTopicMapping by tests/assert_learn_topic_seeds_match_mitlearn.sql
    until the MIT Learn ETL cutover. Production holds most mappings twice under
    different ids; the seed keeps the distinct set, which is all topic resolution
    reads.
  config:
    column_types:
      offeror_code: varchar
      offeror_topic_name: varchar
      topic_uuid: varchar
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - offeror_code
        - offeror_topic_name
        - topic_uuid
  columns:
  - name: offeror_code
    description: string, MIT Learn offeror code, e.g. mitx, ocw, mitpe
    tests:
    - not_null
  - name: offeror_topic_name
    description: string, the offeror's own topic name, e.g. an edX subject
    tests:
    - not_null
  - name: topic_uuid
    description: string, the learn_topics topic the offeror topic maps to
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('learn_topics')
          field: topic_uuid
