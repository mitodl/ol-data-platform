---
# Dimensional tables for the b2b materialized views (models/b2b_analytics and
# models/b2b_learner_records), so ol-analytics-api and MIT Learn's org analytics
# dashboard can run against the local lake. Load with:
#
#   ol-dbt fixtures load-dimensional b2b_organization \
#       --set sso_organization_id=<Keycloak organization id> --set contract_id=<MITx Online contract id>
#   ol-dbt starrocks build --env dev --target starrocks_local_b2b --select tag:starrocks
#
# Both parameters are ids the local stack assigns, and the dashboard asks for
# them by those ids: it reads the organization and its contracts from MITx
# Online's manager API. See "B2B views" in docs/LOCAL_LAKE.md.
#
# Each table has only the columns the views read. One organization, one
# contract, two course runs in one program, and eight learners, which keeps
# every per-run and per-month cohort the dashboard shows at or above
# ol-analytics-api's anonymization floor of 5. Statuses cover certified,
# passed, in progress, not started and an unenrolled learner; consent covers
# shared, refused and undecided. needs_attention_since follows
# afact_learner_courserun_progress: the enrollment day when not started, the
# last active day plus needs_attention_quiet_days (30) when in progress.
schema_version: 1
parameters:
  sso_organization_id:
    type: string
    description: The Keycloak organization's id (MITx Online's OrganizationPage.sso_organization_id).
  contract_id:
    type: long
    description: The MITx Online contract's id (ContractPage id) under that organization.
tables:
  dim_organization:
    columns:
      organization_pk: string
      organization_key: string
      sso_organization_id: string
      organization_name: string
      platform: string
    rows:
    - organization_pk: fixture-org
      organization_key: fixture-org-key
      sso_organization_id: $sso_organization_id
      organization_name: Fixture Organization
      platform: mitxonline
  dim_contract:
    columns:
      contract_pk: string
      contract_id: long
      organization_fk: string
      b2b_contract_name: string
      b2b_contract_is_active: boolean
      b2b_contract_start_date: date
      b2b_contract_end_date: date
      b2b_contract_max_learners: long
      b2b_contract_membership_type: string
    rows:
    - contract_pk: fixture-contract
      contract_id: $contract_id
      organization_fk: fixture-org
      b2b_contract_name: Fixture Contract
      b2b_contract_is_active: true
      b2b_contract_start_date: 2026-06-01
      b2b_contract_end_date: 2027-05-31
      b2b_contract_max_learners: 20
      b2b_contract_membership_type: managed
  dim_course_run:
    columns:
      courserun_pk: string
      course_fk: string
      courserun_readable_id: string
      courserun_title: string
      courserun_start_on: string
      courserun_end_on: string
      is_current: boolean
    rows:
    - courserun_pk: fixture-run-1
