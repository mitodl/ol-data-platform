---
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "open_learning"
version: "0.1.0"

# This setting configures which "profile" dbt uses for this project.
profile: "open_learning"

# Load AWS credentials for DuckDB Iceberg access
on-run-start:
- "{% if target.type == 'duckdb' %}{{ duckdb_init() }}{% endif %}"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: # directories to be removed by `dbt clean`
- "target"
- "dbt_packages"

# Without a search order dbt looks in this project before the package. Our
# day_of_week macros take one argument and dbt_date's take two, so dbt_date
# keeps its own implementations.
dispatch:
- macro_namespace: dbt_date
  search_order: ["dbt_date"]

vars:
  schema_suffix: dev
  # Where starrocks__create_schema places a schema dbt has to create in a
  # Glue-backed Iceberg catalog: <root>/<schema name>, keyed by catalog.
  iceberg_schema_location_roots:
    ol_data_lake_qa: "s3://ol-data-lake-staging-qa/processed"
    ol_data_lake_production: "s3://ol-data-lake-staging-production/processed"
    ol_data_lake_ci: "s3://ol-data-lake-staging-ci/processed"
    ol_data_lake_local: "s3://ol-data-lake-local/warehouse"

  open_learning:
    platforms: ["Bootcamps", "xPro", "xPRO Emeritus", "xPRO Global Alumni", "MITx\
        \ Online", "MicroMasters", "edX.org", "Residential MITx", "MIT Learn"]
    bootcamps: "Bootcamps"
    edxorg: "edX.org"
    mitxpro: "xPro"
    micromasters: "MicroMasters"
    mitxonline: "MITx Online"
    mitlearn: "MIT Learn"
    residential: "Residential MITx"
    emeritus: "xPRO Emeritus"
    global_alumni: "xPRO Global Alumni"
    dedp_micromasters_program_id: 2
    dedp_mitxonline_international_development_program_id: 1
    dedp_mitxonline_public_policy_program_id: 2
    dedp_mitxonline_good_economics_for_hard_times_course_number: "14.009x"
    dedp_mitxonline_good_economics_for_hard_times_internation_development_cutoff: "2023-08-01"
    # Entitlements expiring before this date are not migrated to MITx Online
    edxorg_migration_entitlement_expiration_cutoff: "2026-01-01"
    ocw_production_url: "https://ocw.mit.edu/"
    # MIT PE feed paths are root-relative (/courses/...), so no trailing slash
    mitpe_url: "https://professional.mit.edu"
    mitxonline_openedx_url: "https://courses.learn.mit.edu"
    mitxpro_openedx_url: "https://courses.xpro.mit.edu"
    # xPRO marketing site, no trailing slash. Course and program page URLs are built on it.
    mitxpro_url: "https://xpro.mit.edu"
    # Base URLs for Wagtail-uploaded media files (prepended to wagtailimages_image.file paths).
    # The image file column contains paths like 'original_images/course.jpg' — these vars
    # supply the scheme+host prefix to form a complete URL. Verify against the Django
    # MEDIA_URL setting for each app in production.
    xpro_media_url: "https://ol-xpro-app-production.s3.amazonaws.com/"
    mitxonline_media_url: "https://mitxonline.mit.edu/media/"
    micromasters_media_url: "https://ol-micromasters-app-production.s3.amazonaws.com/"
    micromasters_production_url: "https://micromasters.mit.edu/"
    # Days without tracked activity before an in-progress learner needs attention
    # (afact_learner_courserun_progress.needs_attention_since).
    needs_attention_quiet_days: 30
    # Support an observed reliance needs to pass the support rule (inferred requires in
    # bridge_courserun_concept, builds_on in bridge_concept_relation). The rule filters
    # noise from single model calls; passing does not make it a prerequisite. This many
    # distinct units (scopes) showing it, each a separate extraction call, with a
    # course's reruns counted once for builds_on...
    courseware_prerequisite_min_scope_support: 2
    # ...or, for requires only, this many courses requiring the concept. Courses, not
    # runs: reruns of one course have near-identical text.
    courseware_prerequisite_min_course_support: 2
    # And this share of the units must point the same way: for builds_on, units showing
    # from -> to over those showing either direction; for requires, units relying on the
    # concept before the run teaches it over those plus the units that teach it. 0.75
    # needs three units for every contrary one.
    courseware_prerequisite_min_direction_consistency: 0.75
    # How far bridge_courserun_prerequisite_coverage walks down passing broader edges
    # to list an umbrella requirement's (e.g. Python programming) narrower concepts.
    courseware_prerequisite_max_narrower_hops: 3
    # Whether a Dagster asset writes the concept tagging tables
    # (courseware_concept_tagging_run, _mention, _tagging_alias), and the answer
    # checks (courseware_answer_check), to the warehouse. Until then only the local
    # runner writes them, so the sources, the models that read them and those
    # models' tests are enabled on DuckDB targets only (macro
    # courseware_local_tables_enabled). Set true once the asset exists.
    courseware_tagging_in_warehouse: false
    courseware_answer_check_in_warehouse: false

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/ directory
# as tables. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.
models:
  open_learning:
    +grants:
      select: ["read_only_production", "ol_data_analyst", "production_analyst", "ol_data_engineer"]
      insert: ["production_analyst", "ol_data_engineer"]
      update: ["production_analyst", "ol_data_engineer"]
      delete: ["production_analyst", "ol_data_engineer"]
      all privileges: ["accountadmin", "ol_platform_admin"]
    staging:
      +materialized: table
      +schema: staging
      +grants:
        select: ["read_only_production", "ol_data_analyst", "reverse_etl"]
      +meta:
        openmetadata:
          owner: data-platform
          tier: Tier.Tier4
    migration:
      +materialized: table
      +schema: migration
      +grants:
        select: ["read_only_production", "ol_data_analyst", "reverse_etl"]
      +meta:
        openmetadata:
          owner: data-platform
          tier: Tier.Tier5
    dimensional:
      +materialized: table
      +schema: dimensional
      +grants:
        select: ['read_only_production', 'ol_data_analyst', 'business_intelligence',
          'ol_business_analyst', 'reverse_etl']
      # Incremental dims use delete+insert and accumulate one small file per run.
      # 14-day snapshot retention provides a time-travel window for point-in-time
      # queries and safe re-runs across two weekly optimize cycles.
      +meta:
        openmetadata:
          owner: data-platform
          tier: Tier.Tier2
        iceberg_maintenance:
          snapshot_retention_days: 14
          optimize_after_every_n_runs: 1
          analyze_after_every_n_runs: 7
    intermediate:
      +materialized: table
      +schema: intermediate
      +grants:
        select: ["read_only_production", "ol_data_analyst", "business_intelligence",
          "ol_business_analyst", "reverse_etl"]
      +meta:
        openmetadata:
          owner: data-platform
          tier: Tier.Tier3
    marts:
      +materialized: table
      +schema: mart
      +grants:
        select: ['read_only_production', 'ol_data_analyst', 'business_intelligence',
          'ol_business_analyst', 'reverse_etl', 'finance']
      # 14-day retention so mart snapshots survive a missed nightly run.
      +meta:
        openmetadata:
          owner: data-platform
          tier: Tier.Tier2
        iceberg_maintenance:
          snapshot_retention_days: 14
          optimize_after_every_n_runs: 1
          analyze_after_every_n_runs: 7
    reporting:
      +materialized: table
      +schema: reporting
      +grants:
        select: ["read_only_production", "ol_data_analyst", "business_intelligence",
          "ol_business_analyst", "reverse_etl"]
      +meta:
        openmetadata:
          owner: data-platform
          tier: Tier.Tier2
    integrations:
      +materialized: table
      +schema: integrations
      +grants:
        select: ["read_only_production", "ol_data_analyst", "reverse_etl", "mit_learn_etl"]
    b2b_analytics:
      # StarRocks' own tables, so only on a target writing default_catalog. A
      # lake target (catalog ol_data_lake_<env>) would put them in
      # <target.schema>_b2b_analytics in Iceberg, where nothing reads them.
      +enabled: "{{ target.type == 'starrocks' and target.catalog == 'default_catalog'\
        \ }}"
      # Every `dbt build` drops and recreates each MV with its current SELECT,
      # with or without --full-refresh (the locked dbt-starrocks; see
      # lakehouse/assets/lakehouse/dbt_starrocks.py). An edited SELECT lands
      # on the next scheduled build, and each view is empty from that build
      # until its next refresh finishes. The Dagster asset also compares each
      # MV's live columns against this project's manifest and passes
      # --full-refresh on a mismatch, for an adapter version that stops
      # replacing on a plain build. It reads the `columns:` in the schema YAML,
      # which ol-dbt validate holds to the SQL in both directions. Consumers
      # that project a new column (ol-analytics-api's build_select) must deploy
      # AFTER that build, or their SELECT errors on an unknown column.
      +materialized: table
      # The engine-scoping label: dbt_starrocks.py's dbt_assets selects
      # `tag:starrocks`, and dbt.py's Trino-scoped set excludes it. Moving a
      # model between engines is adding/removing this tag (plus a matching
      # +enabled condition) -- no Python asset-definition change needed.
      +tags: ["starrocks"]
      # Explicit so DbtAutomationTranslator.get_group_name (which reads
      # config.schema, not the profile-resolved default) groups these models
      # under "b2b_analytics" instead of falling back to no group.
      +schema: b2b_analytics
      # dbt's grants merge behavior is dict_key_append: an empty dict merges
      # no keys and leaves the root `open_learning` grants (Trino/Snowflake
      # roles that don't exist in StarRocks) fully intact. Each root key must
      # be explicitly re-declared empty to actually clobber it.
      +grants:
        select: []
        insert: []
        update: []
        delete: []
        all privileges: []
      # Clears the root Iceberg `format` property, which StarRocks native tables
      # and materialized views reject. The empty value is null, not {}:
      # dbt-starrocks 1.12.2 renders {} as an empty PROPERTIES () block that
      # fails to parse (https://github.com/StarRocks/dbt-starrocks/issues/128).
      +properties:
      +meta:
        required_docs: true
        iceberg_maintenance:
          enabled: false
    # Same engine config as b2b_analytics above (see the comments there); only
    # the schema differs. These views identify individual learners, so they get
    # their own StarRocks database, provisioned in ol-infrastructure
    # substructure/starrocks, and can be granted apart from the aggregate views.
    b2b_learner_records:
      +enabled: "{{ target.type == 'starrocks' and target.catalog == 'default_catalog'\
        \ }}"
      +materialized: table
      +tags: ["starrocks"]
      +schema: b2b_learner_records
      +grants:
        select: []
        insert: []
        update: []
        delete: []
        all privileges: []
      +properties:
      +meta:
        required_docs: true
        iceberg_maintenance:
          enabled: false
    external:
      +materialized: table
      +schema: external
      +grants:
        select: ["read_only_production", "ol_data_analyst", "business_intelligence",
          "ol_business_analyst", "reverse_etl", "mit_irx"]
      # Every build replaces these tables whole, so a compacted copy lasts only
      # until the next build, there are no old snapshots to expire, and the
      # CREATE TABLE AS already writes statistics.
      +meta:
        required_docs: true
        openmetadata:
          owner: data-platform
          tier: Tier.Tier4
        iceberg_maintenance:
          enabled: false
    +properties:
      format: "'PARQUET'"
    +meta:
      required_docs: true
      # Owner and criticality tier in OpenMetadata, applied by the nightly
      # om-ingest-dbt job (ol-infrastructure substructure/open_metadata).
      # `owner` is an OpenMetadata user or Group-type team name; any other
      # name is skipped with a warning. A tier set here replaces one set in the
      # OpenMetadata UI on the next run. Tiers by layer: Tier2 dimensional,
      # marts and reporting, Tier3 intermediate, Tier4 staging and external,
      # Tier5 migration. Tier1 is set per model, on the models that carry a
      # data contract (see /contracts). Layers with no tier decided
      # (integrations, b2b_*) inherit only the owner.
      #
      # Like iceberg_maintenance below, an override replaces the whole
      # `openmetadata` dict, so it must repeat `owner`.
      openmetadata:
        owner: data-platform
      # Iceberg maintenance config -- inherited by all models, overrideable per
      # folder (see dimensional/marts above) or per-model in schema YAML files.
      # dbt compiles these defaults into each model's manifest node at build
      # time, so load_maintenance_configs_from_manifest() reads the fully-
      # resolved values directly from the manifest -- no Python-side merging.
      #
      # Note: dbt meta merging is a shallow dict merge, so a per-model or
      # per-folder iceberg_maintenance override must supply all keys.
      #
      # optimize_after_every_n_runs: materializations since last maintenance run
      #   before OPTIMIZE fires. Use 1 for incremental (delete+insert) models;
      #   use 5+ for full-refresh table models.
      # analyze_after_every_n_runs: same threshold for ANALYZE. 7 = weekly for
      #   models that materialize daily.
      iceberg_maintenance:
        enabled: true
        snapshot_retention_days: 7
        optimize_after_every_n_runs: 1
        analyze_after_every_n_runs: 7

snapshots:
  open_learning:
    +grants:
      select: ['read_only_production', 'ol_data_analyst', 'business_intelligence',
        'ol_business_analyst', 'reverse_etl']
      all privileges: ["accountadmin", "ol_platform_admin"]
    +properties:
      format: "'PARQUET'"
    +meta:
      required_docs: true
      # See models above. No tier is decided for snapshots.
      openmetadata:
        owner: data-platform
    # History of raw tables, one snapshot per table (macro raw_history_snapshot).
    raw_history:
      +schema: history
      # Read like raw, which carries no grants: history keeps every raw column,
      # including ones staging drops. Only `select` is cleared (grants merge by
      # dict_key_append, see b2b_analytics above), so accountadmin and
      # ol_platform_admin keep `all privileges` as on every other snapshot.
      +grants:
        select: []

# Test severity config
# default for error_if and warn_if are !=0
tests:
  open_learning:
    +error_if: ">10"

flags:
  require_certificate_validation: true
  require_generic_test_arguments_property: true
