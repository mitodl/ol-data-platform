---
open_learning:
  target: dev_local
  outputs:
    # For the sqlfluff hooks only (bin/sqlfluff-dbt-hook.py): an empty in-memory
    # database, so compiling needs no credentials or network.
    sqlfluff:
      type: duckdb
      path: ':memory:'
      threads: 1
    qa:
      type: trino
      method: ldap
      user: '{{ env_var("DBT_TRINO_USERNAME") }}'
      password: '{{ env_var("DBT_TRINO_PASSWORD") }}'
      database: ol_data_lake_qa
      port: 443
      schema: ol_warehouse_qa
      host: mitol-ol-data-lake-qa-0.trino.galaxy.starburst.io
      http_scheme: https
      threads: 4
    production:
      type: trino
      method: ldap
      user: '{{ env_var("DBT_TRINO_USERNAME") }}'
      password: '{{ env_var("DBT_TRINO_PASSWORD") }}'
      database: ol_data_lake_production
      port: 443
      schema: ol_warehouse_production
      host: mitol-ol-data-lake-production.trino.galaxy.starburst.io
      http_scheme: https
      threads: 4
    dev_qa:
      type: trino
      method: oauth
      database: ol_data_lake_qa
      port: 443
      schema: ol_warehouse_qa{{ "_{}".format(var('schema_suffix')) }}
      host: mitol-ol-data-lake-qa-0.trino.galaxy.starburst.io
      http_scheme: https
      threads: 4
    dev_production:
      type: trino
      method: oauth
      database: ol_data_lake_production
      port: 443
      schema: ol_warehouse_production{{ "_{}".format(var('schema_suffix')) }}
      host: mitol-ol-data-lake-production.trino.galaxy.starburst.io
      http_scheme: https
      threads: 4
    dev:
      type: duckdb
      path: dev_dbs/dev.duckdb
    # Used only by `ol-dbt unit-test`, which deletes and refills this file on every run.
    unit_test:
      type: duckdb
      path: dev_dbs/unit_test.duckdb
    dev_local:
      type: duckdb
      path: '{{ env_var("HOME") }}/.ol-dbt/local.duckdb'
      schema: main
      threads: 4
      use_credential_provider: aws
      extensions:
      - httpfs
      - aws
      - iceberg
      config_options:
        temp_directory: '{{ env_var("HOME") }}/.ol-dbt/temp'
      settings:
        memory_limit: '{{ env_var("DBT_DUCKDB_MEMORY_LIMIT", "28GB") }}'
        enable_http_metadata_cache: true
        preserve_insertion_order: false
    dev_local_iceberg:
      type: duckdb
      path: ':memory:'
      threads: 4
      extensions:
      - httpfs
      - aws
      - iceberg
      config_options:
        temp_directory: '{{ env_var("HOME") }}/.ol-dbt/temp'
      settings:
        memory_limit: '{{ env_var("DBT_DUCKDB_MEMORY_LIMIT", "16GB") }}'
        enable_http_metadata_cache: true
        s3_region: '{{ env_var("AWS_DEFAULT_REGION", "us-east-1") }}'
        s3_access_key_id: '{{ env_var("AWS_ACCESS_KEY_ID", "") }}'
        s3_secret_access_key: '{{ env_var("AWS_SECRET_ACCESS_KEY", "") }}'
    starrocks_qa:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "lakehouse.qa.starrocks.ol.mit.edu")
        }}'
      port: 9030
      database: default_catalog
      schema: '{{ env_var("DBT_STARROCKS_SCHEMA", "b2b_analytics") }}'
      username: '{{ env_var("DBT_STARROCKS_OIDC_USERNAME") }}'
      password: '{{ env_var("DBT_STARROCKS_OIDC_TOKEN") }}'
      auth_plugin: mysql_clear_password
      threads: 4
    starrocks_qa_vault:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "127.0.0.1") }}'
      port: 9030
      database: default_catalog
      schema: '{{ env_var("DBT_STARROCKS_SCHEMA", "b2b_analytics") }}'
      username: '{{ env_var("DBT_STARROCKS_USERNAME") }}'
      password: '{{ env_var("DBT_STARROCKS_PASSWORD") }}'
      threads: 4
    # The lake in ol-infrastructure's local-dev cluster (`data-platform` in
    # enabled_apps), reached over Tilt's port-forward. `ol-dbt starrocks --env dev`
    # selects it. The schema is created by that stack, not by dbt.
    starrocks_local:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "127.0.0.1") }}'
      port: 9030
      catalog: ol_data_lake_local
      schema: ol_warehouse_local
      username: root
      password: ''
      threads: 4
    # StarRocks' own tables on the same local cluster: the b2b materialized
    # views live in default_catalog and read ol_data_lake_local through it.
    # Dagster's `dev` builds on this one. The stack creates b2b_analytics and
    # b2b_learner_records.
    starrocks_local_b2b:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "127.0.0.1") }}'
      port: 9030
      database: default_catalog
      schema: b2b_analytics
      username: root
      password: ''
      threads: 4
    starrocks_production:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "lakehouse-starrocks-fe-service.starrocks.svc.cluster.local")
        }}'
      port: 9030
      database: default_catalog
      schema: '{{ env_var("DBT_STARROCKS_SCHEMA", "b2b_analytics") }}'
      username: '{{ env_var("DBT_STARROCKS_USERNAME") }}'
      password: '{{ env_var("DBT_STARROCKS_PASSWORD") }}'
      threads: 4
    # The layered warehouse on StarRocks, written into the Glue-backed Iceberg
    # catalog (`catalog`, not `database`, is what selects it). Each resolves the
    # same layer schemas as the Trino output of the same environment:
    # <schema>_<layer>, e.g. ol_warehouse_qa_staging. The b2b views are disabled
    # on these targets and build on the default_catalog ones above.
    #
    # dbt-starrocks connects to <catalog>.<schema>, and if that fails for any
    # reason it runs a bare CREATE DATABASE for it, which in Glue has no location.
    # Seeds build into the profile schema itself, so it has to exist with one
    # first. ol_warehouse_qa and ol_warehouse_production already do. `ol-dbt
    # starrocks` creates the others (ol_warehouse_ci, every suffixed schema) with
    # a location before it starts dbt.
    #
    # The canonical QA and production layer schemas are the ones the Trino
    # build writes until the cutover.
    starrocks_qa_lake:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "127.0.0.1") }}'
      port: 9030
      catalog: ol_data_lake_qa
      schema: ol_warehouse_qa
      username: '{{ env_var("DBT_STARROCKS_USERNAME") }}'
      password: '{{ env_var("DBT_STARROCKS_PASSWORD") }}'
      threads: 4
    # A developer's own copy of the QA warehouse, ol_warehouse_qa_<suffix>_<layer>,
    # like the Trino dev_qa output.
    starrocks_dev_qa:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "127.0.0.1") }}'
      port: 9030
      catalog: ol_data_lake_qa
      schema: ol_warehouse_qa{{ "_{}".format(var('schema_suffix')) }}
      username: '{{ env_var("DBT_STARROCKS_USERNAME") }}'
      password: '{{ env_var("DBT_STARROCKS_PASSWORD") }}'
      threads: 4
    starrocks_production_lake:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "lakehouse-starrocks-fe-service.starrocks.svc.cluster.local")
        }}'
      port: 9030
      catalog: ol_data_lake_production
      schema: ol_warehouse_production
      username: '{{ env_var("DBT_STARROCKS_USERNAME") }}'
      password: '{{ env_var("DBT_STARROCKS_PASSWORD") }}'
      threads: 4
    # CI StarRocks writing its own lake (ol-infrastructure#6533). DBT_TARGET_MAP
    # in lakehouse.lib.dbt_environment names this output for DAGSTER_ENVIRONMENT=ci.
    # Without a schema_suffix var it builds the canonical ol_warehouse_ci_<layer>
    # schemas; a PR build passes one (e.g. `--vars '{schema_suffix: pr_123}'`) to
    # get its own.
    ci:
      type: starrocks
      host: '{{ env_var("DBT_STARROCKS_HOST", "lakehouse-starrocks-fe-service.starrocks.svc.cluster.local")
        }}'
      port: 9030
      catalog: ol_data_lake_ci
      schema: ol_warehouse_ci{{ "_{}".format(var('schema_suffix')) if var('schema_suffix',
        '') else '' }}
      username: '{{ env_var("DBT_STARROCKS_USERNAME") }}'
      password: '{{ env_var("DBT_STARROCKS_PASSWORD") }}'
      threads: 4
