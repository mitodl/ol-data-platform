---
version: 2
snapshots:
- name: snapshot_raw__xpro__app__postgres__cms_certificatepage
  description: >
    History of xPRO certificate pages (the CEUs a course or program awards): one row
    per version of each
    raw__xpro__app__postgres__cms_certificatepage record, with every source column
    and
    none of the loader's. Resolution is one run, and history starts at the
    first run. A record deleted in xPRO gets a final row with dbt_is_deleted
    'True', but only once the table is loaded by a full read.
  columns:
  - name: page_ptr_id
    description: primary key of the xPRO cms_certificatepage row.
  - name: dbt_scd_id
    description: key of this version (hash of the primary key and dbt_updated_at).
  - name: dbt_updated_at
    description: time of the snapshot run that recorded this version.
  - name: dbt_valid_from
    description: time of the snapshot run that first saw this version.
  - name: dbt_valid_to
    description: time of the snapshot run that saw it replaced or deleted; null for
      the current version.
  - name: dbt_is_deleted
    description: >
      'True' on the row written when the record was no longer in the source,
      'False' otherwise.
