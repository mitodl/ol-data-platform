    History of raw__xpro__app__postgres__users_user (xpro/app_postgres, table users_user):
    one row per version of each record, with every source column except the loader's,
    secret-pattern columns and any the inventory excludes. Resolution is one snapshot
    run, and history starts at the first run. A record that leaves the source gets
    a final row with dbt_is_deleted 'True', since every load reads the whole table.
  config:
    meta:
      raw_history:
        unit: xpro/app_postgres
        absence: deleted
        delete_capture: full_read
  columns:
  - name: id
    description: primary key of the xpro/app_postgres users_user record.
  - name: dbt_scd_id
    description: >-
      key of this version (hash of the primary key and dbt_updated_at).
  - name: dbt_updated_at
    description: time of the snapshot run that recorded this version.
  - name: dbt_valid_from
    description: time of the snapshot run that first saw this version.
  - name: dbt_valid_to
    description: >-
      time of the snapshot run that saw it replaced or deleted; null for the current
      version.
  - name: dbt_is_deleted
    description: >-
      'True' on the row written when the record left the source, 'False' otherwise.
      The deleted row also has a null dbt_valid_to.
