---
version: 2
snapshots:
- name: snapshot_bridge_concept_relation
  relation: ref('bridge_concept_relation')
  description: >
    History of concept-to-concept edges, one row per version of an edge's support
    or support-rule outcome. bridge_concept_relation is rebuilt from the current
    evidence on every run, so without this an edge's support, support_score and
    passes_support_rule leave no trace once they change. Read it beside
    afact_concept_graph_run (graph runs) by time. A new version is recorded when a
    support count, the consistency, support_score, the co-taught or co-assessed
    evidence flags (ml.lib.courseware.graph keeps a co-assessed complements edge
    whatever its lift), review_status or the support-rule outcome changes. co_taught_lift
    is left out of the check, because
    its denominator counts every taught unit, so each extracted course would version
    every complements edge without its own evidence changing. Resolution is one
    run, and history starts at the first run. An edge whose evidence disappears has
    its current version closed (dbt_valid_to set).
  config:
    schema: dimensional
    unique_key: concept_relation_pk
    strategy: check
    check_cols:
    - courserun_support
    - scope_support
    - course_scope_support
    - reverse_courserun_support
    - reverse_scope_support
    - direction_consistency
    - verdict_support
    - contrary_verdict_support
    - cross_signal_support
    - support_score
    - has_co_taught_evidence
    - has_co_assessed_evidence
    - review_status
    - passes_support_rule
    - support_rule_failure
    hard_deletes: invalidate
  columns:
  - name: concept_relation_pk
    description: str, bridge_concept_relation.concept_relation_pk, a surrogate key
      of (from, to, relation)
  - name: from_concept_fk
    description: str, dim_concept.concept_pk of the narrower, dependent or lower-id
      concept
  - name: to_concept_fk
    description: str, dim_concept.concept_pk of the broader, built-on or higher-id
      concept
  - name: relation
    description: str, broader, builds_on, practiced_with, close, complements or related
  - name: relation_family
    description: str, hierarchy, sequence, practice, equivalence or association
  - name: courserun_support
    description: int, distinct course runs with course evidence for the edge in this
      version
  - name: scope_support
    description: int, units across those runs that showed the edge
  - name: course_scope_support
    description: int, course relations only, scope_support with each course's reruns
      counted once
  - name: reverse_courserun_support
    description: int, builds_on only, course runs showing the opposite direction
  - name: reverse_scope_support
    description: int, builds_on only, course_scope_support of the opposite direction
  - name: direction_consistency
    description: float, builds_on only, course_scope_support / (course_scope_support
      + reverse_scope_support)
  - name: co_taught_lift
    description: float, complements only, co-taught unit count over the count expected
      by chance; carried along but not checked for changes
  - name: verdict_support
    description: int, adjudicated relations only, resolution verdicts agreeing with
      the relation (at least 1)
  - name: contrary_verdict_support
    description: int, adjudicated relations only, resolution verdicts against it
  - name: cross_signal_support
    description: int, evidence for the pair from the other source (course units for
      an adjudicated relation, connecting verdicts for a course relation)
  - name: support_score
    description: float in [0, 1], the edge's uncalibrated support_score in this version
  - name: is_adjudicated
    description: boolean, whether resolution adjudication proposed the edge
  - name: has_sequence_evidence
    description: boolean, whether course sequence showed the edge
  - name: has_co_taught_evidence
    description: boolean, whether co-taught units showed the edge
  - name: has_co_assessed_evidence
    description: boolean, whether co-assessed items showed the edge
  - name: first_observed_at
    description: timestamp, the earliest evidence for the edge
  - name: last_observed_at
    description: timestamp, the latest evidence for the edge
  - name: review_status
    description: str, proposed, accepted or rejected
  - name: passes_support_rule
    description: boolean, whether the edge passed bridge_concept_relation's support
      rules in this version (a noise filter, not acceptance)
  - name: support_rule_failure
    description: str, why the edge failed them in this version, as in bridge_concept_relation
  - name: dbt_scd_id
    description: Unique id of this version of the edge.
  - name: dbt_updated_at
    description: When dbt recorded this version.
  - name: dbt_valid_from
    description: When this version was first observed.
  - name: dbt_valid_to
    description: When this version stopped being current (changed, or its evidence
      disappeared). Null for the current version.
