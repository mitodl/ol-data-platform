---
# Individually identifying learner records for ol-analytics-api's
# b2b_learner_records tenant. A separate StarRocks database from b2b_analytics
# so the PII-bearing views can be granted to that tenant's role without also
# granting the k-anonymized aggregate views, and vice versa. As in
# b2b_analytics, every column each model emits is documented here in SELECT
# order: the Dagster drift check rebuilds an MV whose live columns differ.
#
# Every test here is severity: warn. A failing test fails starrocks_dbt_assets,
# which skips the MV refresh for every StarRocks model, and the tests read the
# previous refresh's rows anyway (a plain build leaves an existing MV untouched).
# Anything the API contract depends on is enforced in the SQL instead.
version: 2
models:
- name: mv_b2b_learner_enrollment
  description: >
    One row per learner x course run under an organization's contracts -- grain
    org x contract x course_run x learner. INDIVIDUALLY IDENTIFYING: backs
    ol-analytics-api's b2b_learner_records tenant (the /enrollments collection,
    and the /learners collection when filtered by contract_id or
    include_inactive), never the k-anonymized b2b_dashboard tenant. The
    organization is attributed through the contract that owns the course run,
    never organization_administration_report's free-text organization_key
    fallback. A course run belongs to at most one contract
    (courses_courserun.b2b_contract_id is a single FK), so contract attribution
    cannot fan out. Not filtered to the organization's current roster: a learner
    removed from the organization keeps their enrollment in its contract runs;
    snapshot_mitxonline_b2b_userorganization records membership history. Carries
    no consent column yet: until the learner data-sharing consent field lands,
    the API treats every row as outcomes_shared = false and nulls the grade and
    certificate columns. Activity columns come from
    afact_learner_courserun_daily_activity, pre-aggregated to (user, course
    run). Manual-refresh materialized view.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - contract_pk
      - courserun_pk
      - user_pk
      config:
        severity: warn
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id) -- the
      identifier the ol-analytics-api filters organizations on.
  - name: organization_name
    description: Display name of the organization.
  - name: contract_pk
    description: Surrogate key of the B2B contract.
  - name: contract_id
    description: >
      mitxonline's ContractPage.page_ptr_id (dim_contract.contract_id) -- the
      contract identifier the API exposes.
  - name: b2b_contract_name
    description: Display name of the contract.
  - name: courserun_pk
    description: Surrogate key of the course run.
  - name: courserun_readable_id
    description: Course run identifier (e.g. course-v1:MITxT+14.310x+2T2026) -- the
      API's courserun_id.
  - name: courserun_title
    description: Display title of the course run. Mutable; key on courserun_readable_id.
  - name: courserun_start_on
    description: >
      Course run start, ISO-8601 in UTC with no offset (e.g. 2026-02-09T15:00:00.000).
      Trino's cast_timestamp_to_iso8601 drops the zone; ol-analytics-api attaches
      UTC.
  - name: courserun_end_on
    description: >
      Course run end, ISO-8601 in UTC with no offset, as courserun_start_on. Null
      for
      self-paced runs.
  - name: user_pk
    description: >
      dim_user surrogate. Internal join key only -- it can still re-key, so the
      API must not expose it. Join key for
      afact_learner_courserun_daily_activity.
  - name: user_global_id
    description: >
      Keycloak user id (dim_user.user_global_id) -- the API's learner_id, stable
      across email changes. Never null: the API contract requires it, so users
      without one are filtered out.
  - name: email
    description: >
      dim_user.email -- a coalesce across the person's platform accounts, so it
      may differ from the address the organization enrolled them under. Not a
      join key.
  - name: full_name
    description: dim_user.full_name. Often null.
  - name: enrollment_created_on
    description: When this run's enrollment was created, ISO-8601 -- the API's enrolled_on.
  - name: enrollment_is_active
    description: Whether the enrollment is active. Inactive rows are kept; the API
      drops them unless include_inactive is set.
  - name: enrollment_mode
    description: Enrollment mode (audit, verified, ...).
  - name: enrollment_status
    description: Deactivation reason where one was recorded.
  - name: is_passing
    description: >
      tfact_grade.is_passing. Null where no grade exists. Emitted separately
      from the certificate columns; the API derives completion_status from both.
  - name: grade_value
    description: tfact_grade.grade_value, 0-1 -- the API's grade.
  - name: letter_grade
    description: tfact_grade.letter_grade. Frequently null.
  - name: certificate_issued_on
    description: Course certificate issue time, ISO-8601. Null where no certificate
      exists.
  - name: certificate_is_revoked
    description: >
      Whether the course certificate was revoked. Null where no certificate
      exists. Revoked certificates are kept so the API can report a revoked run
      as passed rather than certified.
  - name: last_active_on
    description: >
      Date of the latest day with tracked activity in this course run (video
      play, problem check, navigation, discussion or Open edX chatbot submit).
      The event's source-local day, not a UTC day. Null when the learner has
      no activity in the run.
  - name: days_active
    description: Distinct days with tracked activity in this course run. 0 when none.
  - name: videos_played
    description: >
      Sum over active days of distinct video blocks played that day, so a
      block played on two days counts twice. The API's videos_watched.
  - name: problems_attempted
    description: >
      Sum over active days of distinct problem blocks with a problem_check that
      day, so a problem attempted on two days counts twice. Excludes
      showanswer.
  - name: chatbot_interactions
    description: Distinct (session, block) Open edX chatbot submits in this course
      run.
  - name: record_updated_on
    description: >
      Latest of the enrollment, grade and certificate update timestamps,
      ISO-8601 -- the cursor for the API's updated_since, which therefore
      covers enrollment, grade and certificate changes ONLY, including
      deactivation and revocation. Null only when every one of those
      timestamps is missing. dim_user (email, name) and course-run metadata
      carry no change timestamp, so edits to them do not move it; a partner
      picks those up from a full reload of the bulk export. Activity does not
      move it either. A day's activity first appears at a refresh after that
      day has begun, and partners pass the previous refresh's as_of as
      updated_since, so a cursor taken from last_active_on would already sort
      below the bound and the change would never be sent.

- name: mv_b2b_learner
  description: >
    One row per learner associated with an organization -- grain org x learner,
    the union of the organization's membership roster (bridge_user_organization)
    and learners enrolled under its contracts. INDIVIDUALLY IDENTIFYING: backs
    ol-analytics-api's b2b_learner_records /learners collection only.
    Roster-only learners (assigned, never enrolled) appear here and in no
    aggregate b2b_analytics view. courses_enrolled and the enrolled_on dates
    count ACTIVE enrollments only, matching the API's default
    include_inactive=false; completions count every enrollment. A contract_id
    or include_inactive request is recomputed from mv_b2b_learner_enrollment.
    Roster rows with keep_until_seen are included: mitxonline sets that flag on
    memberships it creates itself (enrollment-code redemption, contract-run
    enrollment) so SSO reconciliation does not remove them before Keycloak
    reflects them. snapshot_mitxonline_b2b_userorganization records membership
    history. Carries no consent column, for the same reason as
    mv_b2b_learner_enrollment. last_active_on and courses_in_progress count
    active enrollments only. Manual-refresh materialized view.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - organization_key
      - user_pk
      config:
        severity: warn
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id) -- the
      identifier the ol-analytics-api filters organizations on.
  - name: organization_name
    description: Display name of the organization.
  - name: user_pk
    description: dim_user surrogate. Internal join key only; the API must not expose
      it.
  - name: user_global_id
    description: >
      Keycloak user id -- the API's learner_id. Never null: users without one
      are filtered out.
  - name: email
    description: dim_user.email. Not a join key; see mv_b2b_learner_enrollment.
  - name: full_name
    description: dim_user.full_name. Often null.
  - name: membership_source
    description: >
      roster (on the membership roster with no active enrollment under the
      organization's contracts -- an unstarted seat, or one whose enrollments
      were all deactivated), enrollment (enrolled under the organization's
      contracts but absent from the roster -- removed from the organization, or
      enrolled before mitxonline created memberships on enrollment), or both
      (on the roster with an active enrollment).
  - name: is_organization_manager
    description: Administers the organization in MITx Online (userorganization_is_manager).
      False for enrollment-only learners.
  - name: first_enrolled_on
    description: Earliest active enrollment under the organization's contracts, ISO-8601.
      Null when the learner has no active enrollment.
  - name: last_enrolled_on
    description: Latest active enrollment under the organization's contracts, ISO-8601.
      Null when the learner has no active enrollment.
  - name: courses_enrolled
    description: Distinct course runs with an active enrollment under the organization's
      contracts.
  - name: courses_passed
    description: Distinct course runs enrolled under the organization's contracts,
      active or not, with a passing grade. Does not drop when a seat is reclaimed.
  - name: courses_certified
    description: Distinct course runs enrolled under the organization's contracts,
      active or not, with a non-revoked course certificate.
  - name: program_certificates_earned
    description: >
      Distinct non-revoked mitxonline program certificates for programs that
      contain a course the learner enrolled in (active or not) under the
      organization's contracts. Bounded that way so a certificate earned
      outside the licence is not reported. The API's certificates_earned is
      courses_certified + program_certificates_earned.
  - name: last_active_on
    description: >
      Latest last_active_on across the learner's ACTIVE enrollments under the
      organization's contracts. Source-local day. Null when none of them has
      activity.
  - name: courses_in_progress
    description: >
      Distinct course runs with an active enrollment under the organization's
      contracts that have no unrevoked certificate, are not passing, and have
      a nonzero grade or any tracked activity. Matches the API's
      completion_status = in_progress on those enrollments.
  - name: record_updated_on
    description: >
      Latest update timestamp across all of the learner's enrollments under the
      organization's contracts (active or not), their grades and course
      certificates, and the program certificates attributed above (revoked or
      not), ISO-8601 -- the cursor for updated_since. Taken over the unfiltered
      set so deactivation and revocation move it forward. Null for learners
      with no enrollment under the organization's contracts. Roster adds,
      removals and manager changes, and dim_user edits, carry no change
      timestamp and do not move it; a partner picks those up from a full
      reload of the bulk export.

- name: mv_b2b_contract_courserun
  description: >
    One row per course run covered by one of an organization's contracts --
    grain org x contract x course_run. Backs ol-analytics-api's
    b2b_learner_records /courses collection. Carries no personal data; it sits
    in this database so the tenant reads a single schema. Includes runs with no
    enrollments, which is why it is not derived from mv_b2b_learner_enrollment.
    A course run belongs to at most one contract
    (courses_courserun.b2b_contract_id is a single FK), so the grain cannot fan
    out. Manual-refresh materialized view.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - contract_pk
      - courserun_pk
      config:
        severity: warn
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id) -- the
      identifier the ol-analytics-api filters organizations on.
  - name: organization_name
    description: Display name of the organization.
  - name: contract_pk
    description: Surrogate key of the B2B contract.
  - name: contract_id
    description: >
      mitxonline's ContractPage.page_ptr_id (dim_contract.contract_id) -- the
      contract identifier the API exposes.
  - name: b2b_contract_name
    description: Display name of the contract -- the API's contract_name.
  - name: b2b_contract_is_active
    description: >
      Whether the contract is marked active in MITx Online -- the API's
      contract_is_active. A manual flag: the end date is not applied, so combine it
      with b2b_contract_end_date.
  - name: b2b_contract_start_date
    description: Contract start date. Null when the contract has none.
  - name: b2b_contract_end_date
    description: Contract end date. Null when the contract has none.
  - name: seat_limit
    description: >
      b2b_contract_max_learners, with 0 folded into null: MITx Online documents
      both 0 and null as unlimited. Null means uncapped.
  - name: courserun_pk
    description: Surrogate key of the course run.
  - name: courserun_readable_id
    description: Course run identifier (e.g. course-v1:MITxT+14.310x+2T2026) -- the
      API's courserun_id.
  - name: courserun_title
    description: Display title of the course run. Mutable; key on courserun_readable_id.
  - name: courserun_start_on
    description: >
      Course run start, ISO-8601 in UTC with no offset (e.g. 2026-02-09T15:00:00.000).
      Trino's cast_timestamp_to_iso8601 drops the zone; ol-analytics-api attaches
      UTC.
  - name: courserun_end_on
    description: >
      Course run end, ISO-8601 in UTC with no offset, as courserun_start_on. Null
      for
      self-paced runs.
