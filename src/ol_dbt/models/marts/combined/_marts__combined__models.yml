      a marketing discount code like 'smartmitx25', a financial-assistance discount
      code like 'Lottery_2T2025cea95f1f-416e-4da6-a2de-ca1d669e7d00', or a sales discount
      code like 'B2B_AffiliateDiscount_2T2025ca0ad77b-b82b-4998-bd7b-6d944a360fc1'
  - name: discount_name
    description: string, human readable name for the discount
  - name: discount_created_on
    description: timestamp, date and time when the discount was initially created
  - name: payment_transaction
    description: string, string that identifies the payment invoice for coupon purchases
      by companies
  - name: discount_source
    description: string, one of "staff", "marketing", "purchase_order", "legacy",
      "financial-assistance", "sales", "customer-support". "staff" coupons are used
      to allow staff to enroll in courses. "marketing" coupons are promos for discounts
      generated by marketing. "purchase_order" and "sales" correspond to different
      ways that companies can pay for enrollment codes for their employees to enroll
      in courses or programs. The value will be 'b2b' for records sourced from b2b.
  - name: discount_activated_on
    description: timestamp, activation timestamp
  - name: discount_expires_on
    description: timestamp, expiration timestamp
  - name: num_discount_codes
    description: int, number of discount objects associated with the payment version
  - name: discount_max_redemptions
    description: int, maximum number of redemptions for the discount
  - name: couponpayment_name
    description: string, human readable name for the coupon payment. This field is
      null for records from mitxonline.
  - name: b2b_contract_number
    description: string, contract number used to identify the order
  - name: b2breceipt_reference_number
    description: str, transaction reference number from cybersource payment
  - name: redeemed
    description: boolean, set to true if the discount has at least one redeemed order
      otherwise it's false.
  - name: discounts_used_count
    description: int, count of discounts used
  - name: product_readable_id
    description: string, the product identifier either referring to courserun_readable_id,
      programrun_readable_id, or program_readable_id. Examples include course-v1:MITxPRO+TPMx_Mondelez+SPOC_R1
      and program-v1:xPRO+SysEngx.
  - name: product_name
    description: string, the product name either referring to courserun_title or program_title
  - name: discount_amount_text
    description: string, either dollar amount off, fixed price, or percentage discount.
  - name: company_name
    description: string, company name
  - name: discount_type
    description: string, one of 'single-use' or 'promo'. Promo coupon codes can be
      used multiple times. This will be null for records sourced from b2b.
  - name: b2bcoupon_id
    description: int, foreign key to b2becommerce_b2bcoupon.
  - name: discount_id
    description: int, foreign key referencing ecommerce_coupon from xpro or foreign
      key to ecommerce_discount for mitxonline. This will be null for records sourced
      from xpro b2b.
  - name: couponpaymentversion_id
    description: int, foreign key to ecommerce_couponpaymentversion for orders that
      use a coupon
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["b2bcoupon_id", "discount_id", "platform", "couponpaymentversion_id",
          "b2b_contract_number", "product_readable_id"]

unit_tests:
- name: test_coursesinprogram_keeps_unmapped_edxorg_program_courses
  description: >
    An edX.org program whose title dim_program_report_key maps to a MITx Online
    program, by the seed or by title, leaves its courses to that program. One
    whose title maps to nothing, e.g. a title two MITx Online programs share,
    keeps its own edX.org courses, also when its program_name is a mapped title.
    A MITx Online row whose readable id and title match different dim rows is
    keyed by its readable id.
  model: marts__combined_coursesinprogram
  given:
  - input: ref('int__mitx__program_requirements')
    rows:
    - {program_title: Program Title, course_number: X1, mitxonline_program_id: 45}
  - input: ref('int__mitx__courses')
    rows:
    - {course_number: X1, course_readable_id: "course-v1:MITxT+X1", course_title: X
        One, is_on_mitxonline: true}
  - input: ref('int__mitxpro__courses')
    rows: []
  - input: ref('int__mitxpro__programs')
    rows: []
  - input: ref('int__mitxonline__programs')
    rows:
    - {program_id: 45, program_readable_id: "program-v1:MITxT+P", program_name: Program
        Title}
  - input: ref('int__edxorg__mitx_program_courses')
    rows:
    - {program_title: Shared, program_name: Shared, course_title: Shared One, course_readable_id: "MITx/SH1"}
    - {program_title: Circuits, program_name: Circuits, course_title: Circuits One,
      course_readable_id: "MITx/C1"}
    - {program_title: Finance, program_name: Finance, course_title: Finance One, course_readable_id: "MITx/F1"}
    - {program_title: Retired Old Version, program_name: Finance, course_title: Retired
        One, course_readable_id: "MITx/R1"}
  - input: ref('dim_program_report_key')
    rows:
    - {lookup_type: readable_id, lookup_value: "program-v1:MITxT+P", program_key: "program-v1:MITxT+P",
      mapped_by: own, is_mapped_to_mitxonline: false}
    - {lookup_type: title, lookup_value: Program Title, program_key: Program Title,
      mapped_by: none, is_mapped_to_mitxonline: false}
    - {lookup_type: title, lookup_value: Shared, program_key: Shared, mapped_by: none,
      is_mapped_to_mitxonline: false}
    - {lookup_type: title, lookup_value: Circuits, program_key: "program-v1:MITxT+XS-MCE",
      mapped_by: title, is_mapped_to_mitxonline: true}
    - {lookup_type: title, lookup_value: Finance, program_key: "program-v1:MITxT+FIN",
      mapped_by: seed, is_mapped_to_mitxonline: true}
    - {lookup_type: title, lookup_value: Retired Old Version, program_key: Retired
        Old Version, mapped_by: none, is_mapped_to_mitxonline: false}
  expect:
    rows:
    - {platform: MITx Online, program_title: Program Title, course_readable_id: "course-v1:MITxT+X1",
      program_report_key: "program-v1:MITxT+P"}
    - {platform: edX.org, program_title: Shared, course_readable_id: "MITx/SH1", program_report_key: Shared}
    - {platform: edX.org, program_title: Retired Old Version, course_readable_id: "MITx/R1",
      program_report_key: Retired Old Version}

- name: test_program_enrollment_detail_matches_courses_on_own_platform
  description: >
    A MITx Online learner and an edX.org learner share user_id 7. Each row
    counts only its own platform's enrollments. The edX.org program maps to
    the MITx Online program, so it takes its courses from that program's
    bridge_program_course rows. A non-current dim_course version of C under an
    older key adds no course, and an audit enrollment in an earlier run of C
    does not move the start date program_completion_days counts from. The
    MITx Online row's readable id and title match different dim_program_report_key
    rows, and the readable id wins; the edX.org row's generated readable id
    matches none, so its title maps it to the MITx Online program.
  model: marts__combined_program_enrollment_detail
  given:
  - input: ref('int__mitxpro__programenrollments')
    rows: []
  - input: ref('int__mitxpro__programs')
    rows: []
  - input: ref('int__mitxpro__program_certificates')
    rows: []
  - input: ref('int__mitxpro__users')
    rows: []
  - input: ref('int__mitx__programs')
    rows: []
  - input: ref('int__mitxonline__programenrollments')
    rows:
    - {program_id: 45, user_id: 7, user_email: online@example.com, user_username: online7}
  - input: ref('int__mitxonline__programs')
    rows:
    - {program_id: 45, program_readable_id: "program-v1:MITxT+SDS-General-Track",
      program_title: "SDS General Track", program_name: "SDS General Track", program_type: MicroMasters}
  - input: ref('int__mitxonline__users')
    rows: []
  - input: ref('int__mitxonline__program_certificates')
    rows: []
  - input: ref('int__edxorg__mitx_program_enrollments')
    rows:
    - {micromasters_program_id: 4, program_uuid: sds-general, program_title: "Statistics\
        \ and Data Science (General Track)", program_type: MicroMasters, user_id: 7,
      user_username: edx7}
  - input: ref('int__edxorg__mitx_program_certificates')
    rows:
    - {program_uuid: sds-general, user_id: 7, program_certificate_awarded_on: "2020-06-30T00:00:00Z",
      program_certificate_hashed_id: h7, user_has_completed_program: true}
  - input: ref('int__edxorg__mitx_users')
    rows:
    - {user_id: 7, user_email: edx@example.com}
  - input: ref('int__micromasters__program_enrollments')
    rows: []
  - input: ref('dim_program_report_key')
    rows:
    - {lookup_type: title, lookup_value: "Statistics and Data Science (General Track)",
      mitxonline_program_id: 45, program_key: "program-v1:MITxT+SDS-General-Track",
      program_title: "SDS General Track"}
    - {lookup_type: readable_id, lookup_value: "program-v1:MITxT+SDS-General-Track",
      mitxonline_program_id: 45, program_key: "program-v1:MITxT+SDS-General-Track",
      program_title: "SDS General Track"}
    - {lookup_type: title, lookup_value: "SDS General Track", program_key: "SDS General\
        \ Track", program_title: "SDS General Track"}
  - input: ref('bridge_program_course')
    rows:
    - {program_fk: p45, course_fk: ca}
    - {program_fk: p45, course_fk: cb}
    - {program_fk: p45, course_fk: cc}
  - input: ref('dim_program')
    rows:
    - {program_pk: p45, source_id: "45", platform_code: mitxonline}
  - input: ref('dim_course')
    rows:
    - {course_pk: ca, course_readable_id: "course-v1:MITxT+A", is_current: true}
    - {course_pk: cb, course_readable_id: "course-v1:MITxT+B", is_current: true}
    - {course_pk: cc, course_readable_id: "course-v1:MITxT+C", is_current: true}
    - {course_pk: cc, course_readable_id: "course-v1:MITxT+C-OLD", is_current: false}
  - input: ref('int__combined__courserun_enrollments')
    rows:
    - {platform: MITx Online, user_id: "7", course_readable_id: "course-v1:MITxT+A",
      courserun_readable_id: "course-v1:MITxT+A+1T2020", course_title: A, courserunenrollment_enrollment_mode: audit}
    - {platform: MITx Online, user_id: "7", course_readable_id: "course-v1:MITxT+B",
      courserun_readable_id: "course-v1:MITxT+B+1T2020", course_title: B, courserunenrollment_enrollment_mode: audit}
    - {platform: edX.org, user_id: "7", course_readable_id: "course-v1:MITxT+C", courserun_readable_id: "course-v1:MITxT+C+1T2020",
      course_title: C Capstone, courserunenrollment_enrollment_mode: verified}
    - {platform: edX.org, user_id: "7", course_readable_id: "course-v1:MITxT+C", courserun_readable_id: "course-v1:MITxT+C+3T2019",
      course_title: C Capstone, courserunenrollment_enrollment_mode: audit}
    - {platform: edX.org, user_id: "7", course_readable_id: "course-v1:MITxT+C-OLD",
      courserun_readable_id: "course-v1:MITxT+C-OLD+1T2018", course_title: C Old,
      courserunenrollment_enrollment_mode: audit}
  - input: ref('int__combined__course_runs')
    rows:
    - {courserun_readable_id: "course-v1:MITxT+C+1T2020", courserun_start_on: "2020-01-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:MITxT+C+3T2019", courserun_start_on: "2019-09-01T00:00:00Z"}
  expect:
    rows:
    - {platform_name: MITx Online, user_id: 7, unique_courses_taken_in_program: 2,
      capstone_indicator: N, program_completion_days: null, program_report_key: "program-v1:MITxT+SDS-General-Track"}
    - {platform_name: edX.org, user_id: 7, unique_courses_taken_in_program: 1, capstone_indicator: Y,
      program_completion_days: 181, program_report_key: "program-v1:MITxT+SDS-General-Track"}
