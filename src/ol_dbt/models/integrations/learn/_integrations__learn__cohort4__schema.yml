---
# MIT Learn integration layer — Cohort 4, ContentFiles.
# Contract: docs/design/contentfile_scoped_pull_contract.md §9, and the content
# file section of docs/learn_marts_contract.md.

version: 2

models:
- name: integrations__learn__content_files
  description: >
    One row per ContentFile of an MITx Online or xPRO course run, for MIT Learn's
    SyncOpenEdXContentFilesTask. A scoped pull filters and prunes on
    (etl_source, run_readable_id). Built from the OLX blocks and the document and
    transcript text the openedx location extracts, less the files Learn's
    excluded_olx_paths hides (staff-only subtrees, unreachable tabs and about
    pages, course settings, asset manifests, unreferenced static files). A run appears
    once its export has been through that check. The course root files course.xml
    and course/<run>.xml are there for a run whose course_xml_blocks were parsed
    after that asset started carrying them (2026-10).
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: [etl_source, run_readable_id, key]
        quote_columns: true
  columns:
  - name: etl_source
    description: str, mitxonline or xpro. Half of the scoped pull's key.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [mitxonline, xpro]
  - name: run_readable_id
    description: str, course run id; equals ContentFile.run.run_id. Half of the scoped
      pull's key.
    tests: [not_null]
  - name: key
    quote: true
    description: str, ContentFile.key, the edX module id Learn derives from the file's
      path. Unique within a run.
    tests: [not_null]
  - name: edx_module_id
    description: str, same value as key.
  - name: title
    description: str, the block's display_name, the video name for a transcript, the
      html pointer's display_name for an HTML file, or a title made from the file
      name.
  - name: description
    description: str, always null; Learn's Open edX ETL sets none.
  - name: url
    description: str, LMS jump URL for a block with a UUID id or a transcript of a
      video, the asset URL for other static files, else null.
  - name: file_type
    description: str, always null; Learn's Open edX ETL sets none.
  - name: content
    description: str, the file's extracted text; null when extraction failed. An XML
      block's text is its XML as re-serialized by the parser (Tika returns the file
      unchanged; comments and CDATA markers are lost here), or for a block with inline
      html, its text nodes (an approximation of Tika's HTML text).
  - name: content_title
    description: str, always ''. Learn reads Tika's metadata title into this field,
      but its production content files have '' throughout, PDFs with an embedded title
      included, so '' matches what Learn stores.
  - name: content_author
    description: str, always null.
  - name: content_language
    description: str, always null.
  - name: content_type
    description: str, always "file".
  - name: image_src
    description: str, always null.
  - name: uid
    description: str, always null.
  - name: source_path
    description: str, path within the course export, e.g. course/static/handout.pdf.
    tests: [not_null]
  - name: file_extension
    description: str, file extension with its dot, e.g. .pdf
  - name: checksum
    description: str, MD5 of content. Not Learn's archive_checksum, which hashes the
      file's bytes.
  - name: extraction_status
    description: str, extracted, or failed for a file whose text could not be read.
      A failed file is still present so a scoped prune does not unpublish it.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [extracted, failed]
  - name: published
    description: boolean, always true.
  - name: last_modified
    description: str, ISO 8601 time the file's text was extracted.
  - name: release_date
    description: str, ContentFile.release_date as ISO 8601 UTC (YYYY-MM-DDTHH:MM:SS.ffffffZ),
      the latest OLX start on the path from the course down to the file (a static
      asset takes the earliest date of the dated files that link it), as Learn's OlxArchive.release_dates
      computes it. Null when Learn leaves the file undated (an undated learner-visible
      path to it, or a self-paced run). Learn shows a file only while release_date
      is null or past, so a future-dated row stays here but is hidden in Learn until
      then.

- name: integrations__learn__ocw_content_files
  description: >
    One row per ContentFile of an OCW course run, for MIT Learn's
    SyncOCWContentFilesTask. A scoped pull filters and prunes on
    (etl_source, run_readable_id). Built from the data.json files of the OCW live
    bucket, which is what Learn's OCW ETL reads, and the text Tika extracts from
    each resource's file. Not applied: Learn's nh3 sanitizing of a resource's
    description, so description is the HTML OCW published.
  config:
    meta:
      # It reads the OCW live bucket, and ocw/s3 is qa: omit in the inventory.
      qa_buildable: false
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: [etl_source, run_readable_id, key]
        quote_columns: true
  columns:
  - name: etl_source
    description: str, always ocw. Half of the scoped pull's key.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [ocw]
  - name: run_readable_id
    description: str, the course's legacy_uid, or its site_uid when it has none, without
      dashes; equals ContentFile.run.run_id. Half of the scoped pull's key.
    tests: [not_null]
  - name: key
    quote: true
    description: str, ContentFile.key, the directory of the page or resource in the
      OCW bucket with its trailing slash, e.g. courses/<course>/resources/<name>/.
    tests: [not_null]
  - name: edx_module_id
    description: str, always null.
  - name: title
    description: str, title of the page or resource.
  - name: description
    description: str, description of a page, or the HTML body of a resource. Not sanitized.
  - name: url
    description: str, https://ocw.mit.edu/ followed by key.
    tests: [not_null]
  - name: file_type
    description: str, MIME type of a resource's file; null for a page.
  - name: content
    description: str, a page's HTML, or the text Tika extracted from a resource's
      file. Null for a resource whose file is not a type Learn reads, has no text,
      or failed extraction.
  - name: content_title
    description: str, same value as title.
  - name: content_author
    description: str, always null.
  - name: content_language
    description: str, always null.
  - name: content_type
    description: str, page, video, pdf or file.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [page, video, pdf, file]
  - name: image_src
    description: str, thumbnail of a video resource, else null.
  - name: uid
    description: str, always null.
  - name: source_path
    description: str, always null.
  - name: file_extension
    description: str, extension of a resource's file with its dot, e.g. .pdf; '' for
      a resource whose file has none and null for a page.
  - name: checksum
    description: str, MD5 of content, null when content is null or empty. Equals ContentFile.checksum
      where the text matches.
  - name: extraction_status
    description: str, extracted, empty (the file has no text) or failed (Tika could
      not read it); null for a page and for a file Learn reads no text from. A failed
      file keeps its row so a scoped prune does not unpublish it.
    tests:
    - accepted_values:
        arguments:
          values: [extracted, empty, failed]
  - name: published
    description: boolean, always true.
  - name: last_modified
    description: str, ISO 8601 time the course was last read from the bucket. It moves
      for every file of a course when any of them changes.
  - name: content_tags
    description: str, JSON array of the learning resource types Learn loads as content
      tags, e.g. ["Problem Sets"].
  - name: youtube_id
    description: str, YouTube id of a video resource, else null.
- name: integrations__learn__canvas_content_files
  description: >
    One row per ContentFile of a Canvas course's run, for the warehouse pull that
    replaces ingest_canvas_course. A scoped pull filters and prunes on
    (etl_source, run_readable_id). Built from the newest export of each course in
    the landing zone by the same rules as learning_resources/etl/canvas.py, with
    the text Tika extracts. Tutor problem files are not here: ingest_canvas_course
    also loads those, so flipping Canvas stops them unless Learn gets them another
    way. Not at parity for PDFs: Learn converts a PDF of up to
    OCR_PDF_MAX_PAGE_THRESHOLD pages with opendataloader and an LLM (mit-learn
    #4126 changed that path), which keeps math and text in images and returns
    markdown, and this model has Tika's plain text for every PDF. A scanned PDF has
    no row here.
  config:
    meta:
      # It reads the production landing zone, and canvas/s3 is qa: omit in the
      # inventory.
      qa_buildable: false
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: [etl_source, run_readable_id, key]
        quote_columns: true
  columns:
  - name: etl_source
    description: str, always canvas. Half of the scoped pull's key.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [canvas]
  - name: run_readable_id
    description: str, <course_id>-<course_code>+canvas; equals ContentFile.run.run_id.
      Half of the scoped pull's key.
    tests: [not_null]
  - name: key
    quote: true
    description: str, ContentFile.key, block-v1:<run>+type@<file's folder>+block@<file
      name without its extension>. The extension is not part of it, so when a folder
      holds a.pdf and a.docx they are one row, for the last path in sort order.
    tests: [not_null]
  - name: edx_module_id
    description: str, same value as key.
  - name: title
    description: str, the title of the module item, file or page that publishes the
      file, or one derived from the file name when it has none. Learn has this on
      a read that reuses a file's text; on a file's first read, or the read after
      its bytes change, Learn has the derived title.
    tests: [not_null]
  - name: description
    description: str, always null.
  - name: url
    description: str, the file's, assignment's or page's Canvas URL, from the export's
      metadata JSON. Null when that has no entry for the file.
  - name: file_type
    description: str, always null.
  - name: content
    description: str, the text Tika extracted, or an earlier read's text for the same
      bytes. Null for a file that failed, which keeps its row so a scoped prune does
      not unpublish it.
  - name: content_title
    description: str, the title of what publishes the file; empty for a file only
      a page links to, null for a file at the root of the archive.
  - name: content_author
    description: str, always null.
  - name: content_language
    description: str, always null.
  - name: content_type
    description: str, always file.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [file]
  - name: image_src
    description: str, always null.
  - name: uid
    description: str, always null.
  - name: source_path
    description: str, the file's path in the archive.
    tests: [not_null]
  - name: file_extension
    description: str, the file's extension with its dot, in lower case.
  - name: checksum
    description: str, MD5 of content; null when content is. Equals ContentFile.checksum
      where the text matches.
  - name: extraction_status
    description: str, extracted, or failed (Tika could not read the file, it was over
      the source's size limit, or pypdf could not read it, which Learn also treats
      as a failure).
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [extracted, failed]
  - name: published
    description: boolean, always true. A file students cannot reach is not here.
  - name: last_modified
    description: str, ISO 8601 time the course was last read. It moves for every file
      of a course when any of them changes.
- name: integrations__learn__canvas_courses
  description: >
    One row per Canvas course with an export in the landing zone. ingest_canvas_course
    writes a course and its content files from one archive, so Learn's (canvas, course)
    and (canvas, content_file) ownership keys move together, and this is the course
    half. Carries what run_for_canvas_archive writes. Each course has the one run
    Learn creates for it. Learn keeps a Canvas resource unpublished and in test mode,
    so neither flag is here.
  config:
    meta:
      # It reads the production landing zone, and canvas/s3 is qa: omit in the
      # inventory.
      qa_buildable: false
  columns:
  - name: etl_source
    description: str, always canvas.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [canvas]
  - name: course_id
    description: str, the Canvas course id.
    tests: [not_null, unique]
  - name: readable_id
    description: str, <course_id>-<course_code>; LearningResource.readable_id.
    tests: [not_null, unique]
  - name: run_id
    description: str, <readable_id>+canvas; equals run_readable_id in integrations__learn__canvas_content_files.
    tests: [not_null, unique]
  - name: course_code
    description: str, course_code in the course's settings.
  - name: title
    description: str, title in the course's settings, or "canvas course <course_id>"
      when it has none.
    tests: [not_null]
  - name: url
    description: str, the course's home in Canvas.
    tests: [not_null]
  - name: start_date
    description: str, start_at in the course's settings as Canvas wrote it.
  - name: end_date
    description: str, conclude_at in the course's settings as Canvas wrote it.
  - name: last_modified
    description: str, ISO 8601 time the course was last read.
