---
# MIT Learn integration layer — Cohort 2 REST API sources
# Sits above marts, exposes stable application-level contracts for ETL consumption.
# Naming: integrations__learn__<source>_<entity>
# See: docs/learn_marts_contract.md for the full schema contract.

version: 2

models:
- name: integrations__learn__mit_climate_articles
  config:
    tags: [qa_scheduled]
  description: >
    MIT Climate Portal articles (Explainers + Ask MIT Climate) exposed for
    MIT Learn's ETL. One row per article, identified by uuid.
    Sourced from stg__mit_climate__api__articles via the mit_climate dlt pipeline.
  columns:
  - name: readable_id
    description: Article UUID from the MIT Climate API. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Article title.
    tests: [not_null]
  - name: last_modified
    description: >
      ISO-8601 timestamp derived from the article's created date.
      Falls back to current_timestamp when the created field is absent.
    tests: [not_null]
  - name: etl_source
    description: Always 'mit_climate'.
    tests: [not_null]
  - name: description
    description: Article summary.
  - name: url
    description: Absolute URL for the article (base URL prepended to the relative
      path).
  - name: image_url
    description: Absolute URL for the article cover image, or NULL if absent.
  - name: image_alt
    description: Alt text for the article cover image, or NULL if absent.
  - name: topics
    description: Comma-separated topic labels (normalized from pipe-separated raw
      field).
  - name: footnotes
    description: Article footnotes/citations, as raw text from the CMS.
  - name: byline
    description: Article author byline.
  - name: feed_type
    description: Source feed — 'explainer' or 'ask_mit_climate'.
  - name: published
    description: >
      Always true; the MIT Climate API only returns published articles.
  - name: platform
    description: >
      Always 'climate' (differs from etl_source, which is 'mit_climate').

- name: integrations__learn__mitpe_courses
  config:
    tags: [qa_scheduled]
  description: >
    MIT Professional Education courses for MIT Learn webhook delivery, one row per
    course with at least one published run (integrations__learn__mitpe_runs). A
    course with none is left out, which MIT Learn treats as unpublished. Built from
    int__mitpe__learning_resources.
  columns:
  - name: readable_id
    description: str, the feed item's uuid, which MIT Learn's legacy ETL used as readable_id.
    tests: [not_null, unique]
  - name: title
    description: str, title with surrounding whitespace trimmed and HTML entities
      decoded.
    tests: [not_null]
  - name: url
    description: str, absolute URL of the page on professional.mit.edu.
  - name: image_url
    description: str, absolute URL of the cover image, null if none.
  - name: image_alt
    description: str, alt text for the cover image.
  - name: description
    description: str, description as the feed gives it (HTML). The delivery asset
      sanitizes it, as MIT Learn's clean_data did.
  - name: topics
    description: array of str, the feed's topic names, null if none. MIT Learn keeps
      only names that are exactly one of its topics.
  - name: delivery
    description: str, MIT Learn delivery code (online, hybrid, in_person, offline).
    tests: [not_null]
  - name: location
    description: str, location for in-person and blended formats, else empty.
    tests: [not_null]
  - name: duration
    description: str, the feed's duration text, empty if none.
  - name: min_weeks
    description: int, lower bound of the duration in weeks, null if unparseable.
  - name: max_weeks
    description: int, upper bound of the duration in weeks, null if unparseable.
  - name: price
    description: decimal, price in USD, null if none. Applies to every run.
  - name: instructors
    description: array of str, instructor full names, lead instructors first. Applies
      to every run.
  - name: etl_source
    description: Always 'mitpe'.
    tests: [not_null]
  - name: platform
    description: Always 'mitpe'.
    tests: [not_null]
  - name: resource_type
    description: Always 'course'.
    tests: [not_null]

- name: integrations__learn__mitpe_programs
  config:
    tags: [qa_scheduled]
  description: >
    MIT Professional Education programs for MIT Learn webhook delivery, one row per
    program with at least one published run, with the delivered courses it contains.
    Built from int__mitpe__learning_resources and int__mitpe__program_courses.
  columns:
  - name: readable_id
    description: str, the feed item's uuid.
    tests: [not_null, unique]
  - name: title
    description: str, title with surrounding whitespace trimmed and HTML entities
      decoded.
    tests: [not_null]
  - name: url
    description: str, absolute URL of the page on professional.mit.edu.
  - name: image_url
    description: str, absolute URL of the cover image, null if none.
  - name: image_alt
    description: str, alt text for the cover image.
  - name: description
    description: str, description as the feed gives it (HTML). The delivery asset
      sanitizes it, as MIT Learn's clean_data did.
  - name: topics
    description: array of str, the feed's topic names, null if none. MIT Learn keeps
      only names that are exactly one of its topics.
  - name: delivery
    description: str, MIT Learn delivery code (online, hybrid, in_person, offline).
    tests: [not_null]
  - name: location
    description: str, location for in-person and blended formats, else empty.
    tests: [not_null]
  - name: duration
    description: str, the feed's duration text, empty if none.
  - name: min_weeks
    description: int, lower bound of the duration in weeks, null if unparseable.
  - name: max_weeks
    description: int, upper bound of the duration in weeks, null if unparseable.
  - name: price
    description: decimal, price in USD, null if none. Applies to every run.
  - name: instructors
    description: array of str, instructor full names, lead instructors first. Applies
      to every run.
  - name: course_readable_ids
    description: array of str, readable_ids of the program's courses that are in integrations__learn__mitpe_courses,
      in the order the feed lists them; null if none.
  - name: etl_source
    description: Always 'mitpe'.
    tests: [not_null]
  - name: platform
    description: Always 'mitpe'.
    tests: [not_null]
  - name: resource_type
    description: Always 'program'.
    tests: [not_null]

- name: integrations__learn__mitpe_runs
  config:
    tags: [qa_scheduled]
  description: >
    Published runs of MIT Professional Education courses and programs, for MIT Learn
    webhook delivery. Publication is evaluated when the model is built. Dates are
    ISO
    8601 UTC instants of midnight US Eastern.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - readable_id
        - run_position
  columns:
  - name: readable_id
    description: str, the course or program the run belongs to.
    tests: [not_null]
  - name: run_id
    description: str, the feed's run id.
    tests: [not_null]
  - name: run_position
    description: int, 1-based position of the run in the feed.
    tests: [not_null]
  - name: start_date
    description: str, ISO 8601 start instant, null if none.
  - name: end_date
    description: str, ISO 8601 end instant, null if none.
  - name: enrollment_end
    description: str, ISO 8601 enrollment end instant, null if none.

- name: integrations__learn__oll_courses
  config:
    tags: [qa_scheduled]
  description: >
    Open Learning Library courses for MIT Learn webhook delivery, shaped as MIT
    Learn's legacy OLL ETL (learning_resources/etl/oll.py) writes them. One row per
    row of the OLL sheet except the runs in MIT Learn's SKIP_OCW_COURSES; each
    course has exactly one run. OCW-offered rows are included: they are OLL-hosted
    runs MIT Learn lists as offered by OCW, not OCW course sites.
  columns:
  - name: readable_id
    description: >
      str, MITx+{course_number}, or for an OCW-offered row
      {course_number}+{semester}_{year} with the semester lowercased, as the
      legacy ETL builds them.
    tests: [not_null, unique]
  - name: run_id
    description: str, the sheet's edX run key, e.g. MITx+0.501x+2T2019. The course's
      only run.
    tests: [not_null, unique]
  - name: course_number
    description: str, the OLL course number, e.g. 0.501x.
    tests: [not_null]
  - name: title
    description: str, course title; also the run title and image alt text.
    tests: [not_null]
  - name: url
    description: str, the course's openlearninglibrary.mit.edu URL.
  - name: description
    description: str, course description; also the full description and run description.
  - name: image_url
    description: str, course image URL (the sheet's flat image column).
  - name: offered_by
    description: str, MIT Learn offeror code, 'ocw' when the sheet says OCW, else
      'mitx'.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [mitx, ocw]
  - name: published
    description: boolean, whether the sheet's published column is YES.
    tests: [not_null]
  - name: level
    description: str, MIT Learn LevelType name of the sheet's level, null when empty
      or not one MIT Learn knows.
  - name: topics
    description: array<str>, the sheet's MITx Online primary and secondary child topics,
      in that order, with Educational Policy renamed Education Policy. Null when the
      row has neither.
  - name: instructors
    description: array<str>, the sheet's instructor columns 1 to 6 in order, empty
      ones dropped. Null when the row has none.
  - name: year
    description: int, the run's year from its run key, null when the key has no term.
  - name: semester
    description: str, Spring, Summer or Fall from a 1T/2T/3T term key, else the season
      of a 2022_Summer style suffix, else null.
  - name: duration
    description: str, '{weeks} weeks', null when the sheet has no duration.
  - name: min_weeks
    description: int, the sheet's duration in weeks, rounded up.
  - name: max_weeks
    description: int, same as min_weeks.
  - name: time_commitment
    description: str, '{hours} hours/week', null when the sheet has no student effort.
  - name: min_weekly_hours
    description: int, the sheet's student effort in hours a week, rounded up.
  - name: max_weekly_hours
    description: int, same as min_weekly_hours.
  - name: last_modified
    description: str, ISO 8601 build time; the sheet has no modification time.
    tests: [not_null]
  - name: etl_source
    description: Always 'oll'.
    tests: [not_null]
  - name: platform
    description: Always 'oll'.
  - name: resource_type
    description: Always 'course'.

- name: integrations__learn__mit_edx_programs
  description: >
    The edX.org programs MIT Learn lists, for webhook delivery: MITx and MITx_PRO
    programs edX currently lists as active, excluding MicroMasters. One row per
    program, carrying the single run MIT Learn models a program as. Built from the
    edxorg code location's programs API extraction (int__edxorg__mitx_learn_programs)
    and the MITx catalog (int__edxorg__mitx_learn_program_rollups). Evaluated when
    built.
  config:
    meta:
      qa_branches:
      - mitlearn/app_postgres
  columns:
  - name: readable_id
    description: str, the program's edX uuid; also its run id.
    tests: [not_null, unique]
  - name: title
    description: str, program title.
    tests: [not_null]
  - name: description
    description: str, the program's edX subtitle (sanitized at delivery).
  - name: url
    description: str, the program's edX marketing URL.
  - name: image_url
    description: str, the program's medium banner image URL, null if none.
  - name: last_modified
    description: str, ISO 8601 time edX last modified the program.
  - name: level
    description: str, MIT Learn level code from the program's level override, null
      when the override isn't one of MIT Learn's levels.
  - name: start_date
    description: str, earliest start of a published run of a course not excluded from
      search.
  - name: end_date
    description: str, latest end of such a run.
  - name: enrollment_start
    description: str, earliest enrollment start of such a run.
  - name: enrollment_end
    description: str, latest enrollment end of such a run.
  - name: price
    description: decimal, sum over the program's searchable courses of the cheapest
      paid seat of each one's earliest-starting published run.
    tests: [not_null]
  - name: currency
    description: str, currency of the first course's price, USD by default.
    tests: [not_null]
  - name: pace
    description: array of str, pacing types of the courses' published runs (self_paced
      for a course with none).
  - name: availability
    description: str, dated or anytime from the courses' published runs, null when
      neither applies.
  - name: topics
    description: array of str, MIT Learn topics the program's published courses' edX
      subjects resolve to through the topic crosswalk.
  - name: duration
    description: str, the published courses' weeks to complete summed, e.g. 22 weeks;
      empty if none.
  - name: min_weeks
    description: int, the summed weeks, null if none.
  - name: max_weeks
    description: int, the summed weeks, null if none.
  - name: time_commitment
    description: str, averaged weekly hours, e.g. 4-5 hours/week; empty if none.
  - name: min_weekly_hours
    description: int, the lower averaged weekly hours, null if none.
  - name: max_weekly_hours
    description: int, the higher averaged weekly hours, null if none.
  - name: course_readable_ids
    description: array of str, the program's course keys in the programs API's order.
      MIT Learn links the ones it publishes. Null when the programs' extraction has
      no courses for the program, which the delivery refuses to send, since MIT Learn
      would drop every course link the program has.
    tests: [not_null]
  - name: retrieved_at
    description: str, ISO 8601 time the edX programs extraction these rows come from
      ran. The delivery refuses to send an extraction older than three days, since
      the models keep the last one when extractions stop arriving.
    tests: [not_null]
  - name: etl_source
    description: Always 'mit_edx'.
    tests: [not_null]
  - name: platform
    description: Always 'edx', MIT Learn's platform code for edX.org.
    tests: [not_null]
  - name: resource_type
    description: Always 'program'.
    tests: [not_null]

- name: integrations__learn__mit_edx_program_instructors
  description: >
    Instructors of the programs in integrations__learn__mit_edx_programs, one row
    per program and distinct instructor: the staff of the best run of each course
    in
    the program that MIT Learn publishes, ordered by last name.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - readable_id
        - instructor_position
  columns:
  - name: readable_id
    description: str, the program's edX uuid.
    tests: [not_null]
  - name: first_name
    description: str, instructor's first name.
  - name: last_name
    description: str, instructor's last name.
  - name: full_name
    description: str, first and last name.
    tests: [not_null]
  - name: instructor_position
    description: int, 1-based position of the instructor in the program.
    tests: [not_null]

unit_tests:
- name: test_integrations__learn__oll_courses_builds_legacy_ids_and_run_fields
  description: >
    MIT Learn's OLL ETL ids an OCW-offered row by course number, semester and year
    parsed from the run key (a 1T/2T/3T term, else a 2022_Summer suffix) and every
    other row by MITx+{course number}. It skips the SKIP_OCW_COURSES run, rounds
    duration and effort up, and maps the level label to its LevelType name.
  model: integrations__learn__oll_courses
  given:
  - input: ref('stg__oll__google_sheets__courses')
    rows:
    - {course_number: 0.501x, courserun_readable_id: MITx+0.501x+2T2019, course_title: Mechanics,
      course_offered_by: MITx, course_is_published: true, course_level: Undergraduate,
      course_duration_weeks: '13', course_weekly_hours: '3.5'}
    - {course_number: '18.05', courserun_readable_id: MITx+18.05r_10+2022_Summer,
      course_title: Probability, course_offered_by: OCW, course_is_published: true,
      course_level: '', course_duration_weeks: '', course_weekly_hours: ''}
    - {course_number: Pre_7.01r, courserun_readable_id: OCW+Pre-7.01+1T2020, course_title: Biology,
      course_offered_by: OCW, course_is_published: true, course_level: High School,
      course_duration_weeks: '6', course_weekly_hours: '4'}
    - {course_number: 21A.819.1x, courserun_readable_id: MITx+21A.819.1x, course_title: Ethnography,
      course_offered_by: MITx, course_is_published: false, course_level: Graduate,
      course_duration_weeks: '4', course_weekly_hours: ''}
    - {course_number: '18.031', courserun_readable_id: OCW+18.031+2019_Spring, course_title: Skipped,
      course_offered_by: OCW, course_is_published: true, course_level: Undergraduate,
      course_duration_weeks: '4', course_weekly_hours: '4'}
  expect:
    rows:
    - {readable_id: MITx+0.501x, run_id: MITx+0.501x+2T2019, offered_by: mitx, published: true,
      level: undergraduate, year: 2019, semester: Summer, duration: 13 weeks, min_weeks: 13,
      time_commitment: 4 hours/week, min_weekly_hours: 4}
    - {readable_id: 18.05+summer_2022, run_id: MITx+18.05r_10+2022_Summer, offered_by: ocw,
      published: true, level: null, year: 2022, semester: Summer, duration: null,
      min_weeks: null, time_commitment: null, min_weekly_hours: null}
    - {readable_id: Pre_7.01r+spring_2020, run_id: OCW+Pre-7.01+1T2020, offered_by: ocw,
      published: true, level: high_school, year: 2020, semester: Spring, duration: 6
        weeks, min_weeks: 6, time_commitment: 4 hours/week, min_weekly_hours: 4}
    - {readable_id: MITx+21A.819.1x, run_id: MITx+21A.819.1x, offered_by: mitx, published: false,
      level: graduate, year: null, semester: null, duration: 4 weeks, min_weeks: 4,
      time_commitment: null, min_weekly_hours: null}

- name: test_integrations__learn__oll_courses_orders_instructors_and_topics
  description: >
    Instructors keep their column order and topics put the primary child first, as
    the legacy ETL lists them. Empty columns are dropped, a row with none gets NULL
    (sent as []), and Educational Policy is renamed Education Policy.
  model: integrations__learn__oll_courses
  given:
  - input: ref('stg__oll__google_sheets__courses')
    rows:
    - {course_number: 0.501x, courserun_readable_id: MITx+0.501x+2T2019, course_offered_by: MITx,
      instructor_1: Zed Last, instructor_2: '', instructor_3: Amy First, instructor_4: '',
      instructor_5: '', instructor_6: '', course_primary_topic: Educational Policy,
      course_secondary_topic: Mathematics}
    - {course_number: 0.502x, courserun_readable_id: MITx+0.502x+1T2019, course_offered_by: MITx,
      instructor_1: '', instructor_2: '', instructor_3: '', instructor_4: '', instructor_5: '',
      instructor_6: '', course_primary_topic: '', course_secondary_topic: ''}
  expect:
    # DuckDB casts the list literals to the model's varchar[] columns.
    rows:
    - {readable_id: MITx+0.501x, topics: '[Education Policy, Mathematics]', instructors: '[Zed
        Last, Amy First]'}
    - {readable_id: MITx+0.502x, topics: null, instructors: null}
