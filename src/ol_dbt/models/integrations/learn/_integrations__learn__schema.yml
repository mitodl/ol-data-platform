---
# MIT Learn integration layer
# Sits above marts, exposes stable application-level contracts for Trino-pull consumption.
# Naming: integrations__learn__<source>_<entity>
# See: docs/learn_marts_contract.md for the full schema contract.

version: 2

models:
- name: integrations__learn__ocw_courses
  config:
    tags: [qa_scheduled]
  description: >
    OCW courses exposed for MIT Learn's Trino-pull ETL. One row per live OCW course.
    Sourced from int__ocw__courses, int__ocw__course_topics,
    int__ocw__course_instructors, and int__ocw__course_departments.
  columns:
  - name: readable_id
    description: OCW course short ID (website_short_id). Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Course title.
    tests: [not_null]
  - name: last_modified
    description: Last publish date from OCW Studio.
    tests: [not_null]
  - name: etl_source
    description: Always 'ocw'.
    tests: [not_null]
  - name: description
    description: Course description from the OCW website.
  - name: url
    description: URL of the course on OCW production (ocw.mit.edu).
  - name: image_url
    description: Course image URL.
  - name: published
    description: Whether the course is live on ocw.mit.edu.
  - name: platform
    description: Always 'ocw', matches etl_source.
  - name: level
    description: >
      Comma-separated course level(s), e.g. Undergraduate, Graduate,
      Non-Credit, High School.
  - name: term
    description: Course term, e.g. Spring, Summer, Fall, January IAP, or blank.
  - name: year
    description: Course year.
  - name: course_number
    description: Primary course number, e.g. '21A.850J'.
  - name: extra_course_numbers
    description: Additional course numbers beyond the primary, e.g. 'STS.484J'.
  - name: topics
    description: >
      Comma-separated topic labels, preferring speciality, then subtopic,
      then topic.
  - name: instructors
    description: Comma-separated instructor names.
  - name: departments
    description: Comma-separated department names offering the course.

- name: integrations__learn__mitxonline_courses
  config:
    tags: [qa_scheduled]
  description: >
    MITx Online courses exposed for MIT Learn's Trino-pull ETL. One row per live course.
    Sourced from int__mitxonline__courses and int__mitxonline__course_runs.
  columns:
  - name: readable_id
    description: MITxOnline course readable ID. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Course title.
    tests: [not_null]
  - name: last_modified
    description: >
      Last CMS page publish date. Falls back to current_timestamp for courses
      without a Wagtail CMS page.
    tests: [not_null]
  - name: etl_source
    description: Always 'mitxonline'.
    tests: [not_null]
  - name: description
    description: Course description shown on the course's home/product page.
  - name: url
    description: MITx Online course page URL path (relative).
  - name: image_url
    description: Course image URL.
  - name: published
    description: Whether the course is live on mitxonline.mit.edu.
  - name: platform
    description: Always 'mitxonline', matches etl_source.
  - name: page_slug
    description: MITx Online CMS page slug, used for constructing the course page's
      URL.
  - name: topics
    description: Comma-separated topic names for the course.
  - name: instructors
    description: Comma-separated instructor names for the course.
  - name: certification_type
    description: Either 'MicroMasters Credential' or 'Certificate of Completion'.
  - name: price
    description: >
      Product price in plain text, e.g. '$250 - $1000 (financial assistance
      available)'.
  - name: length
    description: >
      Short description of how long the course takes to complete, e.g.
      '4 weeks'.
  - name: effort
    description: >
      Short description of expected weekly effort, e.g. '1-3 hours per week'.
  - name: runs
    description: >
      Pipe-delimited run metadata strings joined with semicolons.
      Format per run: readable_id|start_on|end_on|is_live

- name: integrations__learn__mitxonline_programs
  config:
    tags: [qa_scheduled]
  description: >
    MITx Online programs exposed for MIT Learn's Trino-pull ETL. One row per live
    program.
    Sourced from int__mitxonline__programs and int__mitxonline__program_requirements.
  columns:
  - name: readable_id
    description: MITxOnline program readable ID. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Program title.
    tests: [not_null]
  - name: last_modified
    description: >
      Last CMS page publish date. Falls back to current_timestamp for programs
      without a Wagtail CMS page.
    tests: [not_null]
  - name: etl_source
    description: Always 'mitxonline'.
    tests: [not_null]
  - name: description
    description: Program description shown on the program's home/product page.
  - name: url
    description: MITx Online program page URL path (relative).
  - name: image_url
    description: Program image URL.
  - name: published
    description: Whether the program is live on mitxonline.mit.edu.
  - name: platform
    description: Always 'mitxonline', matches etl_source.
  - name: program_type
    description: >
      Program type, free text from the source CMS, e.g. 'MicroMasters',
      'Series'.
  - name: certification_type
    description: Either 'MicroMasters Credential' or 'Certificate of Completion'.
  - name: topics
    description: >
      Comma-separated topic names aggregated across all courses in the
      program.
  - name: instructors
    description: Comma-separated instructor names for the program.
  - name: page_slug
    description: MITx Online CMS page slug, used for constructing the program page's
      URL.
  - name: price
    description: Product price in plain text, e.g. '$250 - $1000'.
  - name: effort
    description: >
      Short description of expected weekly effort, e.g. '1-3 hours per week'.
  - name: courses
    description: Comma-separated list of course readable_ids belonging to this program.

- name: integrations__learn__xpro_courses
  config:
    tags: [qa_scheduled]
  description: >
    The courses xPRO's catalog API lists: live courses with a live CMS page, published
    or not. One row per course, with the fields MIT Learn's xPRO ETL reads from the
    API. Runs are in integrations__learn__xpro_runs.
  columns:
  - name: readable_id
    description: str, the xPRO course readable id. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: str, course title.
    tests: [not_null]
  - name: last_modified
    description: str, ISO 8601 time the CMS page was last published.
    tests: [not_null]
  - name: etl_source
    description: str, always 'xpro'.
    tests: [not_null]
  - name: description
    description: str, the page's description, as HTML. Not sanitized; MIT Learn passes
      it through clean_data.
  - name: url
    description: str, absolute URL of the course page on the xPRO site.
    tests: [not_null]
  - name: image_url
    description: str, the page's thumbnail image, or the xPRO site's default image
      when the page has none.
    tests: [not_null]
  - name: published
    description: boolean, whether a run in integrations__learn__xpro_runs has a price
      above zero, which is when MIT Learn publishes an xPRO course.
    tests: [not_null]
  - name: platform
    description: str, the xPRO platform name (xPRO, Emeritus, Global Alumni, Simplilearn,
      Susskind, WHU). MIT Learn maps it to a platform code.
  - name: topics
    description: array(str), names of the page's xPRO topics, sorted; null when it
      has none. A child topic is named 'Parent:Child'. MIT Learn keeps the part after
      the colon and maps it to its own topics.
  - name: format
    description: str, the page's format, 'Online' or 'Hybrid'. MIT Learn maps it to
      a delivery code.
  - name: availability
    description: str, always 'dated', as the xPRO API reports.
  - name: continuing_ed_credits
    description: double, CEUs from the page's certificate page; null without one.
  - name: duration
    description: str, free-text duration from the page, e.g. '3 Weeks'.
  - name: min_weeks
    description: int, shortest length in weeks; null if the page does not give one.
  - name: max_weeks
    description: int, longest length in weeks; null if the page does not give one.
  - name: time_commitment
    description: str, free-text weekly effort from the page, e.g. '5 Hours per Week'.
  - name: min_weekly_hours
    description: int, least weekly hours; null if the page does not give one.
  - name: max_weekly_hours
    description: int, most weekly hours; null if the page does not give one.

- name: integrations__learn__xpro_runs
  config:
    tags: [qa_scheduled]
  description: >
    Runs of the courses in integrations__learn__xpro_courses, as xPRO's catalog API
    lists them under a course: live, with a start date, not past their end date or
    enrollment end, enrollment open, and with an active product. Evaluated when the
    model builds. A run that leaves this set is one MIT Learn unpublishes.
  columns:
  - name: readable_id
    description: str, the run's course.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('integrations__learn__xpro_courses')
          field: readable_id
  - name: run_id
    description: str, the run's courseware id, MIT Learn's run id.
    tests: [not_null, unique]
  - name: title
    description: str, the run's title.
  - name: start_date
    description: str, ISO 8601 UTC start.
    tests: [not_null]
  - name: end_date
    description: str, ISO 8601 UTC end; null if none.
  - name: enrollment_start
    description: str, ISO 8601 UTC start of enrollment; null if none.
  - name: enrollment_end
    description: str, ISO 8601 UTC end of enrollment; null if none.
  - name: price
    description: decimal, price in USD from the latest version of the run's product;
      null if the product has no version.
  - name: instructors
    description: array(str), names on the course page's faculty page; null without
      one.
  - name: published
    description: boolean, whether price is above zero, as MIT Learn's xPRO ETL sets
      it.
    tests: [not_null]

- name: integrations__learn__xpro_programs
  config:
    tags: [qa_scheduled]
  description: >
    The programs xPRO's catalog API lists: live programs with a live CMS page and
    a product. One row per program, with the fields MIT Learn's xPRO ETL reads
    from the API, including the price and dates of the one run MIT Learn gives a
    program.
  columns:
  - name: readable_id
    description: str, the xPRO program readable id. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: str, program title.
    tests: [not_null]
  - name: last_modified
    description: str, ISO 8601 time the CMS page was last published.
    tests: [not_null]
  - name: etl_source
    description: str, always 'xpro'.
    tests: [not_null]
  - name: description
    description: str, the page's description, as HTML. Not sanitized; MIT Learn passes
      it through clean_data.
  - name: url
    description: str, absolute URL of the program page on the xPRO site.
    tests: [not_null]
  - name: image_url
    description: str, the page's thumbnail image, or the xPRO site's default image
      when the page has none.
    tests: [not_null]
  - name: published
    description: boolean, whether price is above zero, as MIT Learn's xPRO ETL sets
      it.
    tests: [not_null]
  - name: platform
    description: str, the xPRO platform name. MIT Learn maps it to a platform code.
  - name: topics
    description: array(str), names of the xPRO topics of every course in the program,
      sorted; null when there are none.
  - name: instructors
    description: array(str), names on the program page's faculty page; null without
      one.
  - name: courses
    description: str, comma-separated readable ids of the program's live courses,
      in program order.
  - name: price
    description: decimal, price in USD from the latest version of the program's active
      product; null if it has none.
  - name: start_date
    description: str, ISO 8601 UTC start of the earliest open run of the program's
      first course; null if it has none.
  - name: end_date
    description: str, ISO 8601 UTC end of the last live run of any course in the program.
  - name: enrollment_start
    description: str, ISO 8601 UTC enrollment start of the run start_date comes from.
  - name: format
    description: str, the page's format, 'Online' or 'Hybrid'. MIT Learn maps it to
      a delivery code.
  - name: availability
    description: str, always 'dated', as the xPRO API reports.
  - name: continuing_ed_credits
    description: double, CEUs from the page's certificate page; null without one.
  - name: duration
    description: str, free-text duration from the page, e.g. '3 Weeks'.
  - name: min_weeks
    description: int, shortest length in weeks; null if the page does not give one.
  - name: max_weeks
    description: int, longest length in weeks; null if the page does not give one.
  - name: time_commitment
    description: str, free-text weekly effort from the page, e.g. '5 Hours per Week'.
  - name: min_weekly_hours
    description: int, least weekly hours; null if the page does not give one.
  - name: max_weekly_hours
    description: int, most weekly hours; null if the page does not give one.

- name: integrations__learn__mit_edx_courses
  description: >
    MIT edX (MITx on edX.org) courses exposed for MIT Learn's Trino-pull ETL.
    One row per course with at least one published run.
    Sourced from stg__edxorg__api__course and stg__edxorg__api__courserun
    (edx.org S3 exports via IRx). Source decision: edxorg dg_project, not
    mitxresidential (which covers MIT's internal OpenEdX deployment).
  columns:
  - name: readable_id
    description: edX.org course key (e.g. MITx/6.00.1x). Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Course title.
    tests: [not_null]
  - name: last_modified
    description: Last modified timestamp from the edX.org course catalog API export.
    tests: [not_null]
  - name: etl_source
    description: Always 'mit_edx'.
    tests: [not_null]
  - name: description
    description: Short course description from the edX.org catalog API.
  - name: url
    description: URL for the course's About page on edx.org.
  - name: image_url
    description: URL for the course image from the edX.org catalog API.
  - name: published
    description: True if at least one course run is published.
  - name: platform
    description: >
      Always 'edxorg' (differs from etl_source, which is 'mit_edx').
  - name: page_slug
    description: >
      Always NULL; edX.org courses have no CMS page slug (placeholder for
      contract parity with other sources).
  - name: topics
    description: Comma-separated subject names from the edX.org course record.
  - name: instructors
    description: Comma-separated instructor names aggregated across all course runs.
  - name: certification_type
    description: >
      Course type from the edX.org catalog API, e.g. audit, verified,
      professional; used as this contract's certification_type.
  - name: price
    description: >
      Maximum non-audit/honor seat price across all published runs, cast to
      a string, or NULL if no priced seats.
  - name: length
    description: >
      Max course run duration across published runs, e.g. '4 weeks'.
  - name: effort
    description: >
      Max course run time commitment across published runs, e.g.
      '5-7 hours per week'.
  - name: runs
    description: >
      Pipe-delimited run metadata strings joined with semicolons.
      Format per run: courserun_key|start_on|end_on|is_published
