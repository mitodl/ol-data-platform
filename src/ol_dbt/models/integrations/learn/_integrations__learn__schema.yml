---
# MIT Learn integration layer
# Sits above marts, exposes stable application-level contracts for Trino-pull consumption.
# Naming: integrations__learn__<source>_<entity>
# See: docs/learn_marts_contract.md for the full schema contract.

version: 2

models:
- name: integrations__learn__ocw_courses
  description: >
    OCW courses exposed for MIT Learn's Trino-pull ETL. One row per live OCW course.
    Sourced from int__ocw__courses, int__ocw__course_topics,
    int__ocw__course_instructors, and int__ocw__course_departments.
  columns:
  - name: readable_id
    description: OCW course short ID (website_short_id). Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Course title.
    tests: [not_null]
  - name: last_modified
    description: Last publish date from OCW Studio.
    tests: [not_null]
  - name: etl_source
    description: Always 'ocw'.
    tests: [not_null]
  - name: description
    description: Course description from the OCW website.
  - name: url
    description: URL of the course on OCW production (ocw.mit.edu).
  - name: image_url
    description: Course image URL.
  - name: published
    description: Whether the course is live on ocw.mit.edu.
  - name: platform
    description: Always 'ocw', matches etl_source.
  - name: level
    description: >
      Comma-separated course level(s), e.g. Undergraduate, Graduate,
      Non-Credit, High School.
  - name: term
    description: Course term, e.g. Spring, Summer, Fall, January IAP, or blank.
  - name: year
    description: Course year.
  - name: course_number
    description: Primary course number, e.g. '21A.850J'.
  - name: extra_course_numbers
    description: Additional course numbers beyond the primary, e.g. 'STS.484J'.
  - name: topics
    description: >
      Comma-separated topic labels, preferring speciality, then subtopic,
      then topic.
  - name: instructors
    description: Comma-separated instructor names.
  - name: departments
    description: Comma-separated department names offering the course.

- name: integrations__learn__mitxonline_courses
  description: >
    MITx Online courses exposed for MIT Learn's Trino-pull ETL. One row per live course.
    Sourced from int__mitxonline__courses and int__mitxonline__course_runs.
  columns:
  - name: readable_id
    description: MITxOnline course readable ID. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Course title.
    tests: [not_null]
  - name: last_modified
    description: >
      Last CMS page publish date. Falls back to current_timestamp for courses
      without a Wagtail CMS page.
    tests: [not_null]
  - name: etl_source
    description: Always 'mitxonline'.
    tests: [not_null]
  - name: description
    description: Course description shown on the course's home/product page.
  - name: url
    description: MITx Online course page URL path (relative).
  - name: image_url
    description: Course image URL.
  - name: published
    description: Whether the course is live on mitxonline.mit.edu.
  - name: platform
    description: Always 'mitxonline', matches etl_source.
  - name: page_slug
    description: MITx Online CMS page slug, used for constructing the course page's
      URL.
  - name: topics
    description: Comma-separated topic names for the course.
  - name: instructors
    description: Comma-separated instructor names for the course.
  - name: certification_type
    description: Either 'MicroMasters Credential' or 'Certificate of Completion'.
  - name: price
    description: >
      Product price in plain text, e.g. '$250 - $1000 (financial assistance
      available)'.
  - name: length
    description: >
      Short description of how long the course takes to complete, e.g.
      '4 weeks'.
  - name: effort
    description: >
      Short description of expected weekly effort, e.g. '1-3 hours per week'.
  - name: runs
    description: >
      Pipe-delimited run metadata strings joined with semicolons.
      Format per run: readable_id|start_on|end_on|is_live

- name: integrations__learn__mitxonline_programs
  description: >
    MITx Online programs exposed for MIT Learn's Trino-pull ETL. One row per live
    program.
    Sourced from int__mitxonline__programs and int__mitxonline__program_requirements.
  columns:
  - name: readable_id
    description: MITxOnline program readable ID. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Program title.
    tests: [not_null]
  - name: last_modified
    description: >
      Last CMS page publish date. Falls back to current_timestamp for programs
      without a Wagtail CMS page.
    tests: [not_null]
  - name: etl_source
    description: Always 'mitxonline'.
    tests: [not_null]
  - name: description
    description: Program description shown on the program's home/product page.
  - name: url
    description: MITx Online program page URL path (relative).
  - name: image_url
    description: Program image URL.
  - name: published
    description: Whether the program is live on mitxonline.mit.edu.
  - name: platform
    description: Always 'mitxonline', matches etl_source.
  - name: program_type
    description: >
      Program type, free text from the source CMS, e.g. 'MicroMasters',
      'Series'.
  - name: certification_type
    description: Either 'MicroMasters Credential' or 'Certificate of Completion'.
  - name: topics
    description: >
      Comma-separated topic names aggregated across all courses in the
      program.
  - name: instructors
    description: Comma-separated instructor names for the program.
  - name: page_slug
    description: MITx Online CMS page slug, used for constructing the program page's
      URL.
  - name: price
    description: Product price in plain text, e.g. '$250 - $1000'.
  - name: effort
    description: >
      Short description of expected weekly effort, e.g. '1-3 hours per week'.
  - name: courses
    description: Comma-separated list of course readable_ids belonging to this program.

- name: integrations__learn__xpro_courses
  description: >
    xPRO courses exposed for MIT Learn's Trino-pull ETL. One row per live course.
    Sourced from int__mitxpro__courses and int__mitxpro__course_runs.
  columns:
  - name: readable_id
    description: xPRO course readable ID. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Course title.
    tests: [not_null]
  - name: last_modified
    description: >
      Last CMS page publish date. Falls back to current_timestamp for courses
      without a Wagtail CMS page.
    tests: [not_null]
  - name: etl_source
    description: Always 'xpro'.
    tests: [not_null]
  - name: description
    description: Course description displayed on the xPRO course page.
  - name: url
    description: xPRO course page URL path (relative).
  - name: image_url
    description: Course image URL.
  - name: published
    description: Whether the course is live on xpro.mit.edu.
  - name: platform
    description: >
      Platform name for the course, sourced from xPRO's platform dimension
      table (e.g. 'xPRO'). Unlike etl_source, this is not a fixed literal.
  - name: page_slug
    description: xPRO CMS page slug, used for constructing the course page's URL.
  - name: topics
    description: Comma-separated topic names for the course.
  - name: instructors
    description: Comma-separated instructor names for the course.
  - name: length
    description: >
      Short description of how long the course takes to complete, e.g.
      '4 weeks'.
  - name: effort
    description: Short description of expected weekly time commitment.
  - name: format
    description: Course format, e.g. 'Online', 'Other'.
  - name: runs
    description: >
      Pipe-delimited run metadata strings joined with semicolons.
      Format per run: readable_id|start_on|end_on|is_live

- name: integrations__learn__xpro_programs
  description: >
    xPRO programs exposed for MIT Learn's Trino-pull ETL. One row per live program.
    Sourced from int__mitxpro__programs and int__mitxpro__courses.
  columns:
  - name: readable_id
    description: xPRO program readable ID. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Program title.
    tests: [not_null]
  - name: last_modified
    description: >
      Last CMS page publish date. Falls back to current_timestamp for programs
      without a Wagtail CMS page.
    tests: [not_null]
  - name: etl_source
    description: Always 'xpro'.
    tests: [not_null]
  - name: description
    description: Program description displayed on the xPRO program page.
  - name: url
    description: xPRO program page URL path (relative).
  - name: image_url
    description: Program image URL.
  - name: published
    description: Whether the program is live on xpro.mit.edu.
  - name: platform
    description: >
      Platform name for the program, sourced from xPRO's platform dimension
      table (e.g. 'xPRO'). Unlike etl_source, this is not a fixed literal.
  - name: page_slug
    description: xPRO CMS page slug, used for constructing the program page's URL.
  - name: topics
    description: Comma-separated topic names for the program.
  - name: instructors
    description: Comma-separated instructor names for the program.
  - name: length
    description: >
      Short description of how long the program takes to complete, e.g.
      '4 weeks'.
  - name: effort
    description: Short description of expected weekly time commitment.
  - name: format
    description: Program format, e.g. 'Online', 'Other'.
  - name: courses
    description: Comma-separated list of course readable_ids belonging to this program.

- name: integrations__learn__micromasters_programs
  description: >
    MicroMasters programs exposed for MIT Learn's Trino-pull ETL.
    One row per live program. Sourced from int__micromasters__programs
    and int__micromasters__program_requirements.
    NOTE: last_modified is sourced from program_updated_on in the
    MicroMasters programs staging table.
  columns:
  - name: readable_id
    description: >
      String-cast program_id (MicroMasters has no slug). Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Program title.
    tests: [not_null]
  - name: last_modified
    description: >
      Last update timestamp for the program sourced from program_updated_on
      in stg__micromasters__app__postgres__courses_program.
    tests: [not_null]
  - name: etl_source
    description: Always 'micromasters'.
    tests: [not_null]
  - name: description
    description: Program description.
  - name: url
    description: >
      Absolute URL for the program's page on micromasters.mit.edu, or NULL
      for unpublished pages.
  - name: image_url
    description: Absolute URL for the program's thumbnail image.
  - name: published
    description: Whether the program is live on micromasters.mit.edu.
  - name: platform
    description: Always 'micromasters', matches etl_source.
  - name: courses
    description: >
      Comma-separated list of course readable_ids ordered by position_in_program.

- name: integrations__learn__program_certificates
  description: >
    MicroMasters + MITx Online program certificates exposed for MIT Learn's
    warehouse-pull ETL, replacing the Hightouch sync into MIT Learn's
    external.programcertificate table (mitodl/hq#12954). One row per
    certificate. Sourced from int__micromasters__program_certificates.
    NOTE: this model does not follow the readable_id/title/etl_source-enum
    shape from docs/learn_marts_contract.md — that contract targets catalog
    resources feeding MIT Learn's LearningResource model, whereas this feeds
    a distinct fact model (profiles.ProgramCertificate) keyed by
    record_hash.
  columns:
  - name: record_hash
    description: >
      Hashed certificate identifier from int__micromasters__program_certificates
      (program_certificate_hashed_id). Primary/upsert key for MIT Learn's
      profiles.ProgramCertificate.
    tests: [not_null, unique]
  - name: program_title
    description: Program title at the time of certificate issuance.
  - name: user_full_name
    description: Certificate recipient's full name.
  - name: user_email
    description: >
      Certificate recipient's email, preferring MicroMasters/MITx Online/
      edX.org email in that order depending on program type and completion
      date (see int__micromasters__program_certificates). Empty string, not
      NULL, when no email could be resolved.
    tests: [not_null]
  - name: user_edxorg_id
    description: Certificate recipient's edX.org user id, when resolvable.
  - name: user_edxorg_username
    description: Certificate recipient's edX.org username, when resolvable.
  - name: user_mitxonline_username
    description: Certificate recipient's MITx Online username, when resolvable.
  - name: micromasters_program_id
    description: MicroMasters program id for the completed program, when applicable.
  - name: mitxonline_program_id
    description: MITx Online program id for the completed program, when applicable.
  - name: user_first_name
    description: Certificate recipient's first name.
  - name: user_last_name
    description: Certificate recipient's last name.
  - name: user_gender
    description: Certificate recipient's self-reported gender, when available.
  - name: user_year_of_birth
    description: Certificate recipient's self-reported birth year, when available.
  - name: user_country
    description: Certificate recipient's self-reported country, when available.
  - name: user_address_state_or_territory
    description: Certificate recipient's self-reported state/territory, when available.
  - name: user_address_city
    description: Certificate recipient's self-reported city, when available.
  - name: user_address_postal_code
    description: Certificate recipient's self-reported postal code, when available.
  - name: user_street_address
    description: Certificate recipient's self-reported street address, when available.
  - name: program_completion_timestamp
    description: >
      When the recipient completed the program's certificate requirements.
      NULL for "override" certificates (a hardcoded list of recipients
      granted a certificate outside the normal completion-tracking path,
      with no completion time to report).
  - name: last_modified
    description: >
      No genuine last-modified signal exists in the source lineage (a
      certificate is issued once and essentially never revised); reuses
      program_completion_timestamp as the closest available proxy so MIT
      Learn's generic incremental-pull machinery (which requires this
      column on every integrations__learn__* view) still functions.
      Falls back to current_timestamp for override certificates (see
      program_completion_timestamp), so that row is simply re-upserted
      (a no-op) on every incremental run instead of never matching an
      incremental `since` filter.
    tests: [not_null]

- name: integrations__learn__mit_edx_courses
  description: >
    MIT edX (MITx on edX.org) courses exposed for MIT Learn's Trino-pull ETL.
    One row per course with at least one published run.
    Sourced from stg__edxorg__api__course and stg__edxorg__api__courserun
    (edx.org S3 exports via IRx). Source decision: edxorg dg_project, not
    mitxresidential (which covers MIT's internal OpenEdX deployment).
  columns:
  - name: readable_id
    description: edX.org course key (e.g. MITx/6.00.1x). Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: Course title.
    tests: [not_null]
  - name: last_modified
    description: Last modified timestamp from the edX.org course catalog API export.
    tests: [not_null]
  - name: etl_source
    description: Always 'mit_edx'.
    tests: [not_null]
  - name: description
    description: Short course description from the edX.org catalog API.
  - name: url
    description: URL for the course's About page on edx.org.
  - name: image_url
    description: URL for the course image from the edX.org catalog API.
  - name: published
    description: True if at least one course run is published.
  - name: platform
    description: >
      Always 'edxorg' (differs from etl_source, which is 'mit_edx').
  - name: page_slug
    description: >
      Always NULL; edX.org courses have no CMS page slug (placeholder for
      contract parity with other sources).
  - name: topics
    description: Comma-separated subject names from the edX.org course record.
  - name: instructors
    description: Comma-separated instructor names aggregated across all course runs.
  - name: certification_type
    description: >
      Course type from the edX.org catalog API, e.g. audit, verified,
      professional; used as this contract's certification_type.
  - name: price
    description: >
      Maximum non-audit/honor seat price across all published runs, cast to
      a string, or NULL if no priced seats.
  - name: length
    description: >
      Max course run duration across published runs, e.g. '4 weeks'.
  - name: effort
    description: >
      Max course run time commitment across published runs, e.g.
      '5-7 hours per week'.
  - name: runs
    description: >
      Pipe-delimited run metadata strings joined with semicolons.
      Format per run: courserun_key|start_on|end_on|is_published
