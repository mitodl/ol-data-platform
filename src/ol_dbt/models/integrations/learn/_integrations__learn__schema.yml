---
# MIT Learn integration layer
# Sits above marts, exposes stable application-level contracts for Trino-pull consumption.
# Naming: integrations__learn__<source>_<entity>
# See: docs/learn_marts_contract.md for the full schema contract.

version: 2

models:
- name: integrations__learn__ocw_courses
  description: >
    OCW courses exposed for MIT Learn's warehouse pull. One row per course in
    the OCW live bucket, with the fields MIT Learn's OCW ETL builds a course and
    its one run from. Sourced from int__ocw__live_courses, which reads each
    course's published data.json.
  config:
    meta:
      # It reads the OCW live bucket, and ocw/s3 is qa: omit in the inventory.
      qa_buildable: false
  columns:
  - name: readable_id
    description: >
      Primary course number, then "+" and the slugified term and "_" and the
      year where the course has them, e.g. 6.1810+fall_2023.
    tests: [not_null, unique]
  - name: title
    description: Course title.
    tests: [not_null]
  - name: last_modified
    description: >
      When the platform last read the course from the bucket. A course is read
      again when one of its objects changes, or to retry a file Tika failed on.
    tests: [not_null]
  - name: etl_source
    description: Always 'ocw'.
    tests: [not_null]
  - name: description
    description: >
      The course description as rendered HTML (course_description_html). MIT
      Learn passes it through nh3 before storing it.
  - name: url
    description: >
      URL of the course on ocw.mit.edu, with its trailing slash. MIT Learn
      matches an OCW course on this, not on readable_id.
    tests: [not_null, unique]
  - name: image_url
    description: Absolute URL of the course image; null for a course with none.
  - name: image_alt
    description: Alt text of the course image.
  - name: image_description
    description: Description of the course image.
  - name: published
    description: Always true. A course that leaves the bucket leaves the model.
  - name: platform
    description: Always 'ocw'.
  - name: run_id
    description: >
      The course's legacy_uid, or its site_uid when it has none, without
      dashes. Equals run_readable_id in integrations__learn__ocw_content_files.
    tests: [not_null, unique]
  - name: slug
    description: The course's path in the bucket, courses/<slug>.
  - name: term
    description: Course term (Fall, Spring, Summer, January IAP); null when not given.
  - name: year
    description: Course year; null when not given.
  - name: level
    description: >
      Array of level labels (Undergraduate, Graduate, High School, Non-Credit).
      MIT Learn's transform_levels takes these labels.
  - name: course_number
    description: Primary course number, e.g. '21A.850J'.
  - name: extra_course_numbers
    description: Array of the cross-listed course numbers; empty when there are none.
  - name: departments
    description: Array of MIT department numbers, e.g. ['6', '18'].
  - name: topics
    description: >
      Array of the course's MIT Learn topic names (mit_learn_topics), sorted.
      Empty for a course OCW gave none; MIT Learn then maps ocw_topics.
  - name: ocw_topics
    description: Array of every OCW topic, subtopic and speciality of the course,
      sorted.
  - name: content_tags
    description: >
      Array of the course's learning resource types, e.g. Lecture Notes. MIT
      Learn shows them as course_feature.
  - name: instructors
    description: >
      JSON array of the course's instructors as published, in order, each with
      first_name, last_name, middle_initial, salutation and title. MIT Learn's
      parse_instructors takes this list.
  - name: hide_download
    description: >
      Whether OCW hides the course's download link. MIT Learn adds offline
      delivery for a course that does not, when OCW_OFFLINE_DELIVERY is set.

- name: integrations__learn__mitxonline_courses
  config:
    tags: [qa_scheduled]
  description: >
    The courses MITx Online's catalog API for MIT Learn (/api/internal/courses/) lists:
    every course, published or not, except the proctored exam courses MIT Learn's
    ETL drops. One row per course, with the fields MIT Learn's MITx Online ETL reads
    from the API or derives from the course's runs. Runs are in
    integrations__learn__mitxonline_runs.
  columns:
  - name: readable_id
    description: str, the MITx Online course readable id. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: str, course title.
    tests: [not_null]
  - name: last_modified
    description: str, ISO 8601 time the CMS page was last published; the build time
      for a course with no page.
    tests: [not_null]
  - name: etl_source
    description: str, always 'mitxonline'.
    tests: [not_null]
  - name: platform
    description: str, always 'mitxonline'.
    tests: [not_null]
  - name: description
    description: str, the page's description, as HTML; null without a page. The API
      strips the tags and MIT Learn then passes it through clean_data.
  - name: has_catalog_page
    description: boolean, whether the course's page is live and in the Learn catalog,
      which is when MITx Online's pages API lists it to MIT Learn. MIT Learn builds
      full_description only for these and otherwise leaves the stored value alone.
    tests: [not_null]
  - name: about
    description: str, the page's About section as stored HTML; null unless has_catalog_page.
      One of the sections MIT Learn's parse_full_description assembles.
  - name: what_you_learn
    description: str, the page's What you'll learn section as stored HTML; null unless
      has_catalog_page.
  - name: prerequisites
    description: str, the page's Prerequisites section as stored HTML; null unless
      has_catalog_page.
  - name: faqs
    description: str, the page's FAQs as a JSON array of {"question", "answer"} objects
      in the order MITx Online's pages API lists them, the answer as stored HTML.
      "[]" for a page without FAQs, as the API returns; null unless has_catalog_page.
      MIT Learn's parse_full_description appends them under "Frequently asked questions".
  - name: image_url
    description: str, the page's feature image on the MITx Online site, with the ?v=<file
      hash> suffix the API adds; null without one.
  - name: has_page
    description: boolean, whether the course has a CMS page. MIT Learn gives the course
      a URL on its own site (/courses/<readable_id>) only when it has one.
    tests: [not_null]
  - name: published
    description: boolean, whether MIT Learn publishes the course - its page is live
      and in the Learn catalog, and a run in integrations__learn__mitxonline_runs
      is published.
    tests: [not_null]
  - name: include_in_learn_catalog
    description: boolean, the page's include_in_learn_catalog flag; false without
      a page.
    tests: [not_null]
  - name: ingest_content_files_for_ai
    description: boolean, the page's ingest_content_files_for_ai flag, MIT Learn's
      force_ingest; false without a page.
    tests: [not_null]
  - name: topics
    description: array(str), names of the page's topics and of their parent topics,
      sorted; null when it has none. MIT Learn maps them to its own topics.
  - name: departments
    description: array(str), names of the course's departments, sorted; null when
      it has none. MIT Learn maps them to department ids.
  - name: course_numbers
    description: array(str), the course numbers of the course's runs, the latest run's
      first. The first is the primary number and the rest are cross-listed.
  - name: certification
    description: boolean, whether a published, current run offers the verified enrollment
      mode.
    tests: [not_null]
  - name: certification_type
    description: str, 'MicroMasters Credential' when the course's first live program
      with a live page is a MicroMasters program, otherwise 'Certificate of Completion'.
      MIT Learn uses it only when certification is true.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['MicroMasters Credential', 'Certificate of Completion']
  - name: availability
    description: str, 'dated' when any run of the course is enrollable and not self-paced,
      otherwise 'anytime'. Evaluated when the model builds.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['dated', 'anytime']
  - name: pace
    description: array(str), the distinct pace of the course's runs, 'instructor_paced'
      or 'self_paced'; null for a course with no run.
  - name: duration
    description: str, free-text length from the page, e.g. '14 weeks'.
  - name: min_weeks
    description: int, shortest length in weeks; null if the page does not give one.
  - name: max_weeks
    description: int, longest length in weeks; null if the page does not give one.
  - name: time_commitment
    description: str, free-text weekly effort from the page, e.g. '10-14 hours per
      week'.
  - name: min_weekly_hours
    description: str, least weekly hours as the page stores it; MIT Learn parses it
      to an integer.
  - name: max_weekly_hours
    description: str, most weekly hours as the page stores it; MIT Learn parses it
      to an integer.
  - name: min_price
    description: decimal, the page's lowest certificate price in USD; null if not
      set.
  - name: max_price
    description: decimal, the page's highest certificate price in USD; null if not
      set.

- name: integrations__learn__mitxonline_runs
  config:
    tags: [qa_scheduled]
  description: >
    Every run of the courses in integrations__learn__mitxonline_courses, source and
    B2B runs included, as MITx Online's catalog API for MIT Learn lists them under
    a course. One row per run, with what MIT Learn's MITx Online ETL derives for
    it. published, status and prices depend on the time the model builds.
  columns:
  - name: readable_id
    description: str, the run's course.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('integrations__learn__mitxonline_courses')
          field: readable_id
  - name: run_id
    description: str, the run's courseware id, MIT Learn's run id.
    tests: [not_null, unique]
  - name: title
    description: str, the run's title.
  - name: start_date
    description: str, ISO 8601 UTC start, or the start of enrollment when the run
      has no start; null if neither.
  - name: end_date
    description: str, ISO 8601 UTC end; null if none.
  - name: enrollment_start
    description: str, ISO 8601 UTC start of enrollment; null if none.
  - name: enrollment_end
    description: str, ISO 8601 UTC end of enrollment; null if none.
  - name: published
    description: boolean, whether MIT Learn publishes the run - it is not a variant,
      it is enrollable (live, started enrollment, enrollment not ended, has a start
      date) and the course page is live.
    tests: [not_null]
  - name: b2b_only
    description: boolean, whether the run is offered only under a B2B contract.
    tests: [not_null]
  - name: is_variant
    description: boolean, whether the run is B2B-only or its language matches a variant
      set of the course that is not the default.
    tests: [not_null]
  - name: status
    description: str, 'Current' when the course has a page and the run is enrollable
      and not past its enrollment end (or its end, without one), otherwise 'Archived'.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['Current', 'Archived']
  - name: pace
    description: str, 'self_paced' or 'instructor_paced'.
    tests: [not_null]
  - name: language
    description: str, the run's language code, e.g. en or es_419.
  - name: course_number
    description: str, the course part of the run's courseware id.
  - name: has_verified_mode
    description: boolean, whether the run offers the verified enrollment mode.
    tests: [not_null]
  - name: prices
    description: array(decimal), the run's distinct prices in USD, ascending - zero
      for the audit mode and the course page's min and max price for the verified
      mode. Only zero when the run is not current or the page has no price.
    tests: [not_null]
  - name: instructors
    description: array(str), names of the instructors linked to the course page; null
      without any.

- name: integrations__learn__mitxonline_programs
  config:
    tags: [qa_scheduled]
  description: >
    The programs MITx Online's catalog API (/api/v2/programs/?live=true) lists: live
    programs that are not B2B-only, published or not. One row per program, with the
    fields MIT Learn's MITx Online ETL reads from the API, including the dates and
    prices of the one run MIT Learn gives a program. Its courses and child programs
    are in integrations__learn__mitxonline_program_children.
  columns:
  - name: readable_id
    description: str, the MITx Online program readable id. Used for upsert matching
      and as the id of the program's run.
    tests: [not_null, unique]
  - name: title
    description: str, program title.
    tests: [not_null]
  - name: last_modified
    description: str, ISO 8601 time the CMS page was last published; the build time
      for a program with no page.
    tests: [not_null]
  - name: etl_source
    description: str, always 'mitxonline'.
    tests: [not_null]
  - name: platform
    description: str, always 'mitxonline'.
    tests: [not_null]
  - name: description
    description: str, the page's description, as HTML; null without a page. The API
      strips the tags and MIT Learn then passes it through clean_data.
  - name: has_catalog_page
    description: boolean, whether the program's page is live and in the Learn catalog,
      which is when MITx Online's pages API lists it to MIT Learn. MIT Learn builds
      full_description only for these and otherwise leaves the stored value alone.
    tests: [not_null]
  - name: about
    description: str, the page's About section as stored HTML; null unless has_catalog_page.
      One of the sections MIT Learn's parse_full_description assembles.
  - name: what_you_learn
    description: str, the page's What you'll learn section as stored HTML; null unless
      has_catalog_page.
  - name: prerequisites
    description: str, the page's Prerequisites section as stored HTML; null unless
      has_catalog_page.
  - name: faqs
    description: str, the page's FAQs as a JSON array of {"question", "answer"} objects
      in the order MITx Online's pages API lists them, the answer as stored HTML.
      "[]" for a page without FAQs, as the API returns; null unless has_catalog_page.
      MIT Learn's parse_full_description appends them under "Frequently asked questions".
  - name: image_url
    description: str, the page's feature image on the MITx Online site, with the ?v=<file
      hash> suffix the API adds; null without one.
  - name: has_page
    description: boolean, whether the program has a CMS page. MIT Learn gives the
      program a URL on its own site, publishes its run and marks the run current only
      when it has one.
    tests: [not_null]
  - name: published
    description: boolean, whether MIT Learn publishes the program - its page is live
      and in the Learn catalog.
    tests: [not_null]
  - name: display_mode
    description: str, 'course' for a program MIT Learn shows as a course (resource_category
      course, URL /courses/p/<readable_id>); otherwise null.
  - name: topics
    description: array(str), names of the page topics of the program's live courses,
      sorted; null when there are none.
  - name: departments
    description: array(str), names of the program's departments, sorted; null when
      it has none.
  - name: certification
    description: boolean, whether the program has a page and offers the verified enrollment
      mode.
    tests: [not_null]
  - name: certification_type
    description: str, 'MicroMasters Credential' for a MicroMasters program, otherwise
      'Certificate of Completion'. MIT Learn uses it only when certification is true.
    tests: [not_null]
  - name: availability
    description: str, the program's availability, 'dated' or 'anytime'.
  - name: start_date
    description: str, ISO 8601 UTC start of the next live run of any course in the
      program's requirements, else the program's own start date, else its enrollment
      start. Evaluated when the model builds.
  - name: end_date
    description: str, ISO 8601 UTC end of the program; null if none.
  - name: enrollment_start
    description: str, ISO 8601 UTC start of enrollment; null if none.
  - name: enrollment_end
    description: str, ISO 8601 UTC end of enrollment; null if none.
  - name: prices
    description: array(decimal), the program's distinct prices in USD, ascending -
      zero for the audit mode and the page's min and max price for the verified mode.
      Only zero when the page has no price.
    tests: [not_null]
  - name: duration
    description: str, free-text length from the page.
  - name: min_weeks
    description: int, shortest length in weeks; null if the page does not give one.
  - name: max_weeks
    description: int, longest length in weeks; null if the page does not give one.
  - name: time_commitment
    description: str, free-text weekly effort from the page.
  - name: min_weekly_hours
    description: str, least weekly hours as the page stores it.
  - name: max_weekly_hours
    description: str, most weekly hours as the page stores it.
  - name: min_price
    description: decimal, the page's lowest price in USD; null if not set.
  - name: max_price
    description: decimal, the page's highest price in USD; null if not set.

- name: integrations__learn__mitxonline_program_children
  config:
    tags: [qa_scheduled]
  description: >
    The courses and child programs of each program in integrations__learn__mitxonline_programs,
    from the program's requirement tree. One row per program and child. A course
    row is a course with a live page, in the program's own tree or in the tree of
    a program it requires. A program row is a program it requires that the API lists.
  columns:
  - name: readable_id
    description: str, the parent program.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('integrations__learn__mitxonline_programs')
          field: readable_id
  - name: child_resource_type
    description: str, 'course' or 'program'.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['course', 'program']
  - name: child_readable_id
    description: str, readable id of the child course or program.
    tests: [not_null]
  - name: child_display_mode
    description: str, the display mode of a child program, 'course' or null; null
      for a course.
  - name: child_position
    description: int, zero-based place of the child in the requirement tree, as MIT
      Learn orders a program's courses. Null for a child program that is not shown
      as a course - its courses have positions of their own. Positions have gaps where
      a course in the tree has no live page.
  - name: child_program_order
    description: int, zero-based place of a child program among the program's child
      programs, by its first node in the requirement tree. This is the order MIT Learn's
      ETL lists child_programs in (get_program_ids_from_req_tree), and Learn numbers
      a child program without a child_position after the program's other children
      in this order. Null for a course.
    tests:
    - not_null:
        config:
          where: "child_resource_type = 'program'"
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["readable_id", "child_resource_type", "child_readable_id"]

- name: integrations__learn__xpro_courses
  config:
    tags: [qa_scheduled]
  description: >
    The courses xPRO's catalog API lists: live courses with a live CMS page, published
    or not. One row per course, with the fields MIT Learn's xPRO ETL reads from the
    API. Runs are in integrations__learn__xpro_runs.
  columns:
  - name: readable_id
    description: str, the xPRO course readable id. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: str, course title.
    tests: [not_null]
  - name: last_modified
    description: str, ISO 8601 time the CMS page was last published.
    tests: [not_null]
  - name: etl_source
    description: str, always 'xpro'.
    tests: [not_null]
  - name: description
    description: str, the page's description, as HTML. Not sanitized; MIT Learn passes
      it through clean_data.
  - name: url
    description: str, absolute URL of the course page on the xPRO site.
    tests: [not_null]
  - name: image_url
    description: str, the page's thumbnail image, or the xPRO site's default image
      when the page has none.
    tests: [not_null]
  - name: published
    description: boolean, whether a run in integrations__learn__xpro_runs has a price
      above zero, which is when MIT Learn publishes an xPRO course.
    tests: [not_null]
  - name: platform
    description: str, the xPRO platform name (xPRO, Emeritus, Global Alumni, Simplilearn,
      Susskind, WHU). MIT Learn maps it to a platform code.
  - name: topics
    description: array(str), names of the page's xPRO topics, sorted; null when it
      has none. A child topic is named 'Parent:Child'. MIT Learn keeps the part after
      the colon and maps it to its own topics.
  - name: format
    description: str, the page's format, 'Online' or 'Hybrid'. MIT Learn maps it to
      a delivery code.
  - name: availability
    description: str, always 'dated', as the xPRO API reports.
  - name: continuing_ed_credits
    description: double, CEUs from the page's certificate page; null without one.
  - name: duration
    description: str, free-text duration from the page, e.g. '3 Weeks'.
  - name: min_weeks
    description: int, shortest length in weeks; null if the page does not give one.
  - name: max_weeks
    description: int, longest length in weeks; null if the page does not give one.
  - name: time_commitment
    description: str, free-text weekly effort from the page, e.g. '5 Hours per Week'.
  - name: min_weekly_hours
    description: int, least weekly hours; null if the page does not give one.
  - name: max_weekly_hours
    description: int, most weekly hours; null if the page does not give one.

- name: integrations__learn__xpro_runs
  config:
    tags: [qa_scheduled]
  description: >
    Runs of the courses in integrations__learn__xpro_courses, as xPRO's catalog API
    lists them under a course: live, with a start date, not past their end date or
    enrollment end, enrollment open, and with an active product. Evaluated when the
    model builds. A run that leaves this set is one MIT Learn unpublishes.
  columns:
  - name: readable_id
    description: str, the run's course.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('integrations__learn__xpro_courses')
          field: readable_id
  - name: run_id
    description: str, the run's courseware id, MIT Learn's run id.
    tests: [not_null, unique]
  - name: title
    description: str, the run's title.
  - name: start_date
    description: str, ISO 8601 UTC start.
    tests: [not_null]
  - name: end_date
    description: str, ISO 8601 UTC end; null if none.
  - name: enrollment_start
    description: str, ISO 8601 UTC start of enrollment; null if none.
  - name: enrollment_end
    description: str, ISO 8601 UTC end of enrollment; null if none.
  - name: price
    description: decimal, price in USD from the latest version of the run's product;
      null if the product has no version.
  - name: instructors
    description: array(str), names on the course page's faculty page; null without
      one.
  - name: published
    description: boolean, whether price is above zero, as MIT Learn's xPRO ETL sets
      it.
    tests: [not_null]
  - name: platform_code
    description: str, MIT Learn's platform code for the course's platform, as its
      XPRO_PLATFORM_TRANSFORM maps the platform name in integrations__learn__xpro_courses.
      It is the run's resource's platform.code, part of a content file's vector point
      key. Null for a platform Learn does not map; Learn's loader skips such a course,
      so the run has no resource there.
    tests:
    - accepted_values:
        arguments:
          values: ['emeritus', 'globalalumni', 'simplilearn', 'susskind', 'whu', 'xpro']

- name: integrations__learn__xpro_programs
  config:
    tags: [qa_scheduled]
  description: >
    The programs xPRO's catalog API lists: live programs with a live CMS page and
    a product. One row per program, with the fields MIT Learn's xPRO ETL reads
    from the API, including the price and dates of the one run MIT Learn gives a
    program.
  columns:
  - name: readable_id
    description: str, the xPRO program readable id. Used for upsert matching.
    tests: [not_null, unique]
  - name: title
    description: str, program title.
    tests: [not_null]
  - name: last_modified
    description: str, ISO 8601 time the CMS page was last published.
    tests: [not_null]
  - name: etl_source
    description: str, always 'xpro'.
    tests: [not_null]
  - name: description
    description: str, the page's description, as HTML. Not sanitized; MIT Learn passes
      it through clean_data.
  - name: url
    description: str, absolute URL of the program page on the xPRO site.
    tests: [not_null]
  - name: image_url
    description: str, the page's thumbnail image, or the xPRO site's default image
      when the page has none.
    tests: [not_null]
  - name: published
    description: boolean, whether price is above zero, as MIT Learn's xPRO ETL sets
      it.
    tests: [not_null]
  - name: platform
    description: str, the xPRO platform name. MIT Learn maps it to a platform code.
  - name: topics
    description: array(str), names of the xPRO topics of every course in the program,
      sorted; null when there are none.
  - name: instructors
    description: array(str), names on the program page's faculty page; null without
      one.
  - name: courses
    description: str, comma-separated readable ids of the program's live courses,
      in program order.
  - name: price
    description: decimal, price in USD from the latest version of the program's active
      product; null if it has none.
  - name: start_date
    description: str, ISO 8601 UTC start of the earliest open run of the program's
      first course; null if it has none.
  - name: end_date
    description: str, ISO 8601 UTC end of the last live run of any course in the program.
  - name: enrollment_start
    description: str, ISO 8601 UTC enrollment start of the run start_date comes from.
  - name: format
    description: str, the page's format, 'Online' or 'Hybrid'. MIT Learn maps it to
      a delivery code.
  - name: availability
    description: str, always 'dated', as the xPRO API reports.
  - name: continuing_ed_credits
    description: double, CEUs from the page's certificate page; null without one.
  - name: duration
    description: str, free-text duration from the page, e.g. '3 Weeks'.
  - name: min_weeks
    description: int, shortest length in weeks; null if the page does not give one.
  - name: max_weeks
    description: int, longest length in weeks; null if the page does not give one.
  - name: time_commitment
    description: str, free-text weekly effort from the page, e.g. '5 Hours per Week'.
  - name: min_weekly_hours
    description: int, least weekly hours; null if the page does not give one.
  - name: max_weekly_hours
    description: int, most weekly hours; null if the page does not give one.

- name: integrations__learn__program_certificates
  description: >
    MicroMasters + MITx Online program certificates exposed for MIT Learn's
    warehouse-pull ETL, replacing the Hightouch sync into MIT Learn's
    external.programcertificate table (mitodl/hq#12954). One row per
    certificate. Sourced from int__micromasters__program_certificates.
    NOTE: this model does not follow the readable_id/title/etl_source-enum
    shape from docs/learn_marts_contract.md — that contract targets catalog
    resources feeding MIT Learn's LearningResource model, whereas this feeds
    a distinct fact model (profiles.ProgramCertificate) keyed by
    record_hash.

    QA builds this view on learn_integrations_qa_daily so MIT Learn's
    SyncProgramCertificatesTask can be rehearsed there, and QA's rows are
    not production's. The edX.org and IRx inputs (edxorg/s3, irx/bigquery)
    are masked mirrors of production: usernames and emails are SHA-256
    digests, names and addresses read 'redacted' and year of birth is NULL.
    MITx Online and MicroMasters are QA's own apps, with their own users.
    So learners do not join across platforms the way they do in production,
    and the edX.org-side recipient fields carry digests or 'redacted'. QA's
    MITx Online Open edX database (mitxonline/mysql) is empty, which
    qa_partial_tables records for auth_user: user_mitxonline_username
    falls back to the MITx Online app username there. A QA rehearsal
    checks that the task reads, maps and writes these rows, not
    certificate counts. See
    docs/specs/QA_DATA_TOPOLOGY_SPEC.md §2.
  config:
    tags: [qa_scheduled]
    meta:
      qa_branches:
      - edxorg/s3
      - irx/bigquery
      - micromasters/app_postgres
      - mitxonline/app_postgres
      - mitxonline/mysql
      qa_partial_tables:
      - raw__mitxonline__openedx__mysql__auth_user
  columns:
  - name: record_hash
    description: >
      Hashed certificate identifier from int__micromasters__program_certificates
      (program_certificate_hashed_id). Primary/upsert key for MIT Learn's
      profiles.ProgramCertificate.
    tests: [not_null, unique]
  - name: program_title
    description: Program title at the time of certificate issuance.
  - name: user_full_name
    description: Certificate recipient's full name.
  - name: user_email
    description: >
      Certificate recipient's email, preferring MicroMasters/MITx Online/
      edX.org email in that order depending on program type and completion
      date (see int__micromasters__program_certificates). Empty string, not
      NULL, when no email could be resolved.
    tests: [not_null]
  - name: user_edxorg_id
    description: Certificate recipient's edX.org user id, when resolvable.
  - name: user_edxorg_username
    description: Certificate recipient's edX.org username, when resolvable.
  - name: user_mitxonline_username
    description: Certificate recipient's MITx Online username, when resolvable.
  - name: micromasters_program_id
    description: MicroMasters program id for the completed program, when applicable.
  - name: mitxonline_program_id
    description: >
      MITx Online program id for the completed program. For an edX.org
      MicroMasters certificate, the id of the MITx Online program its title
      maps to in edxorg_to_mitxonline_program_mapping. Null when the title has
      no mapping; the warning means a new edX.org title needs a seed row.
    tests:
    - not_null:
        config:
          severity: warn
  - name: user_first_name
    description: Certificate recipient's first name.
  - name: user_last_name
    description: Certificate recipient's last name.
  - name: user_gender
    description: Certificate recipient's self-reported gender, when available.
  - name: user_year_of_birth
    description: Certificate recipient's self-reported birth year, when available.
  - name: user_country
    description: Certificate recipient's self-reported country, when available.
  - name: user_address_state_or_territory
    description: Certificate recipient's self-reported state/territory, when available.
  - name: user_address_city
    description: Certificate recipient's self-reported city, when available.
  - name: user_address_postal_code
    description: Certificate recipient's self-reported postal code, when available.
  - name: user_street_address
    description: Certificate recipient's self-reported street address, when available.
  - name: program_completion_timestamp
    description: >
      When the recipient completed the program's certificate requirements.
      NULL for "override" certificates (a hardcoded list of recipients
      granted a certificate outside the normal completion-tracking path,
      with no completion time to report).
  - name: last_modified
    description: >
      No genuine last-modified signal exists in the source lineage (a
      certificate is issued once and essentially never revised); reuses
      program_completion_timestamp as the closest available proxy so MIT
      Learn's generic incremental-pull machinery (which requires this
      column on every integrations__learn__* view) still functions.
      Falls back to current_timestamp for override certificates (see
      program_completion_timestamp), so that row is simply re-upserted
      (a no-op) on every incremental run instead of never matching an
      incremental `since` filter.
    tests: [not_null]

