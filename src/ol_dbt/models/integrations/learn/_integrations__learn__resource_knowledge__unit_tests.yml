---
unit_tests:
- name: test_integrations__learn__resource_knowledge_publishes_only_accepted_claims
  description: >
    A course's statement arrays list only accepted claims; proposed ones stay in
    tfact_courseware_claim for review. The concept gate the document shares with
    integrations__learn__resource_concepts is tested there.
  model: integrations__learn__resource_knowledge
  given:
  - input: ref('int__courseware__learn_course_runs')
    rows:
    - {etl_source: mitxonline, readable_id: "course-v1:X+Y", course_title: Data Analysis,
      courserun_fk: r1, courserun_readable_id: "course-v1:X+Y+1T2026"}
  - input: ref('bridge_courserun_concept')
    rows:
    - {courserun_fk: r1, concept_fk: pandas, relation: teaches, claim_count: 2, accepted_claim_count: 1,
      passes_support_rule: true}
    - {courserun_fk: r1, concept_fk: numpy, relation: teaches, claim_count: 5, accepted_claim_count: 5,
      passes_support_rule: true}
    - {courserun_fk: r1, concept_fk: sklearn, relation: teaches, claim_count: 3, accepted_claim_count: 0,
      passes_support_rule: true}
  - input: ref('dim_concept')
    rows:
    - {concept_pk: pandas, preferred_label: pandas, review_status: accepted, lifecycle_status: active,
      is_learner_facing: true, label_count: 1}
    - {concept_pk: numpy, preferred_label: numpy, review_status: proposed, lifecycle_status: active,
      is_learner_facing: true, label_count: 1}
    - {concept_pk: sklearn, preferred_label: scikit-learn, review_status: accepted,
      lifecycle_status: active, is_learner_facing: true, label_count: 1}
  - input: ref('tfact_courseware_claim')
    rows:
    - {courserun_fk: r1, claim_kind: skill, label: clean a data frame, is_current: true,
      is_verified: true, review_status: accepted}
    - {courserun_fk: r1, claim_kind: skill, label: plot a histogram, is_current: true,
      is_verified: true, review_status: proposed}
  expect:
    rows:
    - {etl_source: mitxonline, readable_id: "course-v1:X+Y", skills: [clean a data
          frame]}
