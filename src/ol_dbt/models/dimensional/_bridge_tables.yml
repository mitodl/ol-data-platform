---
version: 2

models:
- name: bridge_user_courserun_role
  description: >
    User to course run roles bridge across all platforms. Links users to course runs
    via their course access roles (e.g. instructor, staff, beta_testers).
    Grain: one row per (user, course_run, role).
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - user_fk
      - courserun_readable_id
      - courseaccess_role
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/mysql
      - xpro/app_postgres
      - xpro/mysql
  columns:
  - name: user_fk
    description: Foreign key to dim_user.user_pk.
    tests:
    - not_null
    - relationships:
        to: ref('dim_user')
        field: user_pk
  - name: courserun_fk
    description: Foreign key to dim_course_run.courserun_pk. Null when the course
      run does not exist in dim_course_run.
    tests:
    - relationships:
        to: ref('dim_course_run')
        field: courserun_pk
  - name: courserun_readable_id
    description: Human-readable course run identifier from the source system. Preserved
      for rows where courserun_fk is null.
    tests:
    - not_null
  - name: platform_code
    description: Platform identifier code (e.g. mitxonline, edxorg, mitxpro, residential)
      for the course run.
    tests:
    - not_null
  - name: courseaccess_role
    description: The role assigned to the user for this course run (e.g. instructor,
      staff, beta_testers, finance_admin, sales_admin).
    tests:
    - not_null

- name: bridge_program_course
  description: >
    Many-to-many bridge table connecting programs to their required courses.
    Allows analysis of program composition and cross-program course sharing.
  tests:
    # Ensure no duplicate program-course pairs
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - program_fk
      - course_fk
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitxonline/app_postgres
      - xpro/app_postgres
  columns:
  - name: program_fk
    description: Foreign key to dim_program
    tests:
    - not_null
    - relationships:
        to: ref('dim_program')
        field: program_pk
  - name: course_fk
    description: Foreign key to dim_course
    tests:
    - not_null
    - relationships:
        to: ref('dim_course')
        field: course_pk
  - name: is_required
    description: True when the course is a core requirement of the program. False
      when it is one option in an elective set ("choose N of M"), which MITx Online
      and MicroMasters programs have; every course in an xPRO program is required.
      This flags courses, it does not count them; the number of courses a program
      requires is program_num_required_courses in int__mitxonline__program_requirements
      and int__micromasters__program_requirements.
    tests:
    - not_null
  - name: course_order
    description: Sequence/order of course within program curriculum

- name: bridge_course_instructor
  description: Many-to-many relationship between courses and instructors
  config:
    meta:
      qa_branches:
      - mitxonline/app_postgres
      - ocw/app_postgres
      - xpro/app_postgres
  columns:
  - name: course_fk
    description: Foreign key to dim_course
    tests:
    - not_null
    - relationships:
        to: ref('dim_course')
        field: course_pk
  - name: instructor_fk
    description: Foreign key to dim_instructor
    tests:
    - not_null
    - relationships:
        to: ref('dim_instructor')
        field: instructor_pk
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - course_fk
      - instructor_fk

- name: bridge_course_topic
  description: Many-to-many relationship between courses and topics
  config:
    meta:
      qa_branches:
      - mitxonline/app_postgres
      - xpro/app_postgres
  columns:
  - name: course_fk
    description: Foreign key to dim_course
    tests:
    - not_null
    - relationships:
        to: ref('dim_course')
        field: course_pk
  - name: topic_fk
    description: Foreign key to dim_topic
    tests:
    - not_null
    - relationships:
        to: ref('dim_topic')
        field: topic_pk
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - course_fk
      - topic_fk

- name: bridge_course_department
  description: Many-to-many relationship between courses and departments
  config:
    meta:
      qa_branches:
      - mitxonline/app_postgres
  columns:
  - name: course_fk
    description: Foreign key to dim_course
    tests:
    - not_null
    - relationships:
        to: ref('dim_course')
        field: course_pk
  - name: department_fk
    description: Foreign key to dim_department
    tests:
    - not_null
    - relationships:
        to: ref('dim_department')
        field: department_pk
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - course_fk
      - department_fk

- name: bridge_user_organization
  description: >
    MITx Online B2B user-to-organization membership bridge.
    Grain: one row per (user, organization) membership.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - user_fk
      - organization_fk
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/mysql
      - xpro/app_postgres
      - xpro/mysql
  columns:
  - name: user_fk
    description: Foreign key to dim_user.user_pk.
    tests:
    - not_null
    - relationships:
        to: ref('dim_user')
        field: user_pk
  - name: organization_fk
    description: Foreign key to dim_organization.organization_pk.
    tests:
    - not_null
    - relationships:
        to: ref('dim_organization')
        field: organization_pk
  - name: userorganization_keep_until_seen
    description: If true, the user is retained in the organization until their SSO
      data is next observed.
  - name: userorganization_is_manager
    description: If true, the user is a manager of this organization and can access
      organization dashboard features.

- name: bridge_user_contract
  description: >
    MITx Online B2B user-to-contract membership bridge, with the learner's
    data-sharing consent for the contract. Grain: one row per (user, contract).
    Consent is per contract, not per organization. Rows are the current
    memberships plus removed memberships with a recorded decision: MITx Online
    hard-deletes a membership when the learner leaves the organization while
    their enrollments stay, so the decision is kept from
    snapshot_mitxonline_b2b_userb2bcontract rather than lost with the row.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - user_fk
      - contract_fk
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/mysql
      - xpro/app_postgres
      - xpro/mysql
  columns:
  - name: user_fk
    description: Foreign key to dim_user.user_pk.
    tests:
    - not_null
    - relationships:
        to: ref('dim_user')
        field: user_pk
  - name: contract_fk
    description: Foreign key to dim_contract.contract_pk.
    tests:
    - not_null
    - relationships:
        to: ref('dim_contract')
        field: contract_pk
  - name: organization_fk
    description: Foreign key to dim_organization.organization_pk, from the contract.
      Null when the contract's organization is not in dim_organization.
  - name: membership_is_current
    description: True when MITx Online currently holds the membership. False for a
      removed membership kept because of a recorded decision.
  - name: consented_to_data_sharing
    description: >
      The learner's decision to share their course data with the contract's
      organization. Null when the learner has not been asked or has not answered,
      true when they consented, false when they declined or withdrew. MITx Online
      stores a single value, so declined and withdrawn are not distinguishable.
      When the current membership has no decision, or is gone, this is the
      latest decision the snapshot recorded for the (user, contract), so a
      decision survives removal and re-adding in either direction.
  - name: consent_modified_at
    description: ISO-8601 timestamp when consented_to_data_sharing was last set. Null
      when it never has been. Moves on withdrawal as well as on consent.
  - name: membership_created_on
    description: ISO-8601 timestamp when the membership was created. Null for a removed
      membership.
  - name: membership_updated_on
    description: ISO-8601 timestamp when the membership was last saved. Null for a
      removed membership.

- name: bridge_user_account_link
  description: >
    User account link bridge across platforms. Links accounts held by the same person,
    either a merge into a replacement account or the same person on another platform.
    Grain: one row per (from_platform, from_user_id, to_platform).
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - from_platform
      - from_user_id
      - to_platform
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitxonline/app_postgres
      - mitxonline/mysql
  columns:
  - name: from_platform
    description: Platform identifier code for the source account (currently always
      mitxonline).
    tests:
    - not_null
  - name: from_user_id
    description: User ID of the source account on its own platform.
    tests:
    - not_null
  - name: to_platform
    description: Platform identifier code for the target account. When this equals
      from_platform, the row is a merge within that platform. When it differs (e.g.
      edxorg), the row links the same person's accounts on two platforms.
    tests:
    - not_null
  - name: to_user_id
    description: User ID of the target account on its own platform.
    tests:
    - not_null
  - name: observed_on
    description: When the merge was recorded, most recent if merged more than once.
      Null for cross-platform links.

unit_tests:
- name: test_bridge_program_course_memberships
  description: >
    A course in an elective set is one option among several, so is_required
    is false for it on MITx Online and MicroMasters and true for core courses.
    A MITx Online course under an all_of nested in an elective set reads Core
    but is not required, and the bridge takes that from programrequirement_is_required.
    xPRO has no elective sets, so every xPRO program course is required. A
    MicroMasters course in two elective sets of one program is one bridge row.
    An xPRO course is in the program its program_id names and in any program
    whose CMS page lists it. Other edX.org MITx program memberships are retained
    from the program-course API, matched to the MITx Online course key when the
    course moved to MITx Online and to the edX.org course key when it did not.
    An edX.org program whose title dim_program_report_key maps to a MITx Online
    program, by the seed or by title, is left out. One it leaves unmapped, e.g. a
    title two MITx Online programs share, keeps its courses, also when its
    program_name is a mapped title, as for the retired "old version" SDS programs.
  model: bridge_program_course
  given:
  - input: ref('int__mitxonline__program_requirements')
    rows:
    - {program_id: 1, course_id: 10, programrequirement_type: Core, programrequirement_is_required: true,
      course_order_in_program: 1}
    - {program_id: 1, course_id: 11, programrequirement_type: Elective, programrequirement_is_required: false,
      course_order_in_program: 2}
    - {program_id: 1, course_id: 12, programrequirement_type: Core, programrequirement_is_required: false,
      course_order_in_program: 3}
  - input: ref('int__mitxpro__coursesinprogram')
    rows:
    - {program_id: 2, course_id: 20, course_order: 1}
  - input: ref('int__mitxpro__courses')
    rows:
    - {course_id: 20, program_id: 2}
    - {course_id: 21, program_id: 2}
    - {course_id: 22, program_id: null}
  - input: ref('int__micromasters__program_requirements')
    rows:
    - {program_id: 3, course_id: 30, electiveset_id: null, programrequirement_type: Core,
      course_position_in_program: 1}
    - {program_id: 3, course_id: 31, electiveset_id: 7, programrequirement_type: Elective,
      course_position_in_program: 2}
    - {program_id: 3, course_id: 31, electiveset_id: 8, programrequirement_type: Elective,
      course_position_in_program: 2}
  - input: ref('int__edxorg__mitx_program_courses')
    rows:
    - {program_uuid: "edxorg-program", program_title: "Other Program", program_name: "Other\
        \ Program", course_readable_id: "MITx/OTHER+1"}
    - {program_uuid: "edxorg-program", program_title: "Other Program", program_name: "Other\
        \ Program", course_readable_id: "MITx/EDXONLY"}
    - {program_uuid: "edxorg-mapped", program_title: "Mapped Program", program_name: "Mapped\
        \ Program", course_readable_id: "MITx/EDXONLY"}
    - {program_uuid: "edxorg-title-mapped", program_title: "Title Mapped Program",
      program_name: "Title Mapped Program", course_readable_id: "MITx/EDXONLY"}
    - {program_uuid: "edxorg-retired", program_title: "Retired Old Version", program_name: "Mapped\
        \ Program", course_readable_id: "MITx/EDXONLY"}
  - input: ref('dim_program_report_key')
    rows:
    - {lookup_type: title, lookup_value: "Other Program", mapped_by: none, is_mapped_to_mitxonline: false}
    - {lookup_type: title, lookup_value: "Mapped Program", mapped_by: seed, is_mapped_to_mitxonline: true}
    - {lookup_type: title, lookup_value: "Title Mapped Program", mapped_by: title,
      is_mapped_to_mitxonline: true}
    - {lookup_type: title, lookup_value: "Retired Old Version", mapped_by: none, is_mapped_to_mitxonline: false}
  - input: ref('int__mitx__courses')
    rows:
    - {course_readable_id: "course-v1:MITxT+OTHER+1"}
  - input: ref('stg__micromasters__app__postgres__courses_course')
    rows:
    - {course_id: 30, course_edx_key: "MITx+MM.1"}
    - {course_id: 31, course_edx_key: "MITx+MM.2"}
  - input: ref('dim_program')
    rows:
    - {program_pk: p1, source_id: "1", platform_code: mitxonline}
    - {program_pk: p2, source_id: "2", platform_code: mitxpro}
    - {program_pk: p3, source_id: "3", platform_code: micromasters}
    - {program_pk: p4, source_id: "edxorg-program", platform_code: edxorg}
    - {program_pk: p5, source_id: "edxorg-mapped", platform_code: edxorg}
    - {program_pk: p6, source_id: "edxorg-title-mapped", platform_code: edxorg}
    - {program_pk: p7, source_id: "edxorg-retired", platform_code: edxorg}
  - input: ref('dim_course')
    rows:
    - {course_pk: c10, source_id: 10, primary_platform: mitxonline, is_current: true}
    - {course_pk: c11, source_id: 11, primary_platform: mitxonline, is_current: true}
    - {course_pk: c12, source_id: 12, primary_platform: mitxonline, is_current: true}
    - {course_pk: c20, source_id: 20, primary_platform: mitxpro, is_current: true}
    - {course_pk: c21, source_id: 21, primary_platform: mitxpro, is_current: true}
    - {course_pk: c22, source_id: 22, primary_platform: mitxpro, is_current: true}
    - {course_pk: c30, course_readable_id: "MITx+MM.1", primary_platform: edxorg,
      is_current: true}
    - {course_pk: c31, course_readable_id: "MITx+MM.2", primary_platform: edxorg,
      is_current: true}
    - {course_pk: c40, course_readable_id: "course-v1:MITxT+OTHER+1", primary_platform: mitxonline,
      is_current: true}
    - {course_pk: c41, course_readable_id: "MITx/EDXONLY", primary_platform: edxorg,
      is_current: true}
  expect:
    rows:
    - {program_fk: p1, course_fk: c10, is_required: true}
    - {program_fk: p1, course_fk: c11, is_required: false}
    - {program_fk: p1, course_fk: c12, is_required: false}
    - {program_fk: p2, course_fk: c20, is_required: true}
    - {program_fk: p2, course_fk: c21, is_required: true}
    - {program_fk: p3, course_fk: c30, is_required: true}
    - {program_fk: p3, course_fk: c31, is_required: false}
    - {program_fk: p4, course_fk: c40, is_required: true}
    - {program_fk: p4, course_fk: c41, is_required: true}
    - {program_fk: p7, course_fk: c41, is_required: true}
