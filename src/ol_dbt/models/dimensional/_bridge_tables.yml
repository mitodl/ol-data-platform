---
version: 2

models:
- name: bridge_user_courserun_role
  description: >
    User to course run roles bridge across all platforms. Links users to course runs
    via their course access roles (e.g. instructor, staff, beta_testers).
    Grain: one row per (user, course_run, role).
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - user_fk
      - courserun_readable_id
      - courseaccess_role
  columns:
  - name: user_fk
    description: Foreign key to dim_user.user_pk.
    tests:
    - not_null
    - relationships:
        to: ref('dim_user')
        field: user_pk
  - name: courserun_fk
    description: Foreign key to dim_course_run.courserun_pk. Null when the course
      run does not exist in dim_course_run.
    tests:
    - relationships:
        to: ref('dim_course_run')
        field: courserun_pk
  - name: courserun_readable_id
    description: Human-readable course run identifier from the source system. Preserved
      for rows where courserun_fk is null.
    tests:
    - not_null
  - name: platform_code
    description: Platform identifier code (e.g. mitxonline, edxorg, mitxpro, residential)
      for the course run.
    tests:
    - not_null
  - name: courseaccess_role
    description: The role assigned to the user for this course run (e.g. instructor,
      staff, beta_testers, finance_admin, sales_admin).
    tests:
    - not_null

- name: bridge_program_course
  description: >
    Many-to-many bridge table connecting programs to their required courses.
    Allows analysis of program composition and cross-program course sharing.
  tests:
    # Ensure no duplicate program-course pairs
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - program_fk
      - course_fk
  columns:
  - name: program_fk
    description: Foreign key to dim_program
    tests:
    - not_null
    - relationships:
        to: ref('dim_program')
        field: program_pk
  - name: course_fk
    description: Foreign key to dim_course
    tests:
    - not_null
    - relationships:
        to: ref('dim_course')
        field: course_pk
  - name: is_required
    description: Boolean indicating if course is required for program completion
    tests:
    - not_null
  - name: course_order
    description: Sequence/order of course within program curriculum

- name: bridge_course_instructor
  description: Many-to-many relationship between courses and instructors
  columns:
  - name: course_fk
    description: Foreign key to dim_course
    tests:
    - not_null
    - relationships:
        to: ref('dim_course')
        field: course_pk
  - name: instructor_fk
    description: Foreign key to dim_instructor
    tests:
    - not_null
    - relationships:
        to: ref('dim_instructor')
        field: instructor_pk
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - course_fk
      - instructor_fk

- name: bridge_course_topic
  description: Many-to-many relationship between courses and topics
  columns:
  - name: course_fk
    description: Foreign key to dim_course
    tests:
    - not_null
    - relationships:
        to: ref('dim_course')
        field: course_pk
  - name: topic_fk
    description: Foreign key to dim_topic
    tests:
    - not_null
    - relationships:
        to: ref('dim_topic')
        field: topic_pk
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - course_fk
      - topic_fk

- name: bridge_course_department
  description: Many-to-many relationship between courses and departments
  columns:
  - name: course_fk
    description: Foreign key to dim_course
    tests:
    - not_null
    - relationships:
        to: ref('dim_course')
        field: course_pk
  - name: department_fk
    description: Foreign key to dim_department
    tests:
    - not_null
    - relationships:
        to: ref('dim_department')
        field: department_pk
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - course_fk
      - department_fk

- name: bridge_user_organization
  description: >
    MITx Online B2B user-to-organization membership bridge.
    Grain: one row per (user, organization) membership.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - user_fk
      - organization_fk
  columns:
  - name: user_fk
    description: Foreign key to dim_user.user_pk.
    tests:
    - not_null
    - relationships:
        to: ref('dim_user')
        field: user_pk
  - name: organization_fk
    description: Foreign key to dim_organization.organization_pk.
    tests:
    - not_null
    - relationships:
        to: ref('dim_organization')
        field: organization_pk
  - name: userorganization_keep_until_seen
    description: If true, the user is retained in the organization until their SSO
      data is next observed.
  - name: userorganization_is_manager
    description: If true, the user is a manager of this organization and can access
      organization dashboard features.

- name: bridge_user_account_link
  description: >
    User account link bridge across platforms. Links accounts held by the same person,
    either a merge into a replacement account or the same person on another platform.
    Grain: one row per (from_platform, from_user_id, to_platform).
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - from_platform
      - from_user_id
      - to_platform
  columns:
  - name: from_platform
    description: Platform identifier code for the source account (currently always
      mitxonline).
    tests:
    - not_null
  - name: from_user_id
    description: User ID of the source account on its own platform.
    tests:
    - not_null
  - name: to_platform
    description: Platform identifier code for the target account. When this equals
      from_platform, the row is a merge within that platform. When it differs (e.g.
      edxorg), the row links the same person's accounts on two platforms.
    tests:
    - not_null
  - name: to_user_id
    description: User ID of the target account on its own platform.
    tests:
    - not_null
  - name: observed_on
    description: When the merge was recorded, most recent if merged more than once.
      Null for cross-platform links.

- name: bridge_user_key_alias
  description: >
    Retired-to-surviving user_pk map. When identity resolution discovers that two
    previously-separate people are one (a user_global_id appears and links accounts
    across
    platforms), each account keeps its own assigned key, so the person has more than
    one.
    dim_user reports the survivor; this table names the keys it retired so a downstream
    FK
    pointing at one is remapped deliberately instead of silently orphaning.


    Derived every run rather than persisted, which guarantees every non-survivor points
    directly at the one survivor: alias chains cannot form. Empty is the normal state;
    a
    non-empty result is a real merge event that reverse-ETL consumers of user_pk must
    act
    on. See docs/design/adr_durable_user_surrogate_key.md.


    Grain: one row per retired key.
  columns:
  - name: retired_user_pk
    description: >
      str, a user_pk that identity resolution merged away. Downstream rows still carrying
      it should be remapped to surviving_user_pk.
    tests:
    - not_null
    # warn, not error: a duplicate here is a genuine ambiguity worth a human look (one
    # retired key reachable from two email groups, which happens when an account carrying
    # a non-surviving key moves groups on an email edit), but it is diagnostic output --
    # dim_user is unaffected, so it must not fail the nightly build.
    - unique:
        config:
          severity: warn
  - name: surviving_user_pk
    description: >
      str, the user_pk that survived the merge and appears in dim_user. Always resolves
      in
      one hop.
    tests:
    - not_null
    - relationships:
        to: ref('dim_user')
        field: user_pk
