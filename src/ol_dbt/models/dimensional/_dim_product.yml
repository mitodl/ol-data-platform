---
version: 2

models:
- name: dim_product
  description: >
    Product catalog dimension (SCD Type 2) representing purchasable offerings.
    Products can be for course runs or programs. Tracks price changes over time.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - source_product_id
      - platform
      - is_current
      where: "is_current = true"
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitxonline/app_postgres
      - xpro/app_postgres
  columns:
  - name: product_pk
    description: >
      Surrogate key for the product, stable across SCD Type 2 history rows for the
      same source product and platform. This value is not unique across historical
      versions; filter on is_current = true or include effective_date when looking
      up a single row.
    tests:
    - not_null
  - name: source_product_id
    description: Product ID from source system
    tests:
    - not_null
  - name: product_type
    description: Type of product (course, program, etc.)
    tests:
    - not_null
  - name: courserun_fk
    description: Foreign key to dim_course_run (if product is for a course)
    tests:
    - relationships:
        to: ref('dim_course_run')
        field: courserun_pk
  - name: program_fk
    description: Foreign key to dim_program (if product is for a program)
    tests:
    - relationships:
        to: ref('dim_program')
        field: program_pk
  - name: platform_fk
    description: Foreign key to dim_platform (Phase 3+)
  - name: platform
    description: Platform identifier string
    tests:
    - not_null
  - name: product_price
    description: Product price in product_currency
  - name: product_currency
    description: Currency code (standardized to USD)
    tests:
    - not_null
    - accepted_values:
        values: ['USD']
  - name: product_is_active
    description: Boolean indicating if product is currently active/purchasable
  - name: created_date_key
    description: Foreign key to dim_date for product creation date
    tests:
    - relationships:
        to: ref('dim_date')
        field: date_key
  - name: effective_date
    description: SCD Type 2 effective timestamp
    tests:
    - not_null
  - name: end_date
    description: SCD Type 2 end timestamp (null if current)
  - name: is_current
    description: Boolean indicating current version
    tests:
    - not_null

unit_tests:
- name: test_dim_product_merge_collapses_duplicate_current_rows
  description: >
    Product 3190 had three identical current rows in production after the
    2026-09-01 duplicate upstream copies. With an unchanged price upstream, the merge
    must still rewrite the key so that delete+insert collapses it to one current row
    (plus one expired copy of the old version).
  model: dim_product
  overrides:
    macros:
      is_incremental: true
  given:
  - input: ref('int__mitxonline__ecommerce_product')
    rows:
    - product_id: 3190
      product_type: "course run"
      product_price: 100.0
      product_is_active: true
  - input: ref('int__mitxpro__ecommerce_product')
    rows: []
  - input: ref('dim_course_run')
    rows: []
  - input: ref('dim_program')
    rows: []
  - input: ref('dim_platform')
    rows: []
  - input: this
    rows:
    - &current_product
      source_product_id: 3190
      platform: "mitxonline"
      product_price: 100.0
      effective_date: "2026-08-11 00:46:01"
      is_current: true
    - *current_product
    - *current_product
  expect:
    rows:
    - source_product_id: 3190
      product_price: 100.0
      is_current: true
    - source_product_id: 3190
      product_price: 100.0
      is_current: false
