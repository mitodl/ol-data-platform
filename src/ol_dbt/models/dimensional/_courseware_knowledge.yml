---
version: 2

models:
- name: dim_courseware_extraction
  description: One row per courseware claim extractor call, i.e. one scope part of
    a course run read by one extractor version and model. Versions accumulate.
  config:
    meta:
      # It reads tables only the courseware extractor writes, which no QA run produces
      # until the Dagster assets exist.
      qa_buildable: false
      # Verbatim course text, which no source-visibility policy covers yet.
      superset_dataset: false
  columns:
  - name: courseware_extraction_pk
    description: str, surrogate key of extraction_key
    tests:
    - unique
    - not_null
  - name: extraction_key
    description: str, sha256 of everything the call depended on
  - name: courserun_fk
    description: str, dim_course_run.courserun_pk
    tests:
    - relationships:
        to: ref('dim_course_run')
        field: courserun_pk
  - name: scope_block_fk
    description: str, dim_course_content.content_block_pk of the sequential; null
      for the context and materials scopes
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: scope_id
    description: str, the sequential's block id, or 'context' or 'materials'
  - name: scope_kind
    description: str, unit, context or materials
  - name: scope_title
    description: str, the sequential's title or the scope's name
  - name: scope_position
    description: int, the scope's order in the course; 0 for context, 9999 for materials
  - name: scope_part
    description: int, which part of a split scope the call read, from 1
  - name: scope_part_count
    description: int, how many parts the scope was split into
  - name: extractor_id
    description: str, the extractor version
  - name: prompt_version
    description: str, hash of the system prompt
  - name: schema_version
    description: str, hash of the output JSON schema
  - name: model_id
    description: str, the model id as sent to the provider
  - name: effort
    description: str, the effort setting for the call
  - name: input_text_checksum
    description: str, sha256 of the source text the call read
  - name: source_count
    description: int, sources the call read
  - name: truncated_source_count
    description: int, sources cut to the per-source limit
  - name: summary
    description: str, the model's summary of the scope
  - name: notes_json
    description: str, JSON list of the model's notes plus truncation notes
  - name: stop_reason
    description: str, the response's stop_reason
  - name: input_tokens
    description: int, uncached input tokens billed
  - name: output_tokens
    description: int, output tokens billed, thinking included
  - name: cache_read_input_tokens
    description: int, input tokens read from the prompt cache
  - name: cache_creation_input_tokens
    description: int, input tokens written to the prompt cache
  - name: extracted_at
    description: timestamp, when the call returned
  - name: is_current
    description: boolean, whether this is the extraction its scope part is read from
      now (int__courseware__extractions)

- name: tfact_courseware_claim
  description: One row per extracted claim (concept, skill, assumed knowledge, assessment
    expectation, learning outcome, declared prerequisite, audience), as the model
    stated it, with its evidence counts and resolved concept.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
      # Verbatim course text, which no source-visibility policy covers yet.
      superset_dataset: false
  columns:
  - name: courseware_claim_pk
    description: str, surrogate key of (extraction_key, claim_ordinal)
    tests:
    - unique
    - not_null
  - name: courseware_extraction_fk
    description: str, dim_courseware_extraction.courseware_extraction_pk
    tests:
    - not_null
    - relationships:
        to: ref('dim_courseware_extraction')
        field: courseware_extraction_pk
  - name: courserun_fk
    description: str, dim_course_run.courserun_pk
  - name: scope_block_fk
    description: str, dim_course_content.content_block_pk of the sequential; null
      for the context and materials scopes
  - name: concept_fk
    description: str, dim_concept.concept_pk for concept, assumed knowledge and declared
      prerequisite claims
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: scope_kind
    description: str, unit, context or materials
  - name: scope_position
    description: int, the scope's order in the course
  - name: claim_ordinal
    description: int, the claim's position in the extraction, from 1
  - name: claim_kind
    description: str, the kind of claim
    tests:
    - accepted_values:
        values: [concept, skill, assumed_knowledge, assessment_expectation, learning_outcome,
          declared_prerequisite, audience]
  - name: label
    description: str, the model's canonical label; the statement for outcomes and
      audience
  - name: description
    description: str, the model's description of how the scope treats the claim
  - name: concept_kind
    description: str, concept, method, tool, dataset or application (concepts only)
  - name: teaching_status
    description: str, taught, reviewed, used or mentioned (concepts and skills)
  - name: how_used
    description: str, where the material relies on assumed knowledge
  - name: flagged_as_prior
    description: boolean, whether the material frames assumed knowledge as prior
  - name: bloom_process
    description: str, Bloom revised cognitive process (assessments and outcomes)
  - name: knowledge_type
    description: str, Bloom revised knowledge type (outcomes)
  - name: prerequisite_kind
    description: str, prerequisite, corequisite, recommended or explicitly_none
  - name: course_ref
    description: str, a course a declared prerequisite names
  - name: related_concept_labels_json
    description: str, JSON list of concept labels an assessment or outcome names
  - name: evidence_count
    description: int, evidence passages quoted for the claim
  - name: verified_evidence_count
    description: int, passages found in the source text (exact or fuzzy)
  - name: is_verified
    description: boolean, whether at least one passage was found in the source
  - name: is_current
    description: boolean, whether the claim's extraction is the one its scope part
      is read from now (int__courseware__extractions)
  - name: review_status
    description: str, proposed, accepted or rejected. Only accepted claims reach learner-facing
      views; every claim is proposed until review exists.
    tests:
    - accepted_values:
        values: [proposed, accepted, rejected]
  - name: extracted_at
    description: timestamp, when the extraction returned

- name: tfact_courseware_claim_evidence
  description: One row per evidence passage quoted for a claim, with its verification
    against the source text and its character span there.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
      # Verbatim course text, which no source-visibility policy covers yet.
      superset_dataset: false
  columns:
  - name: courseware_claim_evidence_pk
    description: str, surrogate key of (extraction_key, claim_ordinal, evidence_ordinal)
    tests:
    - unique
    - not_null
  - name: courseware_claim_fk
    description: str, tfact_courseware_claim.courseware_claim_pk
    tests:
    - relationships:
        to: ref('tfact_courseware_claim')
        field: courseware_claim_pk
  - name: content_block_fk
    description: str, dim_course_content.content_block_pk of the cited block; null
      when the source is an exported file (about page, document)
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: evidence_ordinal
    description: int, the passage's position within the claim, from 1
  - name: source_ref
    description: str, the cited block id or export path; null when the model cited
      a source id the call was not sent
  - name: passage
    description: str, the passage as the model quoted it
  - name: verification_status
    description: str, exact, fuzzy, unverified or unknown_source
    tests:
    - accepted_values:
        values: [exact, fuzzy, unverified, unknown_source]
  - name: char_start
    description: int, offset of an exact or fuzzy match in the source text
  - name: char_end
    description: int, end offset of an exact or fuzzy match in the source text

- name: dim_concept
  description: Every concept id the resolver has minted, active or retired, with its
    display label, descriptions and lifecycle. review_status is 'proposed' until reviewed.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
  columns:
  - name: concept_pk
    description: str, opaque UUID minted once by the resolver; never derived from
      a label
    tests:
    - unique
    - not_null
  - name: preferred_label
    description: str, the most-mentioned member label, chosen at read time; the minted
      label for retired concepts
  - name: concept_kind
    description: str, concept, method, tool, dataset or application, from the preferred
      member label
  - name: short_description
    description: str, learner-facing phrase of at most 12 words, from the concept
      describer
  - name: description
    description: str, learner-facing, course-agnostic description of one or two sentences
  - name: is_learner_facing
    description: boolean, false for datasets, single exercises and course-internal
      labels; null until described
  - name: description_model_id
    description: str, the model that wrote the descriptions
  - name: described_at
    description: timestamp, when the descriptions were written
  - name: extracted_description
    description: str, one claim's description of how a scope treats the concept (course-specific
      evidence, not for display)
  - name: lifecycle_status
    description: str, active, merged or deprecated
    tests:
    - accepted_values:
        values: [active, merged, deprecated]
  - name: merged_into_concept_fk
    description: str, for a merged concept, the active concept it redirects to
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: split_from_concept_fk
    description: str, for a concept minted as another sense of a label (e.g. "kernel"
      in machine learning, split from the operating systems one), the concept it was
      split from
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: review_status
    description: str, proposed, accepted or rejected. Only accepted concepts reach
      learner-facing views; every concept is proposed until review exists.
    tests:
    - accepted_values:
        values: [proposed, accepted, rejected]
  - name: wikidata_qid
    description: str, the concept's Wikidata item; null until concept-level linking
      exists
  - name: minted_label
    description: str, the label the concept was minted under
  - name: minted_run_id
    description: str, the resolution run that minted the id
  - name: minted_at
    description: timestamp, when the id was minted
  - name: label_count
    description: int, normalized labels with mentions assigned to the concept
  - name: mention_count
    description: int, mentions across those labels
  - name: courserun_count
    description: int, distinct course runs that mention the concept
  - name: taught_mention_count
    description: int, mentions with teaching_status taught or reviewed

- name: dim_concept_alias
  description: Every sense of every normalized label, one row per (label, concept).
    A label can name several concepts, so the label alone does not identify one.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
  columns:
  - name: concept_alias_pk
    description: str, surrogate key of the label key and the concept
    tests:
    - unique
    - not_null
  - name: concept_fk
    description: str, dim_concept.concept_pk
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: concept_label_key
    description: str, the normalized label key
  - name: alias
    description: str, the label's most used surface form
  - name: sense_role
    description: str, primary (the concept label resolution put the label in) or split
      (a concept minted for another meaning of the label)
  - name: sense_gloss
    description: str, what the label means in this sense
  - name: added_run_id
    description: str, the resolution run that first gave the label this sense
  - name: courserun_count
    description: int, course runs whose use of the label is assigned to this sense

- name: bridge_concept_relation
  description: Concept-to-concept candidate edges with their accumulated evidence,
    an uncalibrated support_score and support-rule outcome, one row per (from, to,
    relation); review_status stays proposed until a review workflow exists. Hierarchy
    (broader), sequence (builds_on), practice (practiced_with), equivalence (close)
    and association (complements, related). snapshot_bridge_concept_relation keeps
    each edge's history.
  config:
    meta:
      # Reads dim_course_run for course keys; no QA form until the Dagster assets
      # exist, as for bridge_courserun_concept.
      qa_buildable: false
  columns:
  - name: concept_relation_pk
    description: str, surrogate key of (from, to, relation)
    tests:
    - unique
    - not_null
  - name: from_concept_fk
    description: str, the narrower concept for broader, the dependent concept for
      builds_on and practiced_with, the lower id otherwise
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
    # builds_on rows are observations, so a cycle among passing edges is a signal
    # to review, not a broken contract
    - acyclic:
        to_column: to_concept_fk
        config:
          severity: warn
          where: relation = 'builds_on' and passes_support_rule
    # a hierarchy is a strict partial order; the cycle rule holds broader to one
    - acyclic:
        name: bridge_concept_relation_broader_acyclic
        to_column: to_concept_fk
        config:
          where: relation = 'broader' and passes_support_rule
  - name: to_concept_fk
    description: str, the broader concept, the concept or tool built on, or the higher
      id
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: relation
    description: str, the relation
    tests:
    - accepted_values:
        values: [broader, builds_on, practiced_with, close, complements, related]
  - name: relation_family
    description: str, hierarchy, sequence, practice, equivalence or association
  - name: courserun_support
    description: int, distinct course runs with course evidence for the edge
  - name: scope_support
    description: int, units across those runs that showed the edge
  - name: reverse_courserun_support
    description: int, builds_on only, course runs showing the opposite direction
  - name: course_scope_support
    description: int, course relations only, scope_support with each course's reruns
      and platform copies counted once (the run with the most units; courses keyed
      by courseware_current_course_runs' course_key, so an edxorg and a mitxonline
      copy with one readable id are one course); the support the builds_on support
      rule and support_score read, since reruns and copies of one course have near-identical
      text
  - name: reverse_scope_support
    description: int, builds_on only, course_scope_support of the opposite direction
  - name: direction_consistency
    description: float, builds_on only, course_scope_support / (course_scope_support
      + reverse_scope_support)
  - name: co_taught_lift
    description: float, complements only, co-taught unit count over the count expected
      by chance
  - name: verdict_support
    description: int, adjudicated relations only, the newest resolution verdict per
      label pair agreeing with the relation (for broader, those placing from under
      to; for related, related or either hierarchy direction), and at least 1, since
      the proposal itself is one even when none of the labels that voted is still
      assigned
  - name: contrary_verdict_support
    description: int, adjudicated relations only, distinct verdicts on the pair, plus
      for broader those placing to under from
  - name: cross_signal_support
    description: int, evidence for the pair from the other source. For an adjudicated
      relation, unit observations of the pair in course evidence (co-taught, co-assessed
      or sequenced, either direction and relation, summed within a run, then each
      course's largest run, so its reruns count once); for a course relation, verdicts
      saying the pair is connected (close, related, broader or narrower)
  - name: support_score
    description: >-
      float in [0, 1], an uncalibrated ranking heuristic, not a probability that the
      relation holds: units of one course share source material and adjudication and
      extraction are related model judgements, so the evidence is not the independent
      votes the formula assumes, and cross-signal support says the pair is connected,
      not that this relation holds. Noisy-OR of the edge's evidence scaled by its
      consistency:
      consistency * (1 - (1 - r) ^ own_support * 0.8 ^ cross_signal_support), where
      own_support is verdict_support with r = 0.5 for adjudicated relations and
      course_scope_support with r = 0.3 for course relations, and consistency is
      direction_consistency for builds_on, verdict_support / (verdict_support +
      contrary_verdict_support) for adjudicated relations, and 1 otherwise. Agreeing
      evidence never lowers it and contrary evidence never raises it. One unit gives
      0.3, two units 0.51, one verdict 0.5; a co-taught pair adjudicated related once
      gets 0.44 on complements. Rounded to 4 places so the snapshot does not version
      an edge over a last-bit float difference. The reliabilities are priors. No
      support rule fails one predicate because another scored higher on the same
      pair.
    tests:
    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        min_value: 0
        max_value: 1
  - name: is_adjudicated
    description: boolean, whether resolution adjudication proposed the edge
  - name: has_sequence_evidence
    description: boolean, whether course sequence showed the edge
  - name: has_co_taught_evidence
    description: boolean, whether co-taught units showed the edge
  - name: has_co_assessed_evidence
    description: boolean, whether co-assessed items showed the edge
  - name: first_observed_at
    description: timestamp, the earliest evidence for the edge
  - name: last_observed_at
    description: timestamp, the latest evidence for the edge
  - name: review_status
    description: str, proposed, accepted or rejected
  - name: passes_support_rule
    description: boolean, whether the edge passes the support rules, which filter
      noise and do not accept the edge (review_status does that). builds_on needs
      course_scope_support of courseware_prerequisite_min_scope_support and direction_consistency
      of courseware_prerequisite_min_direction_consistency (no course-count clause,
      since every supporting course adds at least one unit). Each broader cycle loses
      its lowest-ranked edge (by adjudication score, then the number of broader edges
      into its broader concept, then concept ids). Every other relation passes. A
      pair can pass as both broader and builds_on, and a passing builds_on edge is
      still a course observation, not a prerequisite
    tests:
    - not_null
  - name: support_rule_failure
    description: str, why the edge fails the support rules. builds_on, insufficient_support
      or contested_direction; broader, hierarchy_cycle when it is the lowest-ranked
      edge of a broader cycle, or hierarchy_cycle_unresolved when the cycle walk reaches
      its bound (32 edges) without ruling a longer cycle out
    tests:
    - accepted_values:
        values: [insufficient_support, contested_direction, hierarchy_cycle, hierarchy_cycle_unresolved]

- name: dim_concept_community
  description: Neighbourhoods of related concepts from the newest graph run, with
    ids carried forward across runs by member overlap.
  columns:
  - name: community_pk
    description: str, UUID minted when the community first appeared
    tests:
    - unique
    - not_null
  - name: concept_count
    description: int, concepts in the community
  - name: top_concepts_json
    description: str, JSON list of the five member labels with the highest weighted
      degree
  - name: first_seen_run_id
    description: str, the graph run the community first appeared in
  - name: graph_run_id
    description: str, the graph run these rows come from

- name: afact_concept_graph_position
  description: Each active concept's community, connectivity, foundation rank, sequence
    level, hierarchy depth and cycle membership in the newest graph run.
  columns:
  - name: concept_fk
    description: str, dim_concept.concept_pk
    tests:
    - unique
    - not_null
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: community_fk
    description: str, dim_concept_community.community_pk
    tests:
    - relationships:
        to: ref('dim_concept_community')
        field: community_pk
  - name: component_index
    description: int, the concept's connected component in the association graph,
      valid within one graph run
  - name: degree
    description: int, edges on the concept in the association graph
  - name: weighted_degree
    description: float, sum of those edges' weights
  - name: foundation_rank
    description: float, PageRank over builds_on toward foundations
  - name: sequence_level
    description: int, longest chain of concepts beneath this one in builds_on (observed
      instructional order, not a prerequisite chain)
  - name: hierarchy_depth
    description: int, longest chain of broader concepts above this one
  - name: in_sequence_cycle
    description: boolean, whether the concept is on a builds_on cycle (a finding to
      review; builds_on edges are observations, so a cycle is not by itself bad data)
  - name: in_hierarchy_cycle
    description: boolean, whether the concept is on a broader cycle (a data-quality
      finding)
  - name: graph_run_id
    description: str, the graph run these rows come from
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      column_list: [concept_fk, graph_run_id]

- name: afact_concept_graph_run
  description: One row per concept graph run, for tracking size, sparsity, connectivity,
    community structure and cycles over time.
  columns:
  - name: concept_graph_run_pk
    description: str, the graph run's UUID
    tests:
    - unique
    - not_null
  - name: graph_version
    description: str, the graph computation's version
  - name: computed_at
    description: timestamp, when the run computed
  - name: input_checksum
    description: str, sha256 of the nodes, selected edges and parameters
  - name: parameters_json
    description: str, the thresholds and weights the run used
  - name: node_count
    description: int, active concepts in the graph
  - name: edge_count
    description: int, edges kept after thresholds
  - name: edges_by_relation_json
    description: str, JSON object of kept edge counts by relation
  - name: density
    description: float, density of the association graph
  - name: sparsity
    description: float, 1 - density of the association graph
  - name: average_degree
    description: float, 2 * edges / nodes
  - name: component_count
    description: int, connected components of the association graph
  - name: largest_component_share
    description: float, share of nodes in the largest component
  - name: isolate_count
    description: int, concepts with no kept edges
  - name: community_count
    description: int, Leiden communities
  - name: modularity
    description: float, modularity of the Leiden partition
  - name: sequence_cycle_node_count
    description: int, concepts on cycles of builds_on edges passing the support rule,
      a finding to review; only a cycle among approved edges fails the graph run
  - name: hierarchy_cycle_node_count
    description: int, concepts on broader cycles
  - name: prerequisite_closure_excluded_json
    description: str, JSON array of approved builds_on edges the prerequisite closure
      left out, each with from_concept_id, to_concept_id and reason (inactive_concept,
      a concept merged or without current labels since approval)

- name: bridge_courserun_concept
  description: How a course run relates to a concept (teaches, reviews, uses, mentions,
    assesses, requires), from current verified claims; requires is declared or inferred
    by the prerequisite rule.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
  columns:
  - name: courserun_concept_pk
    description: str, surrogate key of (platform, run, concept, relation, requirement_source)
    tests:
    - unique
    - not_null
  - name: courserun_fk
    description: str, dim_course_run.courserun_pk. Null for a run with no current
      dim_course_run row, which course_support keys by its run id and can count as
      a course of its own.
    tests:
    # counts those runs, to decide whether they should stop counting as support
    - not_null:
        config:
          severity: warn
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: concept_fk
    description: str, dim_concept.concept_pk
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: relation
    description: str, the relation
    tests:
    - accepted_values:
        values: [teaches, reviews, uses, mentions, assesses, requires, requires_concurrently,
          recommends]
  - name: requirement_source
    description: str, declared or inferred for requires, declared for requires_concurrently
      (a stated corequisite) and recommends (stated recommended background); null
      otherwise. A statement that a run has no prerequisites gives no row
  - name: first_scope_position
    description: int, the earliest scope with the relation; for inferred requires,
      the first scope that relies on the concept
  - name: claim_count
    description: int, claims behind the relation, each counted once however many of
      its labels name the concept
  - name: accepted_claim_count
    description: int, accepted claims behind the relation; for an inferred requires,
      only those made before any scope teaches the concept. Learner-facing views take
      only relations with at least one
  - name: scope_count
    description: int, distinct scopes behind the relation
  - name: relied_scope_ids
    description: array of str, inferred requires only, the units relying on the concept,
      in course order; join on (platform, courserun_readable_id, scope_id) to dim_courseware_extraction
      for the extraction version behind each
  - name: prior_scope_count
    description: int, inferred requires only, units relying on the concept before
      the run teaches it
  - name: taught_scope_count
    description: int, inferred requires only, scopes of the run that teach the concept
      (all after the first reliance), the contrary evidence
  - name: course_support
    description: int, inferred requires only, distinct courses, keyed as bridge_courserun_prerequisite_coverage
      keys them (course_key, across platforms), with a run that declares the concept
      or infers it with a direction_consistency clearing the threshold, this run included
  - name: direction_consistency
    description: float, inferred requires only, prior_scope_count / (prior_scope_count
      + taught_scope_count)
  - name: tool_status
    description: str, inferred requires of a tool (most of the run's own claims that
      give the concept a kind say tool, or, when none of them gives a kind, dim_concept.concept_kind
      is tool) only, from the run's own claims; assumed (an assumed_knowledge claim,
      or a declared prerequisite or recommended background), introduced (the run teaches
      it in some scope) or unresolved (the run only uses it). Whether another course
      teaches the tool never changes it
    tests:
    - accepted_values:
        values: [assumed, introduced, unresolved]
  - name: passes_support_rule
    description: boolean, whether the relation passes the support rule, which filters
      noise and does not accept it; inferred requires needs the courseware_prerequisite_*
      support and direction thresholds, every other relation passes. A passing inferred
      requirement is still an observation of this run, not a reviewed prerequisite
    tests:
    - not_null
  - name: support_rule_failure
    description: str, inferred requires only, insufficient_support or contested_direction
      when the requirement fails the support rule
    tests:
    - accepted_values:
        values: [insufficient_support, contested_direction]

- name: bridge_courserun_prerequisite_coverage
  description: Experimental preparation evidence, not a readiness verdict. Which other
    course runs teach or review each concept a course run requires, directly, through
    a close equivalent, or through some of its narrower concepts (an umbrella requirement
    such as Python programming), one row per requirement and providing run, with match
    type, depth, covered and missing narrower concepts and the sources of uncertainty
    as separate columns.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
  columns:
  - name: courserun_prerequisite_coverage_pk
    description: str, surrogate key of (courserun_concept_fk, provider_courserun_fk)
    tests:
    - unique
    - not_null
  - name: courserun_concept_fk
    description: str, the requires row, bridge_courserun_concept.courserun_concept_pk
    tests:
    - not_null
    - relationships:
        to: ref('bridge_courserun_concept')
        field: courserun_concept_pk
  - name: platform
    description: str, the requiring run's platform
  - name: courserun_readable_id
    description: str, the requiring run
  - name: courserun_fk
    description: str, dim_course_run.courserun_pk of the requiring run
  - name: concept_fk
    description: str, dim_concept.concept_pk, the required concept
  - name: requirement_source
    description: str, declared or inferred
  - name: requirement_passes_support_rule
    description: boolean, bridge_courserun_concept.passes_support_rule of the requirement;
      its rule counts other courses requiring the concept, so adding a course can
      change it
  - name: provider_platform
    description: str, the providing run's platform
  - name: provider_courserun_readable_id
    description: str, a current run of another course that covers the concept. Runs
      are the same course when they share dim_course.course_readable_id across platforms,
      or, without a course_fk, the run id less its run tag, with an edxorg {org}/{course}
      read as course-v1:{org}+{course}; edxorg and mitxonline copies whose readable
      ids differ (e.g. by org) still count as different courses
  - name: provider_courserun_fk
    description: str, dim_course_run.courserun_pk of the providing run
    tests:
    - not_null
  - name: match_type
    description: str, direct (teaches or reviews the concept), close (teaches or reviews
      a close equivalent) or narrower (teaches or reviews some of its narrower concepts),
      the closest that applies
    tests:
    - not_null
    - accepted_values:
        values: [direct, close, narrower]
  - name: provider_relation
    description: str, direct and close only, teaches when the provider teaches the
      matched concept, reviews when it only reviews it (which can assume it is known)
  - name: match_depth
    description: int, broader hops from the required concept to the nearest concept
      the provider covers; 0 for direct and close
    tests:
    - not_null
  - name: relies_on_unreviewed_relation
    description: boolean, whether no covered close or narrower concept is reached
      over accepted bridge_concept_relation edges only; false for direct
    tests:
    - not_null
  - name: narrower_concept_count
    description: int, narrower concepts of the required concept, within courseware_prerequisite_max_narrower_hops
      passing broader edges, that appear in any current course run. This depends on
      the corpus, not on what the requiring course needs, so it is not a denominator
      for a verdict
  - name: narrower_taught_count
    description: int, of those, the ones the providing run teaches or reviews
  - name: covered_narrower_concept_fks
    description: array of str, the narrower concepts the providing run teaches or
      reviews; null when none
  - name: missing_narrower_concept_fks
    description: array of str, the narrower concepts it does not; null when none

- name: bridge_concept_prerequisite_closure
  description: Experimental. Every concept each concept builds on, directly or through
    others, at the fewest hops over approved builds_on edges (review_status accepted),
    from the newest graph run; empty until a review workflow approves edges. It keeps
    the meaning of its input and validates nothing. Capped at the run's max_prerequisite_depth
    (afact_concept_graph_run.parameters_json).
  columns:
  - name: from_concept_fk
    description: str, dim_concept.concept_pk of the concept that builds on to_concept_fk
    tests:
    - not_null
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: to_concept_fk
    description: str, dim_concept.concept_pk of the prerequisite concept
    tests:
    - not_null
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: min_depth
    description: int, the fewest approved builds_on hops between the two; 1 is an
      approved builds_on edge
    tests:
    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        min_value: 1
  - name: graph_run_id
    description: str, the graph run these rows come from
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      column_list: [from_concept_fk, to_concept_fk]

- name: bridge_courserun_prerequisite_path
  description: Experimental preparation candidates for a course run, not validated
    prerequisites or readiness advice. Every concept the run requires, and what those
    build on over the approved closure (empty until review exists), with the runs
    of other courses that teach each one, ranked. One row per run, prerequisite concept
    and providing run, and one row with a null provider for a prerequisite no other
    course covers.
  config:
    meta:
      # Same as bridge_courserun_prerequisite_coverage.
      qa_buildable: false
  columns:
  - name: courserun_prerequisite_path_pk
    description: str, surrogate key of (courserun_fk, concept_fk, provider_courserun_fk)
    tests:
    - unique
    - not_null
  - name: platform
    description: str, the requiring run's platform
  - name: courserun_readable_id
    description: str, the requiring run
  - name: courserun_fk
    description: str, dim_course_run.courserun_pk of the requiring run
    tests:
    - not_null
    - relationships:
        to: ref('dim_course_run')
        field: courserun_pk
  - name: concept_fk
    description: str, dim_concept.concept_pk, the prerequisite concept
    tests:
    - not_null
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: prerequisite_depth
    description: int, 1 for a concept the run requires (bridge_courserun_concept requires,
      passing the support rule), 1 plus the bridge_concept_prerequisite_closure min_depth
      for a concept a requirement builds on over approved edges, the shortest over
      the run's requirements
    tests:
    - not_null
  - name: prerequisite_source
    description: str, declared or inferred for a requirement (declared when both),
      builds_on for a concept reached through what requirements build on
    tests:
    - not_null
    - accepted_values:
        values: [declared, inferred, builds_on]
  - name: required_concept_count
    description: int, the run's requirements that are or build on this concept
    tests:
    - not_null
  - name: provider_platform
    description: str, the providing run's platform
  - name: provider_courserun_readable_id
    description: str, a current run of another course that teaches the concept, as
      in bridge_courserun_prerequisite_coverage; null when none does
  - name: provider_courserun_fk
    description: str, dim_course_run.courserun_pk of the providing run
    tests:
    - relationships:
        to: ref('dim_course_run')
        field: courserun_pk
  - name: match_type
    description: str, direct (teaches or reviews the concept), close (a close equivalent)
      or, for requirements only, narrower (a narrower match in bridge_courserun_prerequisite_coverage),
      the first that applies
    tests:
    - accepted_values:
        values: [direct, close, narrower]
  - name: provider_scope_count
    description: int, the provider's scopes teaching or reviewing the concept (direct)
      or its best close equivalent (close), a scope that does both counted once; null
      for narrower, which counts concepts
  - name: narrower_taught_count
    description: int, narrower only, the required concept's narrower concepts the
      provider teaches or reviews (bridge_courserun_prerequisite_coverage)
  - name: provider_rank
    description: int, 1 for the best provider of this prerequisite, by match type
      and then provider_scope_count, or narrower_taught_count for narrower
  - name: provider_prerequisite_count
    description: int, how many of the run's prerequisites this provider covers, which
      ranks candidate courses (not advice on what to take first)

- name: bridge_course_content_concept
  description: Which known concepts each courseware block or course document mentions,
    from dictionary tagging, one row per (source, concept). Mentions only, not teaching
    status.
  config:
    meta:
      # It reads tables only the courseware tagger writes, which no QA run produces
      # until the Dagster assets exist.
      qa_buildable: false
  columns:
  - name: course_content_concept_pk
    description: str, surrogate key of (platform, courserun_readable_id, source_ref,
      concept)
    tests:
    - unique
    - not_null
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: content_block_fk
    description: str, dim_course_content.content_block_pk of the latest retrieval;
      null when the source is an exported file rather than a block
  - name: concept_fk
    description: str, dim_concept.concept_pk of the concept as of the newest resolution
      run; a concept merged since the tagging run reads as its survivor
    tests:
    - not_null
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: scope_id
    description: str, the sequential's block id, or 'context' or 'materials'
  - name: scope_kind
    description: str, unit, context or materials
  - name: source_ref
    description: str, the block id, or the exported file's path
  - name: source_kind
    description: str, html, problem, video_transcript, document or a page kind
  - name: mention_count
    description: int, mentions of the concept in the source
  - name: phrase_count
    description: int, distinct phrases that matched
  - name: first_char_start
    description: int, offset of the first mention in the source's text
  - name: is_ambiguous
    description: boolean, every mention came through an ambiguous phrase; a review
      signal, not a sense decision
  - name: is_sense_resolved
    description: boolean, the course run's sense of the label is this concept; otherwise
      the row is a mention candidate whose sense nothing has decided
  - name: is_cited_by_extractor
    description: boolean, a current verified claim naming the concept quotes this
      source
  - name: is_named_in_scope
    description: boolean, a current verified claim in the source's scope names the
      concept
  - name: tagging_run_id
    description: str, the tagging run the rows come from

unit_tests:
- name: test_bridge_concept_relation_keeps_hierarchy_beside_dependency_and_cuts_hierarchy_cycles
  description: >
    a < b < c < a is a broader cycle, and c < a has the fewest verdicts, so it is
    the one that fails the support rule. j < k < l < j ties j < k and k < l on
    verdicts; more broader edges point at k (j and z sit under it) than at l, so k
    <
    l ranks lower and is the only edge cut. g < h < i < g is a cycle whose weakest
    edge g < h is cut; h -> g builds_on passes on its own support. x < y and p < q
    are broader pairs that also have a builds_on edge passing its own support rule
    (x -> y the same way, q -> p the opposite way); both predicates pass on each
    pair, whichever scores higher, because a concept can be a kind or part of
    another and still build on it. m and n are co-taught and adjudicated related,
    so
    each edge carries the other source as cross-signal support. s and t are related
    with no verdict left to count, so the proposal counts as one. u and v are
    co-taught in run1 and in run3, a rerun of the same course, which counts once,
    so
    complements scores one unit's 0.3.
  model: bridge_concept_relation
  given:
  - input: ref('int__courseware__concept_relation_evidence')
    rows:
    - {from_concept_id: a, to_concept_id: b, relation: broader, evidence_source: adjudication,
      platform: null, courserun_readable_id: null, scope_count: 0, observed_at: '2026-10-01'}
    - {from_concept_id: b, to_concept_id: c, relation: broader, evidence_source: adjudication,
