- name: test_bridge_concept_relation_cuts_every_cycle_lowest_edge_in_one_pass
  description: >
    z < x < y < z and x < y < w < x overlap on x < y. x < y is the lowest edge of
    x <
    y < w < x and z < x the lowest of z < x < y < z, so both are cut in the one pass,
    although cutting x < y already broke z < x < y < z and an exact pass would keep
    z <
    x. This pins the conservative rule;
    assert_bridge_concept_relation_hierarchy_cycle_overprune counts such edges.
  model: bridge_concept_relation
  given:
  - input: ref('int__courseware__concept_relation_evidence')
