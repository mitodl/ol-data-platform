---
version: 2

models:
- name: dim_courseware_extraction
  description: One row per courseware claim extractor call, i.e. one scope part of
    a course run read by one extractor version and model. Versions accumulate.
  config:
    meta:
      # It reads tables only the courseware extractor writes, which no QA run produces
      # until the Dagster assets exist.
      qa_buildable: false
      # Verbatim course text, which no source-visibility policy covers yet.
      superset_dataset: false
  columns:
  - name: courseware_extraction_pk
    description: str, surrogate key of extraction_key
    tests:
    - unique
    - not_null
  - name: extraction_key
    description: str, sha256 of everything the call depended on
  - name: courserun_fk
    description: str, dim_course_run.courserun_pk
    tests:
    - relationships:
        to: ref('dim_course_run')
        field: courserun_pk
  - name: scope_block_fk
    description: str, dim_course_content.content_block_pk of the sequential; null
      for the context and materials scopes
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: scope_id
    description: str, the sequential's block id, or 'context' or 'materials'
  - name: scope_kind
    description: str, unit, context or materials
  - name: scope_title
    description: str, the sequential's title or the scope's name
  - name: scope_position
    description: int, the scope's order in the course; 0 for context, 9999 for materials
  - name: scope_part
    description: int, which part of a split scope the call read, from 1
  - name: scope_part_count
    description: int, how many parts the scope was split into
  - name: extractor_id
    description: str, the extractor version
  - name: prompt_version
    description: str, hash of the system prompt
  - name: schema_version
    description: str, hash of the output JSON schema
  - name: model_id
    description: str, the model id as sent to the provider
  - name: effort
    description: str, the effort setting for the call
  - name: input_text_checksum
    description: str, sha256 of the source text the call read
  - name: source_count
    description: int, sources the call read
  - name: truncated_source_count
    description: int, sources cut to the per-source limit
  - name: summary
    description: str, the model's summary of the scope
  - name: notes_json
    description: str, JSON list of the model's notes plus truncation notes
  - name: stop_reason
    description: str, the response's stop_reason
  - name: input_tokens
    description: int, uncached input tokens billed
  - name: output_tokens
    description: int, output tokens billed, thinking included
  - name: cache_read_input_tokens
    description: int, input tokens read from the prompt cache
  - name: cache_creation_input_tokens
    description: int, input tokens written to the prompt cache
  - name: extracted_at
    description: timestamp, when the call returned
  - name: is_current
    description: boolean, whether this is the newest extraction of its scope part

- name: tfact_courseware_claim
  description: One row per extracted claim (concept, skill, assumed knowledge, assessment
    expectation, learning outcome, declared prerequisite, audience), as the model
    stated it, with its evidence counts and resolved concept.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
      # Verbatim course text, which no source-visibility policy covers yet.
      superset_dataset: false
  columns:
  - name: courseware_claim_pk
    description: str, surrogate key of (extraction_key, claim_ordinal)
    tests:
    - unique
    - not_null
  - name: courseware_extraction_fk
    description: str, dim_courseware_extraction.courseware_extraction_pk
    tests:
    - not_null
    - relationships:
        to: ref('dim_courseware_extraction')
        field: courseware_extraction_pk
  - name: courserun_fk
    description: str, dim_course_run.courserun_pk
  - name: scope_block_fk
    description: str, dim_course_content.content_block_pk of the sequential; null
      for the context and materials scopes
  - name: concept_fk
    description: str, dim_concept.concept_pk for concept, assumed knowledge and declared
      prerequisite claims
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: scope_kind
    description: str, unit, context or materials
  - name: scope_position
    description: int, the scope's order in the course
  - name: claim_ordinal
    description: int, the claim's position in the extraction, from 1
  - name: claim_kind
    description: str, the kind of claim
    tests:
    - accepted_values:
        values: [concept, skill, assumed_knowledge, assessment_expectation, learning_outcome,
          declared_prerequisite, audience]
  - name: label
    description: str, the model's canonical label; the statement for outcomes and
      audience
  - name: description
    description: str, the model's description of how the scope treats the claim
  - name: concept_kind
    description: str, concept, method, tool, dataset or application (concepts only)
  - name: teaching_status
    description: str, taught, reviewed, used or mentioned (concepts and skills)
  - name: how_used
    description: str, where the material relies on assumed knowledge
  - name: flagged_as_prior
    description: boolean, whether the material frames assumed knowledge as prior
  - name: bloom_process
    description: str, Bloom revised cognitive process (assessments and outcomes)
  - name: knowledge_type
    description: str, Bloom revised knowledge type (outcomes)
  - name: prerequisite_kind
    description: str, prerequisite, corequisite, recommended or explicitly_none
  - name: course_ref
    description: str, a course a declared prerequisite names
  - name: related_concept_labels_json
    description: str, JSON list of concept labels an assessment or outcome names
  - name: evidence_count
    description: int, evidence passages quoted for the claim
  - name: verified_evidence_count
    description: int, passages found in the source text (exact or fuzzy)
  - name: is_verified
    description: boolean, whether at least one passage was found in the source
  - name: is_current
    description: boolean, whether the claim's extraction is the newest for its scope
      part
  - name: extracted_at
    description: timestamp, when the extraction returned

- name: tfact_courseware_claim_evidence
  description: One row per evidence passage quoted for a claim, with its verification
    against the source text and its character span there.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
      # Verbatim course text, which no source-visibility policy covers yet.
      superset_dataset: false
  columns:
  - name: courseware_claim_evidence_pk
    description: str, surrogate key of (extraction_key, claim_ordinal, evidence_ordinal)
    tests:
    - unique
    - not_null
  - name: courseware_claim_fk
    description: str, tfact_courseware_claim.courseware_claim_pk
    tests:
    - relationships:
        to: ref('tfact_courseware_claim')
        field: courseware_claim_pk
  - name: content_block_fk
    description: str, dim_course_content.content_block_pk of the cited block; null
      when the source is an exported file (about page, document)
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: evidence_ordinal
    description: int, the passage's position within the claim, from 1
  - name: source_ref
    description: str, the cited block id or export path; null when the model cited
      a source id the call was not sent
  - name: passage
    description: str, the passage as the model quoted it
  - name: verification_status
    description: str, exact, fuzzy, unverified or unknown_source
    tests:
    - accepted_values:
        values: [exact, fuzzy, unverified, unknown_source]
  - name: char_start
    description: int, offset of an exact match in the source text
  - name: char_end
    description: int, end offset of an exact match in the source text

- name: dim_concept
  description: Every concept id the resolver has minted, active or retired, with its
    display label, descriptions and lifecycle. review_status is 'proposed' until reviewed.
  columns:
  - name: concept_pk
    description: str, opaque UUID minted once by the resolver; never derived from
      a label
    tests:
    - unique
    - not_null
  - name: preferred_label
    description: str, the most-mentioned member label, chosen at read time; the minted
      label for retired concepts
  - name: concept_kind
    description: str, concept, method, tool, dataset or application, from the preferred
      member label
  - name: short_description
    description: str, learner-facing phrase of at most 12 words, from the concept
      describer
  - name: description
    description: str, learner-facing, course-agnostic description of one or two sentences
  - name: is_learner_facing
    description: boolean, false for datasets, single exercises and course-internal
      labels; null until described
  - name: description_model_id
    description: str, the model that wrote the descriptions
  - name: described_at
    description: timestamp, when the descriptions were written
  - name: extracted_description
    description: str, one claim's description of how a scope treats the concept (course-specific
      evidence, not for display)
  - name: lifecycle_status
    description: str, active, merged or deprecated
    tests:
    - accepted_values:
        values: [active, merged, deprecated]
  - name: merged_into_concept_fk
    description: str, for a merged concept, the active concept it redirects to
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: review_status
    description: str, proposed, accepted or rejected
  - name: wikidata_qid
    description: str, the concept's Wikidata item; null until concept-level linking
      exists
  - name: minted_label
    description: str, the label the concept was minted under
  - name: minted_run_id
    description: str, the resolution run that minted the id
  - name: minted_at
    description: timestamp, when the id was minted
  - name: label_count
    description: int, normalized labels assigned to the concept
  - name: mention_count
    description: int, mentions across those labels
  - name: courserun_count
    description: int, distinct course runs that mention the concept
  - name: taught_mention_count
    description: int, mentions with teaching_status taught or reviewed

- name: dim_concept_alias
  description: Every normalized label a concept was extracted under.
  columns:
  - name: concept_alias_pk
    description: str, surrogate key of the label key
    tests:
    - unique
    - not_null
  - name: concept_fk
    description: str, dim_concept.concept_pk
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: concept_label_key
    description: str, the normalized label key
  - name: alias
    description: str, the label's most used surface form
  - name: mention_count
    description: int, mentions of the label
  - name: courserun_count
    description: int, distinct course runs that mention the label
  - name: assignment_source
    description: str, carried, exact_match, minted or rebuild_carried
  - name: assigned_run_id
    description: str, the resolution run that first assigned the label to the concept

- name: bridge_concept_relation
  description: Concept-to-concept edges with their accumulated evidence, a combined
    relation_confidence and a publishing decision, one row per (from, to, relation).
    Hierarchy (broader), sequence (builds_on), practice (practiced_with), equivalence
    (close) and association (complements, related).
  config:
    meta:
      # Reads dim_course_run for course keys; no QA form until the Dagster assets
      # exist, as for bridge_courserun_concept.
      qa_buildable: false
  columns:
  - name: concept_relation_pk
    description: str, surrogate key of (from, to, relation)
    tests:
    - unique
    - not_null
  - name: from_concept_fk
    description: str, the narrower concept for broader, the dependent concept for
      builds_on and practiced_with, the lower id otherwise
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
    # learning order is a strict partial order, so published builds_on has no cycles
    - acyclic:
        to_column: to_concept_fk
        config:
          where: relation = 'builds_on' and is_published
    # and so is the hierarchy
    - acyclic:
        name: bridge_concept_relation_published_broader_acyclic
        to_column: to_concept_fk
        config:
          where: relation = 'broader' and is_published
  - name: to_concept_fk
    description: str, the broader concept, the concept or tool built on, or the higher
      id
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: relation
    description: str, the relation
    tests:
    - accepted_values:
        values: [broader, builds_on, practiced_with, close, complements, related]
  - name: relation_family
    description: str, hierarchy, sequence, practice, equivalence or association
  - name: courserun_support
    description: int, distinct course runs with course evidence for the edge
  - name: scope_support
    description: int, units across those runs that showed the edge
  - name: reverse_courserun_support
    description: int, builds_on only, course runs showing the opposite direction
  - name: course_scope_support
    description: int, builds_on only, scope_support with each course's reruns counted
      once (the run with the most units; a run without a course_fk is keyed by the
      run id less its run segment); the support the publishing rule reads, since reruns
      of one course have near-identical text
  - name: reverse_scope_support
    description: int, builds_on only, course_scope_support of the opposite direction
  - name: direction_consistency
    description: float, builds_on only, course_scope_support / (course_scope_support
      + reverse_scope_support)
  - name: co_taught_lift
    description: float, complements only, co-taught unit count over the count expected
      by chance
  - name: verdict_support
    description: int, adjudicated relations only, resolution verdicts agreeing with
      the relation (for broader, those placing from under to; for related, related
      or either hierarchy direction)
  - name: contrary_verdict_support
    description: int, adjudicated relations only, distinct verdicts on the pair, plus
      for broader those placing to under from
  - name: cross_signal_support
    description: int, evidence for the pair from the other source. For an adjudicated
      relation, unit observations of the pair in course evidence (co-taught, co-assessed
      or sequenced, either direction); for a course relation, verdicts saying the
      pair is connected (close, related, broader or narrower)
  - name: relation_confidence
    description: >-
      float in [0, 1], noisy-OR of the edge's evidence scaled by its consistency:
      consistency * (1 - (1 - r) ^ own_support * 0.8 ^ cross_signal_support), where
      own_support is verdict_support with r = 0.5 for adjudicated relations and
      scope_support with r = 0.3 for course relations, and consistency is
      direction_consistency for builds_on, verdict_support / (verdict_support +
      contrary_verdict_support) for adjudicated relations, and 1 otherwise. Agreeing
      evidence never lowers it and contrary evidence never raises it. One unit gives
      0.3, two units 0.51, one verdict 0.5; a co-taught pair adjudicated related once
      gets 0.44 on complements. The reliabilities are priors until the gold set
      calibrates them, and it is not a probability yet.
    tests:
    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        min_value: 0
        max_value: 1
  - name: is_adjudicated
    description: boolean, whether resolution adjudication proposed the edge
  - name: has_sequence_evidence
    description: boolean, whether course sequence showed the edge
  - name: has_co_taught_evidence
    description: boolean, whether co-taught units showed the edge
  - name: has_co_assessed_evidence
    description: boolean, whether co-assessed items showed the edge
  - name: first_observed_at
    description: timestamp, the earliest evidence for the edge
  - name: last_observed_at
    description: timestamp, the latest evidence for the edge
  - name: review_status
    description: str, proposed, accepted or rejected
  - name: is_published
    description: boolean, whether the edge clears the publishing rule. builds_on needs
      course_scope_support of courseware_prerequisite_min_scope_support and direction_consistency
      of courseware_prerequisite_min_direction_consistency (no course-count clause,
      since every supporting course adds at least one unit); broader and builds_on
      are exclusive per pair (the higher relation_confidence publishes, broader on a
      tie); and the weakest edge of each broader cycle, by adjudication score, is not
      published. Every other relation is published
    tests:
    - not_null
  - name: unpublished_reason
    description: str, why the edge is not published. builds_on, insufficient_support
      or contested_direction, or hierarchy_pair when it lost its pair to a broader
      edge; broader, sequence_pair when it lost its pair to a builds_on edge, or hierarchy_cycle
      when it is the weakest link of a broader cycle
    tests:
    - accepted_values:
        values: [insufficient_support, contested_direction, hierarchy_pair, sequence_pair,
          hierarchy_cycle]

- name: dim_concept_community
  description: Neighbourhoods of related concepts from the newest graph run, with
    ids carried forward across runs by member overlap.
  columns:
  - name: community_pk
    description: str, UUID minted when the community first appeared
    tests:
    - unique
    - not_null
  - name: concept_count
    description: int, concepts in the community
  - name: top_concepts_json
    description: str, JSON list of the five member labels with the highest weighted
      degree
  - name: first_seen_run_id
    description: str, the graph run the community first appeared in
  - name: graph_run_id
    description: str, the graph run these rows come from

- name: afact_concept_graph_position
  description: Each active concept's community, connectivity, foundation rank, sequence
    level, hierarchy depth and cycle membership in the newest graph run.
  columns:
  - name: concept_fk
    description: str, dim_concept.concept_pk
    tests:
    - unique
    - not_null
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: community_fk
    description: str, dim_concept_community.community_pk
    tests:
    - relationships:
        to: ref('dim_concept_community')
        field: community_pk
  - name: component_index
    description: int, the concept's connected component in the association graph,
      valid within one graph run
  - name: degree
    description: int, edges on the concept in the association graph
  - name: weighted_degree
    description: float, sum of those edges' weights
  - name: foundation_rank
    description: float, PageRank over builds_on toward foundations
  - name: sequence_level
    description: int, longest chain of concepts beneath this one in builds_on
  - name: hierarchy_depth
    description: int, longest chain of broader concepts above this one
  - name: in_sequence_cycle
    description: boolean, whether the concept is on a builds_on cycle (a data-quality
      finding)
  - name: in_hierarchy_cycle
    description: boolean, whether the concept is on a broader cycle (a data-quality
      finding)
  - name: graph_run_id
    description: str, the graph run these rows come from
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      column_list: [concept_fk, graph_run_id]

- name: afact_concept_graph_run
  description: One row per concept graph run, for tracking size, sparsity, connectivity,
    community structure and cycles over time.
  columns:
  - name: concept_graph_run_pk
    description: str, the graph run's UUID
    tests:
    - unique
    - not_null
  - name: graph_version
    description: str, the graph computation's version
  - name: computed_at
    description: timestamp, when the run computed
  - name: input_checksum
    description: str, sha256 of the nodes, selected edges and parameters
  - name: parameters_json
    description: str, the thresholds and weights the run used
  - name: node_count
    description: int, active concepts in the graph
  - name: edge_count
    description: int, edges kept after thresholds
  - name: edges_by_relation_json
    description: str, JSON object of kept edge counts by relation
  - name: density
    description: float, density of the association graph
  - name: sparsity
    description: float, 1 - density of the association graph
  - name: average_degree
    description: float, 2 * edges / nodes
  - name: component_count
    description: int, connected components of the association graph
  - name: largest_component_share
    description: float, share of nodes in the largest component
  - name: isolate_count
    description: int, concepts with no kept edges
  - name: community_count
    description: int, Leiden communities
  - name: modularity
    description: float, modularity of the Leiden partition
  - name: sequence_cycle_node_count
    description: int, concepts on builds_on cycles
  - name: hierarchy_cycle_node_count
    description: int, concepts on broader cycles

- name: bridge_courserun_concept
  description: How a course run relates to a concept (teaches, reviews, uses, mentions,
    assesses, requires), from current verified claims; requires is declared or inferred
    by the prerequisite rule.
  config:
    meta:
      # Same as dim_courseware_extraction: no QA form until the Dagster assets exist.
      qa_buildable: false
  columns:
  - name: courserun_concept_pk
    description: str, surrogate key of (platform, run, concept, relation, requirement_source)
    tests:
    - unique
    - not_null
  - name: courserun_fk
    description: str, dim_course_run.courserun_pk
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run
  - name: concept_fk
    description: str, dim_concept.concept_pk
    tests:
    - relationships:
        to: ref('dim_concept')
        field: concept_pk
  - name: relation
    description: str, the relation
    tests:
    - accepted_values:
        values: [teaches, reviews, uses, mentions, assesses, requires, requires_concurrently,
          recommends]
  - name: requirement_source
    description: str, declared or inferred for requires, declared for requires_concurrently
      (a stated corequisite) and recommends (stated recommended background); null
      otherwise. A statement that a run has no prerequisites gives no row
  - name: first_scope_position
    description: int, the earliest scope with the relation; for inferred requires,
      the first scope that relies on the concept
  - name: claim_count
    description: int, claims behind the relation
  - name: scope_count
    description: int, distinct scopes behind the relation
  - name: prior_scope_count
    description: int, inferred requires only, units relying on the concept before
      the run teaches it
  - name: taught_scope_count
    description: int, inferred requires only, scopes of the run that teach the concept
      (all after the first reliance), the contrary evidence
  - name: course_support
    description: int, inferred requires only, distinct courses (course_fk, or for
      a run without one the platform and the run id less its run segment) with a run
      that declares the concept or infers it with a direction_consistency clearing
      the threshold, this run included
  - name: direction_consistency
    description: float, inferred requires only, prior_scope_count / (prior_scope_count
      + taught_scope_count)
  - name: is_published
    description: boolean, whether the relation clears the publishing rule; inferred
      requires needs the courseware_prerequisite_* support and direction thresholds,
      every other relation is published
    tests:
    - not_null
  - name: unpublished_reason
    description: str, inferred requires only, insufficient_support or contested_direction
      when the requirement is not published
    tests:
    - accepted_values:
        values: [insufficient_support, contested_direction]

unit_tests:
- name: test_bridge_concept_relation_publishes_one_edge_per_hierarchy_pair_and_no_hierarchy_cycle
  description: >
    a < b < c < a is a broader cycle, and c < a has the fewest verdicts, so it is
    the one left unpublished. x < y and p < q are broader pairs that also have a
    builds_on edge clearing its own support rule: on x, y the builds_on edge has
    the higher relation_confidence (four units against one verdict) and publishes
    instead of broader; on p, q broader (two verdicts) beats a two-unit builds_on
    in
    the opposite direction. m and n are co-taught and adjudicated related, so each
    edge carries the other source as cross-signal support.
  model: bridge_concept_relation
  given:
  - input: ref('int__courseware__concept_relation_evidence')
    rows:
    - {from_concept_id: a, to_concept_id: b, relation: broader, evidence_source: adjudication,
      platform: null, courserun_readable_id: null, scope_count: 0, observed_at: '2026-10-01'}
    - {from_concept_id: b, to_concept_id: c, relation: broader, evidence_source: adjudication,
      platform: null, courserun_readable_id: null, scope_count: 0, observed_at: '2026-10-01'}
    - {from_concept_id: c, to_concept_id: a, relation: broader, evidence_source: adjudication,
      platform: null, courserun_readable_id: null, scope_count: 0, observed_at: '2026-10-01'}
    - {from_concept_id: x, to_concept_id: y, relation: broader, evidence_source: adjudication,
      platform: null, courserun_readable_id: null, scope_count: 0, observed_at: '2026-10-01'}
    - {from_concept_id: x, to_concept_id: y, relation: builds_on, evidence_source: course_sequence,
      platform: mitxonline, courserun_readable_id: run1, scope_count: 2, observed_at: '2026-10-01'}
    - {from_concept_id: x, to_concept_id: y, relation: builds_on, evidence_source: course_sequence,
      platform: mitxonline, courserun_readable_id: run2, scope_count: 2, observed_at: '2026-10-01'}
    - {from_concept_id: p, to_concept_id: q, relation: broader, evidence_source: adjudication,
      platform: null, courserun_readable_id: null, scope_count: 0, observed_at: '2026-10-01'}
    - {from_concept_id: q, to_concept_id: p, relation: builds_on, evidence_source: course_sequence,
      platform: mitxonline, courserun_readable_id: run1, scope_count: 2, observed_at: '2026-10-01'}
    - {from_concept_id: m, to_concept_id: n, relation: related, evidence_source: adjudication,
      platform: null, courserun_readable_id: null, scope_count: 0, observed_at: '2026-10-01'}
    - {from_concept_id: m, to_concept_id: n, relation: complements, evidence_source: co_taught,
      platform: mitxonline, courserun_readable_id: run1, scope_count: 1, observed_at: '2026-10-01'}
  - input: ref('int__courseware__adjudicated_concept_relations')
