      narrower_concept_count: 0, narrower_taught_count: 0}

- name: test_bridge_courserun_prerequisite_coverage_lists_covered_and_missing_parts
  description: >
    Run ra requires the umbrella u, whose narrower concepts n1, n2 and n3 all appear
    in current runs (n3 two hops down, under n1). rb teaches n1 and reviews n3, so
    it
    covers n1 and n3 and misses n2. rc teaches only n3, so its match is at depth 2.
    The lists stay evidence; nothing turns 2 of 3 into a verdict.
  model: bridge_courserun_prerequisite_coverage
  overrides:
    vars:
      courseware_prerequisite_max_narrower_hops: 3
  given:
  - input: ref('dim_course')
    rows:
    - {course_pk: A, course_readable_id: "course-v1:ORG+A.1", primary_platform: mitxonline,
      is_current: true}
    - {course_pk: B, course_readable_id: "course-v1:ORG+B.1", primary_platform: mitxonline,
      is_current: true}
    - {course_pk: C, course_readable_id: "course-v1:ORG+C.1", primary_platform: mitxonline,
      is_current: true}
  - input: ref('dim_course_run')
    rows:
    - {courserun_pk: ra, course_fk: A, platform: mitxonline, courserun_readable_id: "course-v1:ORG+A.1+1T2026",
      is_current: true}
    - {courserun_pk: rb, course_fk: B, platform: mitxonline, courserun_readable_id: "course-v1:ORG+B.1+1T2026",
      is_current: true}
    - {courserun_pk: rc, course_fk: C, platform: mitxonline, courserun_readable_id: "course-v1:ORG+C.1+1T2026",
      is_current: true}
  - input: ref('bridge_courserun_concept')
    rows:
    - {courserun_concept_pk: rc-n3, courserun_fk: rc, concept_fk: n3, relation: teaches,
      passes_support_rule: true}
    - {courserun_concept_pk: ra-u, courserun_fk: ra, concept_fk: u, relation: requires,
      requirement_source: inferred, passes_support_rule: true}
    - {courserun_concept_pk: ra-n2, courserun_fk: ra, concept_fk: n2, relation: teaches,
      passes_support_rule: true}
    - {courserun_concept_pk: rb-n1, courserun_fk: rb, concept_fk: n1, relation: teaches,
      passes_support_rule: true}
    - {courserun_concept_pk: rb-n3, courserun_fk: rb, concept_fk: n3, relation: reviews,
      passes_support_rule: true}
  - input: ref('bridge_concept_relation')
    rows:
    - {from_concept_fk: n1, to_concept_fk: u, relation: broader, passes_support_rule: true,
      review_status: proposed}
    - {from_concept_fk: n2, to_concept_fk: u, relation: broader, passes_support_rule: true,
      review_status: proposed}
    - {from_concept_fk: n3, to_concept_fk: n1, relation: broader, passes_support_rule: true,
      review_status: proposed}
  expect:
    format: sql
    rows: |
      select
          md5(concat('ra-u', '-', 'rb')) as courserun_prerequisite_coverage_pk
          , 'ra-u' as courserun_concept_fk
          , cast(null as varchar) as platform
          , cast(null as varchar) as courserun_readable_id
          , 'ra' as courserun_fk
          , 'u' as concept_fk
          , 'inferred' as requirement_source
          , true as requirement_passes_support_rule
          , 'mitxonline' as provider_platform
          , 'course-v1:ORG+B.1+1T2026' as provider_courserun_readable_id
          , 'rb' as provider_courserun_fk
          , 'narrower' as match_type
          , cast(null as varchar) as provider_relation
          , 1 as match_depth
          , true as relies_on_unreviewed_relation
          , 3 as narrower_concept_count
          , 2 as narrower_taught_count
          , ['n1', 'n3']::varchar[] as covered_narrower_concept_fks
          , ['n2']::varchar[] as missing_narrower_concept_fks
      union all
      select
          md5(concat('ra-u', '-', 'rc'))
          , 'ra-u', cast(null as varchar), cast(null as varchar), 'ra', 'u', 'inferred', true
          , 'mitxonline', 'course-v1:ORG+C.1+1T2026', 'rc', 'narrower', cast(null as varchar)
          , 2, true, 3, 1, ['n3']::varchar[], ['n1', 'n2']::varchar[]
