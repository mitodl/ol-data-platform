---
version: 2

models:
- name: dim_course
  description: >
    Master course catalog dimension (SCD Type 2) representing abstract course concepts
    across all platforms. One course may have multiple runs (see dim_course_run).
    Tracks historical changes to course metadata.
    Note: edxorg has no native course-level table. edxorg courses are derived from
    courserun records, with one row per course_readable_id using the most-recent course
    run (by courserun_start_date desc nulls last) to supply attributes (title,
    course_number, is_live). emeritus and global_alumni courses are derived the same
    way from Wrike run codes, one per course code with no xPro course. source_id
    is null for edxorg, OCW, emeritus and global_alumni courses.
    The most-recent-run collapse uses a ROW_NUMBER subquery (WHERE _row_num = 1) rather
    than a QUALIFY clause because Trino does not support QUALIFY; the semantics are
    identical — exactly one row is retained per course_readable_id.
  meta:
    qa_branches:
    - micromasters/app_postgres
    - mitxonline/app_postgres
    - ocw/app_postgres
    - xpro/app_postgres
    owner: data_team
  columns:
  - name: course_pk
    description: >
      Surrogate primary key. Generated as dbt_utils.generate_surrogate_key(['platform',
      'course_readable_id']). Value is stable across runs — do not filter on this
      alone
      for SCD2; also filter on is_current.
    tests:
    - unique:
        where: "is_current = true"
    - not_null
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.course
  - name: course_readable_id
    description: Business key - readable course ID (e.g., course-v1:MITx+6.00.1x)
    tests:
    - not_null
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.course
  - name: source_id
    description: >
      Integer source system ID for this course. Null for edxorg courses — edxorg
      exposes no native integer course ID; course records are synthesized from the
      most-recent course run sharing the same course_readable_id. Null for OCW
      courses because OCW exposes a string UUID, not an integer source ID. Null for
      emeritus and global_alumni courses, which have no course table.
  - name: course_number
    description: Course number (e.g., 6.00.1x)
  - name: course_title
    description: >
      Course title. For edxorg courses, the int__mitx__courses title of the course_number
      (MITx Online's when the course is on MITx Online), else the latest run's title.
    tests:
    - not_null
  - name: course_description
    description: Course description text
  - name: course_is_live
    description: Boolean indicating if course is currently live/published
  - name: primary_platform
    description: Primary platform hosting this course
    tests:
    - not_null
    - accepted_values:
        values: ['mitxonline', 'mitxpro', 'edxorg', 'ocw', 'residential', 'bootcamps',
          'emeritus', 'global_alumni']
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.platform
  - name: effective_date
    description: >
      Timestamp (UTC) when this SCD Type 2 version became effective. Populated as
      current_timestamp at the time the row is first inserted. Always set; filter
      with
      is_current for the latest version.
    tests:
    - not_null
  - name: end_date
    description: >
      Timestamp (UTC) when this SCD Type 2 version was superseded by a newer version.
      Null for the current active record.
  - name: is_current
    description: Boolean indicating current version
    tests:
    - not_null

  tests:
      # Ensure only one current record per (primary_platform, course_readable_id)
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - primary_platform
      - course_readable_id
      where: "is_current = true"

unit_tests:
- name: test_dim_course_expires_synthesized_course_once_xpro_holds_the_code
  description: >
    An Emeritus course in the target whose prefixed Wrike code now has an xPro course
    drops
    out of the synthesized set. It must be expired, since no replacement row triggers
    the
    expiry. A synthesized course with no xPro course stays, unchanged.
  model: dim_course
  overrides:
    macros:
      is_incremental: true
  given:
  - input: ref('int__mitxonline__courses')
    format: sql
    rows: select cast(null as varchar) as course_readable_id, cast(null as integer)
      as course_id, cast(null as varchar) as course_title, cast(null as varchar) as
      course_number, cast(null as varchar) as course_description, cast(null as boolean)
      as course_is_live where false
  - input: ref('int__mitxpro__courses')
    rows:
    - {course_id: 1, course_readable_id: "course-v1:xPRO+DL", course_title: "Deep\
        \ Learning", course_is_live: true, course_is_external: false}
  - input: ref('int__mitxpro__course_runs')
    rows:
    - {courserun_external_readable_id: "MO-DL-26-12#1", course_id: 1}
  - input: ref('int__edxorg__mitx_courseruns')
    format: sql
    rows: select cast(null as varchar) as course_readable_id, cast(null as varchar)
      as courserun_title, cast(null as varchar) as course_number, cast(null as varchar)
      as courserun_start_date, cast(null as boolean) as courserun_is_published where
      false
  - input: ref('int__mitx__courses')
    format: sql
    rows: select cast(null as varchar) as course_number, cast(null as varchar) as
      course_title, cast(null as boolean) as is_on_mitxonline, cast(null as integer)
      as mitxonline_course_id, cast(null as varchar) as course_readable_id where false
  - input: ref('int__ocw__courses')
    format: sql
    rows: select cast(null as varchar) as course_readable_id, cast(null as varchar)
      as course_title, cast(null as varchar) as course_primary_course_number, cast(null
      as varchar) as course_description, cast(null as boolean) as course_is_live where
      false
  - input: ref('int__bootcamps__course_runs')
    rows: []
  - input: ref('int__bootcamps__courses')
    rows: []
  - input: ref('stg__emeritus__api__bigquery__user_enrollments')
    rows:
    - {courserun_external_readable_id: "MO-DL-27-03#1", courserun_title: "Deep Learning\
        \ (Mar-2027)", courserun_start_on: "2027-03-01", courserun_end_on: "2027-04-01"}
    - {courserun_external_readable_id: "MO-CRT.ES-26-11#1", courserun_title: "CRT\
        \ ES (Nov-2026)", courserun_start_on: "2026-11-01", courserun_end_on: "2026-12-01"}
  - input: ref('stg__global_alumni__api__bigquery__user_enrollments')
    rows: []
  - input: this
    rows:
    - {course_pk: "old_dl", course_readable_id: "MO-DL", primary_platform: "emeritus",
      course_title: "Deep Learning", course_number: "DL", effective_date: "2026-08-11\
        \ 00:46:01", is_current: true}
    - {course_pk: "old_crt", course_readable_id: "MO-CRT.ES", primary_platform: "emeritus",
      course_title: "CRT ES", course_number: "CRT.ES", effective_date: "2026-08-11\
        \ 00:46:01", is_current: true}
  expect:
    rows:
    - {course_readable_id: "MO-DL", primary_platform: "emeritus", is_current: false}
    - {course_readable_id: "course-v1:xPRO+DL", primary_platform: "mitxpro", is_current: true}
- name: test_dim_course_titles_synthesized_course_from_latest_enrollment_row
  description: >
    Two rows of one Emeritus run share the run's start and end dates and differ in
    title.
    The course takes the title of the row dim_course_run picks for the run, the latest
    enrollment, and not the alphabetically first title.
  model: dim_course
  overrides:
    macros:
      is_incremental: false
  given:
  - input: ref('int__mitxonline__courses')
    format: sql
    rows: select cast(null as varchar) as course_readable_id, cast(null as integer)
      as course_id, cast(null as varchar) as course_title, cast(null as varchar) as
      course_number, cast(null as varchar) as course_description, cast(null as boolean)
      as course_is_live where false
  - input: ref('int__mitxpro__courses')
    rows:
    - {course_id: 1, course_readable_id: "course-v1:xPRO+DL", course_title: "Deep\
        \ Learning", course_is_live: true, course_is_external: false}
  - input: ref('int__mitxpro__course_runs')
    rows:
    - {courserun_external_readable_id: "MO-DL-26-12#1", course_id: 1}
  - input: ref('int__edxorg__mitx_courseruns')
    format: sql
    rows: select cast(null as varchar) as course_readable_id, cast(null as varchar)
      as courserun_title, cast(null as varchar) as course_number, cast(null as varchar)
      as courserun_start_date, cast(null as boolean) as courserun_is_published where
      false
  - input: ref('int__mitx__courses')
    format: sql
    rows: select cast(null as varchar) as course_number, cast(null as varchar) as
      course_title, cast(null as boolean) as is_on_mitxonline, cast(null as integer)
      as mitxonline_course_id, cast(null as varchar) as course_readable_id where false
  - input: ref('int__ocw__courses')
    format: sql
    rows: select cast(null as varchar) as course_readable_id, cast(null as varchar)
      as course_title, cast(null as varchar) as course_primary_course_number, cast(null
      as varchar) as course_description, cast(null as boolean) as course_is_live where
      false
  - input: ref('int__bootcamps__course_runs')
    rows: []
  - input: ref('int__bootcamps__courses')
    rows: []
  - input: ref('stg__emeritus__api__bigquery__user_enrollments')
    rows:
    - {courserun_external_readable_id: "MO-LAI-27-03#1", courserun_title: "A Old Title\
        \ (Mar-2027)", courserun_start_on: "2027-03-01", courserun_end_on: "2027-04-01",
      enrollment_created_on: "2026-08-01"}
    - {courserun_external_readable_id: "MO-LAI-27-03#1", courserun_title: "Z New Title\
        \ (Mar-2027)", courserun_start_on: "2027-03-01", courserun_end_on: "2027-04-01",
      enrollment_created_on: "2026-09-01"}
  - input: ref('stg__global_alumni__api__bigquery__user_enrollments')
    rows: []
  expect:
    rows:
    - {course_readable_id: "MO-LAI", primary_platform: "emeritus", course_title: "Z\
        \ New Title", is_current: true}
    - {course_readable_id: "course-v1:xPRO+DL", primary_platform: "mitxpro", course_title: "Deep\
        \ Learning", is_current: true}
- name: test_dim_course_titles_edxorg_course_from_mitx_courses_before_latest_run
  description: >
    An edX.org course takes the int__mitx__courses title of its course_number, trimmed
    on both sides, and both id forms of a course share it. For a duplicated number
    the MITx Online row wins, else the lowest readable id. With no match, or no
    course_number, it keeps the latest run's title.
  model: dim_course
  overrides:
    macros:
      is_incremental: false
  given:
  - input: ref('int__mitxonline__courses')
    format: sql
    rows: select cast(null as varchar) as course_readable_id, cast(null as integer)
      as course_id, cast(null as varchar) as course_title, cast(null as varchar) as
      course_number, cast(null as varchar) as course_description, cast(null as boolean)
      as course_is_live where false
  - input: ref('int__mitxpro__courses')
    rows: []
  - input: ref('int__mitxpro__course_runs')
    rows: []
  - input: ref('int__edxorg__mitx_courseruns')
    rows:
    - {course_readable_id: "course-v1:MITx+6.00.1x", course_number: " 6.00.1x", courserun_title: "Old\
        \ Run Title", courserun_start_date: "2020-01-01", courserun_is_published: true}
    - {course_readable_id: "course-v1:MITx+6.00.1x", course_number: " 6.00.1x", courserun_title: "Latest\
        \ Run Title", courserun_start_date: "2021-01-01", courserun_is_published: true}
    - {course_readable_id: "MITx/6.00.1x/2013", course_number: "6.00.1x", courserun_title: "Other\
        \ Form Run Title", courserun_start_date: "2013-01-01", courserun_is_published: true}
    - {course_readable_id: "course-v1:MITx+UAI.1", course_number: "UAI.1", courserun_title: "UAI\
        \ 1 Run Title", courserun_start_date: "2021-01-01", courserun_is_published: true}
    - {course_readable_id: "course-v1:MITx+UAI.2", course_number: "UAI.2", courserun_title: "UAI\
        \ 2 Run Title", courserun_start_date: "2021-01-01", courserun_is_published: true}
    - {course_readable_id: "course-v1:MITx+7.00x", course_number: "7.00x", courserun_title: "Seven\
        \ Run Title", courserun_start_date: "2021-01-01", courserun_is_published: true}
    - {course_readable_id: "course-v1:MITx+NOMATCH", course_number: "NOMATCH", courserun_title: "No\
        \ Match Latest Run Title", courserun_start_date: "2021-06-01", courserun_is_published: true}
    - {course_readable_id: "course-v1:MITx+NOMATCH", course_number: "NOMATCH", courserun_title: "No\
        \ Match Older Run Title", courserun_start_date: "2020-06-01", courserun_is_published: true}
    - {course_readable_id: "course-v1:MITx+NONUM", course_number: null, courserun_title: "No\
        \ Number Run Title", courserun_start_date: "2021-01-01", courserun_is_published: true}
  - input: ref('int__mitx__courses')
    rows:
    - {course_number: "6.00.1x", course_title: "MITx Online Title", is_on_mitxonline: true,
      mitxonline_course_id: 7, course_readable_id: "course-v1:MITxT+6.00.1x"}
    - {course_number: "UAI.1", course_title: "UAI 1 Offline", is_on_mitxonline: false,
      mitxonline_course_id: null, course_readable_id: "course-v1:MITx+UAI.1a"}
    - {course_number: "UAI.1", course_title: "UAI 1 Online", is_on_mitxonline: true,
      mitxonline_course_id: 9, course_readable_id: "course-v1:MITxT+UAI.1"}
    - {course_number: "UAI.2", course_title: "UAI 2 Second", is_on_mitxonline: false,
      mitxonline_course_id: null, course_readable_id: "course-v1:MITx+UAI.2b"}
    - {course_number: "UAI.2", course_title: "UAI 2 First", is_on_mitxonline: false,
      mitxonline_course_id: null, course_readable_id: "course-v1:MITx+UAI.2a"}
    - {course_number: " 7.00x ", course_title: "Seven Lookup Title", is_on_mitxonline: false,
      mitxonline_course_id: null, course_readable_id: "course-v1:MITx+7.00x"}
  - input: ref('int__ocw__courses')
    format: sql
    rows: select cast(null as varchar) as course_readable_id, cast(null as varchar)
      as course_title, cast(null as varchar) as course_primary_course_number, cast(null
      as varchar) as course_description, cast(null as boolean) as course_is_live where
      false
  - input: ref('int__bootcamps__course_runs')
    rows: []
  - input: ref('int__bootcamps__courses')
    rows: []
  - input: ref('stg__emeritus__api__bigquery__user_enrollments')
    rows: []
  - input: ref('stg__global_alumni__api__bigquery__user_enrollments')
    rows: []
  expect:
    rows:
    - {course_readable_id: "course-v1:MITx+6.00.1x", course_title: "MITx Online Title"}
    - {course_readable_id: "MITx/6.00.1x/2013", course_title: "MITx Online Title"}
    - {course_readable_id: "course-v1:MITx+UAI.1", course_title: "UAI 1 Online"}
    - {course_readable_id: "course-v1:MITx+UAI.2", course_title: "UAI 2 First"}
    - {course_readable_id: "course-v1:MITx+7.00x", course_title: "Seven Lookup Title"}
    - {course_readable_id: "course-v1:MITx+NOMATCH", course_title: "No Match Latest\
        \ Run Title"}
    - {course_readable_id: "course-v1:MITx+NONUM", course_title: "No Number Run Title"}
