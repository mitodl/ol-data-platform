      scope_kind: unit, scope_position: 2, claim_kind: concept, concept_id: sklearn,
      teaching_status: used, concept_kind: tool}
    - {platform: mitxonline, courserun_readable_id: "course-v1:ORG+A.1+1T2026", scope_id: u1,
      scope_kind: unit, scope_position: 1, claim_kind: concept, concept_id: xgboost,
      teaching_status: used, concept_kind: tool}
    - {platform: mitxonline, courserun_readable_id: "course-v1:ORG+A.1+1T2026", scope_id: u2,
      scope_kind: unit, scope_position: 2, claim_kind: concept, concept_id: xgboost,
      teaching_status: used, concept_kind: tool}
    - {platform: mitxonline, courserun_readable_id: "course-v1:ORG+A.1+1T2026", scope_id: u1,
      scope_kind: unit, scope_position: 1, claim_kind: concept, concept_id: regression,
      teaching_status: used, concept_kind: concept}
    - {platform: mitxonline, courserun_readable_id: "course-v1:ORG+A.1+1T2026", scope_id: u2,
      scope_kind: unit, scope_position: 2, claim_kind: concept, concept_id: regression,
      teaching_status: used, concept_kind: concept}
  - input: ref('dim_course_run')
    rows:
    - {courserun_pk: ra, platform: mitxonline, courserun_readable_id: "course-v1:ORG+A.1+1T2026",
      is_current: true}
  - input: ref('dim_course')
    rows: []
  - input: ref('dim_concept')
    rows: []
  expect:
    rows:
    - {courserun_fk: ra, concept_fk: sklearn, relation: requires, tool_status: unresolved,
      passes_support_rule: true}
    - {courserun_fk: ra, concept_fk: xgboost, relation: requires, tool_status: unresolved,
      passes_support_rule: true}
    - {courserun_fk: ra, concept_fk: regression, relation: requires, tool_status: null,
      passes_support_rule: true}
    - {courserun_fk: ra, concept_fk: sklearn, relation: uses, tool_status: null, passes_support_rule: true}
    - {courserun_fk: ra, concept_fk: xgboost, relation: uses, tool_status: null, passes_support_rule: true}
    - {courserun_fk: ra, concept_fk: regression, relation: uses, tool_status: null,
      passes_support_rule: true}

- name: test_bridge_concept_relation_counts_a_courses_platform_copies_once
  description: >
    6.86x has a mitxonline run and an edxorg run, each linked to its own platform's
    dim_course row, and a third run extracted as course-v1:MITx+6.86x+3T2024 that
    is
    not a current dim_course_run. a builds_on b in one unit of each, one course, so
    the edge fails the support rule. c builds_on d in one unit of 6.86x's mitxonline
    run
    and one of 6.36x, two courses, so it passes.
  model: bridge_concept_relation
  given:
  - input: ref('int__courseware__concept_relation_evidence')
    rows:
    - {from_concept_id: a, to_concept_id: b, relation: builds_on, evidence_source: course_sequence,
      platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.86x+1T2026",
      scope_count: 1}
    - {from_concept_id: a, to_concept_id: b, relation: builds_on, evidence_source: course_sequence,
      platform: edxorg, courserun_readable_id: "MITx/6.86x/2T2025", scope_count: 1}
    - {from_concept_id: a, to_concept_id: b, relation: builds_on, evidence_source: course_sequence,
      platform: edxorg, courserun_readable_id: "course-v1:MITx+6.86x+3T2024", scope_count: 1}
    - {from_concept_id: c, to_concept_id: d, relation: builds_on, evidence_source: course_sequence,
      platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.86x+1T2026",
      scope_count: 1}
    - {from_concept_id: c, to_concept_id: d, relation: builds_on, evidence_source: course_sequence,
      platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.36x+1T2026",
      scope_count: 1}
  - input: ref('dim_course_run')
    rows:
    - {courserun_pk: rm, course_fk: cm, platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.86x+1T2026",
      is_current: true}
    - {courserun_pk: re, course_fk: ce, platform: edxorg, courserun_readable_id: "MITx/6.86x/2T2025",
      is_current: true}
    - {courserun_pk: rs, course_fk: cs, platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.36x+1T2026",
      is_current: true}
  - input: ref('dim_course')
    rows:
    - {course_pk: cm, course_readable_id: "course-v1:MITx+6.86x", is_current: true}
    - {course_pk: ce, course_readable_id: "MITx/6.86x", is_current: true}
    - {course_pk: cs, course_readable_id: "course-v1:MITx+6.36x", is_current: true}
  - input: ref('int__courseware__resolved_concept_mentions')
    rows: []
  - input: ref('int__courseware__adjudicated_concept_relations')
    rows: []
  expect:
    rows:
    - {from_concept_fk: a, to_concept_fk: b, scope_support: 3, course_scope_support: 1,
      passes_support_rule: false, support_rule_failure: insufficient_support}
    - {from_concept_fk: c, to_concept_fk: d, scope_support: 2, course_scope_support: 2,
      passes_support_rule: true, support_rule_failure: null}

- name: test_bridge_courserun_concept_counts_a_courses_platform_copies_once
  description: >
    6.86x has a mitxonline run and three edxorg runs. dim_course_run holds edxorg
    runs as {org}/{course}/{run}: one is linked to an edxorg dim_course row
    (MITx/6.86x) and one has no course_fk. The third, extracted as
    course-v1:MITx+6.86x+3T2024, is not a current dim_course_run. x is assumed in
    one unit of each, which coverage counts as one course, so it fails the support
    rule in every run.
    y is assumed in one unit of 6.86x's mitxonline run and one of 6.36x, two
    courses, so it passes in both.
  model: bridge_courserun_concept
  given:
  - input: ref('int__courseware__resolved_concept_mentions')
    rows:
    - {platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.86x+1T2026",
      scope_id: u1, scope_kind: unit, scope_position: 1, claim_kind: assumed_knowledge,
      concept_id: x}
    - {platform: edxorg, courserun_readable_id: "MITx/6.86x/2T2025", scope_id: u1,
      scope_kind: unit, scope_position: 1, claim_kind: assumed_knowledge, concept_id: x}
    - {platform: edxorg, courserun_readable_id: "MITx/6.86x/1T2025", scope_id: u1,
      scope_kind: unit, scope_position: 1, claim_kind: assumed_knowledge, concept_id: x}
    - {platform: edxorg, courserun_readable_id: "course-v1:MITx+6.86x+3T2024", scope_id: u1,
      scope_kind: unit, scope_position: 1, claim_kind: assumed_knowledge, concept_id: x}
    - {platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.86x+1T2026",
      scope_id: u2, scope_kind: unit, scope_position: 2, claim_kind: assumed_knowledge,
      concept_id: y}
    - {platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.36x+1T2026",
      scope_id: u1, scope_kind: unit, scope_position: 1, claim_kind: assumed_knowledge,
      concept_id: y}
  - input: ref('dim_course_run')
    rows:
    - {courserun_pk: rm, course_fk: cm, platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.86x+1T2026",
      is_current: true}
    - {courserun_pk: re, course_fk: ce, platform: edxorg, courserun_readable_id: "MITx/6.86x/2T2025",
      is_current: true}
    - {courserun_pk: rn, course_fk: null, platform: edxorg, courserun_readable_id: "MITx/6.86x/1T2025",
      is_current: true}
    - {courserun_pk: rs, course_fk: cs, platform: mitxonline, courserun_readable_id: "course-v1:MITx+6.36x+1T2026",
      is_current: true}
  - input: ref('dim_course')
    rows:
    - {course_pk: cm, course_readable_id: "course-v1:MITx+6.86x", is_current: true}
    - {course_pk: ce, course_readable_id: "MITx/6.86x", is_current: true}
    - {course_pk: cs, course_readable_id: "course-v1:MITx+6.36x", is_current: true}
  - input: ref('dim_concept')
    rows: []
  expect:
    rows:
    - {courserun_fk: rm, concept_fk: x, course_support: 1, passes_support_rule: false}
    - {courserun_fk: re, concept_fk: x, course_support: 1, passes_support_rule: false}
    - {courserun_fk: rn, concept_fk: x, course_support: 1, passes_support_rule: false}
    - {courserun_fk: null, concept_fk: x, course_support: 1, passes_support_rule: false}
    - {courserun_fk: rm, concept_fk: y, course_support: 2, passes_support_rule: true}
    - {courserun_fk: rs, concept_fk: y, course_support: 2, passes_support_rule: true}
- name: test_bridge_courserun_concept_takes_a_tool_kind_from_dim_concept_for_assumed_only_mentions
  description: >
    Run re names pandas only in assumed_knowledge claims, which carry no kind, so
    its
    own claims don't say whether pandas is a tool and dim_concept.concept_kind (tool)
    does. Its requirement is a tool requirement, assumed from re's claims. Course
    F
    teaches pandas; the next test, without F, gives re the same row.
  model: bridge_courserun_concept
  given:
  - input: ref('int__courseware__resolved_concept_mentions')
    rows:
    - {platform: mitxonline, courserun_readable_id: "course-v1:ORG+E.1+1T2026", scope_id: u1,
      scope_kind: unit, scope_position: 1, claim_kind: assumed_knowledge, concept_id: pandas}
    - {platform: mitxonline, courserun_readable_id: "course-v1:ORG+E.1+1T2026", scope_id: u2,
      scope_kind: unit, scope_position: 2, claim_kind: assumed_knowledge, concept_id: pandas}
    - {platform: mitxonline, courserun_readable_id: "course-v1:ORG+F.1+1T2026", scope_id: u1,
      scope_kind: unit, scope_position: 1, claim_kind: concept, concept_id: pandas,
      teaching_status: taught, concept_kind: tool}
  - input: ref('dim_course_run')
    rows:
    - {courserun_pk: re, platform: mitxonline, courserun_readable_id: "course-v1:ORG+E.1+1T2026",
      is_current: true}
    - {courserun_pk: rf, platform: mitxonline, courserun_readable_id: "course-v1:ORG+F.1+1T2026",
      is_current: true}
  - input: ref('dim_concept')
    rows:
    - {concept_pk: pandas, concept_kind: tool}
  - input: ref('dim_course')
    rows: []
  expect:
    rows:
    - {courserun_fk: re, concept_fk: pandas, relation: requires, tool_status: assumed,
      passes_support_rule: true}
    - {courserun_fk: rf, concept_fk: pandas, relation: teaches, tool_status: null,
      passes_support_rule: true}

