---
version: 2

models:
- name: dim_course_run
  description: >
    Specific course offering/run dimension (SCD Type 2). One course (dim_course) may
    have
    multiple runs over time. This dimension captures the specific instance of a course
    with start/end dates, enrollment windows, etc.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - platform
      - courserun_readable_id
      - is_current
      where: "is_current = true"
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - xpro/app_postgres
  columns:
  - name: courserun_pk
    description: >
      Surrogate primary key. Generated as dbt_utils.generate_surrogate_key(['platform',
      'courserun_readable_id']). Value is stable across SCD2 versions — the same
      courserun_pk appears on both current and historical rows. Always filter with
      is_current=true when looking up by this key.
    tests:
    - not_null
  - name: courserun_readable_id
    description: Business key - unique identifier for course run
    tests:
    - not_null
  - name: course_fk
    description: >
      Foreign key to dim_course. Null when no matching course exists in dim_course
      —
      edxorg runs attempt a join (extracting course_readable_id from courserun_readable_id)
      but will be null until edxorg courses are loaded. emeritus and global_alumni
      runs link to the xPro course that holds their Wrike course code (partner prefix
      included), or else to the emeritus or global_alumni course for that code. Other
      nulls
      indicate courses not yet in dim_course.
    tests:
    - not_null:
        where: "platform != 'edxorg'"
        config:
          severity: warn
    - relationships:
        to: ref('dim_course')
        field: course_pk
        where: "platform != 'edxorg' and course_fk is not null"
  - name: platform_fk
    description: Foreign key to dim_platform (Phase 3+)
  - name: platform
    description: Platform identifier string
    tests:
    - not_null
  - name: courserun_title
    description: Title of this specific course run
  - name: courserun_start_date_key
    description: Foreign key to dim_date for course run start date
    tests:
    - relationships:
        to: ref('dim_date')
        field: date_key
        where: "courserun_start_date_key is not null and courserun_start_date_key\
          \ <= 20301231"
  - name: courserun_end_date_key
    description: Foreign key to dim_date for course run end date
    tests:
    - relationships:
        to: ref('dim_date')
        field: date_key
        where: "courserun_end_date_key is not null and courserun_end_date_key <= 20301231"
  - name: enrollment_start_date_key
    description: Foreign key to dim_date for enrollment period start
  - name: enrollment_end_date_key
    description: Foreign key to dim_date for enrollment period end
  - name: courserun_is_live
    description: Boolean indicating if course run is live. False for bootcamps.
  - name: courserun_created_on
    description: >
      Timestamp when the course run was created in the source system. Populated for
      mitxonline, mitxpro, and residential platforms. Null for edxorg and bootcamps.
  - name: courserun_upgrade_deadline
    description: >
      ISO 8601 timestamp of the deadline for upgrading from audit to verified enrollment
      on this course run. Populated for MITxOnline course runs directly from the source.
      Also populated for edxorg course runs via the MicroMasters course run records
      (joined on courserun_edxorg_readable_id). Null for MITxPro, residential, and
      bootcamp platforms.
  - name: semester
    description: >
      Academic term identifier for a MicroMasters proctored exam run (e.g. "2T2022").
      Populated only for MITxOnline course runs that correspond to a MicroMasters
      exam
      run. Null for all other platforms and non-exam MITxOnline course runs.
  - name: passing_grade
    data_type: double
    description: >
      Passing score threshold (0.0–1.0) set per MicroMasters proctored exam run.
      Populated only for MITxOnline course runs that correspond to a MicroMasters
      exam
      run. Null for all other platforms and non-exam MITxOnline course runs. Note:
      a
      stored value of null and an actual passing grade of 0.0 are distinct; -1.0 is
      used as the SCD2 change-detection sentinel to distinguish them.
  - name: effective_date
    description: >
      Timestamp (UTC) when this SCD Type 2 version became effective. Always set for
      the current record. Filter with is_current to get the active version.
    tests:
    - not_null
  - name: end_date
    description: >
      Timestamp (UTC) when this SCD Type 2 version was superseded. Null for the current
      active record.
  - name: is_current
    description: Boolean indicating current version
    tests:
    - not_null
  - name: courserun_start_on
    description: timestamp, the start date/time of the course run (raw timestamp column)
  - name: courserun_end_on
    description: timestamp, the end date/time of the course run (raw timestamp column)
  - name: enrollment_start
    description: timestamp, the start of the enrollment window for this course run
  - name: enrollment_end
    description: timestamp, the end of the enrollment window for this course run
  - name: source_id
    description: string, source system identifier for this course run record

unit_tests:
- name: test_dim_course_run_merge_is_idempotent_under_duplicate_copies
  description: >
    Regression test for 2026-09-01, when staging briefly passed duplicate Airbyte
    copies
    of mitxonline course runs through. Each copy became its own current row, and the
    expire join multiplied existing x incoming rows on every later change. With two
    identical current rows already in the target and two identical copies of a changed
    upstream row, the batch must hold exactly one new current row and one expired
    row.
  model: dim_course_run
  overrides:
    macros:
      is_incremental: true
  given:
  - input: ref('stg__micromasters__app__postgres__courses_courserun')
    rows: []
  - input: ref('stg__micromasters__app__postgres__exams_examrun')
    rows: []
  - input: ref('int__mitxonline__course_runs')
    rows:
    - &changed_run
      courserun_readable_id: "course-v1:MITxT+CTL.SC3x+3T2026"
      courserun_id: 2682
      course_id: 1
      courserun_title: "Supply Chain Dynamics"
      courserun_start_on: "2026-09-16T15:00:00.000"
      courserun_end_on: "2026-12-25T15:00:00.000"
      courserun_is_live: true
    - *changed_run
  - input: ref('stg__mitxonline__app__postgres__courses_course')
    rows: []
  - input: ref('int__mitxpro__course_runs')
    rows: []
  - input: ref('int__mitxpro__courses')
    rows: []
  - input: ref('stg__emeritus__api__bigquery__user_enrollments')
    rows: []
  - input: ref('stg__global_alumni__api__bigquery__user_enrollments')
    rows: []
  - input: ref('int__edxorg__mitx_courseruns')
    rows: []
  - input: ref('int__mitxresidential__courseruns')
    rows: []
  - input: ref('int__bootcamps__course_runs')
    rows: []
  - input: ref('dim_course')
    rows: []
  - input: ref('dim_platform')
    rows: []
  - input: this
    rows:
    - &current_version
      courserun_readable_id: "course-v1:MITxT+CTL.SC3x+3T2026"
      platform: "mitxonline"
      courserun_title: "Supply Chain Dynamics"
      courserun_start_on: "2026-09-16T15:00:00.000"
      courserun_end_on: "2026-12-11T15:00:00.000"
      courserun_is_live: true
      effective_date: "2026-08-11 00:46:01"
      is_current: true
    - *current_version
  expect:
    rows:
    - courserun_readable_id: "course-v1:MITxT+CTL.SC3x+3T2026"
      courserun_end_on: "2026-12-25T15:00:00.000"
      is_current: true
    - courserun_readable_id: "course-v1:MITxT+CTL.SC3x+3T2026"
      courserun_end_on: "2026-12-11T15:00:00.000"
      is_current: false
- name: test_dim_course_run_links_emeritus_and_global_alumni_runs_by_prefixed_code
  description: >
    An Emeritus or Global Alumni run takes the xPro course that holds its prefixed
    Wrike
    code, even when that course is not external (MO-DL is xPRO+DL, not MXP-DL's xPRO+DLx).
    A code with no xPro course links to the synthesized course for the code. A code
    that
    xPro holds as a run is that run, not a run of its own.
  model: dim_course_run
  overrides:
    macros:
      is_incremental: false
  given:
  - input: ref('stg__micromasters__app__postgres__courses_courserun')
    rows: []
  - input: ref('stg__micromasters__app__postgres__exams_examrun')
    rows: []
  - input: ref('int__mitxonline__course_runs')
    rows: []
  - input: ref('stg__mitxonline__app__postgres__courses_course')
    rows: []
  - input: ref('int__mitxpro__course_runs')
    rows:
    - {courserun_readable_id: "course-v1:xPRO+DL+R1", courserun_external_readable_id: "MO-DL-26-09#1",
      course_id: 1}
    - {courserun_readable_id: "course-v1:xPRO+DLx+R1", courserun_external_readable_id: "MXP-DL-26-09#1",
      course_id: 2}
  - input: ref('int__mitxpro__courses')
    rows:
    - {course_id: 1, course_readable_id: "course-v1:xPRO+DL", course_is_external: false}
    - {course_id: 2, course_readable_id: "course-v1:xPRO+DLx", course_is_external: true}
  - input: ref('stg__emeritus__api__bigquery__user_enrollments')
    rows:
    - {courserun_external_readable_id: "MO-DL-26-09#1", courserun_title: "DL (Sep-2026)",
      enrollment_created_on: "2026-08-01T00:00:00"}
    - {courserun_external_readable_id: "MO-DL-26-12#1", courserun_title: "DL (Dec-2026)",
      enrollment_created_on: "2026-08-01T00:00:00"}
    - {courserun_external_readable_id: "MO-CRT.ES-26-11#1", courserun_title: "CRT\
        \ ES (Nov-2026)", enrollment_created_on: "2026-08-01T00:00:00"}
  - input: ref('stg__global_alumni__api__bigquery__user_enrollments')
    rows:
    - {courserun_external_readable_id: "MXP-DL-26-12#1", courserun_title: "DL (Dec-2026)"}
  - input: ref('int__edxorg__mitx_courseruns')
    rows: []
  - input: ref('int__mitxresidential__courseruns')
    rows: []
  - input: ref('int__bootcamps__course_runs')
    rows: []
  - input: ref('dim_course')
    rows:
    - {course_pk: "xpro_dl", course_readable_id: "course-v1:xPRO+DL", primary_platform: "mitxpro",
      is_current: true}
    - {course_pk: "xpro_dlx", course_readable_id: "course-v1:xPRO+DLx", primary_platform: "mitxpro",
      is_current: true}
    - {course_pk: "emeritus_crt_es", course_readable_id: "MO-CRT.ES", primary_platform: "emeritus",
      is_current: true}
  - input: ref('dim_platform')
    rows: []
  expect:
    rows:
    - {courserun_readable_id: "MO-DL-26-12#1", platform: "emeritus", course_fk: "xpro_dl"}
    - {courserun_readable_id: "MO-CRT.ES-26-11#1", platform: "emeritus", course_fk: "emeritus_crt_es"}
    - {courserun_readable_id: "MXP-DL-26-12#1", platform: "global_alumni", course_fk: "xpro_dlx"}
    - {courserun_readable_id: "course-v1:xPRO+DL+R1", platform: "mitxpro", course_fk: "xpro_dl"}
    - {courserun_readable_id: "course-v1:xPRO+DLx+R1", platform: "mitxpro", course_fk: "xpro_dlx"}
- name: test_dim_course_run_expires_emeritus_run_that_xpro_now_holds
  description: >
    An Emeritus run in the target whose code has since become an xPro run drops out
    of the
    source. It must be expired, since no replacement row triggers the expiry. An Emeritus
    run that stays is re-versioned when its course moves from the synthesized course
    to an
    xPro course, though none of its own attributes changed.
  model: dim_course_run
  overrides:
    macros:
      is_incremental: true
  given:
  - input: ref('stg__micromasters__app__postgres__courses_courserun')
    rows: []
  - input: ref('stg__micromasters__app__postgres__exams_examrun')
    rows: []
  - input: ref('int__mitxonline__course_runs')
    rows: []
  - input: ref('stg__mitxonline__app__postgres__courses_course')
    rows: []
  - input: ref('int__mitxpro__course_runs')
    rows:
    - {courserun_readable_id: "course-v1:xPRO+DL+R1", courserun_external_readable_id: "MO-DL-26-09#1",
      course_id: 1}
    - {courserun_readable_id: "course-v1:xPRO+DL+R2", courserun_external_readable_id: "MO-DL-26-12#1",
      course_id: 1}
  - input: ref('int__mitxpro__courses')
    rows:
    - {course_id: 1, course_readable_id: "course-v1:xPRO+DL", course_is_external: false}
  - input: ref('stg__emeritus__api__bigquery__user_enrollments')
    rows:
    - {courserun_external_readable_id: "MO-DL-26-09#1", courserun_title: "DL (Sep-2026)",
      enrollment_created_on: "2026-08-01T00:00:00"}
    - {courserun_external_readable_id: "MO-DL-27-03#1", courserun_title: "DL (Mar-2027)",
      enrollment_created_on: "2026-08-01T00:00:00"}
  - input: ref('stg__global_alumni__api__bigquery__user_enrollments')
    rows: []
  - input: ref('int__edxorg__mitx_courseruns')
    rows: []
  - input: ref('int__mitxresidential__courseruns')
    rows: []
  - input: ref('int__bootcamps__course_runs')
    rows: []
  - input: ref('dim_course')
    rows:
    - {course_pk: "xpro_dl", course_readable_id: "course-v1:xPRO+DL", primary_platform: "mitxpro",
      is_current: true}
  - input: ref('dim_platform')
    rows: []
  - input: this
    rows:
    - {courserun_pk: "old_a", courserun_readable_id: "MO-DL-26-12#1", platform: "emeritus",
      courserun_title: "DL (Dec-2026)", effective_date: "2026-08-11 00:46:01", is_current: true}
    - {courserun_pk: "old_b", courserun_readable_id: "MO-DL-27-03#1", platform: "emeritus",
      courserun_title: "DL (Mar-2027)", course_fk: "emeritus_dl", effective_date: "2026-08-11\
        \ 00:46:01", is_current: true}
  expect:
    rows:
    - {courserun_readable_id: "MO-DL-26-12#1", platform: "emeritus", course_fk: null,
      is_current: false}
    - {courserun_readable_id: "MO-DL-27-03#1", platform: "emeritus", course_fk: "xpro_dl",
      is_current: true}
    - {courserun_readable_id: "MO-DL-27-03#1", platform: "emeritus", course_fk: "emeritus_dl",
      is_current: false}
    - {courserun_readable_id: "course-v1:xPRO+DL+R1", platform: "mitxpro", course_fk: "xpro_dl",
      is_current: true}
    - {courserun_readable_id: "course-v1:xPRO+DL+R2", platform: "mitxpro", course_fk: "xpro_dl",
      is_current: true}
