- name: test_afact_learner_courserun_content_progress_counts_units
  description: >
    A unit counts when every item in it is complete. A pool worth 1 is
    complete with one of its blocks done, and two done still count once, so
    vert-1 is complete for ada. A unit with one of two blocks done does not
    count, and a learner with only such a unit reads 0. A completion of a block
    that is no longer in the structure, a completion value below 1, and a
    learner with no dim_user row do not count. Open edX user ids are matched
    per platform. An id on two dim_user rows credits one of them. In a run with
    two track groups a learner has a row for each, counted against the units
    and blocks that group is shown. A unit with nothing for the group to
    complete counts for every learner with a completion in the run, including
    one whose only completion is of a block no longer in the structure.
  model: afact_learner_courserun_content_progress
