- name: test_afact_learner_courserun_progress_content_progress
  description: >
    content_progress is the learner's completed units over the run's total. The
    total counts each vertical once however many blocks it holds, a learner
    with nothing completed reads 0 rather than null, and a run with no course
    structure reads null. In a run with a track-restricted unit, the total and
    the completed units are those of the learner's enrollment track: a verified
    learner is counted against the verified group, and an audit learner or one
    whose enrollment is inactive against group 0.
  model: afact_learner_courserun_progress
  given:
  - input: ref('tfact_enrollment')
    rows:
    - {enrollment_id: "1", enrollment_type: course, user_fk: halfway, courserun_fk: run-1,
      platform: mitxonline}
    - {enrollment_id: "2", enrollment_type: course, user_fk: nothing_done, courserun_fk: run-1,
      platform: mitxonline}
    - {enrollment_id: "3", enrollment_type: course, user_fk: no_structure, courserun_fk: run-2,
      platform: edxorg}
    - {enrollment_id: "4", enrollment_type: course, user_fk: verified, courserun_fk: run-3,
      platform: mitxonline, enrollment_mode: verified, enrollment_is_active: true}
    - {enrollment_id: "5", enrollment_type: course, user_fk: audit, courserun_fk: run-3,
      platform: mitxonline, enrollment_mode: audit, enrollment_is_active: true}
    - {enrollment_id: "6", enrollment_type: course, user_fk: unenrolled, courserun_fk: run-3,
      platform: mitxonline, enrollment_mode: verified, enrollment_is_active: false}
  - input: ref('tfact_grade')
    rows: []
  - input: ref('tfact_certificate')
    rows: []
  - input: ref('afact_learner_courserun_daily_activity')
    rows: []
  - input: ref('dim_date')
    rows: []
  # Five blocks in two verticals: a total of 2.
  - input: ref('dim_course_content_progress_block')
    rows:
    - {courserun_fk: run-1, enrollment_track_group_id: 0, block_id: html-1, vertical_block_id: vert-1}
    - {courserun_fk: run-1, enrollment_track_group_id: 0, block_id: video-1, vertical_block_id: vert-1}
    - {courserun_fk: run-1, enrollment_track_group_id: 0, block_id: problem-1, vertical_block_id: vert-2}
    - {courserun_fk: run-1, enrollment_track_group_id: 0, block_id: problem-2, vertical_block_id: vert-2}
    - {courserun_fk: run-1, enrollment_track_group_id: 0, block_id: problem-3, vertical_block_id: vert-2}
    - {courserun_fk: null, enrollment_track_group_id: 0, block_id: html-9, vertical_block_id: vert-9}
    # run-3 shows vert-paid to the verified group (2) only.
    - {courserun_fk: run-3, enrollment_track_group_id: 0, block_id: html-open, vertical_block_id: vert-open}
    - {courserun_fk: run-3, enrollment_track_group_id: 2, block_id: html-open, vertical_block_id: vert-open}
    - {courserun_fk: run-3, enrollment_track_group_id: 2, block_id: html-paid, vertical_block_id: vert-paid}
  - input: ref('afact_learner_courserun_content_progress')
    rows:
    - {user_fk: halfway, courserun_fk: run-1, enrollment_track_group_id: 0, content_units_completed: 1}
    # Each run-3 learner has a row per track group; only their own group's is read.
    - {user_fk: verified, courserun_fk: run-3, enrollment_track_group_id: 0, content_units_completed: 1}
    - {user_fk: verified, courserun_fk: run-3, enrollment_track_group_id: 2, content_units_completed: 2}
    - {user_fk: audit, courserun_fk: run-3, enrollment_track_group_id: 0, content_units_completed: 1}
    - {user_fk: audit, courserun_fk: run-3, enrollment_track_group_id: 2, content_units_completed: 0}
  expect:
    rows:
    - {user_fk: halfway, content_units_completed: 1, content_units_total: 2, content_progress: 0.5}
    - {user_fk: nothing_done, content_units_completed: 0, content_units_total: 2,
      content_progress: 0.0}
    - {user_fk: no_structure, content_units_completed: null, content_units_total: null,
      content_progress: null}
    - {user_fk: verified, content_units_completed: 2, content_units_total: 2, content_progress: 1.0}
    - {user_fk: audit, content_units_completed: 1, content_units_total: 1, content_progress: 1.0}
    - {user_fk: unenrolled, content_units_completed: 0, content_units_total: 1, content_progress: 0.0}
- name: test_dim_course_content_progress_block_units
  description: >
    Pins which blocks count toward progress, the unit each is in and what each
    item weighs. Containers and discussions do not count. A block under a
    staff-only chapter, sequential or vertical does not count, including
    through a pool. A pool's children share one item weighing max_count: 1 when
    unset, capped at the number of children, and every child when negative. A
    block in a vertical nested in a split_test belongs to the outer vertical.
    Each unit has a row of its own weighing 0, so a discussion-only unit is
    still listed. Superseded structure versions and edX.org structures are
    ignored. A run with an enrollment track restriction has rows for the group
    it names and for group 0: a restricted block or unit is listed for the
    named group only, and an empty restriction or one on another partition
    restricts nothing.
  model: dim_course_content_progress_block
  given:
  - input: ref('dim_course_run')
    rows:
    - {courserun_pk: run-1, courserun_readable_id: "course-v1:A+B+C", platform: mitxonline,
      is_current: true}
