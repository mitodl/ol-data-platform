---
version: 2

models:
- name: afact_video_engagement
  description: Aggregate fact table summarizing video engagement by video, learner,
    and a courserun.
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/course_structure
      - mitx/mysql
      - mitx/tracking_logs
      - mitxonline/app_postgres
      - mitxonline/course_structure
      - mitxonline/mysql
      - mitxonline/tracking_logs
      - xpro/app_postgres
      - xpro/course_structure
      - xpro/mysql
      - xpro/tracking_logs
  columns:
  - name: platform_fk
    description: string, foreign key to dim_platform
  - name: user_fk
    description: string, foreign key to dim_user, referencing the user who triggered
      the event
  - name: platform
    description: string, name of the platform
  - name: video_id
    description: string, id for the video
  - name: openedx_user_id
    description: int, user ID on the corresponding open edX platform
  - name: user_username
    description: str, username of the open edX user who caused the event to be emitted.
  - name: courserun_readable_id
    description: string, foreign key to dim_course_content, referencing the edX course
      run ID
    tests:
    - not_null
  - name: video_title
    description: string, title of the video
  - name: unit_title
    description: string, name of the unit
  - name: unit_content_fk
    description: string, foreign key to the content dim for the unit
  - name: subsection_title
    description: string, name of the subsection
  - name: subsection_content_fk
    description: string, foreign key to the content dim for the subsection
  - name: section_title
    description: string, name of the section
  - name: section_content_fk
    description: string, foreign key to the content dim for the section
  - name: estimated_time_played
    description: string, estimated time the video was played
  - name: latest_activity_timestamp
    description: timestamp, date and time of the last video activity for this learner
      on this video
  - name: video_played_count
    description: integer, will be 1 if the learner played the video otherwise it will
      be 0
  - name: video_completed_count
    description: integer, will be 1 if the learner completed the video otherwise it
      will be 0

- name: dim_platform
  description: Platform information about the technical system that a given event
    is executed within the context of.
  columns:
  - name: platform_pk
    description: string, primary key for this table
    tests:
    - not_null
    - unique
  - name: platform_readable_id
    description: string, readable id of the platform. e.g. mitxonline, mitxpro, edxorg,
      residential.
    tests:
    - not_null
    - unique
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.platform
  - name: platform_name
    description: string, name of the platform
    tests:
    - not_null
    - unique
  - name: platform_description
    description: string, description of the platform
    tests:
    - not_null
  - name: platform_domain
    description: string, domain name of the platform, e.g. mitxonline.mit.edu
    tests:
    - not_null

- name: dim_video
  description: video metadata across the Open edX platforms
  config:
    meta:
      qa_branches:
      - mitx/course_structure
      - mitx/mysql
      - mitxonline/course_structure
      - mitxonline/mysql
      - xpro/course_structure
      - xpro/mysql
  columns:
  - name: video_block_pk
    description: string, primary key for this table, formatted as block-v1:{org}+{course}+{run}type@video+block@{hash
      code}
    tests:
    - not_null
  - name: platform
    description: string, the platform on which this video exists. Possible values
      are mitxonline, mitxpro, edxorg, residential. NOTE - video_block_pk is NOT globally
      unique; it must be paired with platform to uniquely identify a video.
    tests:
    - not_null
  - name: content_block_fk
    description: string, foreign key to dim_course_content
    tests:
    - not_null
  - name: courserun_readable_id
    description: string, the edX course ID formatted as course-v1:{org}+{course code}+{run_tag}
    tests:
    - not_null
  - name: video_name
    description: string, name of the video
  - name: start_date
    description: timestamp, start date
  - name: due_date
    description: timestamp, due date
  - name: edx_video_id
    description: string, internal edx video ID on the open edX platform
  - name: html5_sources
    description: array, html5 video sources
  - name: transcripts
    description: json, video transcripts
  - name: video_duration
    description: float, duration of video in seconds
  - name: video_edx_uuid
    description: string, edX UUID of the video
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["platform", "video_block_pk"]

- name: dim_problem
  description: problem metadata across the Open edX platforms
  config:
    meta:
      qa_branches:
      - mitx/course_structure
      - mitx/tracking_logs
      - mitxonline/course_structure
      - mitxonline/tracking_logs
      - xpro/course_structure
      - xpro/tracking_logs
  columns:
  - name: problem_block_pk
    description: string, primary key for this table, formatted as block-v1:{org}+{course}+{run}type@problem+block@{hash
      code}
    tests:
    - not_null
  - name: platform
    description: string, the platform on which this problem exists. Possible values
      are mitxonline, mitxpro, edxorg, residential. NOTE - problem_block_pk is NOT
      globally unique; it must be paired with platform to uniquely identify a problem.
    tests:
    - not_null
  - name: content_block_fk
    description: string, foreign key to dim_course_content
    tests:
    - not_null
  - name: courserun_readable_id
    description: string, the edX course ID formatted as course-v1:{org}+{course code}+{run_tag}
    tests:
    - not_null
  - name: problem_name
    description: string, name of the problem
  - name: markdown
    description: string, markdown content of the problem
  - name: max_attempts
    description: int, maximum number of attempts allowed for this problem
  - name: start_date
    description: timestamp, start date of the problem
  - name: due_date
    description: timestamp, due date of the problem
  - name: weight
    description: int, weight of the problem in the course
  - name: problem_types
    description: array, the types of problem in the course. values are a combination
      of numericalresponse, multiplechoiceresponse, customresponse, choiceresponse,
      etc.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["platform", "problem_block_pk"]

- name: dim_discussion_topic
  description: discussion topics across the Open edX platforms
  config:
    meta:
      qa_branches:
      - mitx/course_structure
      - mitxonline/course_structure
      - xpro/course_structure
  columns:
  - name: discussion_topic_pk
    description: string, primary key for this table
    tests:
    - not_null
    - unique
  - name: platform
    description: string, the platform on which this discussion topic exists. Possible
      values are mitxonline, mitxpro, edxorg, residential.
    tests:
    - not_null
  - name: commentable_id
    description: string, identifier for the specific discussion component or top-level,
      course-wide discussion
    tests:
    - not_null
  - name: content_block_fk
    description: string, foreign key to dim_course_content
    tests:
    - not_null
  - name: courserun_readable_id
    description: string, the edX course ID formatted as course-v1:{org}+{course code}+{run_tag}
    tests:
    - not_null
  - name: topic_name
    description: string, topic name
  - name: category_name
    description: string, topic category name
  - name: discussion_type
    description: string, indicates whether the topic is a course-wide discussion or
      a component-specific discussion. Possible values are course-wide and component-specific.
  - name: discussion_block_pk
    description: string, primary key for discussion block

- name: dim_course_content
  description: Slowly Changing Dimension model for course content, including courses,
    chapters, subsections, problems, videos, and other contents across the Open edX
    platforms.
  config:
    meta:
      qa_branches:
      - mitx/course_structure
      - mitxonline/course_structure
      - xpro/course_structure
  columns:
  - name: content_block_pk
    description: string, primary key for this table
    tests:
    - not_null
    - unique
  - name: platform
    description: "string, the platform that owns this course content block. Possible\
      \ values: mitxonline, mitxpro, edxorg, residential. IMPORTANT: courserun_readable_id\
      \ is NOT globally unique across platforms - the same readable ID can appear\
      \ on multiple platforms (e.g. a course migrated from edxorg to mitxonline).\
      \ Always pair courserun_readable_id with platform when joining to other tables."
    tests:
    - not_null
    - accepted_values:
        values: ["mitxonline", "mitxpro", "edxorg", "residential"]
  - name: courserun_readable_id
    description: string, the edX course ID formatted as course-v1:{org}+{course code}+{run_tag}
      for courses on MITxOnline, xPro and Residential platform, {org}/{course}/{run_tag}
      for edX.org courses
    tests:
    - not_null
  - name: block_index
    description: int, sequence number giving order in which this block content appears
      within the course
    tests:
    - not_null
  - name: block_id
    description: string, a unique identifier for each content block within the course,
      formatted as block-v1:{org}+{course}+{run}type@{block type}+block@{hash code}
    tests:
    - not_null
  - name: parent_block_id
    description: string, parent content block ID, same format as content_block_id.
  - name: chapter_block_id
    description: str, block id of chapter within which this child block belongs to.
      Null for course blocks.
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        arguments:
          row_condition: "block_category != 'course'"
  - name: sequential_block_id
    description: str, block id of sequential/unit within which this child block belongs
      to. Null for course and chapter blocks.
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        arguments:
          row_condition: "block_category not in ('course', 'chapter')"
  - name: block_category
    description: string, category/type of the content block. Possible values are course,
      chapter, sequential, vertical, discussion, html, problem, video, etc.
    tests:
    - not_null
  - name: block_title
    description: string, title of the course content block. It is the name field for
      the section, subsection, or unit on the Studio 'Course Outline' page.
  - name: block_metadata
    description: string, a JSON string representing the metadata field of the course
      content block. It provides additional information about this block, and different
      block types may have different member fields within the metadata.
    tests:
    - not_null
  - name: retrieved_at
    description: timestamp, date and time indicating when the content block was last
      retrieved from sources.
    tests:
    - not_null
  - name: is_latest
    description: boolean, indicating if the course content is the latest version
    tests:
    - not_null
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["platform", "courserun_readable_id", "block_id"]
        row_condition: "is_latest = true"
- name: dim_user
  description: Eventually a dimensional model for users from different platforms.
    It will contain one record for a user that's potentially a part of different platforms
    where we are able to see they are the same person.
  config:
    meta:
      # Tier1 because it carries a data contract (contracts/dim_user.yaml).
      openmetadata:
        owner: data-platform
        tier: Tier.Tier1
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/mysql
      - xpro/app_postgres
      - xpro/mysql
  columns:
  - name: user_pk
    data_type: varchar
    description: string, primary key for this user dim table. The grain is still one
      row per shared email, but the key's value is derived from durable identifiers
      - the user_global_id when the group has one, otherwise the highest-ranked platform
      account id in the group - so it no longer changes when a user edits their email
      address.
    tests:
    - not_null
    - unique
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.user
  - name: user_pk_source
    description: string, which identifier user_pk was derived from - global when the
      group has a user_global_id, the platform name when it was keyed off a source
      account id, or email when no durable id was available anywhere in the group.
      Rows with email are the only ones that still re-key when the user edits their
      email address. mitxonline covers accounts keyed off either the application user
      id or the open edX user id.
    tests:
    - not_null
    - accepted_values:
        values: ['global', 'mitlearn', 'mitxonline', 'edxorg', 'micromasters', 'mitxpro',
          'residential', 'bootcamps', 'emeritus', 'global_alumni', 'email']
  - name: user_global_id
    data_type: varchar
    description: string, a unique identifier for the user across all platforms
    tests:
    - unique
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: mitlearn_user_id
    data_type: bigint
    description: int, a unique identifier for the user on the MIT Learn
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: mitlearn_openedx_user_id
    description: string, user id on the MIT Learn open edX platform
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: mitxonline_openedx_user_id
    data_type: bigint
    description: string, openedx user id. This is deprecated in favor of mitlearn_openedx_user_id.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: mitxonline_application_user_id
    data_type: bigint
    description: int, user id on MITxOnline application
    tests:
    - unique:
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: user_mitxonline_username
    description: string, username on the MITx Online open edx platform. If user doesn't
      have an open edX account, it defaults to username on the MITx Online application,
      which is their email address.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: mitxpro_openedx_user_id
    description: int, openedx user id for MITx Pro
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: bootcamps_application_user_id
    description: int, user id on Bootcamps application
    tests:
    - unique:
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: mitxpro_application_user_id
    data_type: bigint
    description: int, user id on MITx Pro application
    tests:
    - unique:
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: user_mitxpro_username
    description: string, username on MITx Pro
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: residential_openedx_user_id
    description: int, openedx user id for MITx Residential
    tests:
    - unique:
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: user_residential_username
    description: string, username on MITx Residential
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: user_bootcamps_username
    description: string, username on Bootcamps
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: edxorg_openedx_user_id
    data_type: bigint
    description: int, openedx user id for edX.org
    tests:
    - unique:
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: user_edxorg_username
    description: string, username on edX.org
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: emeritus_user_id
    description: string, user id on Emeritus platform
    tests:
    - unique:
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: global_alumni_user_id
    description: string, user id on Global Alumni platform
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: emeritus_identity_key
    description: string, identifies the user's Emeritus account - the Emeritus user
      id, or the email as Emeritus sent it (not lowercased) when Emeritus sent no
      user id. Null if the user has no Emeritus account. May contain an email address.
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        arguments:
          row_condition: "emeritus_user_id is not null"
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: global_alumni_identity_key
    description: string, identifies the user's Global Alumni account - the email as
      Global Alumni sent it (not lowercased), falling back to the user id. Email comes
      first because a Global Alumni user id is not unique per person. Null if the
      user has no Global Alumni account.
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        arguments:
          row_condition: "global_alumni_user_id is not null"
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: email
    data_type: varchar
    description: string, user email on the corresponding platform including xpro,
      bootcamps, edX.org, MITx Online, and Residential MITx.
    tests:
    - not_null
    - unique:
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
          - open-learning.ferpa-classification.directory-information
  - name: full_name
    description: str, user full name. Very small number of edX.org users have blank
      full name, their name couldn't be populated from other sources if they don't
      have their accounts linked on MicroMasters.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
          - open-learning.ferpa-classification.directory-information
  - name: address_country
    description: str, country code provided by the user on the corresponding platform
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
  - name: highest_education
    description: str, user's level of education
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
  - name: gender
    description: str, Gender selected by the user on their profile on the corresponding
      platform
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
          - open-learning.ferpa-classification.education-record
  - name: birth_year
    description: int, user's birth year
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
  - name: company
    description: str, user's company
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
          - open-learning.ferpa-classification.education-record
  - name: job_title
    description: str, user's job title
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
          - open-learning.ferpa-classification.education-record
  - name: industry
    description: str, user's job industry
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
          - open-learning.ferpa-classification.education-record
  - name: topic_interests
    description: array, a list of topic interests selected by MIT Learn users on their
      profile. e.g. Art, Design & Architecture, Health & Medicine, Business & Management
  - name: delivery_preference
    description: array, a list of course format that MIT Learn users prefer to take
      courses in. e.g. 'online', 'in-person', 'hybrid', 'offline'.
  - name: goals
    description: array, learning goals or objectives set by MIT Learn users
  - name: certificate_desired
    description: boolean, indicating whether the MIT Learn user wants to receive certificates
      upon course completion
  - name: completed_onboarding
    description: boolean, indicating whether the user has completed the platform onboarding
      process on MIT Learn
  - name: user_is_active_on_bootcamps
    description: boolean, indicating if user's account is active on Bootcamps.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-account
  - name: user_is_active_on_mitlearn
    description: boolean, indicating if user's account is active on MIT Learn.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-account
  - name: user_joined_on_mitlearn
    description: str, date and time when the user joined on MIT Learn.
  - name: user_is_active_on_mitxonline
    description: boolean, indicating if user's account is active on MITx Online.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-account
  - name: user_is_active_on_edxorg
    description: boolean, indicating if user's account is active on edX.org.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-account
  - name: user_is_active_on_mitxpro
    description: boolean, indicating if user's account is active on MITx Pro.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-account
  - name: user_is_active_on_residential
    description: boolean, indicating if user's account is active on Residential MITx.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-account
  - name: user_joined_on_mitxonline
    description: str, when the user joined on MITx Online.
  - name: user_joined_on_edxorg
    description: str, when the user joined on edX.org.
  - name: user_joined_on_mitxpro
    description: str, when the user joined on MITx Pro.
  - name: user_joined_on_residential
    description: str, when the user joined on Residential MITx.
  - name: user_joined_on_bootcamps
    description: str, when the user joined on Bootcamps.
  - name: micromasters_user_id
    description: int, user ID on the MicroMasters platform
    tests:
    - unique:
        config:
          error_if: ">0"
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: address_state
    description: str, state or territory code from the user's legal address. Populated
      for MITxOnline and edX.org users (sourced via int__mitx__users, which coalesces
      MITxOnline, edX.org, and MicroMasters records), MITx Pro users, and Bootcamps
      users. Null for Emeritus, Global Alumni, and Residential users.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
  - name: user_street_address
    description: str, street address. Person-level - street address, city and postal
      code are taken together from one of the user's accounts, so all three describe
      the same address. Accounts are ordered as for the demographic columns, by the
      latest join date across the user's linked platforms, ties broken by platform
      and then platform id, and the first one with a street address or postal code
      is used. Emeritus and Global Alumni accounts have no join date, so they rank
      last. Populated for edX.org, MITx Pro, Bootcamps, Emeritus, Global Alumni and
      MicroMasters accounts.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.direct-identifier
  - name: user_address_city
    description: str, city of the address in user_street_address. When no account
      has a street address or postal code, it is the city alone. MITx Residential
      accounts carry only a city.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
  - name: user_address_postal_code
    description: str, postal code of the address in user_street_address.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.identifiability.indirect-identifier
  - name: latest_income_usd
    description: numeric, the most recent income amount in USD from the user's flexible
      pricing (financial aid) application on MITxOnline. Null if the user has never
      submitted a financial aid application.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.ferpa-classification.education-record
  - name: latest_original_income
    description: numeric, the most recent income amount in the user's original currency
      from their flexible pricing application on MITxOnline. Null if no application
      exists.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.ferpa-classification.education-record
  - name: latest_original_currency
    description: str, the currency code (e.g. USD, EUR) of the original income reported
      in the user's most recent flexible pricing application on MITxOnline. Null if
