      completion_status: not_started
      is_in_progress: false
      is_not_started: true
      last_active_on:
      needs_attention_since: "2024-01-10"
    - user_fk: no_enrollment_date
      is_certified: false
      completion_status: not_started
      is_in_progress: false
      is_not_started: true
      last_active_on:
      needs_attention_since: "1970-01-01"
