  expect:
    rows:
    - user_pk: 14ad7bc9bcef70fc636e037934751877  # pragma: allowlist secret
      user_pk_source: global
      email: ada@example.com
      mitlearn_user_id: 101
      mitxpro_application_user_id:
      bootcamps_application_user_id:
    - user_pk: e82719d98dd31b1e1e2ade0acf8d82d2  # pragma: allowlist secret
