- name: test_afact_learner_courserun_progress_status_and_needs_attention
  description: >
    Pins completion_status and needs_attention_since, one learner per case.
    ol-analytics-api and the B2B views read these columns in place of their
    own copies of the rule, so a changed branch changes what partners see.
  model: afact_learner_courserun_progress
  overrides:
    vars:
      needs_attention_quiet_days: 30
  given:
  - input: ref('tfact_enrollment')
    rows:
    - enrollment_id: "1"
      enrollment_type: course
      user_fk: certified
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "2"
      enrollment_type: course
      user_fk: certified_and_passing
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "3"
      enrollment_type: course
      user_fk: revoked_and_passing
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "4"
      enrollment_type: course
      user_fk: revoked_not_passing
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "5"
      enrollment_type: course
      user_fk: passing
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "6"
      enrollment_type: course
      user_fk: grade_only
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "7"
      enrollment_type: course
      user_fk: active_only
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "8"
      enrollment_type: course
      user_fk: zero_grade
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "9"
      enrollment_type: course
      user_fk: nothing
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key: 20240110
      enrollment_created_on: "2024-01-10T00:00:00"
    - enrollment_id: "10"
      enrollment_type: course
      user_fk: no_enrollment_date
      courserun_fk: run-1
      platform: mitxonline
      enrollment_date_key:
      enrollment_created_on:
  - input: ref('tfact_grade')
    rows:
    - user_fk: certified_and_passing
      courserun_fk: run-1
      is_passing: true
      grade_value: 0.9
    - user_fk: revoked_and_passing
      courserun_fk: run-1
      is_passing: true
      grade_value: 0.8
    - user_fk: revoked_not_passing
      courserun_fk: run-1
      is_passing: false
      grade_value: 0.4
    - user_fk: passing
      courserun_fk: run-1
      is_passing: true
      grade_value: 0.7
    - user_fk: grade_only
      courserun_fk: run-1
      is_passing: false
      grade_value: 0.2
    - user_fk: zero_grade
      courserun_fk: run-1
      is_passing: false
      grade_value: 0.0
  - input: ref('tfact_certificate')
    rows:
    - user_fk: certified
      courserun_fk: run-1
      certificate_scope: course
      certificate_is_revoked: false
      is_current: true
    - user_fk: certified_and_passing
      courserun_fk: run-1
      certificate_scope: course
      certificate_is_revoked: false
      is_current: true
    - user_fk: revoked_and_passing
      courserun_fk: run-1
      certificate_scope: course
      certificate_is_revoked: true
      is_current: true
    - user_fk: revoked_not_passing
      courserun_fk: run-1
      certificate_scope: course
      certificate_is_revoked: true
      is_current: true
    # A superseded certificate does not count, even unrevoked.
    - user_fk: passing
      courserun_fk: run-1
      certificate_scope: course
      certificate_is_revoked: false
      is_current: false
    # Only course certificates count.
    - user_fk: nothing
      courserun_fk: run-1
      certificate_scope: program
      certificate_is_revoked: false
      is_current: true
  - input: ref('afact_learner_courserun_daily_activity')
    rows:
    - user_fk: revoked_not_passing
      courserun_fk: run-1
      activity_date_key: 20240301
    - user_fk: active_only
      courserun_fk: run-1
      activity_date_key: 20240201
    - user_fk: active_only
      courserun_fk: run-1
      activity_date_key: 20240215
    # Going quiet after finishing is expected, so these two get no threshold date.
    - user_fk: certified_and_passing
      courserun_fk: run-1
      activity_date_key: 20240215
    - user_fk: passing
      courserun_fk: run-1
      activity_date_key: 20240215
  - input: ref('dim_date')
    rows:
    - date_key: 20240110
      date: "2024-01-10"
    - date_key: 20240215
      date: "2024-02-15"
    - date_key: 20240301
      date: "2024-03-01"
  - input: ref('dim_course_content_progress_block')
    rows: []
  - input: ref('afact_learner_courserun_content_progress')
    rows: []
  expect:
    rows:
    - user_fk: certified
      is_certified: true
      completion_status: certified
      is_in_progress: false
      is_not_started: false
      last_active_on:
      needs_attention_since:
    - user_fk: certified_and_passing
      is_certified: true
      completion_status: certified
