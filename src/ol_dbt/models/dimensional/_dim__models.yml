- name: tfact_problem_events
  description: >
    Transactional fact table for learner problem events in a course, combining
    tracking log events (problem_check, showanswer) from all four platforms with
    studentmodule history data. One row per unique event: one problem_check per
    (platform, user, course, problem, attempt) — the earliest timestamp wins when
    both tracking log and studentmodule sources have the same attempt — and all
    showanswer events regardless of count. Incremental; full-refresh required when
    backfilling or after schema changes.
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitx/tracking_logs
      - mitxonline/app_postgres
      - mitxonline/mysql
      - mitxonline/tracking_logs
      - xpro/app_postgres
      - xpro/mysql
      - xpro/tracking_logs
  columns:
  - name: event_id
    description: string, surrogate key uniquely identifying this event row, derived
      from (platform, openedx_user_id, courserun_readable_id, problem_block_id, attempt,
      event_type, event_timestamp)
    tests:
    - not_null
    - unique
  - name: platform_fk
    description: string, foreign key to dim_platform
  - name: user_fk
    description: string, foreign key to dim_user, referencing the user who triggered
      the event
    tests:
    # warn until the post-cutover full refresh clears the user_fk values this table
    # persisted under the old email-derived key; raise to error afterwards.
    - relationships:
        to: ref('dim_user')
        field: user_pk
        where: "user_fk is not null"
        config:
          severity: warn
  - name: openedx_user_id
    description: int, user ID on the corresponding open edX platform
    tests:
    - not_null
  - name: user_username
    description: str, username of the open edX user who caused the event to be emitted.
  - name: platform
    description: string, foreign key to dim_platform, referencing the platform where
      the problem event occurred
    tests:
    - not_null
  - name: courserun_readable_id
    description: string, foreign key to dim_course_content, referencing the edX course
      run ID
    tests:
    - not_null
  - name: event_type
    description: string, type of the problem event. Possible values are problem_check,
      , showanswer. The open edx doc - https://edx.readthedocs.io/projects/devdata/en/latest/internal_data_formats/
      tracking_logs/student_event_types.html#video-interaction-events
    tests:
    - not_null
  - name: problem_block_fk
    description: string, foreign key referencing the problem block ID in the dim_course_content
      table, formatted as block-v1:{org}+{course}+{run}type@problem@{hash code}.
    tests:
    - not_null
  - name: attempt
    description: int, number indicating which attempt this was
  - name: answers
    description: json, learner's answers to this problem in problem_id and internal
      answer pair. For multiple questions, it lists every question and answer. e.g.
      {"6a3f44c9265a44d6911996711fe4bafd_2_1":["choice_0","choice_2"]}
  - name: success
    description: str, It's either 'correct' or 'incorrect'
  - name: grade
    description: number, grade value
  - name: max_grade
    description: number, maximum possible grade value for the problem
  - name: event_timestamp_iso8601
    description: string, the raw ISO 8601 timestamp string from the source tracking
      log, in the platform's local timezone. Used as the basis for time_fk and date_fk.
  - name: event_timestamp
    description: timestamp, timestamp (with time zone) indicating the time at which
      the event occurred, formatted as timestamp(9)
    tests:
    - not_null
  - name: time_fk
    description: integer, foreign key to dim_time in HHMM format (e.g. 1430 = 14:30).
      Derived from event_timestamp_iso8601 (local timezone of the source data).
  - name: date_fk
    description: integer, foreign key to dim_date in YYYYMMDD format (e.g. 20230617).
      Derived from event_timestamp_iso8601 (local timezone of the source data).
  - name: event_json
    description: json, it includes member fields that identify specifics of each triggered
      event. For less common/event-specific attributes.
- name: tfact_studentmodule_problems
  description: >
    Transactional fact table for studentmodule problem submissions. Each row represents
    one submission event — a single "Check" click by a student on a problem. Ordering
    rows by event_timestamp for a given studentmodule_id shows the full progression
    through a problem across all attempts.

    The correct_map column contains the per-part correctness for that specific
    submission only. The growing correct_map_history (all prior submissions) is
    intentionally excluded — it is redundant when all submission rows are present
    and
    can be reconstructed by grouping on studentmodule_id ordered by event_timestamp.

    The seed column identifies which randomized variant of the problem the student
    received, enabling analysis of whether specific variants are harder than others.
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/mysql
      - xpro/app_postgres
      - xpro/mysql
  columns:
  - name: user_fk
    description: string, foreign key to dim_user
    tests:
    # warn until the post-cutover full refresh clears the user_fk values this table
    # persisted under the old email-derived key; raise to error afterwards.
    - relationships:
        to: ref('dim_user')
        field: user_pk
        where: "user_fk is not null"
        config:
          severity: warn
  - name: platform
    description: string, platform name (mitxonline, mitxpro, residential)
  - name: openedx_user_id
    description: int, user ID on the corresponding open edX platform
  - name: user_username
    description: str, username of the open edX user
  - name: courserun_readable_id
    description: string, the edX course ID formatted as course-v1:{org}+{course code}+{run_tag}
  - name: studentmodule_id
    description: int, primary key in courseware_studentmodule; groups all submission
      rows for a given student/problem/course combination
  - name: studentmodulehistoryextended_id
    description: int, primary key in courseware_studentmodulehistoryextended; natural
      unique key for this fact table — one row per submission event
  - name: problem_block_id
    description: str, unique ID for a distinct piece of content in a course, formatted
      as block-v1:{org}+{course}+{run}type@{block type}+block@{hash code}
  - name: attempt
    description: int, submission number for this student/problem pair (1-based, incremented
      by OpenEdX on each "Check" click)
  - name: seed
    description: int, random seed that determines which variant of a randomized problem
      this student received. Null for non-randomized problems.
  - name: correct_map
    description: >
      json, per-part correctness map for this submission only. Keys are opaque
      problem-part IDs; values contain correctness (correct/incorrect/partially-correct/submitted),
      npoints, msg, and hint. Reflects the state at the time of this specific check
      only.
  - name: answers
    description: >
      json, per-part answers submitted by the learner for this check. Keys match
      those in correct_map. Values are strings (text/formula answers) or arrays
      (multiple-choice). May include *_dynamath keys with MathML representations
      of formula inputs alongside the plain-text answer key.
  - name: grade
    description: number, unweighted grade earned on this problem as of this submission
      (how many parts correct)
  - name: max_grade
    description: number, maximum possible unweighted grade for this problem (total
      number of parts)
  - name: success
    description: str, "correct" if grade equals max_grade, "incorrect" otherwise
  - name: event_timestamp
    description: timestamp with time zone, when this submission event was recorded
  - name: event_timestamp_iso8601
    description: string, the raw ISO 8601 timestamp string from the source tracking
      log, in the platform's local timezone. Used as the basis for time_fk and date_fk.
  - name: time_fk
    description: integer, foreign key to dim_time in HHMM format (e.g. 1430 = 14:30).
      Derived from event_timestamp_iso8601 (local timezone of the source data).
  - name: date_fk
    description: integer, foreign key to dim_date in YYYYMMDD format (e.g. 20230617).
      Derived from event_timestamp_iso8601 (local timezone of the source data).
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["platform", "studentmodulehistoryextended_id"]
