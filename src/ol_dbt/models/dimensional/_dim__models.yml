- name: test_tfact_problem_events_rekey_keeps_stored_event_id
  description: >
    Regression test for the 2026-10-06 unique_tfact_problem_events_event_id failure.
    A row re-keyed by the stale user_fk path must keep its stored event_id so
    delete+insert replaces it. Rehashing event_timestamp, which reads back in UTC
    rather than the source offset, gave each re-keyed event a second row.
  model: tfact_problem_events
  overrides:
    macros:
      is_incremental: true
  given:
  - input: ref('stg__mitxonline__openedx__tracking_logs__user_activity')
    rows: []
  - input: ref('stg__mitxpro__openedx__tracking_logs__user_activity')
    rows: []
  - input: ref('stg__mitxresidential__openedx__tracking_logs__user_activity')
    rows: []
  - input: ref('stg__edxorg__s3__tracking_logs__user_activity')
    rows: []
  # Empty, but typed: an empty dict fixture makes event_timestamp VARCHAR.
  - input: ref('tfact_studentmodule_problems')
    format: sql
    rows: |
      select
          cast(null as varchar) as user_fk
          , cast(null as varchar) as platform
          , cast(null as integer) as openedx_user_id
          , cast(null as varchar) as user_username
          , cast(null as varchar) as courserun_readable_id
          , cast(null as integer) as studentmodule_id
          , cast(null as integer) as studentmodulehistoryextended_id
          , cast(null as varchar) as problem_block_id
          , cast(null as varchar) as attempt
          , cast(null as varchar) as seed
          , cast(null as varchar) as correct_map
          , cast(null as varchar) as answers
          , cast(null as varchar) as grade
          , cast(null as varchar) as max_grade
          , cast(null as varchar) as success
          , cast(null as timestamp with time zone) as event_timestamp
          , cast(null as varchar) as event_timestamp_iso8601
          , cast(null as integer) as time_fk
          , cast(null as integer) as date_fk
      where false
  - input: ref('dim_user')
    rows:
    - user_pk: "NEW_USER_PK"
      edxorg_openedx_user_id: 555
      user_edxorg_username: "learner"
  - input: ref('dim_platform')
    rows:
    - platform_pk: "PLATFORM_EDXORG"
      platform_readable_id: "edxorg"
  # sql format so event_timestamp is a timestamp; a dict fixture infers VARCHAR here.
  - input: this
    format: sql
    rows: |
      select
          'stored-event-id' as event_id
          , 'PLATFORM_EDXORG' as platform_fk
          , 'OLD_USER_PK' as user_fk
          , 'edxorg' as platform
          , 555 as openedx_user_id
          , 'learner' as user_username
          , 'MITx/6.002x/2024' as courserun_readable_id
          , 'showanswer' as event_type
          , 'block-v1:MITx+6.002x+2024+type@problem+block@p1' as problem_block_fk
          , cast(null as varchar) as answers
          , '1' as attempt
          , cast(null as varchar) as success
          , cast(null as varchar) as grade
          , cast(null as varchar) as max_grade
          , cast('2024-01-15 00:00:00+00:00' as timestamp with time zone) as event_timestamp
          , '2024-01-15T00:00:00Z' as event_timestamp_iso8601
          , cast(null as integer) as time_fk
          , cast(null as integer) as date_fk
          , cast(null as varchar) as event_json
      union all
      select
          'stored-check-id'
          , 'PLATFORM_EDXORG'
          , 'OLD_USER_PK'
          , 'edxorg'
          , 555
          , 'learner'
          , 'MITx/6.002x/2024'
          , 'problem_check'
          , 'block-v1:MITx+6.002x+2024+type@problem+block@p2'
          , cast(null as varchar)
          , '1'
          , cast(null as varchar)
          , cast(null as varchar)
          , cast(null as varchar)
          , cast('2024-01-15 00:00:00+00:00' as timestamp with time zone)
          , '2024-01-15T00:00:00Z'
          , cast(null as integer)
          , cast(null as integer)
          , cast(null as varchar)
  expect:
    rows:
    - event_id: "stored-event-id"
      user_fk: "NEW_USER_PK"
      event_type: "showanswer"
    - event_id: "stored-check-id"
      user_fk: "NEW_USER_PK"
      event_type: "problem_check"
- name: test_tfact_discussion_events_date_fk_keeps_the_source_day
  description: >
    date_fk is the day written in the source timestamp, with the offset dropped,
    not the UTC day. The activity fact and needs_attention_since inherit it, so a
    change here moves a learner's needs-attention date by a day.
  model: tfact_discussion_events
  given:
  - input: ref('stg__mitxonline__openedx__tracking_logs__user_activity')
    rows:
    # 2024-01-16 04:30 UTC.
    - user_username: "late"
      openedx_user_id: 1
      courserun_readable_id: "course-v1:MITx+1.01x+1T2024"
      useractivity_event_type: "edx.forum.thread.created"
      useractivity_event_object: "{}"
      useractivity_timestamp: "2024-01-15T23:30:00.123456-05:00"
    # 2024-01-15 22:30 UTC.
    - user_username: "early"
      openedx_user_id: 2
      courserun_readable_id: "course-v1:MITx+1.01x+1T2024"
      useractivity_event_type: "edx.forum.thread.created"
      useractivity_event_object: "{}"
      useractivity_timestamp: "2024-01-16T00:30:00.123456+02:00"
    - user_username: "utc"
      openedx_user_id: 3
      courserun_readable_id: "course-v1:MITx+1.01x+1T2024"
      useractivity_event_type: "edx.forum.thread.created"
      useractivity_event_object: "{}"
      useractivity_timestamp: "2024-01-15T23:30:00.123456Z"
  - input: ref('stg__mitxpro__openedx__tracking_logs__user_activity')
    rows: []
  - input: ref('stg__mitxresidential__openedx__tracking_logs__user_activity')
    rows: []
  - input: ref('stg__edxorg__s3__tracking_logs__user_activity')
    rows: []
  - input: ref('dim_user')
    rows: []
  - input: ref('dim_course_run')
    rows: []
  - input: ref('dim_platform')
    rows: []
  expect:
    rows:
    - user_username: "late"
      date_fk: 20240115
    - user_username: "early"
      date_fk: 20240116
    - user_username: "utc"
      date_fk: 20240115
