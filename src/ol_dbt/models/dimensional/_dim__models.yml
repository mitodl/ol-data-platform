          "commentable_id", 'post_id']

- name: tfact_chatbot_events
  description: Transactional fact table for learner chatbot events in a course
  config:
    meta:
      qa_branches:
      - learn_ai/app_postgres
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/mysql
      - mitxonline/tracking_logs
      - xpro/app_postgres
      - xpro/mysql
  columns:
  - name: chatbot_source
    description: string, indicates the source of the chatbot event like 'open_edx'
      or 'canvas'
    tests:
    - not_null
  - name: org_id
    description: string, the name of the organization that created the course. e.g.
      MITxT, MITx, UAI_MIT, etc.
    tests:
    - not_null
  - name: user_fk
    description: string, foreign key to dim_user
    tests:
    - not_null
  - name: openedx_user_id
    description: int, user ID on the MIT Learn open edX platform
    tests:
    - not_null
  - name: user_username
    description: str, username of the MIT Learn open edX
    tests:
    - not_null
  - name: courserun_readable_id
    description: string, the open edX course readable ID or canvas course id. May
      be Null for some canvas chatbot events where course info is not captured.
  - name: event_type
    description: string, type of the chatbot event. e.g. ol_openedx_chat.drawer.submit,
      ol_openedx_chat.drawer.response, ol_openedx_chat_xblock.OLChat.submit, ol_openedx_chat_xblock.OLChat.response,
      etc.
    tests:
    - not_null
  - name: session_id
    description: string, unique identifier for the chatbot session
    tests:
    - not_null
  - name: block_id
    description: string, foreign key to dim_course_content, referencing the block
      ID of the page where the chatbot event occurred. e.g. block-v1:{org}+{course}+{run}type@vertical+block@{hash
      code}.
  - name: block_name
    description: string, name of the content block where the chatbot event occurred.
  - name: chatbot_type
    description: string, type of the chatbot. e.g. Syllabus, Tutor, etc.
  - name: event_value
    description: string, the value of the event, e.g. the message submitted by the
      learner or the response from the chatbot. For other event type such as tabchange,
      it is string indicating which tab the user switched to.
  - name: event_json
    description: json, it includes member fields that identify specifics of each triggered
      event.
  - name: event_timestamp_iso8601
    description: string, the raw ISO 8601 timestamp string from the source tracking
      log, in the platform's local timezone. Used as the basis for time_fk and date_fk.
  - name: event_timestamp
    description: timestamp, timestamp (with time zone) indicating the time at which
      the event occurred
    tests:
    - not_null
  - name: time_fk
    description: integer, foreign key to dim_time in HHMM format (e.g. 1430 = 14:30).
      Derived from event_timestamp_iso8601 (local timezone of the source data).
  - name: date_fk
    description: integer, foreign key to dim_date in YYYYMMDD format (e.g. 20230617).
      Derived from event_timestamp_iso8601 (local timezone of the source data).
  - name: learn_ai_thread_id
    description: string, unique identifier for the chat thread in the Learn AI database.
  - name: learn_ai_checkpoint_pk
    description: int, foreign key to chatbots_djangocheckpoint in Learn AI database
  - name: platform_fk
    description: string, foreign key to dim_platform, referencing the platform where
      the chatbot event occurred

- name: dim_discount
  description: Dimension table combining discount/coupon records across MITxOnline
    and MITxPro platforms. Each row represents a unique discount or coupon identified
    by a surrogate key derived from the source platform and source discount ID.
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - source_discount_id
      - platform_code
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitxonline/app_postgres
      - xpro/app_postgres
  columns:
  - name: discount_pk
    description: string, surrogate primary key for this table, generated from source_discount_id
      and platform_code
    tests:
    - not_null
    - unique
  - name: platform_code
    description: string, code identifying the source platform. e.g. mitxonline, mitxpro
    tests:
    - not_null
  - name: source_discount_id
    description: integer, original discount or coupon ID from the source platform.
      For mitxpro b2b bulk-purchase coupons (which have no coupon_id), this is the
      negated b2bcoupon_id instead, to keep it distinct from regular coupon IDs.
  - name: discount_code
    description: string, the discount or coupon code used at checkout. If a discount's
      code was changed over its lifetime, this reflects the most recently updated
      code on file, not necessarily the code used on every order that redeemed it
  - name: discount_type
    description: string, type of discount. e.g. percent-off, dollars-off, fixed-price
  - name: discount_amount
    description: decimal, numeric amount of the discount (percentage or dollar value
      depending on discount_type). For percent-off discounts, this is a number between
      0 and 100 representing the percentage
  - name: discount_source
    description: string, source or payment type of the discount. e.g. marketing, b2b,
      financial-assistance
  - name: max_redemptions
    description: integer, maximum number of times this discount may be redeemed. 0
      if unlimited.
  - name: redemption_type
    description: string, redemption constraint type. e.g. one-time, unlimited
  - name: activated_on
    description: string, ISO-8601 timestamp indicating when the discount becomes active
  - name: expires_on
    description: string, ISO-8601 timestamp indicating when the discount expires
  - name: created_on
    description: string, ISO-8601 timestamp indicating when the discount record was
      created
  - name: updated_on
    description: string, ISO-8601 timestamp indicating when the discount record was
      last updated

- name: dim_tax_rate
  description: Dimension table of tax rates by country. Each row represents the tax
    rate for a single country, identified by a surrogate key derived from the country
    code.
  columns:
  - name: tax_rate_pk
    description: string, surrogate primary key generated from country_code
    tests:
    - not_null
    - unique
  - name: country_code
    description: string, ISO 3166-1 alpha-2 country code this tax rate applies to.
      Unique per country
    tests:
    - not_null
    - unique
  - name: tax_rate
    description: numeric, the tax rate as a percentage (e.g. 15 means 15%)
    tests:
    - not_null
  - name: tax_rate_name
    description: string, name of the tax assessed (e.g. GST)
    tests:
    - not_null
  - name: is_active
    description: boolean, indicates whether this tax rate is currently active
    tests:
    - not_null

- name: dim_time
  description: >
    Minute-grain time dimension (1,440 rows) for sub-daily analysis. Each row
    represents one minute of the day. Join fact table timestamp columns to
    time_key using the HHMM integer (hour * 100 + minute).
  columns:
  - name: time_key
    description: >
      Integer primary key in HHMM format (e.g. 1430 = 14:30 / 2:30 PM).
      Range 0–2359. Join target for fact tables.
    tests:
    - unique
    - not_null
  - name: hour
    description: Hour of the day in 24-hour format (0–23)
    tests:
    - not_null
  - name: minute
    description: Minute of the hour (0–59)
    tests:
    - not_null
  - name: minute_of_day
    description: >
      Minutes elapsed since midnight (0–1439). Useful for arithmetic such as
      computing the difference between two intra-day times.
    tests:
    - not_null
  - name: am_pm
    description: Meridiem indicator — 'AM' (hours 0–11) or 'PM' (hours 12–23)
    tests:
    - not_null
  - name: hour_12
    description: Hour in 12-hour clock format (1–12)
    tests:
    - not_null
  - name: hour_of_day_label
    description: >
      Human-readable time label in 12-hour format (e.g. '02:30 PM').
      Suitable for display in dashboards.
    tests:
    - not_null
  - name: time_of_day_bucket
    description: >
      Broad time-of-day category based on the 24-hour hour value.
      Night: 0–5, Morning: 6–11, Afternoon: 12–17, Evening: 18–23.
    tests:
    - not_null
    - accepted_values:
        values: ['Night', 'Morning', 'Afternoon', 'Evening']

- name: afact_learner_courserun_daily_activity
  description: >
    One row per (platform, learner, course run, day) with tracked course
    activity: video plays, problem checks, course navigation, discussion
    events, or Open edX chatbot submits. Days with no activity have no row, so
    last_active_on is max(activity_date) and days_active is
    count(distinct activity_date) over this table. Certificates and
    enrollments don't count as activity here.

    This is the source for learner engagement measures and for "active" in
    the behavioural sense: a learner is active on a day, in a month or in a
    course run when a row exists for it. That is a different thing from an
    active enrollment (tfact_enrollment.enrollment_is_active). The
    b2b_analytics engagement views and the b2b_learner_records views both
    aggregate this table. metrics/ registers each counter column as a metric,
    and "active" as active_learners.

    Every counter is per learner (user_fk) per day (activity_date_key). The
    tracking-log event facts resolve user_fk by joining the event's Open edX
    user id and username to dim_user. The chatbot fact, and the studentmodule
    rows of tfact_problem_events, join on the user id alone. Events whose user
    does not resolve are left out. A row exists when the learner has a
    play_video, problem_check, navigation, discussion or Open edX chatbot
    submit event that day, so a row can carry 0 in every counter (e.g. a
    play_video event with no video id). Rows also exist for users with no
    enrollment in the run (e.g. staff previewing it).

    Keyed on user_fk instead of email, unlike organization_administration_report,
    so a learner's rows don't split or drop when their account email changes.
    Rebuilt in full every run, since a learner's user_fk can still be
    re-resolved and an incremental table would leave old days under the
    stale key.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - platform
        - user_fk
        - courserun_readable_id
        - activity_date_key
  config:
    meta:
      qa_branches:
      - learn_ai/app_postgres
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitx/tracking_logs
      - mitxonline/app_postgres
      - mitxonline/mysql
      - mitxonline/tracking_logs
      - xpro/app_postgres
      - xpro/mysql
      - xpro/tracking_logs
  columns:
  - name: activity_key
    description: string, surrogate key over (platform, user_fk, courserun_readable_id,
      activity_date).
    tests:
    - unique
    - not_null
  - name: user_fk
    description: string, foreign key to dim_user.
    tests:
    - not_null
    - relationships:
        to: ref('dim_user')
        field: user_pk
        config:
          severity: warn
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-learner
  - name: courserun_fk
    description: string, foreign key to dim_course_run, matched on (courserun_readable_id,
      platform) against the current run. Null where the event's course id has no current
      course run.
  - name: platform
    description: string, platform the activity happened on (mitxonline, mitxpro, residential,
      edxorg).
    tests:
    - not_null
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.platform
  - name: courserun_readable_id
    description: string, course run id as recorded on the event.
    tests:
    - not_null
  - name: activity_date_key
    description: >
      integer, foreign key to dim_date in YYYYMMDD format -- the event's own
      date_fk, which the event facts derive from event_timestamp_iso8601 in the
      source's timezone. Not a UTC day: 15.2M of tfact_discussion_events' rows
      carry a local offset, and 2.9M of those fall on a different UTC day. Read
      as a date via dim_date rather than casting the integer.
    tests:
    - not_null
    - relationships:
        to: ref('dim_date')
        field: date_key
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-learner
  - name: videos_played
    description: >
      int, distinct videos the learner played that day. Events: play_video in
      tfact_video_events (not load, seek, pause or complete). Distinct key:
      video_block_fk (the event's video id), so replaying one video the same day
      counts once and playing it on two days counts twice when summed. Day:
      activity_date_key. Learner: user_fk. Platforms: mitxonline, mitxpro,
      residential, edxorg. organization_administration_report's videos_watched
      uses the same event and distinct key but buckets by
      cast(event_timestamp as date) and keys learners on email.
  - name: problems_attempted
    description: >
      int, distinct problems the learner checked that day. Events: problem_check
      rows in tfact_problem_events, which are tracking-log problem_check events
      plus submissions from courseware studentmodule history (mitxonline,
      mitxpro, residential). The studentmodule rows are dated from the database
      timestamp, not a tracking-log offset. showanswer is viewing a solution and
      does not count, unlike organization_administration_report's
      problems_count. Distinct key: problem_block_fk, so several checks of one
      problem the same day count once. Day:
      activity_date_key. Learner: user_fk. Platforms: mitxonline, mitxpro,
      residential, edxorg.
  - name: navigation_events
    description: >
      int, course navigation events that day, a count of events, not of distinct
      pages. Events: every row of tfact_course_navigation_events, i.e.
      edx.ui.lms.jump_nav.selected, .link_clicked, .outline.selected,
      .sequence.next_selected, .sequence.previous_selected and
      .sequence.tab_selected, including events with no block (which
      afact_course_page_engagement drops). Distinct key: none (count(*)). Day:
      activity_date_key. Learner: user_fk. Platforms: mitxonline, mitxpro,
      residential, edxorg.
  - name: discussion_events
    description: >
      int, discussion forum events that day. Events: every row of
      tfact_discussion_events, i.e. every edx.forum.% event, so viewing or
      searching a thread counts as well as posting or voting. Distinct key: none
      (count(*)). Not the number of posts, which counts edx.forum.%.created
      events or distinct post_id. Day: activity_date_key. Learner: user_fk.
      Platforms: mitxonline, mitxpro, residential, edxorg.
  - name: chatbot_interactions
    description: >
      int, chatbot questions the learner asked that day. Events:
      ol_openedx_chat.drawer.submit in tfact_chatbot_events. The Canvas chatbot's
      events have other event types (ol_openedx_chat_xblock.OLChat.*), so they
      never count. Distinct key: (session_id, block_id), with a
      missing block_id read as '' so submits with no block count, unlike
      organization_administration_report's session_id || block_id. Day:
      activity_date_key. Learner: user_fk. Platform: mitxonline only.

- name: afact_learner_courserun_progress
  description: >
    One row per (learner, course run) with the learner's enrollment, grade,
    course certificate, last active day, completion status and the date from
    which they need attention. This is the definition of completion_status,
    is_certified and needs_attention_since; consumers select the columns and
    do not restate the rules.

    Population: course enrollments in tfact_enrollment with a user_fk and a
    courserun_fk. When a learner has several enrollments in one run (refunds,
    deferrals, transfers) the active one is reported, else the newest.

    One rule covers every platform, and its inputs are weaker outside MITx
    Online and xPRO. is_passing is tfact_grade's, whose YAML states the passing
    rule for each platform. edxorg certificates are never marked revoked.
    residential has grades (from tfact_grade) but no certificates, so certified
    does not occur. bootcamps has certificates but no grades or activity, so
    every uncertified enrollment is not_started and gets a needs_attention_since.
    emeritus' and global_alumni's own sources supply no grades, certificates or
    activity. An enrollment on an xPRO-mapped run carries the xPRO run's
    courserun_fk, and dim_user groups the learner's accounts by email, so the row
    reaches another status only through the same learner's xPRO grade, certificate
    or activity on the same run. Otherwise it is not_started.

    Consent is not applied. A consumer-facing model built on this one must
    carry or apply consent itself.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - user_fk
        - courserun_fk
      config:
        # One duplicated pair doubles a consumer's rows, so the project's >10 does not apply.
        error_if: ">0"
  config:
    meta:
      qa_branches:
      - learn_ai/app_postgres
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitx/tracking_logs
      - mitxonline/app_postgres
      - mitxonline/mysql
      - mitxonline/tracking_logs
      - xpro/app_postgres
      - xpro/mysql
      - xpro/tracking_logs
  columns:
  - name: user_fk
    description: string, foreign key to dim_user.
    tests:
    - not_null
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.learner
  - name: courserun_fk
    description: string, foreign key to dim_course_run.
    tests:
    - not_null
  - name: contract_fk
    description: string, foreign key to dim_contract. The MITx Online B2B contract
      the reported enrollment was made under (tfact_enrollment.contract_fk). Null
      for a non-B2B enrollment and on every other platform.
  - name: platform
    description: string, platform of the enrollment (mitxonline, mitxpro, edxorg,
      residential, bootcamps, emeritus, global_alumni).
    tests:
    - not_null
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.platform
  - name: enrollment_created_on
    description: string, ISO-8601 timestamp the reported enrollment was created. Carried
      from tfact_enrollment.
  - name: enrollment_updated_on
    description: string, ISO-8601 timestamp the reported enrollment was last updated.
      Carried from tfact_enrollment.
  - name: enrollment_is_active
    description: boolean, whether the reported enrollment is active. Carried from
      tfact_enrollment.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-enrollment
  - name: enrollment_mode
    description: string, enrollment mode (audit, verified, etc.). Carried from tfact_enrollment.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.enrollment-mode
  - name: enrollment_status
    description: string, why the enrollment changed (e.g. refunded, deferred). Carried
      from tfact_enrollment.
  - name: is_passing
    description: boolean, the grade's own passing flag, carried from tfact_grade whatever
      the certificate status. The rule differs per platform; tfact_grade.is_passing
      states it. Null when there is no grade, which is every bootcamps enrollment
      and every emeritus and global_alumni enrollment without the same learner's xPRO
      grade on the same run. A certified learner with a passing grade is true here,
      so count this for "passed" totals and use completion_status = 'passed' for passed-and-not-certified.
      A certified learner can also be false or null, because an unrevoked certificate
      is certified without a passing grade.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.ferpa-classification.education-record
  - name: grade_value
    description: double, grade on a 0.0 to 1.0 scale, carried from tfact_grade, so
      it can exceed 1.0 where the source allows it (tfact_grade.grade_value). Null
      when there is no grade.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.ferpa-classification.education-record
  - name: letter_grade
    description: string, letter grade. Carried from tfact_grade.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.ferpa-classification.education-record
  - name: grade_updated_on
    description: string, ISO-8601 timestamp the grade was last updated. Carried from
      tfact_grade.
  - name: certificate_is_revoked
    description: boolean, whether the learner's course certificate for this run is
      revoked. Null means no certificate.
  - name: certificate_issued_on
    description: string, ISO-8601 timestamp the course certificate was issued, revoked
      or not.
  - name: certificate_updated_on
    description: string, ISO-8601 timestamp the course certificate was last updated.
  - name: is_certified
    description: boolean, the learner holds an unrevoked course certificate for this
      run. Never null.
    tests:
    - not_null
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.certificate
  - name: last_active_on
    description: date, latest day with tracked activity in afact_learner_courserun_daily_activity.
      Null when there is none.
    config:
      meta:
        openmetadata:
          glossary:
          - open-learning.active-learner
  - name: completion_status
    description: string, certified when is_certified; else passed when is_passing;
      else in_progress when grade_value > 0 or last_active_on is not null; else not_started.
      A certificate does not require a passing grade.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['certified', 'passed', 'in_progress', 'not_started']
  - name: is_in_progress
    description: boolean, completion_status = 'in_progress'. Never null.
    tests:
    - not_null
  - name: is_not_started
    description: boolean, completion_status = 'not_started'. Never null.
    tests:
    - not_null
  - name: needs_attention_since
    description: date, the day from which the learner needs attention. A learner needs
      attention when coalesce(needs_attention_since <= <current UTC date>, false).
      The enrollment and activity days are read from the source timestamps as written,
      so a source that records a local offset can be a day off UTC. not_started is
      the enrollment date (1970-01-01 when the enrollment has none); in_progress is
      last_active_on plus var needs_attention_quiet_days (30); null for in_progress
      with a grade but no tracked activity, and for passed and certified. It is a
      threshold to compare against. Days needing attention is <current UTC date> -
      needs_attention_since only where the predicate above holds (a future date is
      a learner not yet due) and never for the 1970-01-01 rows.
  - name: content_units_completed
    description: int, units (Open edX verticals) of the run's current course structure
      the learner has completed, from afact_learner_courserun_content_progress. A
      unit is complete when every block in it that counts toward progress is complete,
      as on the Open edX progress page. As there, a unit with nothing the learner
      can complete (discussion only, or every block restricted to another enrollment
      track) is complete once the learner has completed any block in the run. 0 when
      the learner has no completion matched to them, which includes a learner whose
      Open edX user id is not on their dim_user row. Null when the run has no units
      to count, which is every edxorg and bootcamps run.
  - name: content_units_total
    description: int, units (Open edX verticals) in the run's current course structure
      that the learner's enrollment track is shown, from dim_course_content_progress_block.
      The track is read from enrollment_mode and enrollment_is_active, and an inactive
      enrollment is shown no track-restricted unit. Content groups and content type
      gating are not followed, so it can still exceed what one learner is shown. Null
      when the run has no course structure, and for every edxorg and bootcamps run.
  - name: content_progress
    description: double, content_units_completed / content_units_total, between 0.0
      and 1.0 like grade_value. Times 100 it is the completion percent the Open edX
      progress page shows, apart from the content groups and content type gating this
      model does not follow. Null when content_units_total is null or 0. Not an input
      to completion_status; a certified learner can be below 1.0.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1

- name: dim_course_content_progress_block
  description: >
    One row per (platform, course run, enrollment track group, block), for each
    unit of the run's current course structure (dim_course_content where
    is_latest) and each block in it that counts toward a learner's progress. A
    block counts when Open edX records completion on it: every block that is
    not a container (course, chapter, sequential, vertical, library_content,
    itembank, split_test, conditional) and not a discussion. Blocks under a
    staff-only chapter, sequential or vertical are left out. MITx Online, xPRO
    and residential only, the platforms with block completion data; edX.org has
    a course structure and is left out.

    Progress is counted in units, as the Open edX progress page does. A unit is
    a vertical directly under a sequential (vertical_block_id). Each unit has a
    row of its own, with block_id = vertical_block_id and a weight of 0, so a
    unit with nothing to complete is still counted. A run's total for a track
    group is its count of distinct vertical_block_id, not a row count.

    A block or unit restricted by enrollment track (group_access on Open edX
    user partition 50) has rows only for the track groups it is shown to. A run
    has a set of rows for each group its restrictions name and one for group 0,
    which is every other learner. A run with no track restriction has group 0
    alone.

    Within a unit, blocks are grouped into progress items. A randomized pool
    (library_content, itembank) shows each learner max_count of its children,
    so the pool is one item weighing max_count. Every other block is its own
    item weighing 1. A unit is complete when the learner's completed weight
    reaches the sum of progress_item_weight over the unit's distinct
    progress_item_block_id.

    Content groups, content type gating and split_test branches are not
    modelled, so a unit can hold blocks one learner is never shown, and that
    learner cannot complete it here.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - platform
        - courserun_readable_id
        - enrollment_track_group_id
        - block_id
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitx/course_structure
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/course_structure
      - xpro/app_postgres
      - xpro/course_structure
  columns:
  - name: courserun_fk
    description: string, foreign key to dim_course_run. Null when the course structure's
      run has no current dim_course_run row.
  - name: platform
    description: string, platform of the course structure (mitxonline, mitxpro, residential).
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['mitxonline', 'mitxpro', 'residential']
  - name: courserun_readable_id
    description: string, the Open edX course ID formatted as course-v1:{org}+{course
      code}+{run_tag}.
    tests:
    - not_null
  - name: enrollment_track_group_id
    description: int, the Open edX enrollment track group the row applies to, e.g.
      1 audit, 2 verified (macro openedx_enrollment_track_group_ids). 0 is every learner
      whose group the run's track restrictions do not name, including one with no
      active enrollment.
    tests:
    - not_null
  - name: block_id
    description: string, the block's Open edX usage key, as dim_course_content.block_id.
      The unit's own row carries the unit's key.
    tests:
    - not_null
  - name: block_category
    description: string, the block's type, e.g. problem, html, video. vertical on
      a unit's own row.
  - name: chapter_block_id
    description: string, block id of the chapter the block is in.
  - name: sequential_block_id
    description: string, block id of the sequential the block is in.
  - name: vertical_block_id
    description: string, block id of the unit the block is in, the vertical directly
      under its sequential. A block in a vertical nested in a split_test or conditional
      carries the outer vertical.
    tests:
    - not_null
  - name: progress_item_block_id
    description: string, the progress item the block counts in. The parent block id
      for a child of a randomized pool, else block_id.
    tests:
    - not_null
  - name: progress_item_weight
    description: int, how many completed blocks the item is worth. 1 for a block that
      is its own item, and 0 on a unit's own row. For a pool, max_count (1 when unset),
      capped at the number of children the track group is shown, or that number when
      max_count is negative. Repeated on every block of the item.
    tests:
    - not_null

- name: afact_learner_courserun_content_progress
  description: >
    One row per (learner, course run, enrollment track group), for each learner
    with at least one completed block in the run and each track group
    dim_course_content_progress_block has for the run. A row is what the
    learner has completed of the units that track group is shown. The
    completion is Open edX's own block completion record
    (completion_blockcompletion), which covers ungraded content. MITx Online,
    xPRO and residential only: edX.org and Bootcamps have no block completion
    data.

    Counted against dim_course_content_progress_block, so a block removed from
    the course no longer counts and content_units_completed cannot exceed the
    run's total. Consumers read it through afact_learner_courserun_progress,
    which picks the row for the learner's own track group and adds the total
    and the learners with nothing completed.

    Consent is not applied. A consumer-facing model built on this one must
    carry or apply consent itself.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - user_fk
        - courserun_fk
        - enrollment_track_group_id
      config:
        # One duplicate doubles afact_learner_courserun_progress's rows.
        error_if: ">0"
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/course_structure
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/course_structure
      - mitxonline/mysql
      - xpro/app_postgres
      - xpro/course_structure
      - xpro/mysql
  columns:
  - name: user_fk
    description: string, foreign key to dim_user, matched on the platform's Open edX
      user id.
    tests:
    - not_null
  - name: courserun_fk
    description: string, foreign key to dim_course_run.
    tests:
    - not_null
  - name: platform
    description: string, platform the completions were recorded on (mitxonline, mitxpro,
      residential).
    tests:
    - not_null
  - name: courserun_readable_id
    description: string, the Open edX course ID formatted as course-v1:{org}+{course
      code}+{run_tag}.
    tests:
    - not_null
  - name: enrollment_track_group_id
    description: int, the Open edX enrollment track group the row is counted for,
      as dim_course_content_progress_block.enrollment_track_group_id.
    tests:
    - not_null
  - name: content_units_completed
    description: int, units (Open edX verticals) the learner has completed of those
      the track group is shown. A unit is complete when the learner's completed weight
      reaches the unit's. A randomized pool counts up to its progress_item_weight,
      however many of its blocks the learner completed. A unit with nothing for the
      track group to complete counts, as it does on the Open edX progress page. 0
      when the learner has completed blocks and finished no unit.
    tests:
    - not_null

unit_tests:
- name: test_dim_user_pk_is_minted_from_the_group_identity
  description: >
    Pins the user_pk mint. user_pk is md5('<identity source>-<identity id>')
    of the highest-ranked account sharing an email: the Keycloak global id
    when there is one, else the best-ranked platform id. Every fact table's
    user_fk holds these values, so a change to the hashed inputs, the
    separator, or the ranking re-keys every learner and orphans the
    incremental facts; this test fails instead. The expected keys are md5
    literals on purpose.
  model: dim_user
  given:
  - input: ref('stg__mitlearn__app__postgres__users_user')
    rows:
    - user_id: 101
      user_global_id: gid-ada
      user_email: ada@example.com
      user_first_name: Ada
      user_last_name: Lovelace
      user_is_active: true
      user_joined_on: '2024-01-01T00:00:00'
      user_created_on: '2024-01-01T00:00:00'
      user_last_login: '2024-02-01T00:00:00'
  - input: ref('stg__mitxpro__app__postgres__users_user')
    rows:
    - user_id: 42
      user_username: grace
      user_email: grace@example.com
      user_is_active: true
      user_joined_on: '2023-01-01T00:00:00'
    # Upper-case email: grouping is on lower(email), so this still merges with the
    # bootcamps account below.
    - user_id: 7
      user_username: alan
      user_email: Alan@Example.com
      user_is_active: true
      user_joined_on: '2022-01-01T00:00:00'
  # Joined later than the MITx Pro account it shares an email with, so it is the base row
  # for profile fields, but MITx Pro outranks Bootcamps for naming the key.
  - input: ref('int__bootcamps__users')
    rows:
