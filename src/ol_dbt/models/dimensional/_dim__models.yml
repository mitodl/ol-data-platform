      enrollment_track_group_id: 0, block_id: pd-1, vertical_block_id: vert-1, progress_item_block_id: pool-default,
      progress_item_weight: 1}
    - {courserun_fk: run-1, platform: mitxonline, courserun_readable_id: "course-v1:A+B+C",
      enrollment_track_group_id: 0, block_id: pd-2, vertical_block_id: vert-1, progress_item_block_id: pool-default,
      progress_item_weight: 1}
    - {courserun_fk: run-1, platform: mitxonline, courserun_readable_id: "course-v1:A+B+C",
      enrollment_track_group_id: 0, block_id: video-1, vertical_block_id: vert-4,
