---
version: 2

models:
- name: stg__google_ads__api__customer_clients
  description: Accounts under the MIT Open Learning Google Ads manager account, one
    row per account.
  columns:
  - name: account_id
    description: str, Google Ads account id; joins to the report models' account_id
    tests:
    - not_null
    - unique
  - name: account_name
    description: str, the account's name in Google Ads
  - name: account_is_manager
    description: boolean, true for a manager account, which runs no ads
  - name: account_status
    description: str, ENABLED, CANCELED or CLOSED
  - name: account_level
    description: bigint, depth under the MIT Open Learning manager account
  - name: account_currency_code
    description: str, the account's currency
  - name: account_time_zone
    description: str, the account's time zone; report dates are in it
  - name: account_retrieved_at
    description: timestamp, when the load read the account list
  - name: account_dlt_load_id
    description: str, id of the dlt load that last wrote the row

- name: stg__google_ads__api__keyword_daily
  description: Keyword Search performance per day and ad network, from the latest
    fetch of each date. Money is in the account currency.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: report_date
    description: date, the day, in the account's time zone
    tests:
    - not_null
  - name: ad_network_type
    description: str, SEARCH or SEARCH_PARTNERS
    tests:
    - not_null
  - name: campaign_id
    description: bigint, campaign id
  - name: campaign_name
    description: str, campaign name on the report date's fetch
  - name: campaign_status
    description: str, campaign status
  - name: campaign_channel_type
    description: str, advertising channel, e.g. SEARCH
  - name: ad_group_id
    description: bigint, ad group id
    tests:
    - not_null
  - name: ad_group_name
    description: str, ad group name
  - name: keyword_criterion_id
    description: bigint, the keyword's criterion id within the ad group
    tests:
    - not_null
  - name: keyword_text
    description: str, keyword text
  - name: keyword_match_type
    description: str, EXACT, PHRASE or BROAD
  - name: currency_code
    description: str, the account currency
  - name: keyword_first_page_cpc
    description: decimal, Google's estimate of the bid for a first-page ad
  - name: impressions
    description: bigint, impressions
  - name: clicks
    description: bigint, clicks
  - name: cost
    description: decimal, cost
  - name: search_impression_share
    description: double, share of eligible impressions received; null when unset
  - name: keyword_daily_retrieved_at
    description: timestamp, when the fetch that wrote the row ran
  - name: keyword_daily_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - report_date
        - ad_network_type
        - ad_group_id
        - keyword_criterion_id

- name: stg__google_ads__api__keyword_conversions_daily
  description: Keyword conversions per day, ad network and conversion action, from
    the latest fetch of each date.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: report_date
    description: date, the day, in the account's time zone
    tests:
    - not_null
  - name: ad_network_type
    description: str, SEARCH or SEARCH_PARTNERS
    tests:
    - not_null
  - name: conversion_action_resource_name
    description: str, the conversion action's resource name
    tests:
    - not_null
  - name: conversion_action_name
    description: str, the conversion action's name, e.g. a purchase or a lead
  - name: campaign_id
    description: bigint, campaign id
  - name: campaign_name
    description: str, campaign name
  - name: campaign_status
    description: str, campaign status
  - name: campaign_channel_type
    description: str, advertising channel
  - name: ad_group_id
    description: bigint, ad group id
    tests:
    - not_null
  - name: ad_group_name
    description: str, ad group name
  - name: keyword_criterion_id
    description: bigint, the keyword's criterion id
    tests:
    - not_null
  - name: keyword_text
    description: str, keyword text
  - name: keyword_match_type
    description: str, match type
  - name: conversions
    description: double, conversions of actions counted in Google's Conversions
  - name: all_conversions
    description: double, conversions of every action
  - name: keyword_conversion_retrieved_at
    description: timestamp, when the fetch that wrote the row ran
  - name: keyword_conversion_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - report_date
        - ad_network_type
        - ad_group_id
        - keyword_criterion_id
        - conversion_action_resource_name

- name: stg__google_ads__api__campaign_daily
  description: Campaign performance, budget and lost impression share per day, from
    the latest fetch of each date.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: report_date
    description: date, the day, in the account's time zone
    tests:
    - not_null
  - name: campaign_id
    description: bigint, campaign id
    tests:
    - not_null
  - name: campaign_name
    description: str, campaign name
  - name: campaign_status
    description: str, campaign status
  - name: campaign_channel_type
    description: str, advertising channel
  - name: campaign_budget_amount
    description: decimal, the campaign's daily budget
  - name: impressions
    description: bigint, impressions
  - name: clicks
    description: bigint, clicks
  - name: cost
    description: decimal, cost
  - name: search_impression_share
    description: double, share of eligible impressions received
  - name: search_budget_lost_impression_share
    description: double, share of eligible impressions lost to budget
  - name: search_rank_lost_impression_share
    description: double, share of eligible impressions lost to ad rank
  - name: campaign_daily_retrieved_at
    description: timestamp, when the fetch that wrote the row ran
  - name: campaign_daily_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - report_date
        - campaign_id

- name: stg__google_ads__api__change_events
  description: Changes made in the client accounts, one row per change event, from
    2026-10-14 on.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: change_event_resource_name
    description: str, the change event's resource name
    tests:
    - not_null
  - name: change_event_at
    description: timestamp, when the change was made
  - name: change_resource_type
    description: str, what changed, e.g. CAMPAIGN_BUDGET or AD_GROUP_CRITERION
  - name: change_resource_name
    description: str, resource name of what changed
  - name: change_operation
    description: str, CREATE, UPDATE or REMOVE
  - name: change_changed_fields
    description: str, comma-separated fields the change set
  - name: change_client_type
    description: str, where the change came from, e.g. GOOGLE_ADS_WEB_CLIENT
  - name: campaign_resource_name
    description: str, resource name of the campaign the change belongs to
  - name: ad_group_resource_name
    description: str, resource name of the ad group the change belongs to
  - name: change_old_resource
    description: str, JSON of the changed resource before the change
  - name: change_new_resource
    description: str, JSON of the changed resource after the change
  - name: change_event_retrieved_at
    description: timestamp, when the load last read the event
  - name: change_event_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - change_event_resource_name

- name: stg__google_ads__api__campaign_snapshots
  description: Each day's campaigns and budgets, from the latest snapshot of the day.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: snapshot_date
    description: date, the day the snapshot was taken
    tests:
    - not_null
  - name: campaign_resource_name
    description: str, campaign resource name
    tests:
    - not_null
  - name: campaign_id
    description: bigint, campaign id
  - name: campaign_name
    description: str, campaign name
  - name: campaign_status
    description: str, ENABLED or PAUSED
  - name: campaign_channel_type
    description: str, advertising channel
  - name: campaign_start_at
    description: timestamp, when the campaign starts
  - name: campaign_end_at
    description: timestamp, when the campaign ends; null when it has no end
  - name: campaign_bidding_strategy_type
    description: str, bidding strategy
  - name: campaign_budget_resource_name
    description: str, the budget's resource name
  - name: campaign_budget_amount
    description: decimal, daily budget
  - name: campaign_budget_reference_count
    description: bigint, campaigns sharing the budget; over 1 is a shared budget
  - name: campaign_snapshot_retrieved_at
    description: timestamp, when the snapshot was read
  - name: campaign_snapshot_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - snapshot_date
        - campaign_resource_name

- name: stg__google_ads__api__keyword_snapshots
  description: Each day's ad group keywords, including negatives, from the latest
    snapshot of the day.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: snapshot_date
    description: date, the day the snapshot was taken
    tests:
    - not_null
  - name: keyword_resource_name
    description: str, the keyword's resource name
    tests:
    - not_null
  - name: campaign_id
    description: bigint, campaign id
  - name: ad_group_id
    description: bigint, ad group id
  - name: ad_group_name
    description: str, ad group name
  - name: ad_group_status
    description: str, ad group status
  - name: keyword_criterion_id
    description: bigint, the keyword's criterion id
  - name: keyword_text
    description: str, keyword text
  - name: keyword_match_type
    description: str, match type
  - name: keyword_status
    description: str, keyword status
  - name: keyword_is_negative
    description: boolean, true for a negative keyword
  - name: keyword_snapshot_retrieved_at
    description: timestamp, when the snapshot was read
  - name: keyword_snapshot_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - snapshot_date
        - keyword_resource_name

- name: stg__google_ads__api__campaign_criterion_snapshots
  description: Each day's campaign negative keywords and location targets, from the
    latest snapshot of the day.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: snapshot_date
    description: date, the day the snapshot was taken
    tests:
    - not_null
  - name: campaign_criterion_resource_name
    description: str, the criterion's resource name
    tests:
    - not_null
  - name: campaign_id
    description: bigint, campaign id
  - name: campaign_criterion_type
    description: str, KEYWORD or LOCATION
  - name: campaign_criterion_is_negative
    description: boolean, true for an exclusion
  - name: keyword_text
    description: str, keyword text for a KEYWORD criterion
  - name: keyword_match_type
    description: str, match type for a KEYWORD criterion
  - name: location_geo_target_constant
    description: str, the targeted location for a LOCATION criterion
  - name: campaign_criterion_snapshot_retrieved_at
    description: timestamp, when the snapshot was read
  - name: campaign_criterion_snapshot_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - snapshot_date
        - campaign_criterion_resource_name

- name: stg__google_ads__api__campaign_shared_set_snapshots
  description: Each day's links between campaigns and shared negative keyword lists,
    from the latest snapshot of the day.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: snapshot_date
    description: date, the day the snapshot was taken
    tests:
    - not_null
  - name: campaign_shared_set_resource_name
    description: str, the link's resource name
    tests:
    - not_null
  - name: campaign_id
    description: bigint, campaign id
  - name: shared_set_id
    description: bigint, shared list id
  - name: shared_set_name
    description: str, shared list name
  - name: shared_set_type
    description: str, e.g. NEGATIVE_KEYWORDS
  - name: campaign_shared_set_status
    description: str, link status
  - name: campaign_shared_set_snapshot_retrieved_at
    description: timestamp, when the snapshot was read
  - name: campaign_shared_set_snapshot_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - snapshot_date
        - campaign_shared_set_resource_name

- name: stg__google_ads__api__shared_criterion_snapshots
  description: Each day's keywords in the shared negative keyword lists, from the
    latest snapshot of the day.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: snapshot_date
    description: date, the day the snapshot was taken
    tests:
    - not_null
  - name: shared_criterion_resource_name
    description: str, the keyword's resource name
    tests:
    - not_null
  - name: shared_set_id
    description: bigint, shared list id
  - name: shared_criterion_type
    description: str, criterion type, e.g. KEYWORD
  - name: keyword_text
    description: str, keyword text
  - name: keyword_match_type
    description: str, match type
  - name: shared_criterion_snapshot_retrieved_at
    description: timestamp, when the snapshot was read
  - name: shared_criterion_snapshot_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - snapshot_date
        - shared_criterion_resource_name

- name: stg__google_ads__api__fetch_log
  description: Each account window a report or snapshot table re-read, with that fetch's
    time.
  columns:
  - name: account_id
    description: str, Google Ads account id
    tests:
    - not_null
  - name: fetch_table_name
    description: str, the raw table the fetch was for
    tests:
    - not_null
  - name: fetch_window_start
    description: date, first date the fetch covered
    tests:
    - not_null
  - name: fetch_window_end
    description: date, last date the fetch covered
    tests:
    - not_null
  - name: fetch_retrieved_at
    description: timestamp, when the fetch ran
    tests:
    - not_null
  - name: fetch_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - account_id
        - fetch_table_name
        - fetch_window_start
        - fetch_window_end
        - fetch_retrieved_at

- name: stg__google_ads__s3__change_history_report
  description: ad_opt_v2's Google Ads UI change history exports, one row per change.
  columns:
  - name: change_course
    description: str, ad_opt_v2's course folder the export came from, e.g. sys_think
    tests:
    - not_null
  - name: change_row_number
    description: bigint, the change's row in its export
    tests:
    - not_null
  - name: change_at
    description: timestamp, when the change was made, in the account's local time
    tests:
    - not_null
  - name: change_user
    description: str, email of the person who made the change
  - name: campaign_name
    description: str, campaign name; empty for account-level changes
  - name: ad_group_name
    description: str, ad group name
  - name: change_text
    description: str, the change as the UI wrote it, a header line then detail lines;
      account access changes name people by email
  - name: change_source_file
    description: str, the landing-zone file the row came from
  - name: change_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - change_course
        - change_row_number

- name: stg__google_ads__s3__change_history_api
  description: The API change events ad_opt_v2 saved between each export's download
    and 2026-10-20, in the export's terms.
  columns:
  - name: change_course
    description: str, ad_opt_v2's course folder the file came from
    tests:
    - not_null
  - name: change_line_number
    description: bigint, the change's line in its file
    tests:
    - not_null
  - name: change_at
    description: timestamp, when the change was made, in the account's local time
    tests:
    - not_null
  - name: campaign_name
    description: str, campaign name
  - name: ad_group_name
    description: str, ad group name
  - name: change_header
    description: str, the change's header line, e.g. Budget changed
  - name: change_details
    description: str, JSON array of the change's detail lines
  - name: change_source_file
    description: str, the landing-zone file the row came from
  - name: change_dlt_load_id
    description: str, id of the dlt load that last wrote the row
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - change_course
        - change_line_number
