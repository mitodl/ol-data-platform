---
version: 2

models:
- name: stg__posthog__learn__s3__search_update_events
  description: >
    One row per MIT Learn `search_update` event: a search the user ran on
    learn.mit.edu, with the query term, the page it happened on, and who ran it.

    The recorded term is not reliably the term the user just submitted. MIT
    Learn calls `posthog.capture("search_update")` with no properties, so every
    property on the event is autocaptured by PostHog, and `search_param_q` is
    derived by PostHog from `$current_url`. The capture fires before the Next.js
    router commits the navigation, so on events captured before the pending
    mitodl/mit-learn fix the URL still holds the PREVIOUS query and
    `search_query_from_url` is that stale term rather than the new one.

    `search_query` prefers an explicit `search_query` property on the event and
    falls back to the URL-derived value, and `search_query_is_from_event` says
    which of the two each row got. Filter on that flag for any analysis that
    needs the term to be the one actually submitted. No event in the lake
    carries the explicit property yet, so today every row is `false`; the
    property name is a forward contract with the mit-learn fix and must be
    reconciled against that PR when it lands.

    Only a subset of `search_update` events carry a query term at all: in a
    sampled production hour (2026-09-03 00:00 UTC) 75 of 249 had
    `search_param_q` and 49 had `isEnter`. The rest are facet-only changes,
    which fire the same event.
  columns:
  - name: search_event_uuid
    description: str, PostHog's per-event identifier
    tests:
    - not_null
  - name: search_event_timestamp
    description: timestamp, when the search fired on the client
    tests:
    - not_null
  - name: search_user_distinct_id
    description: >
      str, PostHog's per-device identifier for the searcher. Becomes the
      Keycloak global_id once the frontend calls posthog.identify, so this is
      the join key to an identified user.
  - name: search_user_person_id
    description: str, PostHog's resolved person identifier across distinct_ids
  - name: search_event_source_object_key
    description: >
      str, the hourly export object this event was read from. The raw table is
      at-least-once at hour granularity, so this is what identifies rows from a
      re-read hour.
  - name: search_page_url
    description: str, the `$current_url` PostHog autocaptured with the event
  - name: search_page_path
    description: >
      str, the path portion of search_page_url with the query string and
      fragment removed (e.g. /search)
  - name: search_query_from_event
    description: >
      str, the query term taken from an explicit `search_query` property on the
      event. Null on every event captured before the mit-learn fix ships.
  - name: search_query_from_url
    description: >
      str, the query term PostHog derived from `$current_url`
      (`search_param_q`). Stale for events captured before the mit-learn fix:
      it is the query the user ran previously, not the one being submitted.
  - name: search_query
    description: >
      str, the query term: search_query_from_event where present, otherwise
      search_query_from_url. Check search_query_is_from_event before treating a
      value as the term the user just submitted.
  - name: search_query_is_from_event
    description: >
      boolean, true when search_query came from an explicit event property and
      is therefore the submitted term; false when it fell back to the
      URL-derived value, which may be the user's previous query.
    tests:
    - not_null
  - name: search_submitted_with_enter_key
    description: >
      boolean, PostHog's `isEnter` property: the user pressed Enter rather than
      changing a facet. Null when the event did not carry it.
