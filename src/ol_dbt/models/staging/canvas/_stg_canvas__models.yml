---
version: 2

models:
- name: stg__canvas__s3__course_content
  description: >
    The current state of every Canvas course in the landing zone: one row per
    course and one per member of its newest export, whoever can see it, with what
    the export records about the member (files_*, page_*, api_*, module_items) and
    the text Tika extracted from a member of a text type that students can reach
    (others have no text, since every analyst can read this table). The learn_* columns
    are
    MIT Learn's reading of the same archive at the time of the read, for the
    integrations__learn__canvas_* views; other readers should use the facts.
  columns:
  - name: course_id
    description: str, the Canvas course id
    tests:
    - not_null
  - name: coursecontent_kind
    description: str, course or member
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [course, member]
  - name: coursecontent_archive_key
    description: str, S3 key of the .imscc the row was read from
    tests:
    - not_null
  - name: course_code
    description: str, course_code in the course's settings; null on a member row
  - name: course_title
    description: str, title in the course's settings; null on a member row
  - name: course_canvas_domain
    description: str, the Canvas host in the export's context.xml; null on a member
      row
  - name: course_canvas_id
    description: str, the course's id in context.xml; null on a member row
  - name: course_start_on
    description: str, start_at in the course's settings as Canvas wrote it; null on
      a member row
  - name: course_end_on
    description: str, conclude_at in the course's settings as Canvas wrote it; null
      on a member row
  - name: course_files_tab_hidden
    description: boolean, the course hides its Files tab from students; null on a
      member row
  - name: course_public_syllabus
    description: str, public_syllabus in the course's settings, true or false; null
      when unset or on a member row
  - name: course_public_syllabus_to_auth
    description: str, public_syllabus_to_auth in the course's settings; null when
      unset or on a member row
  - name: coursecontent_member_path
    description: str, the member's path in the archive; null on a course row
  - name: coursecontent_file_extension
    description: str, the member's extension with its dot, in lower case
  - name: coursecontent_file_md5
    description: str, MD5 of the member's bytes; null for a member whose text was
      not read, or that was too large to read
  - name: coursecontent_file_size_bytes
    description: bigint, uncompressed size of the member in the archive
  - name: coursecontent_text
    description: str, the text Tika extracted from the member, or from an earlier
      read of the same bytes when this read failed
  - name: coursecontent_text_extraction_status
    description: str, extracted, empty (Tika found no text), failed, unreadable (over
      the size limit or not readable from the archive), or not_read (not a text type,
      or not one students can reach by coursecontent_learn_published); null on a course
      row
  - name: coursecontent_text_read_status
    description: str, the extraction status of this read itself, before an earlier
      read's text stands in for a failure
  - name: coursecontent_pdf_is_valid
    description: boolean, pypdf can read the PDF's first page; null for a member that
      is not a PDF
  - name: coursecontent_in_tutor_folder
    description: boolean, the member is under web_resources/ai/tutor/, where courses
      keep the problem and solution files MIT Learn's tutor reads
  - name: coursecontent_draft_in_parent_path
    description: boolean, the member's folder path contains "draft" anywhere, which
      is MIT Learn's test for a draft (it also matches e.g. "rough_drafts/")
  - name: coursecontent_folder_restricted
    description: boolean, a file under web_resources/ is in a folder files_meta.xml
      marks hidden or locked; null outside web_resources/
  - name: coursecontent_files_display_name
    description: str, the file's display_name in files_meta.xml; null when the file
      has no entry there (Canvas writes one only for a file whose settings are not
      the default)
  - name: coursecontent_files_hidden
    description: boolean, hidden in the file's files_meta.xml entry
  - name: coursecontent_files_locked
    description: boolean, locked in the file's files_meta.xml entry
  - name: coursecontent_files_visibility
    description: str, visibility in the file's files_meta.xml entry (inherit, course,
      institution, public, or another value Canvas adds)
  - name: coursecontent_files_lock_on
    description: str, lock_at in the file's files_meta.xml entry, ISO 8601 UTC
  - name: coursecontent_files_unlock_on
    description: str, unlock_at in the file's files_meta.xml entry, ISO 8601 UTC
  - name: coursecontent_module_items
    description: str, JSON array of the module items whose resource includes the member,
      each {module, title, workflow_state}; null when no module holds it
  - name: coursecontent_page_title
    description: str, an HTML page's title, or an assignment's from its settings;
      null for a member that is neither
  - name: coursecontent_page_workflow_state
    description: str, a page's workflow_state meta tag, or an assignment's workflow_state
  - name: coursecontent_page_is_assignment
    description: boolean, the page is an assignment's, with an assignment_settings.xml
  - name: coursecontent_page_intended_role
    description: str, the page's intendedEndUserRole in the manifest; Instructor for
      a page only its authors see
  - name: coursecontent_page_is_syllabus
    description: boolean, the manifest marks the page as the course's syllabus
  - name: coursecontent_page_lock_on
    description: str, an assignment's lock_at, ISO 8601 UTC
  - name: coursecontent_page_unlock_on
    description: str, an assignment's unlock_at, ISO 8601 UTC
  - name: coursecontent_page_only_visible_to_overrides
    description: boolean, an assignment's only_visible_to_overrides
  - name: coursecontent_page_hide_in_gradebook
    description: boolean, an assignment's hide_in_gradebook
  - name: coursecontent_page_module_locked
    description: boolean, an assignment's module_locked
  - name: coursecontent_linked_from_pages
    description: str, JSON array of the paths of the pages that link to the member;
      null when none does
  - name: coursecontent_api_published
    description: boolean, published in the member's entry in the export's metadata
      JSON, which the Canvas API wrote; null when it has no entry
  - name: coursecontent_api_hidden
    description: boolean, hidden in the member's metadata JSON entry
  - name: coursecontent_api_locked
    description: boolean, locked in the member's metadata JSON entry
  - name: coursecontent_api_lock_on
    description: str, lock_at in the member's metadata JSON entry, ISO 8601 UTC
  - name: coursecontent_api_unlock_on
    description: str, unlock_at in the member's metadata JSON entry, ISO 8601 UTC
  - name: coursecontent_api_folder_hidden
    description: boolean, the member's folder is hidden, per its metadata JSON entry
  - name: coursecontent_api_folder_locked
    description: boolean, the member's folder is locked, per its metadata JSON entry
  - name: coursecontent_api_url
    description: str, the member's Canvas URL in its metadata JSON entry
  - name: coursecontent_learn_published
    description: boolean, Learn-parity. MIT Learn's rules (learning_resources/etl/canvas_utils.py)
      treat the member as visible to students at the time of the read. They read Canvas's
      UTC dates as US/Eastern.
  - name: coursecontent_learn_key
    description: str, Learn-parity. The ContentFile.key Learn gives the member, an
      edX-style module id without the file's extension; null unless coursecontent_learn_published
  - name: coursecontent_learn_title
    description: str, Learn-parity. The title of what publishes the member, or one
      derived from its name; null unless coursecontent_learn_published
  - name: coursecontent_learn_content_title
    description: str, Learn-parity. The title of what publishes the member; empty
      for a file only a page links to
  - name: coursecontent_learn_url
    description: str, Learn-parity. The URL Learn takes from the metadata JSON, by
      path or by the publishing item's title
  - name: coursecontent_retrieved_on
    description: str, when this set of the course's rows was read, ISO 8601
    tests:
    - not_null

unit_tests:
- name: test_stg__canvas__s3__course_content_keeps_the_newest_set_and_earlier_text
  description: >
    Each course's newest read is the course, an unpublished marker empties it, a
    member that failed on a retry keeps the text of an earlier read of the same
    bytes, and rows written before parse rule 2 are left out.
  model: stg__canvas__s3__course_content
  given:
  - input: source('ol_warehouse_raw_data', 'raw__canvas__s3__course_content')
    rows:
    - {course_id: '1', content_kind: member, archive_key: a.imscc, parse_rule: 2,
      member_path: web_resources/a.pdf, file_md5: m1, content: Text, extraction_status: extracted,
      course_retrieved_at: "2026-10-01 00:00:00+00"}
    - {course_id: '1', content_kind: member, archive_key: a.imscc, parse_rule: 2,
      member_path: web_resources/locked-since.pdf, file_md5: m2, content: Old, extraction_status: extracted,
      course_retrieved_at: "2026-10-01 00:00:00+00"}
    - {course_id: '1', content_kind: course, archive_key: b.imscc, parse_rule: 2,
      course_code: A, course_retrieved_at: "2026-10-02 00:00:00+00"}
    - {course_id: '1', content_kind: member, archive_key: b.imscc, parse_rule: 2,
      member_path: web_resources/a.pdf, file_md5: m1, content: null, extraction_status: failed,
      course_retrieved_at: "2026-10-02 00:00:00+00"}
    - {course_id: '2', content_kind: course, archive_key: c.imscc, parse_rule: 2,
      course_code: B, course_retrieved_at: "2026-10-01 00:00:00+00"}
    - {course_id: '2', content_kind: unpublished, course_retrieved_at: "2026-10-02\
        \ 00:00:00+00"}
    # Written before parse rule 2, and newer: still not the course.
    - {course_id: '1', content_kind: file, archive_key: d.imscc, parse_rule: null,
      course_retrieved_at: "2026-10-03 00:00:00+00"}
    - {course_id: '3', content_kind: course, archive_key: e.imscc, parse_rule: null,
      course_code: C, course_retrieved_at: "2026-10-01 00:00:00+00"}
  expect:
    rows:
    - {course_id: '1', coursecontent_kind: course, coursecontent_member_path: null,
      coursecontent_text: null, coursecontent_text_extraction_status: null}
    - {course_id: '1', coursecontent_kind: member, coursecontent_member_path: web_resources/a.pdf,
      coursecontent_text: Text, coursecontent_text_extraction_status: extracted}
