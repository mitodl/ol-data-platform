---
version: 2

sources:
- name: ol_warehouse_raw_data
  loader: dlt
  database: '{{ target.database | default(none) }}'
  schema: '{{ target.schema.replace(var("schema_suffix", ""), "").rstrip("_") }}_raw'
  tables:
  - name: raw__edxorg__discovery__api__programs
    description: >
      MIT-authored edX.org programs ingested from the edX Programs API via
      the mit_edx_programs dlt pipeline. Merge on uuid every run; filtered to
      active, non-MicroMasters programs authored by a known MIT organization
      key. A program that becomes inactive/withdrawn stops being yielded but
      its row is NOT deleted (merge never deletes) -- consumers should use
      _dlt_load_id to tell reconfirmed-active rows from stale ones (see
      integrations__learn__mit_edx_programs's `published` column). One row
      per program, keyed by uuid.
    columns:
    - name: uuid
      description: >
        str, unique program UUID from edX.org (used as primary key by dlt)
    - name: title
      description: str, program title
    - name: subtitle
      description: str, optional short subtitle for the program
    - name: overview
      description: str, optional longer overview/description text
    - name: marketing_url
      description: str, full marketing URL for the program on edX.org
    - name: status
      description: >
        str, program status — always "active" after pipeline filtering
    - name: type
      description: >
        str, program type (e.g. "Professional Certificate",
        "MicroBachelors")
    - name: card_image_url
      description: str, URL for the program card image
    - name: subjects
      description: >
        str, JSON array of subject objects
        (e.g. '[{"name": "Engineering"}]')
    - name: courses
      description: >
        str, JSON array of course objects
        (e.g. '[{"key": "MITx/6.00.1x"}]')

  - name: raw__edxorg__discovery__api__program
    description: >
      Every edX.org program the Programs API lists, flattened, one row per program
      per extraction (mit_edx_programs dlt pipeline, append). The rows sharing the
      latest retrieved_at are what the API currently lists.
    columns:
    - name: uuid
      description: str, UUID of the program on edX.org.
    - name: title
      description: str, title of the program on edX.org
    - name: subtitle
      description: str, subtitle of the program on edX.org
    - name: type
      description: str, type of the program. e.g., MicroMasters, XSeries
    - name: status
      description: str, status of the program. Possible values are active, retired,
        unpublished or deleted
    - name: authoring_organizations
      description: str, name of the organization that authored the program. e.g.,
        MITx , HarvardX
    - name: data_modified_timestamp
      description: str, timestamp when the data was last modified
    - name: marketing_url
      description: str, the program's edX marketing URL
    - name: banner_image_url
      description: str, URL of the program's medium banner image
    - name: level_type_override
      description: str, the program's level override
    - name: retrieved_at
      description: str, when the extraction that wrote this row ran
    config:
      # The edX programs delivery rebuilds from the latest extraction; if the dlt
      # load stops landing new ones it would keep re-sending a stale program set.
      # Nothing runs `dbt source freshness` yet, so the delivery asset also refuses
      # an extraction older than three days.
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 3, period: day}
      loaded_at_field: "from_iso8601_timestamp(retrieved_at)"

  - name: raw__edxorg__discovery__api__program_course
    description: >
      Each edX.org program's courses as the Programs API lists them, one row per
      program course per extraction (mit_edx_programs dlt pipeline, append).
    columns:
    - name: program_uuid
      description: str, UUID of the program on edX.org.
    - name: course_key
      description: str, readable ID for the course in {org}+{course} format. e.g.,
        MITx+15.415.1x
    - name: course_title
      description: str, title of the course
    - name: course_short_description
      description: str, short description of the course
    - name: course_type
      description: str, type of the course. e.g., audit, verified, professional
    - name: course_position
      description: int, 1-based position of the course in the program
    - name: excluded_from_search
      description: boolean, whether edX excludes the course from search
    - name: course_runs
      description: str, JSON array of the course's runs as the programs API reports
        them
    - name: retrieved_at
      description: str, when the extraction that wrote this row ran

  - name: raw__edxorg__discovery__api__mitx_course
    description: >
      MITx courses in edX.org's catalog 10, one row per course per extraction
      (mit_edx_programs dlt pipeline, append).
    columns:
    - name: course_key
      description: str, unique identifier for the course in {org}+{course number}
        format. e.g., MITx+15.415.1x
    - name: title
      description: str, title of the course
    - name: short_description
      description: str, the short description of the course and its content
    - name: full_description
      description: str, the long description of the course and its content.
    - name: level_type
      description: str, the course’s level of difficulty. Values can be 'high_school',
        'introductory', 'intermediate', or 'advanced'.
    - name: course_type
      description: str, audit, verified-audit, credit-verified-audit, or professional
    - name: owner
      description: str, list of organizations associated with the course, e.g., MITx
    - name: marketing_url
      description: str, the URL for the course about page.
    - name: image
      description: json, course image
    - name: subjects
      description: json, the academic subjects that this course covers.
    - name: prerequisites
      description: array, array of courses a learner must complete before enrolling
        in the current course. May be empty.
    - name: prerequisites_raw
      description: text, any courses a learner must complete before enrolling in the
        current course
    - name: modified
      description: timestamp, the date and time the course was last modified.

  - name: raw__edxorg__discovery__api__mitx_course_run
    description: >
      Runs of the MITx courses in edX.org's catalog 10, one row per run per
      extraction (mit_edx_programs dlt pipeline, append).
    columns:
    - name: run_key
      description: str, unique identifier for the course run in {org}+{course number}+{run}
        format.
    - name: title
      description: str, title of the course
    - name: short_description
      description: str, the short description of the course and its content
    - name: full_description
      description: str, the long description of the course and its content.
    - name: level_type
      description: str, the course’s level of difficulty. Possible values are 'high_school',
        'introductory', 'intermediate', or 'advanced'.
    - name: languages
      description: str, the language for this course run.
    - name: image
      description: array, course image
    - name: pacing_type
      description: str, the pacing of the course. Possible values are 'self-paced'
        or 'instructor-paced'.
    - name: enrollment_type
      description: str, audit, verified, credit, or professional.
    - name: courserun_is_enrollable
      description: boolean, whether the course is currently open for enrollment
    - name: availability
      description: str, the availability of the course run. Possible values are 'Upcoming',
        'Starting Soon', 'Current' or 'Archived'
    - name: status
      description: str, the status of the course run. Possible values are 'published',
        'unpublished', or 'reviewed'
    - name: seats
      description: array, list of the available modes for this course. The member
        field includes type, price, currency, upgrade_deadline, credit_provider and
        credit_hours
    - name: staff
      description: array, list of instructors associated with the course
    - name: weeks_to_complete
      description: int, the number of weeks to complete the course.
    - name: min_effort
      description: int, the minimum number of estimated hours of effort per week.
    - name: max_effort
      description: int, the maximum number of estimated hours of effort per week.
    - name: estimated_hours
      description: int, the estimated number of hours to complete the course.
    - name: start_on
      description: timestamp, the course start date.
    - name: end_on
      description: datetime, the course end date.
    - name: enrollment_start
      description: timestamp, the course enrollment start date.
    - name: enrollment_end
      description: timestamp, the course enrollment end date.
    - name: announcement
      description: timestamp, date and time when the course will be announced and
        visible.
    - name: modified
      description: timestamp, the date and time the course was last modified.
