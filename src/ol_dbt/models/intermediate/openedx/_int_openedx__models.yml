      coursestructure_xml_block_display_name: Pset 1, coursestructure_xml_block_path: course/chapter/801r_Pset/Pset1.xml,
      coursestructure_xml_raw_xml: '<chapter display_name="Pset 1"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
