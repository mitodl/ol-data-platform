- name: test_int__openedx__content_files_colon_url_names
  description: >
    A block whose url_name has a colon is stored below its type folder (a:b in
    html/a/b.xml). Its key is the one the exclusion row carries (Learn's
    OlxArchive.key, mit-learn#4264), its html body is titled from html/<stem>.xml
    as Learn titles it (so not from html/a/b.xml), and a transcript names its
    video by the url_name on the video file, or by the url_name the video file's
    path spells when its root has none. A run whose exclusion rows
    predate the key falls back to the path rule.
  model: int__openedx__content_files
  given:
  - input: ref('stg__openedx__s3__course_xml_blocks')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: mitxonline,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: html,
      coursestructure_xml_block_display_name: Radiation Pressure, coursestructure_xml_block_path: course/html/802r/Radiation.xml,
      coursestructure_xml_raw_xml: '<html filename="Radiation" display_name="Radiation
        Pressure"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: mitxonline,
