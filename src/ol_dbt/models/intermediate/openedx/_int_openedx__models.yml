---
version: 2

models:
- name: int__openedx__content_files
  description: >
    One row per file of an MITx Online or xPRO course run's export that has text
    to read: OLX block XML from course_xml_blocks plus the documents and
    transcripts the openedx location extracts, including files whose extraction
    failed or found no text. Each carries the key, title and video MIT Learn's
    process_olx_path derives for it, and the flags of Learn's excluded_olx_paths.
    Which files become Learn ContentFiles, and which of two that share a key,
    is decided in integrations__learn__content_files.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: [source_system, courserun_readable_id, source_path]
  columns:
  - name: courserun_readable_id
    description: str, course run ID
    tests:
    - not_null
  - name: source_system
    description: str, mitxonline or xpro
    tests:
    - not_null
  - name: source_path
    description: str, path within the course export, e.g. course/static/handout.pdf
    tests:
    - not_null
  - name: file_extension
    description: str, lower-cased file extension with its dot
  - name: edx_module_id
    description: str, the module id MIT Learn keys the file's ContentFile by (OlxArchive.key
      from the exclusions asset, else get_edx_module_id's rule on the file's path).
      Two files can share one, e.g. foo bar.pdf and foo_bar.pdf.
    tests:
    - not_null
  - name: shares_edx_module_id
    description: boolean, true when another file of the run has the same edx_module_id.
      Learn keeps one ContentFile per key. An html block's pointer (html/x.xml) and
      body (html/x.html) share one, as do foo bar.pdf and foo_bar.pdf.
    tests:
    - not_null
  - name: title
    description: str, the title Learn's get_title_for_content gives the file
  - name: video_url_name
    description: str, for a transcript, the url_name of the video block that names
      it; else null
  - name: content
    description: str, the file's text; null for a failed or empty extraction
  - name: extraction_status
    description: str, extracted, empty or failed for a static file; extracted for
      a block
    tests:
    - not_null
  - name: extracted_at
    description: str, ISO 8601 time the text was extracted
  - name: release_date
    description: str, ISO 8601 UTC time (YYYY-MM-DDTHH:MM:SS.ffffffZ) MIT Learn releases
      the file to learners, from the OLX start dates on its path down from the course.
      Null when Learn leaves the file undated, for a run not yet checked, and for
      a run whose exclusions were written before the asset dated files.
  - name: is_exclusion_checked
    description: boolean, true when the exclusions asset ran over the export this
      run's blocks came from, so is_excluded is known
    tests:
    - not_null
  - name: is_excluded
    description: boolean, true when Learn's excluded_olx_paths drops the file; null
      when is_exclusion_checked is false
  - name: exclusion_reason
    description: str, why the file is excluded (staff_only, unreachable_tab, about_page,
      course_settings, non_content, legacy_announcements, unreferenced_static); null
      when it is not

unit_tests:
- name: test_int__openedx__content_files_matches_learn_derivations
  description: >
    Keys and titles as MIT Learn derives them, each case checked against Learn's
    content files for course-v1:MITxT+7.05x+2T2026 and
    course-v1:xPRO+SysEngx1+R28 on 2026-10-02. Every file of a Learn source's
    export has a row, excluded, empty, failed or sharing a key; a run the
    exclusions check has not covered has its files with the flags unknown.
  model: int__openedx__content_files
  given:
  - input: ref('stg__openedx__s3__course_xml_blocks')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: video,
      coursestructure_xml_block_display_name: Intro Video, coursestructure_xml_block_path: course/video/0123456789abcdef0123456789abcdef.xml,
      coursestructure_xml_block_attributes: '{"url_name": "0123456789abcdef0123456789abcdef"}',
      coursestructure_xml_raw_xml: '<video display_name="Intro Video"><transcript
        language="en" src="intro clip-en.srt"/></video>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    # A pointer file: attributes only. It shares its key with html/abcd.html.
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: html,
      coursestructure_xml_block_display_name: Welcome, coursestructure_xml_block_path: course/html/abcd.xml,
      coursestructure_xml_raw_xml: '<html filename="abcd" display_name="Welcome"/>',
      coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    # A url_name that is not a UUID has no jump URL.
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: chapter,
      coursestructure_xml_block_display_name: Week 1, coursestructure_xml_block_path: course/chapter/week_1.xml,
      coursestructure_xml_raw_xml: '<chapter display_name="Week 1"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    # Inline html makes Tika read a block as HTML: no attribute text, so a
    # vertical with no text of its own is skipped, and one with text is titled
    # from its file name.
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: vertical,
      coursestructure_xml_block_display_name: Empty, coursestructure_xml_block_path: course/vertical/empty_unit.xml,
      coursestructure_xml_raw_xml: '<vertical display_name="Empty"><html display_name="Raw"></html></vertical>',
      coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: vertical,
      coursestructure_xml_block_display_name: Peer Review, coursestructure_xml_block_path: course/vertical/peer_unit.xml,
      coursestructure_xml_raw_xml: '<vertical display_name="Peer Review"><html><p>Assess</p></html></vertical>',
      coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: problem,
      coursestructure_xml_block_display_name: Staff Check, coursestructure_xml_block_path: course/problem/staff_check.xml,
      coursestructure_xml_raw_xml: '<problem display_name="Staff Check"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:X+Y+R2", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: chapter,
      coursestructure_xml_block_display_name: Unchecked, coursestructure_xml_block_path: course/chapter/week_1.xml,
      coursestructure_xml_raw_xml: '<chapter display_name="Unchecked"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    # Checked, but against an older export than these blocks.
    - {courserun_readable_id: "course-v1:X+Y+R3", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v2, coursestructure_xml_block_type: chapter,
      coursestructure_xml_block_display_name: Stale, coursestructure_xml_block_path: course/chapter/week_1.xml,
      coursestructure_xml_raw_xml: '<chapter display_name="Stale"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    # The course root: course.xml has no display_name, so its title comes from
    # the file name, as Learn's does.
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: course,
      coursestructure_xml_block_display_name: "", coursestructure_xml_block_path: course/course.xml,
      coursestructure_xml_raw_xml: '<course url_name="R1" org="X" course="Y" />',
      coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: course,
      coursestructure_xml_block_display_name: Test Course, coursestructure_xml_block_path: course/course/R1.xml,
      coursestructure_xml_raw_xml: '<course display_name="Test Course"><chapter url_name="week_1"
        /></course>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    # Residential MITx is not a Learn source.
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: mitx,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: chapter,
      coursestructure_xml_block_display_name: Hidden, coursestructure_xml_block_path: course/chapter/other.xml,
      coursestructure_xml_raw_xml: '<chapter display_name="Hidden"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
  - input: ref('stg__openedx__s3__course_document_text')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: html/abcd.html, content_file_extension: .html, content_file_text: Hello,
      content_file_extraction_status: extracted}
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: tabs/5244487e.html, content_file_extension: .html, content_file_text: Tab,
      content_file_extraction_status: extracted}
    # Learn skips a file with no text, and keeps a failed one out of its prune.
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: about/effort.html, content_file_extension: .html, content_file_text: null,
      content_file_extraction_status: empty}
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: static/Dash 2010.pdf, content_file_extension: .pdf, content_file_text: null,
      content_file_extraction_status: failed}
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: policies/assets.json, content_file_extension: .json, content_file_text: "{}",
      content_file_extraction_status: extracted}
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: static/answer_key.pdf, content_file_extension: .pdf, content_file_text: Answers,
      content_file_extraction_status: extracted}
  - input: ref('stg__openedx__s3__course_transcript_text')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: static/intro clip-en.srt, content_file_extension: .srt, content_file_text: Hi
        there, content_file_extraction_status: extracted}
  # A file of a checked run with no row of its own is not excluded. R2 was
  # never checked and R3 was checked against an older export.
  - input: ref('stg__openedx__s3__course_file_exclusions')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_course_xml_version: v1, content_file_path: chapter/week_1.xml,
      content_file_is_excluded: false}
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_course_xml_version: v1, content_file_path: static/answer_key.pdf,
      content_file_is_excluded: true}
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_course_xml_version: v1, content_file_path: problem/staff_check.xml,
      content_file_is_excluded: true, content_file_exclusion_reason: staff_only}
    - {courserun_readable_id: "course-v1:X+Y+R3", content_file_source_system: xpro,
      content_file_course_xml_version: v1, content_file_path: chapter/week_1.xml,
      content_file_is_excluded: false}
  expect:
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/video/0123456789abcdef0123456789abcdef.xml",
      edx_module_id: "block-v1:X+Y+R1+type@video+block@0123456789abcdef0123456789abcdef",
      shares_edx_module_id: false, title: "Intro Video", is_exclusion_checked: true,
      is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/html/abcd.xml",
      edx_module_id: "block-v1:X+Y+R1+type@html+block@abcd", shares_edx_module_id: true,
      title: "Abcd", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/chapter/week_1.xml",
      edx_module_id: "block-v1:X+Y+R1+type@chapter+block@week_1", shares_edx_module_id: false,
      title: "Week 1", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/vertical/empty_unit.xml",
      edx_module_id: "block-v1:X+Y+R1+type@vertical+block@empty_unit", shares_edx_module_id: false,
      title: "Empty Unit", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/vertical/peer_unit.xml",
      edx_module_id: "block-v1:X+Y+R1+type@vertical+block@peer_unit", shares_edx_module_id: false,
      title: "Peer Unit", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/problem/staff_check.xml",
      edx_module_id: "block-v1:X+Y+R1+type@problem+block@staff_check", shares_edx_module_id: false,
      title: "Staff Check", is_exclusion_checked: true, is_excluded: true, exclusion_reason: staff_only}
    - {courserun_readable_id: "course-v1:X+Y+R2", source_path: "course/chapter/week_1.xml",
      edx_module_id: "block-v1:X+Y+R2+type@chapter+block@week_1", shares_edx_module_id: false,
      title: "Unchecked", is_exclusion_checked: false, is_excluded: null, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R3", source_path: "course/chapter/week_1.xml",
      edx_module_id: "block-v1:X+Y+R3+type@chapter+block@week_1", shares_edx_module_id: false,
      title: "Stale", is_exclusion_checked: false, is_excluded: null, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/course.xml",
      edx_module_id: "block-v1:X+Y+R1+type@course+block@course", shares_edx_module_id: false,
      title: "Course", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/course/R1.xml",
      edx_module_id: "block-v1:X+Y+R1+type@course+block@R1", shares_edx_module_id: false,
      title: "Test Course", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/html/abcd.html",
      edx_module_id: "block-v1:X+Y+R1+type@html+block@abcd", shares_edx_module_id: true,
      title: "Welcome", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/tabs/5244487e.html",
      edx_module_id: "block-v1:X+Y+R1+type@tabs+block@5244487e", shares_edx_module_id: false,
      title: "5244487E", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/about/effort.html",
      edx_module_id: "block-v1:X+Y+R1+type@about+block@effort", shares_edx_module_id: false,
      title: "Effort", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/static/Dash\
        \ 2010.pdf", edx_module_id: "asset-v1:X+Y+R1+type@asset+block@Dash_2010.pdf",
      shares_edx_module_id: false, title: "Dash 2010", is_exclusion_checked: true,
      is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/policies/assets.json",
      edx_module_id: "block-v1:X+Y+R1+type@policies+block@assets", shares_edx_module_id: false,
      title: "Assets", is_exclusion_checked: true, is_excluded: false, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/static/answer_key.pdf",
      edx_module_id: "asset-v1:X+Y+R1+type@asset+block@answer_key.pdf", shares_edx_module_id: false,
      title: "Answer Key", is_exclusion_checked: true, is_excluded: true, exclusion_reason: null}
    - {courserun_readable_id: "course-v1:X+Y+R1", source_path: "course/static/intro\
        \ clip-en.srt", edx_module_id: "asset-v1:X+Y+R1+type@asset+block@intro_clip-en.srt",
      shares_edx_module_id: false, title: "Intro Video", is_exclusion_checked: true,
      is_excluded: false, exclusion_reason: null}

- name: test_int__openedx__content_files_xml_text_as_tika_reads_it
  description: >
    Tika returns a non-HTML XML file's text unchanged, so a block's content is its
    XML as exported: ElementTree's "<a />" and "&#09;" in raw_xml go back to the
    "<a/>" and "&#9;" of the export. A block with inline html is read as HTML.
  model: int__openedx__content_files
  given:
  - input: ref('stg__openedx__s3__course_xml_blocks')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: course,
      coursestructure_xml_block_display_name: "", coursestructure_xml_block_path: course/course.xml,
      coursestructure_xml_raw_xml: '<course url_name="R1" org="X" course="Y" />',
      coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: problem,
      coursestructure_xml_block_display_name: Quiz, coursestructure_xml_block_path: course/problem/quiz.xml,
      coursestructure_xml_raw_xml: '<problem display_name="Quiz" markdown="(x) True&#09;&#10;"><choiceresponse
        /></problem>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: vertical,
      coursestructure_xml_block_display_name: Peer Review, coursestructure_xml_block_path: course/vertical/peer_unit.xml,
      coursestructure_xml_raw_xml: '<vertical display_name="Peer Review"><html><p>Assess
        &amp; grade</p></html></vertical>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
  - input: ref('stg__openedx__s3__course_document_text')
    rows: []
  - input: ref('stg__openedx__s3__course_transcript_text')
    rows: []
  - input: ref('stg__openedx__s3__course_file_exclusions')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_course_xml_version: v1, content_file_path: course.xml, content_file_is_excluded: false}
  expect:
    rows:
    - {edx_module_id: "block-v1:X+Y+R1+type@course+block@course", content: '<course
        url_name="R1" org="X" course="Y"/>'}
    - {edx_module_id: "block-v1:X+Y+R1+type@problem+block@quiz", content: '<problem
        display_name="Quiz" markdown="(x) True&#9;&#10;"><choiceresponse/></problem>'}
    - {edx_module_id: "block-v1:X+Y+R1+type@vertical+block@peer_unit", content: Assess
        & grade}

- name: test_int__openedx__content_files_release_date
  description: >
    release_date comes from the file's own exclusion row, also for a file with no
    text and for two files that share a key (integrations__learn__content_files
    gives the key the later date, as Learn's key_dates does).
  model: int__openedx__content_files
  given:
  - input: ref('stg__openedx__s3__course_xml_blocks')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: chapter,
      coursestructure_xml_block_display_name: Week 1, coursestructure_xml_block_path: course/chapter/week_1.xml,
      coursestructure_xml_raw_xml: '<chapter display_name="Week 1"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
    - {courserun_readable_id: "course-v1:X+Y+R1", coursestructure_xml_source_system: xpro,
      coursestructure_xml_archive_version: v1, coursestructure_xml_block_type: chapter,
      coursestructure_xml_block_display_name: Week 2, coursestructure_xml_block_path: course/chapter/week_2.xml,
      coursestructure_xml_raw_xml: '<chapter display_name="Week 2"/>', coursestructure_xml_retrieved_at: "2026-10-01T00:00:00Z"}
  - input: ref('stg__openedx__s3__course_document_text')
    rows:
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: static/notes_1.pdf, content_file_extension: .pdf, content_file_text: Notes,
      content_file_extraction_status: extracted}
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: static/notes 1.pdf, content_file_extension: .pdf, content_file_text: null,
      content_file_extraction_status: empty}
    - {courserun_readable_id: "course-v1:X+Y+R1", content_file_source_system: xpro,
      content_file_path: static/slides.pdf, content_file_extension: .pdf, content_file_text: Slides,
      content_file_extraction_status: extracted}
  - input: ref('stg__openedx__s3__course_transcript_text')
    rows: []
