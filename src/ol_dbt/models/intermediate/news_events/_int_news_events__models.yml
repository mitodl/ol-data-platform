      learn_tz_2: null, utc_name: UTC, utc_offset_minutes: 0, zone_abbreviation_1: null,
      zone_abbreviation_2: EDT, utc_offset_unreadable: false}
    - {event_id: d, start_date: "2026-05-26", end_date: "2026-05-31", zone_abbreviation: null,
