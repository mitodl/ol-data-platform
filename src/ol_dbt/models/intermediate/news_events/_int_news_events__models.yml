- name: test_int__news_events__mitpe_event_times_parses_each_case
  model: int__news_events__mitpe_event_times
  given:
  - input: ref('int__news_events__mitpe_event_time_parts')
    rows:
    - {event_id: a, time_range_raw: "12:30pm - 1pm", start_date: "2026-09-15", end_date: "2026-09-15",
      run_count: 2, hour_1: 12, minute_1: "30", ampm_1: pm, hour_2: 1, minute_2: "00",
      ampm_2: pm, utc_offset_hours: null, utc_offset_unreadable: false}
    # Noon to 1 PM, in daylight time although it says ET.
    - {event_id: b, time_range_raw: "12-1pm ET", start_date: "2025-03-27", end_date: "2025-03-27",
      run_count: 2, hour_1: 12, minute_1: "00", hour_2: 1, minute_2: "00", ampm_2: pm,
      zone_abbreviation: ET}
    - {event_id: c, time_range_raw: "8:00AM - 1:00PM JST", start_date: "2022-11-08",
      end_date: "2022-11-08", run_count: 2, hour_1: 8, minute_1: "00", ampm_1: am,
      hour_2: 1, minute_2: "00", ampm_2: pm, zone_abbreviation: JST}
    - {event_id: d, time_range_raw: "", start_date: "2026-05-26", end_date: "2026-05-31",
      run_count: 0, minute_1: "00", minute_2: "00"}
    - {event_id: e, time_range_raw: "40 minutes", start_date: "2022-09-16", end_date: "2022-09-16",
      run_count: 1, hour_1: 40, minute_1: "00", minute_2: "00"}
    - {event_id: f, time_range_raw: "9am-10am EDT", start_date: "2026-07-17", end_date: "2026-07-17",
      run_count: 2, hour_1: 9, minute_1: "00", ampm_1: am, hour_2: 10, minute_2: "00",
      ampm_2: am, zone_abbreviation: EDT}
    # EST in April is read as Eastern time, which is daylight time then.
    - {event_id: g, time_range_raw: "12:00 PM EST", start_date: "2026-04-07", end_date: "2026-04-07",
      run_count: 1, hour_1: 12, minute_1: "00", ampm_1: pm, minute_2: "00", zone_abbreviation: EST}
    - {event_id: h, time_range_raw: "10 - 9 AM", start_date: "2026-06-17", end_date: "2026-06-17",
      run_count: 2, hour_1: 10, minute_1: "00", hour_2: 9, minute_2: "00", ampm_2: am}
    - {event_id: i, time_range_raw: "9am", start_date: null, end_date: null, run_count: 1,
      hour_1: 9, minute_1: "00", ampm_1: am, minute_2: "00"}
    - {event_id: j, time_range_raw: "10am-11am PT", start_date: "2026-07-01", end_date: "2026-07-01",
      run_count: 2, hour_1: 10, minute_1: "00", ampm_1: am, hour_2: 11, minute_2: "00",
      ampm_2: am, zone_abbreviation: PT}
    - {event_id: k, time_range_raw: "11-1pm", start_date: "2026-02-10", end_date: "2026-02-10",
      run_count: 2, hour_1: 11, minute_1: "00", hour_2: 1, minute_2: "00", ampm_2: pm}
    - {event_id: l, time_range_raw: "11am-1", start_date: "2026-02-10", end_date: "2026-02-10",
      run_count: 2, hour_1: 11, minute_1: "00", ampm_1: am, hour_2: 1, minute_2: "00"}
    - {event_id: m, time_range_raw: "TBD", start_date: "2026-02-10", end_date: "2026-02-10",
      run_count: 0, minute_1: "00", minute_2: "00"}
    - {event_id: n, time_range_raw: "14:00 - 15:30", start_date: "2026-02-10", end_date: "2026-02-10",
      run_count: 2, hour_1: 14, minute_1: "00", hour_2: 15, minute_2: "30"}
    # A US abbreviation wins over the offset beside it.
    - {event_id: o, time_range_raw: "7:45 AM - 5:30 PM (EDT, UTC-4)", start_date: "2026-06-03",
      end_date: "2026-06-03", run_count: 2, hour_1: 7, minute_1: "45", ampm_1: am,
      hour_2: 5, minute_2: "30", ampm_2: pm, utc_offset_hours: -4, zone_abbreviation: EDT,
      utc_offset_minutes: 0}
    - {event_id: p, time_range_raw: "8:00 - 16:10 EEST (UTC+3)", start_date: "2026-06-03",
