---
version: 2

models:
- name: int__news_events__mitpe_event_time_parts
  description: >
    The pieces of every MIT Professional Education event's dates and free-text time
    range, read by both parses of it (int__news_events__mitpe_event_times and
    int__news_events__mitpe_event_times_learn). A missing start or end date is
    filled from the other. The runs are read twice: learn_* from the range as
    written, as MIT Learn reads it, and the unprefixed ones from the range with any
    UTC or GMT offset taken out and "a.m."/"p.m." read as AM/PM.
  columns:
  - name: event_id
    description: str, the event's uuid
    tests:
    - not_null
    - unique
  - name: time_range_raw
    description: str, the feed's free-text time range
  - name: start_date
    description: str, the start date as the feed gives it (YYYY-MM-DD), or the end
      date when it has none
  - name: end_date
    description: str, the end date as the feed gives it (YYYY-MM-DD), or the start
      date when it has none
  - name: zone_abbreviation
    description: str, the first US zone abbreviation (ET, EST, EDT, CT, CST, CDT,
      MT, MST, MDT, PT, PST, PDT) or JST or KST in the range, upper case and a whole
      word
  - name: zone_abbreviation_1
    description: str, the zone abbreviation in the first normalized run
  - name: zone_abbreviation_2
    description: str, the zone abbreviation in the second normalized run
  - name: utc_name
    description: str, UTC or GMT where the range names either, upper case and a whole
      word
  - name: utc_offset_hours
    description: int, the hours of a readable "UTC+3" or "GMT-4" offset
  - name: utc_offset_minutes
    description: int, the minutes of a readable offset ("UTC+5:30" is 30), 0 for a
      whole-hour one
  - name: utc_offset_unreadable
    description: bool, true when the range has a UTC/GMT offset that is not H, HH,
      H:MM, HH:MM or HHMM ("UTC+5.5")
  - name: run_count
    description: int, the number of "<hour>[:<minute>]<non-digits>" runs in the normalized
      range
  - name: hour_1
    description: int, the first run's hour as written
  - name: minute_1
    description: str, the first run's minutes, '00' when it has none
  - name: ampm_1
    description: str, the first run's am or pm, lower case
  - name: hour_2
    description: int, the second run's hour as written
  - name: minute_2
    description: str, the second run's minutes, '00' when it has none
  - name: ampm_2
    description: str, the second run's am or pm, lower case
  - name: learn_run_count
    description: int, run_count as MIT Learn splits the range
  - name: learn_hour_1
    description: int, hour_1 as MIT Learn reads it
  - name: learn_minute_1
    description: str, minute_1 as MIT Learn reads it
  - name: learn_ampm_1
    description: str, ampm_1 as MIT Learn reads it ("a.m." is not AM)
  - name: learn_hour_2
    description: int, hour_2 as MIT Learn reads it
  - name: learn_minute_2
    description: str, minute_2 as MIT Learn reads it
  - name: learn_ampm_2
    description: str, ampm_2 as MIT Learn reads it
  - name: learn_tz_1
    description: str, the 2-3 letter word after the first run's AM/PM, upper case,
      which is where MIT Learn finds a zone
  - name: learn_tz_2
    description: str, the 2-3 letter word after the second run's AM/PM, upper case

- name: int__news_events__mitpe_event_times
  description: >
    Start and end of every MIT Professional Education event, from its dates and
    free-text time range. The platform's parse: "12-1pm" is noon to 1 PM, a zone
    abbreviation picks its region's zone with daylight time, and a range that
    cannot be read leaves the instants null with time_parse_status saying why.
    int__news_events__mitpe_event_times_learn keeps MIT Learn's parse for the Learn
    event feed view. An event with neither date is dropped.
  columns:
  - name: event_id
    description: str, the event's uuid
    tests:
    - not_null
    - unique
  - name: event_start_date
    description: date, the event's first day
    tests:
    - not_null
  - name: event_end_date
    description: date, the event's last day
    tests:
    - not_null
  - name: start_on
    description: timestamp with time zone, the event's start; null unless time_parse_status
      is parsed or end_before_start
    data_type: timestamp with time zone
  - name: end_on
    description: timestamp with time zone, the event's end as written; null unless
      time_parse_status is parsed or end_before_start
    data_type: timestamp with time zone
  - name: time_parse_status
    description: str, parsed; end_before_start (read, but the end is before the start);
      no_time (the range is empty); unparseable (no time, more than two, or an hour
      or minute out of range)
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [parsed, end_before_start, no_time, unparseable]
  - name: start_time_zone
    description: str, the zone (IANA name) the start was read in, America/New_York
      when the range names none; null unless time_parse_status is parsed or end_before_start
  - name: end_time_zone
    description: str, the zone the end was read in, the start's unless the end names
      its own
- name: int__news_events__mitpe_event_times_learn
  description: >
    Start and end instants of every MIT Professional Education event as MIT
    Learn's parse_date_time_range (news_events/etl/utils.py) reads them, defects
    included: "12-1pm" is midnight to 1 PM, ET and PT are fixed standard-time
    offsets, an unreadable range is noon, and an end before the start becomes the
    start. Read only by integrations__learn__event_feed_items, for parity with
    Learn. An event with neither date is dropped.
  columns:
  - name: event_id
    description: str, the event's uuid
    tests:
    - not_null
    - unique
  - name: start_on
    description: timestamp with time zone, the event's start as Learn reads it
    data_type: timestamp with time zone
    tests:
    - not_null
  - name: end_on
    description: timestamp with time zone, the event's end as Learn reads it, never
      before its start
    data_type: timestamp with time zone
    tests:
    - not_null

unit_tests:
- name: test_int__news_events__mitpe_event_time_parts_splits_the_range
