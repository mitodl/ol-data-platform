      hour_2: 1, minute_2: "00", ampm_2: pm, learn_run_count: 2, learn_hour_1: 12,
      learn_minute_1: "30", learn_ampm_1: pm, learn_hour_2: 1, learn_minute_2: "00",
      learn_ampm_2: pm, learn_tz_1: null, learn_tz_2: null, utc_name: null, utc_offset_minutes: null,
      zone_abbreviation_1: null, zone_abbreviation_2: null, utc_offset_unreadable: false}
    - {event_id: b, start_date: "2025-03-27", end_date: "2025-03-27", zone_abbreviation: ET,
