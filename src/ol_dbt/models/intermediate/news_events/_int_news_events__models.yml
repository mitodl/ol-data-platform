    - {event_id: q, time_range_raw: "8 p.m.", start_date: "2026-02-10", end_date: "2026-02-10",
      run_count: 1, hour_1: 8, minute_1: "00", ampm_1: pm, minute_2: "00"}
    - {event_id: r, time_range_raw: 9-5, start_date: '2026-07-15', end_date: '2026-07-15',
