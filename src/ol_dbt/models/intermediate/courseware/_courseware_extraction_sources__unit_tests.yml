---
unit_tests:
- name: test_int__courseware__extraction_sources_context_sequentials_and_about_fields
  description: >
    A module overview goes to the context scope wherever it sits, and so does a
    chapter's only sequential titled as an intro or wrap-up, as in mit-learn's
    unit builder. An introduction beside other sequentials stays a unit, and the
    units left are renumbered. As there, a staff-only sequential or chapter, or a
    sequential hidden from the table of contents, is neither a unit nor context and
    does not count toward its chapter's size. About pages other than the description
    pages are prefixed with their field's name. A document a context sequential links
    is read in context after the linking block, and one linked only from a staff-only
    sequential stays in materials.
