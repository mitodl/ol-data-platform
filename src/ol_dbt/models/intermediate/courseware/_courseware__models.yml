---
version: 2

models:
- name: int__courseware__extraction_sources
  description: The text the courseware claim extractor reads, one row per source item
    of each scope (a sequential, the course context, or the course documents) of an
    Open edX course run, in reading order. Problem text is the question side only.
    OCW courses are scoped by page group, section page or calendar session, with answer
    keys left out; a link to a resource also takes what the resource's description
    links.
  config:
    meta:
      # The text it reads (raw__openedx__s3__course_transcript_text and
      # course_document_text, raw__edxorg__s3__course_xml_blocks) is absent from QA raw.
      qa_buildable: false
  columns:
  - name: platform
    description: str, mitxonline, mitxpro, residential or ocw
    tests:
    - not_null
  - name: courserun_readable_id
    description: str, the course run; for OCW, Learn's run id
    tests:
    - not_null
  - name: course_title
    description: str, the course block's title from dim_course_content, or the OCW
      course title
  - name: scope_id
    description: str, the sequential's block id, an OCW page key or session-N / week-N,
      or 'context' or 'materials'
    tests:
    - not_null
  - name: scope_kind
    description: str, unit, context or materials
    tests:
    - accepted_values:
        values: [unit, context, materials]
  - name: scope_title
    description: str, the sequential's title or the scope's name
  - name: scope_position
    description: int, the scope's order in the course; 0 for context, 9999 for materials
  - name: source_position
    description: int, the source's order within its scope, from 1
  - name: source_ref
    description: str, the block id for blocks, the export path for files, the OCW
      content file key
    tests:
    - not_null
  - name: source_kind
    description: str, html, problem, video_transcript, document, about_page, tabs_page,
      info_page, page (OCW) or course_description (OCW)
  - name: source_title
    description: str, the block's display name or the file's path
  - name: source_text
    description: str, the text as the extractor reads it
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      column_list: [platform, courserun_readable_id, scope_id, source_ref]

- name: int__courseware__extractions
  description: Every claim extraction, and whether it is current, the one its scope
    part is read from now. A scope's newest complete reading is current, so a run
    that extracts only some parts of a new reading changes nothing until the rest
    succeed.
  columns:
  - name: extraction_key
    description: str, sha256 of everything the call depended on (extractor, prompt
      and schema versions, model, effort, run, scope and the full message text)
    tests:
    - not_null
    - unique
  - name: extractor_id
    description: str, the extractor, e.g. courseware_claims_v1
  - name: prompt_version
    description: str, hash of the system prompt
  - name: schema_version
    description: str, hash of the output JSON schema
  - name: model_id
    description: str, the model id as sent to the provider
  - name: effort
    description: str, output_config.effort for the call
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the run the scope belongs to
  - name: scope_id
    description: str, the sequential block id, or 'context' or 'materials'
  - name: scope_kind
    description: str, unit, context or materials
  - name: scope_title
    description: str, the sequential title or the scope name
  - name: scope_position
    description: int, the scope's order in the course; 0 for context, 9999 for materials
  - name: scope_part
    description: int, which part of a scope split to fit the input budget, from 1
  - name: scope_part_count
    description: int, how many parts the scope was split into
  - name: input_text_checksum
    description: str, sha256 of the source text the call read
  - name: scope_part_checksums
    description: str, every part's input_text_checksum, in order and comma-separated,
      as the run that made this call split the scope
  - name: source_count
    description: int, number of sources the call read
  - name: truncated_source_count
    description: int, number of those sources cut to the per-source limit
  - name: sources_json
    description: str, JSON list of {source_id, source_ref, included_chars, total_chars}
  - name: summary
    description: str, the model's summary of the scope
  - name: notes_json
    description: str, JSON list of the model's notes plus truncation notes
  - name: stop_reason
    description: str, the response's stop_reason
  - name: input_tokens
    description: int, uncached input tokens billed
  - name: output_tokens
    description: int, output tokens billed, thinking included
  - name: cache_read_input_tokens
    description: int, input tokens read from the prompt cache
  - name: cache_creation_input_tokens
    description: int, input tokens written to the prompt cache
  - name: extracted_at
    description: timestamp, when the call returned
  - name: is_current
    description: boolean, whether this is the extraction its scope part is read from
      now
    tests:
    - not_null

- name: int__courseware__claims
  description: Every extracted claim with its scope, extractor version, evidence counts
    and normalized concept label key.
  columns:
  - name: extraction_key
    description: str, the extraction the claim came from
    tests:
    - not_null
  - name: claim_ordinal
    description: int, the claim's position in the extraction
  - name: platform
    description: str, mitxonline, mitxpro or residential
  - name: courserun_readable_id
    description: str, the course run the scope belongs to
  - name: scope_id
    description: str, the sequential's block id, or 'context' or 'materials'
  - name: scope_kind
    description: str, unit, context or materials
  - name: scope_title
    description: str, the sequential's title or the scope's name
  - name: scope_position
    description: int, the scope's order in the course
  - name: scope_part
    description: int, which part of a split scope the claim came from, from 1
  - name: extractor_id
    description: str, the extractor version
  - name: prompt_version
    description: str, hash of the system prompt
  - name: model_id
    description: str, the model that made the claim
  - name: extracted_at
    description: timestamp, when the extraction returned
  - name: is_current
    description: boolean, whether the claim's extraction is the one its scope part
      is read from now (int__courseware__extractions)
  - name: claim_kind
    description: str, concept, skill, assumed_knowledge, assessment_expectation, learning_outcome,
      declared_prerequisite or audience
  - name: label
    description: str, the model's canonical label; the statement for outcomes and
      audience
  - name: description
    description: str, the model's description of how the scope treats the claim
  - name: concept_kind
    description: str, concept, method, tool, dataset or application (concepts only)
  - name: teaching_status
    description: str, taught, reviewed, used or mentioned (concepts and skills)
  - name: how_used
    description: str, where the material relies on assumed knowledge
  - name: flagged_as_prior
    description: boolean, whether the material frames assumed knowledge as prior
  - name: bloom_process
    description: str, Bloom revised cognitive process (assessments and outcomes)
  - name: knowledge_type
    description: str, Bloom revised knowledge type (outcomes)
  - name: prerequisite_kind
    description: str, prerequisite, corequisite, recommended or explicitly_none
  - name: course_ref
    description: str, a course a declared prerequisite names
  - name: related_concept_labels_json
    description: str, JSON list of concept labels an assessment or outcome names
  - name: concept_label_key
    description: str, the label as normalized by the courseware_label_key macro (lowercase,
      plus and hash signs spelled out, separators collapsed), for concept, assumed
      knowledge and declared prerequisite claims; null for a label with no letters
      or numbers
  - name: evidence_count
    description: int, evidence passages quoted for the claim
  - name: verified_evidence_count
    description: int, passages found in the source text (exact or fuzzy)
  - name: is_verified
    description: boolean, whether at least one evidence passage was found in the source
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      column_list: [extraction_key, claim_ordinal]

- name: int__courseware__extraction_allowlist
  description: One row per course run that courseware_extraction_allowlist approves
    for claim extraction, with the level of the allowlist row that approved it. int__courseware__extraction_sources
    is built for these runs only.
  config:
    meta:
      qa_buildable: false
  columns:
  - name: platform
    description: str, mitxonline, mitxpro or residential
    tests:
    - not_null
  - name: courserun_readable_id
    description: str, the approved run
    tests:
    - not_null
  - name: allowlist_level
    description: str, courserun, course or platform, the most specific allowlist row
      that matched the run
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [courserun, course, platform]
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      column_list: [platform, courserun_readable_id]

unit_tests:
- name: test_int__courseware__extraction_sources_scopes_ocw_course
  description: >
    The site publishes visualizations/light1/ but no visualizations/ page, so light1
    is a unit of its own and its notes are read there, not dropped. "Review of Aqueous
    Solutions" and a lecture opening "Solution of dynamic equilibrium equations" name
    topics, so they stay in materials; ps1_key and "Mock Exam Key" are answer keys
    and are left out. c2's readings page links c1's aqueous solutions notes, which
    stay c1's: c2 does not read them and they still count as unlinked in c1.
  model: int__courseware__extraction_sources
  overrides:
    vars:
      courseware_ocw_courses: [c1]
  given:
  - input: ref('dim_course_content')
    rows: []
  - input: ref('int__combined__course_xml_blocks')
    rows: []
  - input: ref('stg__openedx__s3__course_file_exclusions')
    rows: []
  - input: ref('stg__openedx__s3__course_document_text')
    rows: []
  - input: ref('stg__openedx__s3__course_transcript_text')
    rows: []
  - input: ref('int__ocw__live_courses')
    rows:
    - {course_slug: c1, courserun_readable_id: run1, course_title: Course One, course_description_html: <p>About
        the course.</p>}
    - {course_slug: c2, courserun_readable_id: run2, course_title: Course Two, course_description_html: <p>Another
        course.</p>}
  - input: ref('stg__ocw__s3__course_content')
    rows: []
  - input: ref('int__ocw__content_files')
    rows:
    - {courserun_readable_id: run2, course_slug: c2, content_file_key: courses/c2/pages/readings/,
      content_type: page, title: Readings, file_extension: null, content_tags: null,
      content: '<p>Readings.</p><a href="/courses/c1/resources/mit5_111f08_lec3">Aqueous</a>'}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/pages/visualizations/light1/,
      content_type: page, title: Light, file_extension: null, content_tags: null,
      content: '<p>Light and optics.</p><a href="/courses/c1/resources/light_notes">Notes</a>'}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/light_notes/,
      content_type: pdf, title: Light Notes, file_extension: .pdf, content_tags: null,
      content: Notes on light and optics.}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/mit5_111f08_lec3/,
      content_type: pdf, title: Review of Aqueous Solutions, file_extension: .pdf,
      content_tags: null, content: Review of aqueous solutions. An aqueous solution
        is a solute in water.}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/mit2_092f09_lec15/,
      content_type: pdf, title: mit2_092f09_lec15.pdf, file_extension: .pdf, content_tags: null,
      content: Solution of dynamic equilibrium equations by direct integration.}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/ps1_key/,
      content_type: pdf, title: ps1_key, file_extension: .pdf, content_tags: null,
      content: 1. The force is 3 N.}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/mock_exam/,
      content_type: pdf, title: Mock Exam Key, file_extension: .pdf, content_tags: null,
      content: 1. Beowulf is an epic.}
  expect:
    rows:
    - {scope_id: context, scope_kind: context, scope_title: Course context, source_ref: courses/c2/,
      source_kind: course_description}
    - {scope_id: courses/c2/pages/readings/, scope_kind: unit, scope_title: Readings,
      source_ref: courses/c2/pages/readings/, source_kind: page}
    - {scope_id: context, scope_kind: context, scope_title: Course context, source_ref: courses/c1/,
      source_kind: course_description}
    - {scope_id: courses/c1/pages/visualizations/light1/, scope_kind: unit, scope_title: Light,
      source_ref: courses/c1/pages/visualizations/light1/, source_kind: page}
    - {scope_id: courses/c1/pages/visualizations/light1/, scope_kind: unit, scope_title: Light,
      source_ref: courses/c1/resources/light_notes/, source_kind: document}
    - {scope_id: materials, scope_kind: materials, scope_title: Course materials,
      source_ref: courses/c1/resources/mit5_111f08_lec3/, source_kind: document}
    - {scope_id: materials, scope_kind: materials, scope_title: Course materials,
      source_ref: courses/c1/resources/mit2_092f09_lec15/, source_kind: document}

- name: test_int__courseware__extraction_sources_reads_ocw_solution_file_names
  description: >
    A file name carries "sol" glued to other letters both in answer keys and in
    topics. Solnhofen limestone, Solis and Wets, and lab 2's solids are teaching
    material and stay; exam_smpsolqii2a (a sample answer to exam question II-2A)
    and samplesol are answer keys and are left out.
  model: int__courseware__extraction_sources
  given:
  - input: ref('dim_course_content')
    rows: []
  - input: ref('int__combined__course_xml_blocks')
    rows: []
  - input: ref('stg__openedx__s3__course_file_exclusions')
    rows: []
  - input: ref('stg__openedx__s3__course_document_text')
    rows: []
  - input: ref('stg__openedx__s3__course_transcript_text')
    rows: []
  - input: ref('int__ocw__live_courses')
    rows:
    - {course_slug: c1, courserun_readable_id: run1, course_title: Course One, course_description_html: <p>About
        the course.</p>}
  - input: ref('stg__ocw__s3__course_content')
    rows: []
  - input: ref('int__ocw__content_files')
    rows:
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/solnhofenlimestone/,
      content_type: file, title: SolnhofenLimestone.txt, file_extension: .txt, content_tags: '["Assignments"]',
      content: Measure the yield strength of Solnhofen limestone.}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/ses5_solis_wets/,
      content_type: pdf, title: ses5_solis_wets.pdf, file_extension: .pdf, content_tags: '["Lecture
        Notes"]', content: Minimization by Random Search Techniques by Solis and Wets.}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/catialab2solids/,
      content_type: pdf, title: catialab2solids.pdf, file_extension: .pdf, content_tags: '["Laboratory
        Assignments"]', content: 'Recitation 1: Introduction to Digital Project.'}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/exam_smpsolqii2a/,
      content_type: pdf, title: exam_smpsolqii2a.pdf, file_extension: .pdf, content_tags: '["Exams"]',
      content: Ohio County Election 2004 Results. Answer to Question II-2A.}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/samplesoltxt/,
      content_type: file, title: samplesol.txt, file_extension: .txt, content_tags: '["Problem
        Sets"]', content: 'Edit Distance: 73'}
  expect:
    rows:
    - {scope_id: context, source_ref: courses/c1/}
    - {scope_id: materials, source_ref: courses/c1/resources/solnhofenlimestone/}
    - {scope_id: materials, source_ref: courses/c1/resources/ses5_solis_wets/}
    - {scope_id: materials, source_ref: courses/c1/resources/catialab2solids/}

- name: test_int__courseware__extraction_sources_follows_ocw_resource_descriptions
  description: >
    Session 10's page links a video clip whose description links the session notes.
    The clip has no transcript, so int__ocw__content_files drops it, but the notes
    are
    read in the page's unit, after the page, and do not land in materials. The clip's
    link to another course's notes is left to that course.
  model: int__courseware__extraction_sources
  given:
  - input: ref('dim_course_content')
    rows: []
  - input: ref('int__combined__course_xml_blocks')
    rows: []
  - input: ref('stg__openedx__s3__course_file_exclusions')
    rows: []
  - input: ref('stg__openedx__s3__course_document_text')
    rows: []
  - input: ref('stg__openedx__s3__course_transcript_text')
    rows: []
  - input: ref('int__ocw__live_courses')
    rows:
    - {course_slug: c1, courserun_readable_id: run1, course_title: Course One, course_description_html: <p>About
        the course.</p>}
  - input: ref('stg__ocw__s3__course_content')
    rows:
    - {course_slug: c1, coursecontent_kind: resource, coursecontent_s3_key: courses/c1/resources/clip-1-quotient-rule/data.json,
      coursecontent_body: '<p><a href="/courses/c1/resources/ses10a/">Accompanying
        Notes (PDF)</a></p> <p><a href="/courses/c0/resources/lec4/">Lecture 4</a></p>'}
  - input: ref('int__ocw__content_files')
    rows:
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/pages/differentiation/,
      content_type: page, title: Differentiation, file_extension: null, content_tags: null,
      content: '<p>Part A.</p><a href="/courses/c1/pages/differentiation/session-10-quotient-rule/">Session
        10</a>'}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/pages/differentiation/session-10-quotient-rule/,
      content_type: page, title: 'Session 10: Quotient Rule', file_extension: null,
      content_tags: null, content: '<p>The quotient rule.</p><a href="/courses/c1/resources/clip-1-quotient-rule/">Clip
        1</a><a href="/courses/c1/resources/ex10prb/">Problems</a>'}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/ses10a/,
      content_type: pdf, title: MIT18_01SCF10_Ses10a.pdf, file_extension: .pdf, content_tags: null,
      content: The derivative of u/v is (u'v - uv')/v^2.}
    - {courserun_readable_id: run1, course_slug: c1, content_file_key: courses/c1/resources/ex10prb/,
      content_type: pdf, title: MIT18_01SCF10_ex10prb.pdf, file_extension: .pdf, content_tags: null,
      content: Differentiate x/(x+1).}
  expect:
    rows:
    - {scope_id: context, source_position: 1, source_ref: courses/c1/}
    - {scope_id: courses/c1/pages/differentiation/, source_position: 1, source_ref: courses/c1/pages/differentiation/}
    - {scope_id: courses/c1/pages/differentiation/, source_position: 2, source_ref: courses/c1/pages/differentiation/session-10-quotient-rule/}
    - {scope_id: courses/c1/pages/differentiation/, source_position: 3, source_ref: courses/c1/resources/ses10a/}
    - {scope_id: courses/c1/pages/differentiation/, source_position: 4, source_ref: courses/c1/resources/ex10prb/}
