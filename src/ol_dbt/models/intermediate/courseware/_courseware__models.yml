- name: test_int__courseware__latest_scope_inputs_keeps_only_each_runs_latest_read
  description: >
    An earlier read of a run is dropped, and each run keeps its own latest read.
  model: int__courseware__latest_scope_inputs
  given:
  - input: source('courseware_intermediate', 'courseware_scope_input')
    rows:
    - {platform: mitxonline, courserun_readable_id: run, scope_id: seq-1, scope_part: 1,
      scope_part_count: 1, input_text_checksum: old, observed_at: '2026-10-15T00:00:00'}
    - {platform: mitxonline, courserun_readable_id: run, scope_id: seq-1, scope_part: 1,
      scope_part_count: 1, input_text_checksum: new, observed_at: '2026-10-16T00:00:00'}
    - {platform: mitxonline, courserun_readable_id: other-run, scope_id: seq-1, scope_part: 1,
      scope_part_count: 1, input_text_checksum: only, observed_at: '2026-10-14T00:00:00'}
  expect:
    rows:
    - {courserun_readable_id: run, input_text_checksum: new}
    - {courserun_readable_id: other-run, input_text_checksum: only}

- name: test_int__courseware__scope_part_coverage_flags_a_failed_part
  description: >
    seq-7 grew from one part to two and part 2 failed, so part 2 has no extraction
    and
    is flagged. seq-8's text changed and its re-extraction failed, so it has only
    an
    older promoted extraction and is flagged too. A matching extraction under a
    version nobody promoted covers nothing.
  model: int__courseware__scope_part_coverage
  given:
  - input: ref('int__courseware__latest_scope_inputs')
    rows:
    - {platform: mitxonline, courserun_readable_id: run, scope_id: seq-7, scope_part: 1,
      scope_part_count: 2, input_text_checksum: g1, observed_at: '2026-10-16T00:00:00'}
    - {platform: mitxonline, courserun_readable_id: run, scope_id: seq-7, scope_part: 2,
      scope_part_count: 2, input_text_checksum: g2, observed_at: '2026-10-16T00:00:00'}
    - {platform: mitxonline, courserun_readable_id: run, scope_id: seq-8, scope_part: 1,
      scope_part_count: 1, input_text_checksum: changed, observed_at: '2026-10-16T00:00:00'}
    - {platform: mitxonline, courserun_readable_id: run, scope_id: seq-9, scope_part: 1,
      scope_part_count: 1, input_text_checksum: t, observed_at: '2026-10-16T00:00:00'}
  - input: ref('int__courseware__extractions')
    rows:
    - {extraction_key: grown_old_1, platform: mitxonline, courserun_readable_id: run,
      scope_id: seq-7, scope_part: 1, is_promoted_version: true, matches_current_input: false}
    - {extraction_key: grown_new_1, platform: mitxonline, courserun_readable_id: run,
      scope_id: seq-7, scope_part: 1, is_promoted_version: true, matches_current_input: true}
    - {extraction_key: stale, platform: mitxonline, courserun_readable_id: run, scope_id: seq-8,
      scope_part: 1, is_promoted_version: true, matches_current_input: false}
    - {extraction_key: trial, platform: mitxonline, courserun_readable_id: run, scope_id: seq-9,
      scope_part: 1, is_promoted_version: false, matches_current_input: true}
  expect:
    rows:
    - {scope_id: seq-7, scope_part: 1, promoted_extraction_count: 2, has_promoted_extraction: true,
      has_current_input_extraction: true}
    - {scope_id: seq-7, scope_part: 2, promoted_extraction_count: 0, has_promoted_extraction: false,
      has_current_input_extraction: false}
    - {scope_id: seq-8, scope_part: 1, promoted_extraction_count: 1, has_promoted_extraction: true,
      has_current_input_extraction: false}
    - {scope_id: seq-9, scope_part: 1, promoted_extraction_count: 0, has_promoted_extraction: false,
      has_current_input_extraction: false}
