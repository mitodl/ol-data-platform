---
unit_tests:
- name: test_int__courseware__release_resource_concepts_keys_each_course_by_its_sense
  description: >
    Two courses that use "kernel" for two meanings point at two concepts, so Learn
    gets each course's sense by id, not a shared label. A relation only proposed
    claims support, a concept the release does not publish as learner-facing (numpy
    is proposed, so it is not a release concept; MNIST's description says it is not
    learner-facing, and Gram matrix has no description yet), and an inferred
    requirement failing the support rule are left out.
  model: int__courseware__release_resource_concepts
  given:
  - input: ref('int__courseware__learn_course_runs')
    rows:
    - {etl_source: mitxonline, readable_id: "course-v1:MITx+6.033", courserun_fk: os,
      courserun_readable_id: "course-v1:MITx+6.033+1T2026"}
    - {etl_source: mitxonline, readable_id: "course-v1:MITx+6.036", courserun_fk: ml,
      courserun_readable_id: "course-v1:MITx+6.036+1T2026"}
  - input: ref('bridge_courserun_concept')
    rows:
    - {courserun_fk: os, concept_fk: os-kernel, relation: teaches, requirement_source: null,
      claim_count: 2, accepted_claim_count: 2, first_scope_position: 3, passes_support_rule: true}
    - {courserun_fk: ml, concept_fk: ml-kernel, relation: teaches, requirement_source: null,
      claim_count: 4, accepted_claim_count: 1, first_scope_position: 7, passes_support_rule: true}
    - {courserun_fk: ml, concept_fk: svm, relation: uses, requirement_source: null,
      claim_count: 1, accepted_claim_count: 0, first_scope_position: 2, passes_support_rule: true}
    - {courserun_fk: ml, concept_fk: numpy, relation: uses, requirement_source: null,
      claim_count: 1, accepted_claim_count: 1, first_scope_position: 1, passes_support_rule: true}
    - {courserun_fk: ml, concept_fk: os-kernel, relation: requires, requirement_source: inferred,
      claim_count: 1, accepted_claim_count: 1, first_scope_position: 1, passes_support_rule: false}
    - {courserun_fk: ml, concept_fk: mnist, relation: uses, requirement_source: null,
      claim_count: 1, accepted_claim_count: 1, first_scope_position: 1, passes_support_rule: true}
    - {courserun_fk: ml, concept_fk: gram, relation: uses, requirement_source: null,
      claim_count: 1, accepted_claim_count: 1, first_scope_position: 1, passes_support_rule: true}
  - input: ref('int__courseware__release_concepts')
    rows:
    - {concept_id: os-kernel, name: kernel, is_learner_facing: true}
    - {concept_id: ml-kernel, name: kernel, is_learner_facing: true}
    - {concept_id: svm, name: support vector machine, is_learner_facing: true}
    - {concept_id: mnist, name: MNIST, is_learner_facing: false}
    - {concept_id: gram, name: Gram matrix, is_learner_facing: null}
  expect:
    rows:
    - {readable_id: "course-v1:MITx+6.033", concept_id: os-kernel, concept_name: kernel,
      relation: teaches, claim_count: 2}
    - {readable_id: "course-v1:MITx+6.036", concept_id: ml-kernel, concept_name: kernel,
      relation: teaches, claim_count: 1}

- name: test_int__courseware__learn_course_runs_takes_the_newest_eligible_run
  description: >
    A course's newest extraction is from a run the source policy excludes, so the
    release publishes its older eligible run, and both resource projections read
    that one.
  model: int__courseware__learn_course_runs
  given:
  - input: ref('int__courseware__source_eligibility')
    rows:
    - {platform: mitxonline, courserun_readable_id: "course-v1:X+Y+1T2026", is_source_eligible: true}
    - {platform: mitxonline, courserun_readable_id: "course-v1:X+Y+2T2026", is_source_eligible: false}
  - input: ref('dim_courseware_extraction')
    rows:
    - {platform: mitxonline, courserun_readable_id: "course-v1:X+Y+1T2026", courserun_fk: r1,
      extracted_at: "2026-10-01T00:00:00", is_current: true}
    - {platform: mitxonline, courserun_readable_id: "course-v1:X+Y+2T2026", courserun_fk: r2,
      extracted_at: "2026-10-17T00:00:00", is_current: true}
  - input: ref('dim_course_run')
    rows:
    - {courserun_pk: r1, course_fk: c1, is_current: true}
    - {courserun_pk: r2, course_fk: c1, is_current: true}
  - input: ref('dim_course')
    rows:
    - {course_pk: c1, course_readable_id: "course-v1:X+Y", course_title: Data Analysis,
      is_current: true}
  expect:
    rows:
    - {etl_source: mitxonline, readable_id: "course-v1:X+Y", courserun_fk: r1, courserun_readable_id: "course-v1:X+Y+1T2026"}
