---
unit_tests:
- name: test_int__courseware__claims_current_parts_follow_the_newest_extraction
  description: >
    Scope s was read in two parts, then re-read in one after its text shrank. Only
    the
    one-part extraction is current; the older part 2 does not stay current because
    no
    newer extraction reused its number. Scope t's part 2 was re-read alone, so its
    older part 1 stays current beside it.
  model: int__courseware__claims
  given:
  - input: source('courseware_intermediate', 'courseware_claim_extraction')
    rows:
    - {extraction_key: s1, platform: mitxonline, courserun_readable_id: r, scope_id: s,
      scope_part: 1, scope_part_count: 2, extractor_id: v1, prompt_version: p, schema_version: c,
      model_id: m, effort: medium, extracted_at: "2026-10-17T00:00:00"}
    - {extraction_key: s2, platform: mitxonline, courserun_readable_id: r, scope_id: s,
      scope_part: 2, scope_part_count: 2, extractor_id: v1, prompt_version: p, schema_version: c,
      model_id: m, effort: medium, extracted_at: "2026-10-17T00:00:00"}
    - {extraction_key: s3, platform: mitxonline, courserun_readable_id: r, scope_id: s,
      scope_part: 1, scope_part_count: 1, extractor_id: v1, prompt_version: p, schema_version: c,
      model_id: m, effort: medium, extracted_at: "2026-10-18T00:00:00"}
    - {extraction_key: t1, platform: mitxonline, courserun_readable_id: r, scope_id: t,
      scope_part: 1, scope_part_count: 2, extractor_id: v1, prompt_version: p, schema_version: c,
      model_id: m, effort: medium, extracted_at: "2026-10-17T00:00:00"}
    - {extraction_key: t2, platform: mitxonline, courserun_readable_id: r, scope_id: t,
      scope_part: 2, scope_part_count: 2, extractor_id: v1, prompt_version: p, schema_version: c,
      model_id: m, effort: medium, extracted_at: "2026-10-17T00:00:00"}
    - {extraction_key: t3, platform: mitxonline, courserun_readable_id: r, scope_id: t,
      scope_part: 2, scope_part_count: 2, extractor_id: v1, prompt_version: p, schema_version: c,
      model_id: m, effort: medium, extracted_at: "2026-10-18T00:00:00"}
  - input: source('courseware_intermediate', 'courseware_claim')
    rows:
    - {extraction_key: s1, claim_ordinal: 1, claim_kind: concept, label: a}
    - {extraction_key: s2, claim_ordinal: 1, claim_kind: concept, label: b}
    - {extraction_key: s3, claim_ordinal: 1, claim_kind: concept, label: c}
    - {extraction_key: t1, claim_ordinal: 1, claim_kind: concept, label: d}
    - {extraction_key: t2, claim_ordinal: 1, claim_kind: concept, label: e}
    - {extraction_key: t3, claim_ordinal: 1, claim_kind: concept, label: f}
  - input: source('courseware_intermediate', 'courseware_claim_evidence')
    rows: []
  expect:
    rows:
    - {extraction_key: s1, is_current: false}
    - {extraction_key: s2, is_current: false}
    - {extraction_key: s3, is_current: true}
    - {extraction_key: t1, is_current: true}
    - {extraction_key: t2, is_current: false}
    - {extraction_key: t3, is_current: true}
