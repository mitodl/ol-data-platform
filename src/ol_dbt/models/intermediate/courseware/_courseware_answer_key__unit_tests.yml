- name: test_int__courseware__extraction_sources_leaves_out_answer_keys
  description: >
    An Open edX document whose name or opening says answer key is not read, and a
    reading that works examples is.
  model: int__courseware__extraction_sources
  given:
  - input: ref('dim_course_content')
    rows: []
  - input: ref('int__combined__course_xml_blocks')
    rows: []
  - input: ref('stg__openedx__s3__course_file_exclusions')
    rows: []
  - input: ref('stg__openedx__s3__course_transcript_text')
    rows: []
  - input: ref('stg__openedx__s3__course_document_text')
    rows:
    - {content_file_source_system: mitxonline, courserun_readable_id: r1, content_file_extraction_status: extracted,
      content_file_path: static/ps5.pdf, content_file_extension: .pdf, content_file_text: "Problem\
        \ Set 5 Solutions\n1. The force is 3 N."}
    - {content_file_source_system: mitxonline, courserun_readable_id: r1, content_file_extraction_status: extracted,
      content_file_path: static/Exam2_Key.pdf, content_file_extension: .pdf, content_file_text: 1.
        B}
    - {content_file_source_system: mitxonline, courserun_readable_id: r1, content_file_extraction_status: extracted,
      content_file_path: static/reading3.pdf, content_file_extension: .pdf, content_file_text: "Example\
        \ 1. Solution: 3. Example 2. Solution: 4. Example 3. Solution: 5."}
  expect:
    rows:
    - {scope_id: materials, source_ref: static/reading3.pdf}
