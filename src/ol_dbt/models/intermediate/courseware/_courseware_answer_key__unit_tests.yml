    one are excluded; topics named with solution, answer, solving or key are not.
  model: int__courseware__answer_document_review
  given:
  - input: ref('stg__openedx__s3__course_document_text')
    rows:
    # answer keys
    - {content_file_source_system: mitxonline, courserun_readable_id: r1, content_file_extraction_status: extracted,
      content_file_path: static/QCRx1_Assessment Answer Key.pdf, content_file_text: Q1.
        B}
    - {content_file_source_system: mitx, courserun_readable_id: r1, content_file_extraction_status: extracted,
      content_file_path: static/documents/2022_8_01L_Quiz_2_solution.pdf, content_file_text: 1.
        v = 3 m/s}
