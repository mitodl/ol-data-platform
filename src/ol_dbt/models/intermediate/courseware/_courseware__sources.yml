---
version: 2

sources:
# Written by the courseware assets in dg_projects/ml (ml.assets.courseware_*) into
# the intermediate schema through the Iceberg IO manager, the same way the feedback
# assets write theirs; database/schema resolve to what ml.lib.courseware.warehouse
# writes. dev_local reads them as the glue__ views `ol-dbt local register` creates.
# Rows are never updated: a new prompt, schema, model or input text adds rows under
# a new extraction_key.
- name: courseware_intermediate
  loader: dagster
  database: '{{ target.database | default(none) }}'
  schema: '{{ target.schema }}_intermediate'
  tables:
  - name: courseware_claim_extraction
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_claim_extraction]
    description: One row per model call, i.e. one scope part of a course run read
      by one extractor version and model.
    columns:
    - name: extraction_key
      description: str, sha256 of everything the call depended on (extractor, prompt
        and schema versions, model, effort, run, scope and the full message text)
      tests:
      - unique
      - not_null
    - name: extractor_id
      description: str, the extractor, e.g. courseware_claims_v1
    - name: prompt_version
      description: str, hash of the system prompt
    - name: schema_version
      description: str, hash of the output JSON schema
    - name: model_id
      description: str, the model id as sent to the provider
    - name: effort
      description: str, output_config.effort for the call
    - name: platform
      description: str, mitxonline, mitxpro or residential
    - name: courserun_readable_id
      description: str, the run the scope belongs to
    - name: scope_id
      description: str, the sequential block id, or 'context' or 'materials'
    - name: scope_kind
      description: str, unit, context or materials
    - name: scope_title
      description: str, the sequential title or the scope name
    - name: scope_position
      description: int, the scope's order in the course; 0 for context, 9999 for materials
    - name: scope_part
      description: int, which part of a scope split to fit the input budget, from
        1
    - name: scope_part_count
      description: int, how many parts the scope was split into
    - name: input_text_checksum
      description: str, sha256 of the source text the call read
    - name: scope_part_checksums
      description: str, every part's input_text_checksum, in order and comma-separated,
        as the run that made this call split the scope
    - name: source_count
      description: int, number of sources the call read
    - name: truncated_source_count
      description: int, number of those sources cut to the per-source limit
    - name: sources_json
      description: str, JSON list of {source_id, source_ref, included_chars, total_chars}
    - name: summary
      description: str, the model's summary of the scope
    - name: notes_json
      description: str, JSON list of the model's notes plus truncation notes
    - name: stop_reason
      description: str, the response's stop_reason
    - name: input_tokens
      description: int, uncached input tokens billed
    - name: output_tokens
      description: int, output tokens billed, thinking included
    - name: cache_read_input_tokens
      description: int, input tokens read from the prompt cache
    - name: cache_creation_input_tokens
      description: int, input tokens written to the prompt cache
    - name: extracted_at
      description: timestamp, when the call returned
  - name: courseware_claim
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_claim]
    description: One row per claim in an extraction, as the model returned it.
    columns:
    - name: extraction_key
      description: str, the extraction the claim came from
      tests:
      - not_null
    - name: claim_ordinal
      description: int, the claim's position in the extraction, from 1
    - name: platform
      description: str, the extraction's platform; the table is partitioned by it
    - name: courserun_readable_id
      description: str, the extraction's course run; the table is partitioned by it
    - name: claim_kind
      description: str, concept, skill, assumed_knowledge, assessment_expectation,
        learning_outcome, declared_prerequisite or audience
    - name: label
      description: str, the model's canonical label; the statement for outcomes and
        audience
    - name: description
      description: str, the model's description; the statement for declared prerequisites
    - name: concept_kind
      description: str, concept, method, tool, dataset or application (concepts only)
    - name: teaching_status
      description: str, taught, reviewed, used or mentioned (concepts and skills)
    - name: how_used
      description: str, where the material relies on assumed knowledge
    - name: flagged_as_prior
      description: boolean, whether the material frames assumed knowledge as prior
    - name: bloom_process
      description: str, Bloom revised cognitive process (assessments and outcomes)
    - name: knowledge_type
      description: str, Bloom revised knowledge type (outcomes)
    - name: prerequisite_kind
      description: str, prerequisite, corequisite, recommended or explicitly_none
    - name: course_ref
      description: str, a course a declared prerequisite names
    - name: related_concept_labels_json
      description: str, JSON list of concept labels an assessment or outcome names
    tests:
    - dbt_expectations.expect_compound_columns_to_be_unique:
        column_list: [extraction_key, claim_ordinal]
  - name: courseware_claim_evidence
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_claim_evidence]
    description: One row per evidence passage, verified against the source text the
      call read (int__courseware__extraction_sources.source_text).
    columns:
    - name: extraction_key
      description: str, the extraction
      tests:
      - not_null
    - name: claim_ordinal
      description: int, the claim within the extraction
    - name: platform
      description: str, the extraction's platform; the table is partitioned by it
    - name: courserun_readable_id
      description: str, the extraction's course run; the table is partitioned by it
    - name: evidence_ordinal
      description: int, the passage's position within the claim, from 1
    - name: source_id
      description: str, the S01-style id the model cited
    - name: source_ref
      description: str, the cited source's block id or export path; null when the
        id was not one the call was sent
    - name: passage
      description: str, the passage as the model quoted it
    - name: verification_status
      description: str, exact, fuzzy, unverified or unknown_source
    - name: char_start
      description: int, offset of an exact or fuzzy match in the source text
    - name: char_end
      description: int, end offset of an exact or fuzzy match in the source text
  # Concept identity (ml.lib.courseware.resolve). Registry, assignment and relation
  # rows are full snapshots per resolution run; the newest run in
  # courseware_resolution_run is current, and earlier runs are history.
  - name: courseware_resolution_run
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_resolution_run]
    description: One row per resolution run, with its mode, models and churn counts.
    columns:
    - name: resolution_run_id
      description: str, UUID of the run
      tests:
      - unique
      - not_null
    - name: resolver_id
      description: str, the resolver version, e.g. courseware_resolution_v2
    - name: prompt_version
      description: str, hash of the adjudication prompt and schema
    - name: model_id
      description: str, the adjudication model
    - name: embedding_model_id
      description: str, the blocking embedding model
    - name: mode
      description: str, incremental (only unassigned labels) or rebuild
    - name: label_count
      description: int, labels in the run's input
    - name: resolved_label_count
      description: int, labels the run adjudicated
    - name: adjudication_calls
      description: int, model calls made
    - name: failed_batch_count
      description: int, adjudication calls that failed; their labels are retried by
        the next run (a rebuild keeps their previous concept)
    - name: failed_label_count
      description: int, labels in the failed calls
    - name: concepts_minted
      description: int, new concept ids
    - name: concepts_merged
      description: int, concepts retired into a survivor
    - name: concepts_deprecated
      description: int, concepts retired with no successor
    - name: concepts_carried_forward
      description: int, ids a rebuild kept by member overlap
    - name: rejected_components
      description: int, exact-match components not merged because they were too large
        or contained a distinct verdict
    - name: started_at
      description: timestamp, when the run started
    - name: sense_prompt_version
      description: str, hash of the sense adjudication prompt and schema
    - name: sense_calls
      description: int, sense adjudication model calls made
    - name: senses_minted
      description: int, concepts split off a label for a new sense
    - name: sense_review_count
      description: int, (label, course run) units in the review queue
  - name: courseware_concept_registry
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_registry]
    description: Every concept id ever minted, per resolution run.
    columns:
    - name: resolution_run_id
      description: str, the run this snapshot row belongs to
    - name: concept_id
      description: str, opaque UUID minted once and never reused
    - name: concept_status
      description: str, active, merged or deprecated
    - name: merged_into_concept_id
      description: str, the active survivor a merged concept redirects to
    - name: minted_label
      description: str, the label the concept was minted under (display labels are
        chosen downstream)
    - name: minted_run_id
      description: str, the run that minted the id
    - name: minted_at
      description: timestamp, when the id was minted
    - name: split_from_concept_id
      description: str, for a concept minted as another sense of a label, the label's
        primary concept it was split from; null in snapshots written before senses
  - name: courseware_concept_assignment
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_assignment]
    description: Which concept each normalized label belongs to (its primary sense),
      per resolution run.
    columns:
    - name: resolution_run_id
      description: str, the run this snapshot row belongs to
    - name: concept_label_key
      description: str, the normalized label key
    - name: concept_id
      description: str, the active concept the label belongs to
    - name: assignment_source
      description: str, carried, exact_match, minted or rebuild_carried
    - name: assigned_run_id
      description: str, the run that first made this assignment
  - name: courseware_concept_alias
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_alias]
    description: Every sense of every normalized label, per resolution run (ml.lib.courseware.senses).
      A label has its primary concept and any concepts split off it for another meaning.
    columns:
    - name: resolution_run_id
      description: str, the run this snapshot row belongs to
    - name: concept_label_key
      description: str, the normalized label key
    - name: concept_id
      description: str, the active concept this sense is
    - name: sense_role
      description: str, primary (the label's concept from label resolution) or split
    - name: sense_gloss
      description: str, what the label means in this sense, as the sense model is
        shown it
    - name: added_run_id
      description: str, the run that first gave the label this sense
  - name: courseware_concept_sense_assignment
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_sense_assignment]
    description: Which sense of its label each course run uses, per resolution run,
      one row per (concept_label_key, platform, courserun_readable_id).
    columns:
    - name: resolution_run_id
      description: str, the run this snapshot row belongs to
    - name: concept_label_key
      description: str, the normalized label key
    - name: platform
      description: str, the course run's platform
    - name: courserun_readable_id
      description: str, the course run
    - name: concept_id
      description: str, the concept the run's sense of the label is; null in the review
        queue
    - name: sense_status
      description: str, assigned or needs_review
    - name: assignment_source
      description: str, single_sense (the label's only course run), context_selected,
        new_sense or unsure
    - name: assigned_run_id
      description: str, the run that made the assignment
  - name: courseware_sense_decision
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_sense_decision]
    description: Every sense adjudication decision, append-only, for review and evaluation.
    columns:
    - name: resolution_run_id
      description: str, the run that made the decision
    - name: concept_label_key
      description: str, the label
    - name: platform
      description: str, the course run's platform
    - name: courserun_readable_id
      description: str, the course run
    - name: decision
      description: str, existing, new or unsure
    - name: concept_id
      description: str, the concept chosen or minted; null when unsure
    - name: model_id
      description: str, the sense adjudication model
  - name: courseware_concept_relation
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_relation]
    description: Concept-to-concept relations proposed by adjudication, per run, carried
      forward and redirect-resolved.
    columns:
    - name: resolution_run_id
      description: str, the run this snapshot row belongs to
    - name: from_concept_id
      description: str, the narrower concept for broader; the lower id otherwise
    - name: to_concept_id
      description: str, the broader concept for broader; the higher id otherwise
    - name: relation
      description: str, broader, close or related
    - name: proposed_run_id
      description: str, the run that first proposed the relation
  - name: courseware_resolution_decision
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_resolution_decision]
    description: Every adjudication verdict, append-only, for review and evaluation.
    columns:
    - name: resolution_run_id
      description: str, the run that made the decision
    - name: query_label_key
      description: str, the label being resolved
    - name: candidate_label_key
      description: str, the candidate it was compared with
    - name: verdict
      description: str, exact, close, broader, narrower, related or distinct, of the
        query relative to the candidate
    - name: model_id
      description: str, the adjudication model
  # Concept graph topology (ml.lib.courseware.graph), one set of rows per graph run.
  - name: courseware_concept_graph_run
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_graph_run]
    description: One row per graph run with the graph's size, density, sparsity, components,
      communities, modularity and cycle counts.
    columns:
    - name: graph_run_id
      description: str, UUID of the run
      tests:
      - unique
      - not_null
    - name: computed_at
      description: timestamp, when the run computed
    - name: input_checksum
      description: str, sha256 of the nodes, selected edges and parameters
    - name: parameters_json
      description: str, the thresholds and weights the run used
  - name: courseware_concept_graph_node
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_graph_node]
    description: Each active concept's position in a graph run.
    columns:
    - name: graph_run_id
      description: str, the run
    - name: concept_id
      description: str, the concept
    - name: community_id
      description: str, the concept's Leiden community, carried across runs
  - name: courseware_concept_graph_community
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_graph_community]
    description: Communities found in a graph run, with stable ids carried forward
      by member overlap.
    columns:
    - name: graph_run_id
      description: str, the run
    - name: community_id
      description: str, UUID, minted when the community first appeared
    - name: first_seen_run_id
      description: str, the graph run the community first appeared in
  - name: courseware_concept_graph_edge
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_graph_edge]
    description: The edges a graph run kept after thresholds, with weight and backbone
      score.
    columns:
    - name: graph_run_id
      description: str, the run
    - name: backbone_score
      description: float, local-degree sparsification score; keep edges above a threshold
        to draw a sparse backbone
  - name: courseware_concept_graph_prerequisite_closure
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_graph_prerequisite_closure]
    description: Per graph run, every concept each concept builds on through approved
      builds_on edges (review_status accepted), at the fewest hops, up to the run's
      max_prerequisite_depth; experimental, and empty until review exists.
    columns:
    - name: graph_run_id
      description: str, the run
    - name: from_concept_id
      description: str, the concept that builds on to_concept_id
    - name: to_concept_id
      description: str, the prerequisite concept
    - name: min_depth
      description: int, the fewest builds_on hops from from_concept_id to to_concept_id
  - name: courseware_concept_description
    config:
      meta:
        dagster:
          asset_key: [intermediate, courseware_concept_description]
    description: Learner-facing descriptions of concepts (ml.lib.courseware.describe),
      one row per concept per description version and input checksum.
    columns:
    - name: concept_id
      description: str, the concept's UUID
    - name: short_description
      description: str, at most 12 words, completing "This is ..."
    - name: description
      description: str, one or two course-agnostic sentences, at most 45 words
    - name: is_learner_facing
      description: boolean, false for datasets, single exercises and course-internal
        labels that a catalog should not show as topics
    - name: input_checksum
      description: str, sha256 of the labels and claim descriptions the model read
    - name: description_version
      description: str, hash of the description prompt, model and effort
    - name: model_id
      description: str, the model that wrote the description
    - name: described_at
      description: timestamp, when the description was written
  - name: courseware_concept_tagging_run
    description: One row per dictionary tagging run (ml.lib.courseware.tagging), which
      tags every extraction source with the concepts of dim_concept_alias. Each run
      is a full snapshot.
    columns:
    - name: tagging_run_id
      description: str, the run's UUID; re-running old inputs gets a new one, so the
        newest run is always the one to read
      tests:
      - unique
      - not_null
    - name: input_key
      description: str, sha256 of the tagger, its parameters, the dictionary and the
        source text; a run is skipped when the newest run has the same key
    - name: tagger_id
      description: str, the tagger version
    - name: parameters_json
      description: str, JSON of the minimum and case-sensitive phrase lengths
    - name: dictionary_checksum
      description: str, sha256 of the alias rows the dictionary was built from
    - name: sources_checksum
      description: str, sha256 of the source rows tagged
    - name: label_count
      description: int, concept label keys in the dictionary
    - name: tokenless_label_count
      description: int, labels skipped because they have no letter or number, so no
        key to match on (e.g. "∇")
    - name: pattern_count
      description: int, distinct phrases (labels and their variants)
    - name: case_sensitive_pattern_count
      description: int, phrases matched only in the alias's own case
    - name: skipped_pattern_count
      description: int, phrases too short to match
    - name: ambiguous_pattern_count
      description: int, phrases flagged ambiguous
    - name: source_count
      description: int, sources tagged
    - name: char_count
      description: int, characters of source text read
    - name: tagged_source_count
      description: int, sources with at least one mention
    - name: mention_count
      description: int, mention rows written
    - name: match_seconds
      description: float, wall time of the matching loop
    - name: elapsed_seconds
      description: float, wall time of the whole run, building the dictionary and
        the output frames included
    - name: tagged_at
      description: timestamp, when the run started
  - name: courseware_concept_mention
    description: Every place a dictionary phrase occurs in an extraction source's
      text, per tagging run, one row per candidate concept.
    columns:
    - name: tagging_run_id
      description: str, the tagging run
    - name: platform
      description: str, mitxonline, mitxpro or residential
    - name: courserun_readable_id
      description: str, the course run
    - name: scope_id
      description: str, the source's scope
    - name: scope_kind
      description: str, unit, context or materials
    - name: source_ref
      description: str, the block id, or the exported file's path
    - name: source_kind
      description: str, html, problem, video_transcript, document or a page kind
    - name: pattern_key
      description: str, the normalized phrase that matched
    - name: concept_id
      description: str, the concept's UUID
    - name: matched_text
      description: str, the text as it appears in the source
    - name: char_start
      description: int, offset of the mention in source_text
    - name: char_end
      description: int, end offset of the mention in source_text
  - name: courseware_concept_tagging_alias
    description: The dictionary a tagging run matched, one row per (phrase, concept),
      with each phrase's match mode and ambiguity flags.
    columns:
    - name: tagging_run_id
      description: str, the tagging run
    - name: pattern_key
      description: str, the normalized phrase
    - name: concept_id
      description: str, the concept's UUID
    - name: concept_label_key
      description: str, the label the phrase comes from
    - name: variant
      description: str, label, full_name, abbreviation, without_qualifier or plural
    - name: surface
      description: str, the phrase as spelled, which case-sensitive phrases must match
    - name: match_mode
      description: str, caseless, case_sensitive or skipped
    - name: is_short
      description: boolean, the phrase is shorter than the case-sensitive threshold
    - name: is_qualified
      description: boolean, the phrase is a label's head without its qualifier, e.g.
        entropy from "entropy (information theory)"
    - name: is_single_word
      description: boolean, the phrase is one lowercase word
    - name: has_multiple_concepts
      description: boolean, the phrase belongs to more than one concept
    - name: is_ambiguous
      description: boolean, any of the four flags
  - name: courseware_answer_check
    description: A small model's verdict on whether an extraction source reads as
      an answer key or worked solutions (ml.lib.courseware.answer_check), one row
      per source per check version and source text. A copy of a text already checked
      reuses its verdict.
    columns:
    - name: platform
      description: str, mitxonline, mitxpro, residential or ocw
    - name: courserun_readable_id
      description: str, the run the source belongs to
    - name: source_ref
      description: str, the source's ref in int__courseware__extraction_sources
    - name: source_kind
      description: str, the source's kind, e.g. document
    - name: source_title
      description: str, the source's title as the model saw it
    - name: source_checksum
      description: str, sha256 of the source text
    - name: is_answer_document
      description: boolean, true when the model read the source as mainly answers
        to graded work
    - name: reason
      description: str, the model's reason, at most 20 words
    - name: checker_id
      description: str, the checker, e.g. courseware_answer_check_v1
    - name: check_version
      description: str, hash of the checker, prompt, excerpt size, model and effort
    - name: model_id
      description: str, the model that gave the verdict
    - name: checked_at
      description: timestamp, when the verdict was recorded for this source; a copy
        that reuses a verdict gets the time it was recorded, not the time of the call
