---
unit_tests:
- name: test_int__courseware__claims_current_only_for_scopes_the_sources_still_have
  description: >
    The newest extraction of a scope part is current while the run's sources still
    have that scope. A sequential since read as context keeps its old extraction,
    which is no longer current, so its claims are not counted beside the context
    scope's.
  model: int__courseware__claims
  given:
  - input: source('courseware_intermediate', 'courseware_claim_extraction')
    rows:
    - {extraction_key: old_unit, platform: mitxonline, courserun_readable_id: "course-v1:X+Y+1T2026",
      scope_id: overview, scope_part: 1, extracted_at: "2026-10-01T00:00:00"}
    - {extraction_key: old_context, platform: mitxonline, courserun_readable_id: "course-v1:X+Y+1T2026",
      scope_id: context, scope_part: 1, extracted_at: "2026-10-01T00:00:00"}
    - {extraction_key: new_context, platform: mitxonline, courserun_readable_id: "course-v1:X+Y+1T2026",
      scope_id: context, scope_part: 1, extracted_at: "2026-10-17T00:00:00"}
  - input: ref('int__courseware__extraction_sources')
    rows:
    - {platform: mitxonline, courserun_readable_id: "course-v1:X+Y+1T2026", scope_id: context}
  - input: source('courseware_intermediate', 'courseware_claim')
    rows:
    - {extraction_key: old_unit, claim_ordinal: 1, claim_kind: concept, label: a}
    - {extraction_key: old_context, claim_ordinal: 1, claim_kind: concept, label: b}
    - {extraction_key: new_context, claim_ordinal: 1, claim_kind: concept, label: c}
  - input: source('courseware_intermediate', 'courseware_claim_evidence')
    rows: []
  expect:
    rows:
    - {extraction_key: old_unit, is_current: false}
    - {extraction_key: old_context, is_current: false}
    - {extraction_key: new_context, is_current: true}
