---
version: 2

sources:
# database/schema are target-derived, not literals, so they must keep resolving to
# the same relation feedback_redacted.py's DAGSTER_ENV branch actually writes to
# (dev -> production catalog + personal suffix, qa -> qa catalog, else -> production).
# Verify both sides agree before changing either.
- name: feedback_intermediate
  loader: dagster
  database: '{{ target.database | default(none) }}'
  schema: '{{ target.schema }}_intermediate'
  tables:
  - name: feedback_redacted
    description: Presidio-masked title/text for every feedback turn, materialized
      by the feedback_redacted Dagster asset.
    columns:
    - name: source_slug
      description: str, which source the turn came from.
      tests:
      - not_null
    - name: source_record_ref
      description: str, the source-native turn id.
      tests:
      - not_null
    - name: title_redacted
      description: str, PII-masked ticket subject/title. Null where the source turn's
        title was null.
    - name: text_redacted
      description: str, PII-masked turn body. Null where the source turn's text was
        null.
    tests:
    - dbt_expectations.expect_compound_columns_to_be_unique:
        arguments:
          column_list: ["source_slug", "source_record_ref"]
  - name: feedback_cluster_run
    description: One row per clustering run (params, cluster/noise counts, silhouette,
      run_status='completed'|'failed' -- an audit value, not a promotion gate), materialized
      by the feedback_clusters Dagster asset. Consumed by feedback_cluster_identity,
      which matches each completed run's clusters onto stable cluster_keys. No column
      tests here -- this table may not exist yet in a clean schema, and a source-level
      test (unlike a test on a guarded intermediate model) queries the raw relation
      directly and fails outright rather than tolerating its absence.
    columns:
    - name: cluster_run_id
      description: str, uuid identifying this clustering run.
  - name: feedback_cluster_candidate
    description: One row per (conversation, cluster_run_id) -- every clustered run's
      run-local assignments, the input to feedback_cluster_identity's matching. See
      feedback_cluster_run. No column/table tests here.
    columns:
    - name: cluster_run_id
      description: str, uuid identifying which clustering run produced this assignment.
    - name: feedback_conversation_pk
      description: str, surrogate key matching int__feedback__conversation.feedback_conversation_pk.
  - name: feedback_cluster
    description: One row per cluster_key, materialized by the feedback_cluster_identity
      Dagster asset. Carries the same identity across every clustering run in which
      that cluster continues. No column tests here.
    columns:
    - name: cluster_key
      description: str, uuid identifying this cluster's stable identity.
    - name: cluster_status
      description: str, active or retired.
    - name: embedding_input_filter
      description: str, which embedding_input arm ('summary' or 'concatenated_turns')
        this cluster was built from. Null means every arm was clustered together.
  - name: feedback_cluster_lineage
    description: One row per continued/merged/split/new/retired edge, materialized
      by the feedback_cluster_identity Dagster asset for every clustering run it processes.
      No column tests here.
    columns:
    - name: cluster_lineage_pk
      description: str, deterministic hash of (cluster_run_id, prior_cluster_key,
        cluster_key).
    - name: cluster_run_id
      description: str, which clustering run produced this edge.
    - name: cluster_id
      description: int, the run-local cluster_id this edge came from. Null for 'retired'
        (no corresponding new cluster).
  - name: feedback_cluster_membership
    description: One row per conversation (upsert key feedback_conversation_pk), the
      live cluster assignment, materialized by the feedback_cluster_assignment Dagster
      asset. cluster_assignment_method is 'recluster' (rewritten from a completed
      clustering run) or 'incremental' (placed by nearest active centroid). No column
      tests here.
    columns:
    - name: feedback_conversation_pk
      description: str, surrogate key matching int__feedback__conversation.feedback_conversation_pk.
    - name: cluster_key
      description: str, null if not near any active cluster (noise or unplaced).
    - name: assigned_at
      description: timestamp, when this row's placement was computed.
  - name: feedback_category_proposal
    description: One row per cluster_key the feedback_category_proposals Dagster asset
      has labeled -- an LLM-proposed category_label/category_slug for that cluster_key,
      always category_status='proposed' until a human corrects it. Only new/split/merged
      cluster_keys get a row; a continued key keeps its existing category. No column
      tests here.
    columns:
    - name: cluster_key
      description: str, the stable cluster this proposal labels.
    - name: category_slug
      description: str, deterministically slugified from category_label (ml.lib.categorize.new_category_slug)
        -- never LLM-trusted directly.
    - name: category_label
      description: str, the LLM-proposed display label.
    - name: proposed_at
      description: timestamp, when this proposal was generated.
  - name: feedback_summaries
    description: One row per conversation (upsert key feedback_conversation_pk), materialized
      by the feedback_summaries Dagster asset. Null conversation_summary/summary_model_version
      for a single-turn/short conversation, which the asset's skip rule never summarizes
      (§A.1). No column tests here -- see feedback_cluster_run; not_null/unique coverage
      lives on int__feedback__summary instead.
    columns:
    - name: feedback_conversation_pk
      description: str, surrogate key matching int__feedback__conversation.feedback_conversation_pk.
    - name: prompt_version
      description: str, the Opik Prompt Library version of feedback-summary active
        when this row was summarized (or "local" if Opik wasn't configured).
    - name: summarized_at
      description: timestamp, when this row's summary was generated.
  - name: feedback_embeddings
    description: One row per (feedback_conversation_pk, embedding_model_version, embedding_dim),
      not conversation-unique -- see int__feedback__embedding for the one-row-per-conversation
      view. Materialized by the feedback_embeddings Dagster asset. No column tests
      here -- see feedback_cluster_run; not_null/unique coverage lives on int__feedback__embedding
      instead.
    columns:
    - name: feedback_conversation_pk
      description: str, surrogate key matching int__feedback__conversation.feedback_conversation_pk.
    - name: embedded_at
      description: timestamp, when this row's embedding was generated.
