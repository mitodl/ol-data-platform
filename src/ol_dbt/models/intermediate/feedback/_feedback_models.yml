---
version: 2

models:
- name: int__feedback__zendesk
  description: One row per public, requester-authored Zendesk comment, conformed to
    the common feedback event contract. Agent replies, internal notes and Zendesk
    sample tickets are dropped.
  columns:
  - name: source_slug
    description: str, the feedback source this row came from. Always 'zendesk' here.
    tests:
    - not_null
  - name: source_record_ref
    description: str, the Zendesk comment_id - the turn's stable business key, and
      what feedback_pk is minted from.
    tests:
    - not_null
    - unique
  - name: conversation_ref
    description: str, the Zendesk ticket_id. Groups a conversation's turns together.
    tests:
    - not_null
  - name: turn_index
    description: int, ordinal of this turn within its conversation, ordered by comment
      creation time with comment_id as the tie-break.
    tests:
    - not_null
  - name: is_conversation_opening
    description: boolean, whether this is the first kept turn of the conversation.
      Recovers the previous first-comment-only view as a filter rather than a grain.
    tests:
    - not_null
  - name: occurred_at
    description: str, ISO8601 timestamp of the comment itself. The grain's timestamp.
    tests:
    - not_null
  - name: created_at
    description: str, ISO8601 source lifecycle timestamp of the comment.
  - name: updated_at
    description: str, ISO8601 timestamp the parent ticket was last updated.
  - name: text
    description: str, the raw comment body. Masking happens downstream, in the feedback_redacted
      Dagster asset.
  - name: title
    description: str, the ticket subject. Constant across a ticket's turns.
  - name: channel_slug
    description: str, how the feedback arrived, mapped onto the conformed channel
      value set. Null where a Zendesk channel has no mapping, which then fails the
      fact's relationships test.
  - name: subject_user_ref
    description: str, the comment author's email. Zendesk exposes no openedx user
      id, so this is the last-resort identity path.
  - name: source_url
    description: str, the ticket API url. Per-comment deep links are not exposed by
      the connector.
  - name: subject_type
    description: str, discriminator for what the feedback is about. Always 'unspecified'
      until the Appzi URL decode is implemented.
  - name: subject_ref
    description: str, source-native id of the thing the feedback is about. Null at
      MVP.
  - name: subject_url
    description: str, canonical deep link to the subject. Null at MVP.
  - name: courserun_readable_id
    description: str, null for Zendesk, which is not course-scoped.
  - name: block_id
    description: str, null for Zendesk, which is not course-scoped.
  - name: platform
    description: str, platform readable id. 'mitlearn' for tickets in the MIT Learn,
      Universal AI or upGrad UAI group; other platforms come from the brand.
  - name: explicit_rating
    description: str, the ticket satisfaction rating score - 'good', 'bad' or 'offered'.
      A ticket-level signal, so it repeats across a ticket's turns.
  - name: ticket_tags
    description: array, the parent ticket's tags, carried for bridge_feedback_tag
      to explode. Not part of the event contract.
  - name: source_metadata
    description: str, JSON of the attributes that have not earned a conformed column
      - ticket status, priority, due date, brand, group and organization. Excludes
      the satisfaction rating comment and custom fields, which carry unredacted free
      text.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["conversation_ref", "turn_index"]

- name: int__feedback__learn_ai_tutor
  description: One row per user message sent to the AskTIM chatbot. Bot replies are
    excluded.
  config:
    meta:
      qa_branches:
      - learn_ai/app_postgres
      - micromasters/app_postgres
      - mitx/api
      - mitx/mysql
      - mitx/tracking_logs
      - mitxonline/api
      - mitxonline/app_postgres
      - mitxonline/tracking_logs
      - xpro/api
      - xpro/app_postgres
      - xpro/tracking_logs
  columns:
  - name: source_slug
    description: str, the feedback source this row came from. Always 'learn_ai_tutor'
      here.
    tests:
    - not_null
  - name: source_record_ref
    description: str, the djangocheckpoint_id - the turn's stable business key.
    tests:
    - not_null
    - unique
  - name: conversation_ref
    description: str, the chatsession_thread_id. Groups a conversation's turns together.
    tests:
    - not_null
  - name: turn_index
    description: int, ordinal of this human turn within its conversation, ordered
      by checkpoint_step with djangocheckpoint_id as the tie-break.
    tests:
    - not_null
  - name: is_conversation_opening
    description: boolean, whether this is the first kept turn of the conversation.
    tests:
    - not_null
  - name: occurred_at
    description: str, ISO8601 timestamp the checkpoint was created, falling back to
      the chat session's created_at where the checkpoint's own timestamp is null.
    tests:
    - not_null
  - name: text
    description: str, the human_message
  - name: title
    description: str, the chat session title.
  - name: channel_slug
    description: str, always 'chat'.
  - name: subject_user_ref
    description: str, the chatter's global openedx user id.
  - name: source_url
    description: str, null. Not exposed by the connector.
  - name: subject_type
    description: str, what the chat concerns. 'courseware_block' for TutorBot and
      VideoGPTBot, 'course' for SyllabusBot and CanvasSyllabusBot, 'resource' for
      ResourceRecommendationBot. Null for any other chatsession_agent value.
  - name: subject_ref
    description: str, the chatsession_object_id - a course id, video transcript asset
      id, or edX module id depending on chatsession_agent.
  - name: subject_url
    description: str, null. Not resolved at this stage.
  - name: courserun_readable_id
    description: str, the course run the chat concerns.
  - name: block_id
    description: str, the edX block the chat concerns - the video block for VideoGPTBot,
      the problem block for TutorBot. Null for other agents.
  - name: platform
    description: str, the platform the learner chatted on - 'mitlearn' for every agent
      except CanvasSyllabusBot, which is null. The course run's own platform is in
      source_metadata as courserun_platform.
  - name: explicit_rating
    description: str, the chat response's rating, where given.
  - name: created_at
    description: str, same as occurred_at - the checkpoint's creation timestamp, falling
      back to the chat session's created_at.
  - name: updated_at
    description: str, the chat session's updated_at.
  - name: source_metadata
    description: str, JSON of fields specific to AskTIM, not shared with other sources
      - chatsession_agent, checkpoint_source, checkpoint_type.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["conversation_ref", "turn_index"]

- name: int__feedback__content_feedback
  description: One row per content feedback submission that has a comment, conformed
    to the common feedback event contract. Each submission is its own single-turn
    conversation. Sentiment-only submissions are dropped, because they have no text
    to summarize.
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - ocw/app_postgres
      - xpro/app_postgres
  columns:
  - name: source_slug
    description: str, the feedback source this row came from. Always 'content_feedback'
      here.
    tests:
    - not_null
  - name: source_record_ref
    description: str, the contentfeedback_id - the turn's stable business key.
    tests:
    - not_null
    - unique
  - name: conversation_ref
    description: str, same as source_record_ref. Submissions are not threaded, so
      each one is a one-turn conversation.
    tests:
    - not_null
    - unique
  - name: turn_index
    description: int, always 1.
    tests:
    - not_null
  - name: is_conversation_opening
    description: boolean, always true.
    tests:
    - not_null
  - name: occurred_at
    description: str, ISO8601 timestamp the feedback was submitted.
    tests:
    - not_null
  - name: created_at
    description: str, same as occurred_at.
  - name: updated_at
    description: str, ISO8601 timestamp the feedback record was last updated.
  - name: text
    description: str, the learner's raw comment. The only text this source populates.
      Masking happens downstream, in the feedback_redacted Dagster asset.
    tests:
    - not_null
  - name: title
    description: str, always null. Block and unit names are in source_metadata.
  - name: channel_slug
    description: str, always 'in_product_widget'.
  - name: subject_user_ref
    description: str, the learner's MIT Learn global id, or their email if they have
      none. Null for an anonymous submission or a user not in users_user.
  - name: source_url
    description: str, null. MIT Learn has no admin view of a single submission.
  - name: subject_type
    description: str, always 'courseware_block'.
  - name: subject_ref
    description: str, the Open edX usage key of the block the feedback is about.
  - name: subject_url
    description: str, the courseware URL the learner was on.
  - name: courserun_readable_id
    description: str, the course run the block belongs to.
  - name: block_id
    description: str, the Open edX usage key of the block the feedback is about. Same
      as subject_ref.
  - name: platform
    description: str, always 'mitlearn', where the learner gave the feedback. The
      course run's own platform is in source_metadata as courserun_platform.
  - name: explicit_rating
    description: str, the learner's sentiment - 'positive', 'negative' or 'idea'.
    tests:
    - accepted_values:
        arguments:
          values: ['positive', 'negative', 'idea']
  - name: source_metadata
    description: str, JSON of the course title, block type, block display name, unit
      title and courserun_platform - the course run's platform from dim_course_run,
      which tfact_feedback uses to resolve courserun_fk and content_block_fk.

- name: int__feedback__discussion_forum
  description: One row per learner-authored MITx Online discussion forum post - a
    thread's opening post, a response or a comment - conformed to the common feedback
    event contract. Each thread is one conversation. Posts by course staff and instructors
    are dropped, because they answer feedback rather than give it. Posts by learners
    the LMS has retired are dropped too, and a retired learner's thread title is null
    on the replies that remain.
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitxonline/app_postgres
      - mitxonline/mysql
  columns:
  - name: source_slug
    description: str, the feedback source this row came from. Always 'discussion_forum'
      here.
    tests:
    - not_null
  - name: source_record_ref
    description: str, 'commentthread-<id>' for a thread's opening post or 'comment-<id>'
      for a response or comment - the turn's stable business key. The prefix names
      the source table, because thread and comment ids overlap.
    tests:
    - not_null
    - unique
  - name: conversation_ref
    description: str, the forum thread id.
    tests:
    - not_null
  - name: turn_index
    description: int, 1-based position of the turn among the thread's kept posts,
      in creation order. The opening post comes first when two posts share a timestamp.
    tests:
    - not_null
  - name: is_conversation_opening
    description: boolean, true for the thread's first kept post. That is a response
      when a staff member or a retired learner opened the thread.
    tests:
    - not_null
  - name: occurred_at
    description: str, ISO8601 timestamp the post was created. For a post copied in
      the 2025-09-18/19 Mongo-to-MySQL migration, this is decoded from its Mongo ObjectId,
      because the migration stamped created_at with its own run time.
    tests:
    - not_null
  - name: created_at
    description: str, same as occurred_at.
  - name: updated_at
    description: str, ISO8601 timestamp of the latest update to any post in the thread,
      staff posts included, so a new reply re-enters the whole thread.
  - name: text
    description: str, the post body as plain text, with HTML tags removed and common
      entities decoded. The first kept turn starts with the thread title, unless a
      retired learner wrote it. Masking happens downstream, in the feedback_redacted
      Dagster asset.
    tests:
    - not_null
  - name: title
    description: str, the thread title, repeated on every turn of the thread. Null
      when a retired learner opened the thread.
  - name: channel_slug
    description: str, always 'forum_post'.
  - name: subject_user_ref
    description: str, the author's global id, or their email if they have none. Null
      for an anonymous post or an author not in int__mitxonline__users.
  - name: source_url
    description: str, always null.
  - name: subject_type
    description: str, 'courseware_block' when the thread is in an inline discussion
      that resolves to one block, otherwise 'course'.
  - name: subject_ref
    description: str, block_id when set, otherwise the course run the thread belongs
      to.
  - name: subject_url
    description: str, always null.
  - name: courserun_readable_id
    description: str, the course run the thread belongs to.
  - name: block_id
    description: str, the usage key of the inline discussion block the thread is in,
      from dim_discussion_topic. Null for a course-wide topic, a topic not in the
      latest course structure, or a discussion_id the course run reuses across blocks.
  - name: platform
    description: str, always 'mitlearn', because MITx Online's Open edX is MIT Learn's
      course backend. The course run's own platform is in source_metadata as courserun_platform.
  - name: explicit_rating
    description: str, always null. Forum posts carry no rating.
  - name: source_metadata
    description: str, JSON of post_type ('thread', 'response' or 'comment'), thread_type,
      commentable_id and courserun_platform - always 'mitxonline', which tfact_feedback
      uses to resolve courserun_fk.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["conversation_ref", "turn_index"]
- name: int__feedback__unioned
  description: >
    One row per feedback turn, from every source: Zendesk, AskTIM, content feedback,
    and the course discussion forum.

    PII: this model carries raw, unredacted feedback text under the intermediate
    schema's grants. Presidio masking happens in the feedback_redacted Dagster asset
    between here and tfact_feedback.
  config:
    meta:
      qa_branches:
      - learn_ai/app_postgres
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/api
      - mitx/mysql
      - mitx/tracking_logs
      - mitxonline/api
      - mitxonline/app_postgres
      - mitxonline/tracking_logs
      - xpro/api
      - xpro/app_postgres
      - xpro/tracking_logs
  columns:
  - name: source_slug
    description: str, which source the row came from.
    tests:
    - not_null
  - name: source_record_ref
    description: str, the source-native turn id. Unique within a source.
    tests:
    - not_null
  - name: conversation_ref
    description: str, the source-native thread id. Non-conversational sources set
      this to source_record_ref so they degenerate to a one-turn conversation.
    tests:
    - not_null
  - name: turn_index
    description: int, ordinal of the turn within its conversation.
  - name: is_conversation_opening
    description: boolean, whether this is the conversation's first kept turn.
  - name: occurred_at
    description: str, ISO8601 source event time. The contract's required timestamp.
    tests:
    - not_null
  - name: created_at
    description: str, ISO8601 source lifecycle creation timestamp.
  - name: updated_at
    description: str, ISO8601 source lifecycle update timestamp.
  - name: text
    description: str, raw free text. Redacted downstream, not here.
  - name: title
    description: str, raw title or subject. Redacted downstream, not here.
  - name: channel_slug
    description: str, conformed channel the feedback arrived through.
  - name: subject_user_ref
    description: str, the author's identity reference - a global or openedx user id
      where the source has one, an email as a last resort.
  - name: source_url
    description: str, deep link back to the record in its source system.
  - name: subject_type
    description: str, discriminator for the polymorphic subject reference.
  - name: subject_ref
    description: str, source-native id of the subject.
  - name: subject_url
    description: str, canonical deep link to the subject.
  - name: courserun_readable_id
    description: str, course run the feedback concerns, for course-scoped sources.
  - name: block_id
    description: str, edX block the feedback concerns, for block-scoped sources.
  - name: platform
    description: str, platform readable id where the learner gave the feedback. Null
      where the source does not map to one platform.
  - name: explicit_rating
    description: str, the source's own explicit rating signal, where it has one.
  - name: source_tags
    description: array, source-scoped tags carried through for bridge_feedback_tag.
  - name: source_metadata
    description: str, JSON of everything the conformance rule has not promoted to
      a column.
  - name: feedback_text_chars
    description: int, length of the text measured before masking, so the metric survives
      redaction.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["source_slug", "source_record_ref"]

- name: int__feedback__conversation
  description: One row per conversation, its kept turns assembled in turn_index order.
    This is the text the summarization and embedding assets send to the LLM.
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitlearn/app_postgres
      - mitx/mysql
      - mitxonline/app_postgres
      - mitxonline/mysql
      - xpro/app_postgres
      - xpro/mysql
  columns:
  - name: feedback_conversation_pk
    description: str, surrogate key hashed from (source_slug, conversation_ref), computed
      here as the single source of truth and passed unchanged to afact_feedback_conversation.
    tests:
    - not_null
    - unique
  - name: source_slug
    description: str, which source the conversation came from.
    tests:
    - not_null
  - name: conversation_ref
    description: str, the source-native thread id.
    tests:
    - not_null
  - name: platform
    description: str, platform readable id where the learner gave the feedback, from
      the fact's platform_fk. The summary and clustering assets filter on it.
  - name: conversation_opened_at
    description: str, ISO8601 time of the conversation's first turn. The summary and
      clustering assets use it to process only conversations opened on or after their
      feedback_since date.
  - name: turn_count
    description: int, number of kept turns. At least 1 - a conversation with no kept
      turns does not appear here.
    tests:
    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        arguments:
          min_value: 1
  - name: conversation_text_chars
    description: int, summed pre-redaction length of the kept turns.
  - name: conversation_text
    description: str, the conversation's redacted turns concatenated in order with
      a turn delimiter. Null until the feedback_redacted asset populates the fact.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["source_slug", "conversation_ref"]

- name: int__feedback__summary
  description: feedback_summaries' output, one row per conversation -- empty until
    that asset has materialized in this schema.
  columns:
  - name: feedback_conversation_pk
    description: str, surrogate key matching int__feedback__conversation.feedback_conversation_pk.
    tests:
    - not_null
    - unique
  - name: conversation_summary
    description: str, the LLM-generated summary. Null for a single-turn/short conversation
      (skipped by design, §A.1) or if the table doesn't exist yet.
  - name: summary_model_version
    description: str, which model produced conversation_summary. Null under the same
      conditions as conversation_summary.
  - name: prompt_version
    description: str, the Opik Prompt Library version of feedback-summary active when
      this row was summarized (or "local" if Opik wasn't configured). Null under the
      same conditions as conversation_summary.
  - name: summarized_at
    description: ISO8601 varchar, when conversation_summary was generated. Null under
      the same conditions as conversation_summary.

- name: int__feedback__embedding
  description: feedback_embeddings' output, one row per conversation -- empty until
    that asset has materialized in this schema.
  columns:
  - name: feedback_conversation_pk
    description: str, surrogate key matching int__feedback__conversation.feedback_conversation_pk.
    tests:
    - not_null
    - unique
  - name: embedding_vector
    description: array(double), the conversation's embedding.
  - name: embedding_dim
    description: int, embedding_vector's length.
  - name: embedding_model_version
    description: str, which model produced embedding_vector.
  - name: embedding_input
    description: str, 'summary' or 'concatenated_turns' -- which text was actually
      embedded.
  - name: embedded_at
    description: ISO8601 varchar, when embedding_vector was generated.

- name: int__feedback__cluster_membership
  description: feedback_cluster_membership's output, one row per conversation -- the
    live cluster assignment. Empty until feedback_cluster_assignment has materialized
    in this schema.
  columns:
  - name: feedback_conversation_pk
    description: str, surrogate key matching int__feedback__conversation.feedback_conversation_pk.
    tests:
    - not_null
    - unique
  - name: cluster_key
    description: str, null if not near any active cluster (noise or unplaced).
  - name: cluster_similarity
    description: double, cosine similarity to the cluster's centroid.
  - name: cluster_assignment_method
    description: str, recluster or incremental.
  - name: cluster_run_id
    description: str, which clustering run produced this assignment.
  - name: assigned_at
    description: ISO8601 varchar, when this row's placement was computed.

- name: int__feedback__category_proposal
  description: Every LLM-proposed category, one row per cluster_key that has ever
    been labeled -- empty until feedback_category_proposals has materialized in this
    schema.
  columns:
  - name: cluster_key
    description: str, the stable cluster this proposal labels.
    tests:
    - not_null
    - unique
  - name: cluster_run_id
    description: str, which clustering run this cluster_key was resolved from when
      the proposal was generated.
  - name: category_slug
    description: str, deterministically slugified from category_label.
    tests:
    - not_null
  - name: category_label
    description: str, the LLM-proposed display label.
    tests:
    - not_null
  - name: category_description
    description: str, the LLM-proposed one-line description of the category.
  - name: proposed_at
    description: timestamp, when this proposal was generated.
    tests:
    - not_null
  - name: cluster_status
    description: str, 'active' or 'retired', from feedback_cluster. Null if feedback_cluster
      has not materialized in this schema.
