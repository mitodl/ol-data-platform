---
version: 2

models:
- name: int__ocw__courses
  description: OCW courses metadata on production environment
  columns:
  - name: course_uuid
    description: str, unique identifier for the OCW course
    tests:
    - not_null
    - unique
  - name: course_name
    description: str, unique name of the OCW course. It appears as part of OCW Studio
      urls
    tests:
    - not_null
    - unique
  - name: course_readable_id
    description: str, short unique identifier for the OCW course. e.g. 18.05-spring-2022
      The source of this field is short ID of the website.
    tests:
    - not_null
    - unique
  - name: course_title
    description: str, title of the OCW course
    tests:
    - not_null
  - name: course_source
    description: str, indicating which courses were imported and which ones were authored
      in the app. Possible values are 'studio', 'ocw-import', or blank
  - name: course_url_path
    description: str, unique URL relative path to the OCW course website. e.g., courses/my-site-fall-2020.
      For draft courses, it can be used to preview on https://draft.ocw.mit.edu/
  - name: course_live_url
    description: str, URL of the OCW course on production.
  - name: course_is_live
    description: boolean, indicating if the course website is currently published
      on OCW production.
    tests:
    - not_null
  - name: course_is_unpublished
    description: boolean, indicating if the course website is currently unpublished
      on OCW production.
    tests:
    - not_null
  - name: course_has_never_published
    description: boolean, indicating if the course website has never been published
      on OCW production.
    tests:
    - not_null
  - name: course_first_published_on
    description: timestamp, date and time when the course website was first published
      to OCW production
  - name: course_publish_date_updated_on
    description: timestamp, date and time when the publish date was most recently
      updated on OCW production. The publish date is updated by the webhook to Concourse
      pipeline (it rebuilds every site) whenever we do a release in ocw repos.
  - name: course_created_on
    description: timestamp, date and time when the course was created
    tests:
    - not_null
  - name: course_updated_on
    description: timestamp, date and time when the course was last updated
    tests:
    - not_null
  - name: course_description
    description: str, course description on OCW website
  - name: course_term
    description: str, course term. Possible values are Spring, Summer, Fall, January
      IAP, or blank
  - name: course_year
    description: int, course year
  - name: course_level
    description: str, course level in comma-separated list. Possible values are Undergraduate,
      Graduate, Non-Credit, High School, or blank
  - name: course_primary_course_number
    description: str, the primary course number e.g. 21A.850J
    tests:
    - not_null
  - name: course_extra_course_numbers
    description: str, the extra course number e.g. STS.484J
  - name: course_department_numbers
    description: str, course department numbers in comma-separate list. e.g. STS,
      8.. The department name is available in int__ocw__course_departments.
  - name: course_topics
    description: json, hierarchical course topics (topic, subtopic, speciality) in
      json format. The unnested version of this data is available in int__ocw__course_topics.
      e.g. [["Mathematics","Discrete Mathematics"],["Mathematics","Probability and
      Statistics"]]
  - name: course_learning_resource_types
    description: str, course learning resource types or features in comma-separated
      list. e.g. Lecture Notes, Problem Sets with Solutions,... Full list https://github.com/mitodl/ocw-hugo-projects/blob/049c85e6544a36ba69a89602e5014f6085ef8831/
      ocw-course-v2/ocw-studio.yaml#L163-L207
  - name: course_image_url
    description: str, fully-qualified URL for the course's featured image, constructed
      by prepending the ocw_production_url dbt variable to the file path of the website
      content referenced by course_image_text_id. Null when the course has no featured
      image.

- name: int__ocw__course_topics
  description: supporting table containing tabular course topic data for OCW courses
  columns:
  - name: course_uuid
    description: str, foreign key to ocw_courses
    tests:
    - not_null
  - name: course_topic
    description: str, course topic name e.g. Fine Arts
    tests:
    - not_null
  - name: course_subtopic
    description: str, course subtopic e.g. Architecture
  - name: course_speciality
    description: str, course_speciality. e.g. Architectural Engineering
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["course_uuid", "course_topic", "course_subtopic", "course_speciality"]
- name: int__ocw__course_instructors
  description: supporting table containing tabular instructor profile data for OCW
    courses
  columns:
  - name: course_instructor_uuid
    description: str, uuid string to identify the instructor
    tests:
    - not_null
  - name: course_uuid
    description: str, foreign key to ocw_courses
    tests:
    - not_null
  - name: course_instructor_title
    description: str, instructor title on the OCW website
    tests:
    - not_null
  - name: course_instructor_first_name
    description: str, instructor's first name
    tests:
    - not_null
  - name: course_instructor_last_name
    description: str, instructor's last name
    tests:
    - not_null
  - name: course_instructor_middle_initial
    description: str, instructor's middle name
  - name: course_instructor_salutation
    description: str, instructor's salutation e.g. Dr.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["course_uuid", "course_instructor_uuid"]

- name: int__ocw__course_departments
  description: supporting table containing tabular department number and name for
    OCW courses. The mapping is available in https://github.com/mitodl/ocw-hugo-themes
    /blob/main/base-theme/data/departments.json
  columns:
  - name: course_uuid
    description: str, foreign key to ocw_courses
    tests:
    - not_null
  - name: course_department_number
    description: str, number or short code to represent a department. e.g. 5, HST
    tests:
    - not_null
  - name: course_department_name
    description: str, display name for the department on OCW course website
    tests:
    - not_null
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["course_uuid", "course_department_number"]

- name: int__ocw__pages
  description: OCW course pages (navigable content pages) for ocw-course sites
  columns:
  - name: course_uuid
    description: str, UUID of the course containing the page
    tests:
    - not_null
  - name: course_name
    description: str, unique name of the OCW course
    tests:
    - not_null
  - name: course_live_url
    description: str, URL of the OCW course on production
  - name: course_number
    description: str, primary course number of the course
  - name: course_term
    description: str, term the course was taught
  - name: course_title
    description: str, title of the course
  - name: course_year
    description: str, year the course was taught
  - name: website_title
    description: str, title of the course website
    tests:
    - not_null
  - name: content_type
    description: str, WebsiteContent type of the page (always 'page')
    tests:
    - not_null
  - name: page_uuid
    description: str, UUID of the page (WebsiteContent text_id)
    tests:
    - not_null
  - name: page_title
    description: str, title of the page
  - name: page_filename
    description: str, filename of the page
    tests:
    - not_null
  - name: page_dirpath
    description: str, directory path of the page within the site
  - name: page_parent_id
    description: int, ID of the parent WebsiteContent
  - name: page_is_page_content
    description: boolean, whether the page is page content
  - name: page_draft
    description: boolean, whether the page is in draft state
  - name: page_body
    description: str, the markdown body content of the page (from the markdown column,
      not metadata)
  - name: page_description
    description: str, description of the page
  - name: page_legacy_type
    description: str, legacy OCW type from Plone import (ocw_type field)
  - name: learning_resource_types
    description: str, learning resource types associated with the page
  - name: metadata
    description: json, raw metadata of the page
    tests:
    - not_null
  - name: page_live_url
    description: str, live URL of the page on production
  - name: studio_url
    description: str, OCW Studio URL for the page
  - name: page_created_on
    description: timestamp, date and time when the page was created
    tests:
    - not_null
  - name: page_updated_on
    description: timestamp, date and time when the page was last updated
    tests:
    - not_null
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["course_uuid", "page_uuid"]

- name: int__ocw__resources
  description: supporting table for resources in OCW
  columns:
  - name: content_type
    description: str, WebsiteContent type of the resource (e.g., resource, external-resource)
    tests:
    - not_null
  - name: course_live_url
    description: str, url of the course on production
  - name: course_name
    description: str, name of the course
    tests:
    - not_null
  - name: course_number
    description: str, primary course number of the course, from the course metadata
  - name: course_title
    description: str, title of the course, from the course metadata
  - name: course_term
    description: str, term course was taught, from the course metadata
  - name: course_year
    description: str, year course was taught, from the course metadata
  - name: course_uuid
    description: str, UUID of course containing resource
    tests:
    - not_null
  - name: external_resource_backup_url
    description: str, backup URL of the external resource
  - name: external_resource_backup_url_status_code
    description: int, status code of the external resource backup URL
  - name: external_resource_is_broken
    description: boolean, whether the external resource link is broken
  - name: external_resource_license_warning
    description: boolean, whether the external resource has a license warning
  - name: external_resource_url
    description: URL of the external resource
  - name: external_resource_url_status_code
    description: int, status code of the external resource URL
  - name: image_credit
    description: str, credit of the image resource
  - name: image_alt_text
    description: str, alt text of the image resource
  - name: image_caption
    description: str, caption of the image resource
  - name: learning_resource_types
    description: str, learning resource types of the resource (e.g., Lecture Notes)
  - name: metadata
    description: json, metadata of the resource
    tests:
    - not_null
  - name: resource_draft
    description: boolean, whether the resource is draft
  - name: resource_filename
    description: str, resource page slug used in the resource URL, without an extension
    tests:
    - not_null
  - name: resource_uploaded_filename
    description: str, filename including extension from the linked Google Drive upload
      (DriveFile.name); null when unavailable
  - name: resource_live_url
    description: str, live URL of the resource on production
  - name: resource_title
    description: str, title of the resource
  - name: resource_type
    description: str, resource type (image, video, etc.)
  - name: resource_uuid
    description: str, UUID of the resource
    tests:
    - not_null
  - name: resource_license
    description: str, license URL of the resource (e.g., Creative Commons)
  - name: resource_description
    description: str, description of the resource
  - name: resource_file_type
    description: str, file type of the resource file
  - name: resource_file_size
    description: str, file size of the resource file
  - name: resource_ocw_type
    description: str, OCW content type classification of the resource
  - name: external_resource_status
    description: str, link status of the external resource (e.g., valid, unchecked,
      broken, check_failed)
  - name: external_resource_wayback_url
    description: str, Wayback Machine archive URL of the external resource
  - name: resource_audience
    description: str, intended audience of the resource as a JSON array
  - name: resource_level
    description: str, level of the resource as a JSON array
  - name: video_archive_url
    description: str, archive URL of the video
  - name: video_archive_filename
    description: str, filename extracted from video_archive_url, excluding query parameters
      and fragments; null when unavailable
  - name: video_captions_file
    description: str, captions file of the video resource
  - name: video_thumbnail_file
    description: str, thumbnail file of the video resource
  - name: video_transcript_file
    description: str, transcript file of the video resource
  - name: video_youtube_description
    description: str, description of the YouTube video
  - name: video_youtube_id
    description: str, YouTube ID of the video
  - name: video_youtube_speakers
    description: str, speakers in the YouTube video
  - name: video_youtube_tags
    description: str, tags of the YouTube video
  - name: studio_url
    description: string, OCW Studio URL for the resource
  - name: website_title
    description: str, title of the course
    tests:
    - not_null
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["course_uuid", "resource_uuid"]

- name: int__ocw__live_courses
  description: One row per OCW course published to the OCW live bucket, with the fields
    of its data.json that MIT Learn's OCW ETL reads. A directory left in the bucket
    by a site that ocw-studio has since published under another path is not a course.
  columns:
  - name: course_slug
    description: str, the course's directory under courses/ in the bucket
    tests:
    - not_null
    - unique
  - name: courserun_readable_id
    description: str, the course's legacy_uid, or its site_uid when it has none, without
      dashes. Equals LearningResourceRun.run_id in MIT Learn. Null for a course with
      neither.
    tests:
    - unique
  - name: course_site_uid
    description: str, site_uid, the course's uuid in ocw-studio
  - name: course_legacy_uid
    description: str, legacy_uid, set on a course migrated from the earlier OCW site
  - name: course_title
    description: str, title of the course
  - name: course_description_html
    description: str, the course description as rendered HTML
  - name: course_primary_course_number
    description: str, primary course number, e.g. 6.1810
  - name: course_extra_course_numbers
    description: array, the cross-listed course numbers; empty when there are none
  - name: course_term
    description: str, Fall, Spring, Summer or January IAP; null when not given
  - name: course_year
    description: str, the year; null when not given
  - name: course_levels
    description: array, level labels, e.g. Undergraduate
  - name: course_department_numbers
    description: array, MIT department numbers
  - name: course_learning_resource_types
    description: array, learning resource types of the course, e.g. Lecture Notes
  - name: course_topics
    description: array, every OCW topic, subtopic and speciality of the course, sorted
  - name: course_learn_topics
    description: array, the MIT Learn topic names OCW gave the course, sorted
  - name: course_instructors_json
    description: str, JSON array of the course's instructors as published, each with
      first_name, last_name, middle_initial, salutation and title
  - name: course_image_src
    description: str, path of the course image on ocw.mit.edu
  - name: course_image_alt
    description: str, alt text of the course image
  - name: course_image_description
    description: str, description of the course image
  - name: course_hides_download
    description: boolean, whether OCW hides the course's download link
  - name: course_retrieved_on
    description: timestamp, when the course was last read from the bucket

- name: int__ocw__content_files
  description: One row per page or resource of an OCW course that MIT Learn loads
    as a ContentFile, derived from the OCW live bucket the way Learn's OCW ETL derives
    it.
  columns:
  - name: courserun_readable_id
    description: str, the course's legacy_uid, or its site_uid when it has none, without
      dashes. Equals LearningResourceRun.run_id in MIT Learn.
    tests:
    - not_null
  - name: course_slug
    description: str, the course's directory under courses/ in the bucket
    tests:
    - not_null
  - name: content_file_key
    description: str, the directory of the page or resource in the bucket, with its
      trailing slash. Equals ContentFile.key.
    tests:
    - not_null
    - unique
  - name: content_type
    description: str, page, video, pdf or file
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [page, video, pdf, file]
  - name: title
    description: str, title of the page or resource
  - name: description
    description: str, description of the page, or the HTML body of the resource
  - name: url
    description: str, URL of the page or resource on ocw.mit.edu
  - name: content
    description: str, the page's HTML, or the text extracted from the resource's file;
      null for a resource whose file has no text or is not a type Learn reads
  - name: file_type
    description: str, MIME type of the resource's file
  - name: file_extension
    description: str, extension of the resource's file with its dot
  - name: image_src
    description: str, thumbnail of a video resource
  - name: youtube_id
    description: str, YouTube id of a video resource
  - name: content_tags
    description: str, JSON array of learning resource types
  - name: extraction_status
    description: str, extracted, empty or failed; null where there is no file to extract
  - name: retrieved_on
    description: timestamp, when the course was last read from the bucket

unit_tests:
- name: test_int__ocw__content_files_matches_learn_derivations
  description: >
    Keys, content types and the resources Learn drops, each case checked against
    Learn's content files for 18.06SC+fall_2011 on 2026-10-03.
  model: int__ocw__content_files
  given:
  - input: ref('int__ocw__live_courses')
    rows:
    - {course_slug: a-course, courserun_readable_id: b89637d2d64abf7896f604f5d40d48a9}
    # A course with neither uid is not a Learn resource.
    - {course_slug: b-course, courserun_readable_id: null}
  - input: ref('stg__ocw__s3__course_content')
    rows:
    - {course_slug: a-course, coursecontent_kind: page, coursecontent_s3_key: courses/a-course/pages/syllabus/data.json,
      coursecontent_title: Syllabus, coursecontent_description: About, coursecontent_body: <p>Read.</p>}
    - {course_slug: a-course, coursecontent_kind: resource, coursecontent_s3_key: courses/a-course/resources/notes/data.json,
      coursecontent_title: Notes, coursecontent_body: "", coursecontent_resource_type: Document,
      coursecontent_file: /courses/a-course/abc_notes.pdf, coursecontent_file_type: application/pdf,
      coursecontent_text: Lecture notes, coursecontent_text_extraction_status: extracted}
    # An image has a row and no text.
    - {course_slug: a-course, coursecontent_kind: resource, coursecontent_s3_key: courses/a-course/resources/figure/data.json,
      coursecontent_title: Figure, coursecontent_resource_type: Image, coursecontent_file: /courses/a-course/abc_figure.jpg,
      coursecontent_file_type: image/jpeg}
    # Learn drops caption files by title, a resource with no file, a video
    # with no video_transcript_file, and a resource whose file is gone.
    - {course_slug: a-course, coursecontent_kind: resource, coursecontent_s3_key: courses/a-course/resources/caption/data.json,
      coursecontent_title: 3play caption file, coursecontent_resource_type: Other,
      coursecontent_file: /courses/a-course/abc_caption.srt}
    - {course_slug: a-course, coursecontent_kind: resource, coursecontent_s3_key: courses/a-course/resources/empty/data.json,
      coursecontent_title: No file, coursecontent_resource_type: Other}
    - {course_slug: a-course, coursecontent_kind: resource, coursecontent_s3_key: courses/a-course/resources/lecture/data.json,
      coursecontent_title: Lecture 1, coursecontent_resource_type: Video, coursecontent_video_youtube_id: abc123,
      coursecontent_video_archive_url: "http://www.archive.org/download/x/1.mp4"}
    - {course_slug: a-course, coursecontent_kind: resource, coursecontent_s3_key: courses/a-course/resources/gone/data.json,
      coursecontent_title: Gone, coursecontent_resource_type: Document, coursecontent_file: /courses/a-course/abc_gone.pdf,
      coursecontent_text_extraction_status: missing}
    - {course_slug: a-course, coursecontent_kind: resource, coursecontent_s3_key: courses/a-course/resources/lecture-2/data.json,
      coursecontent_title: Lecture 2, coursecontent_resource_type: Video, coursecontent_video_youtube_id: def456,
      coursecontent_video_transcript_file: /courses/a-course/abc_lecture2.pdf, coursecontent_video_archive_url: "http://www.archive.org/download/x/2.mp4",
      coursecontent_text: Transcript, coursecontent_text_extraction_status: extracted}
    - {course_slug: b-course, coursecontent_kind: page, coursecontent_s3_key: courses/b-course/pages/syllabus/data.json,
      coursecontent_title: Syllabus}
  expect:
    rows:
    - {courserun_readable_id: b89637d2d64abf7896f604f5d40d48a9, content_file_key: courses/a-course/pages/syllabus/,
      content_type: page, title: Syllabus, description: About, url: "https://ocw.mit.edu/courses/a-course/pages/syllabus/",
      content: <p>Read.</p>, file_extension: null, image_src: null, youtube_id: null}
    - {courserun_readable_id: b89637d2d64abf7896f604f5d40d48a9, content_file_key: courses/a-course/resources/notes/,
      content_type: pdf, title: Notes, description: "", url: "https://ocw.mit.edu/courses/a-course/resources/notes/",
      content: Lecture notes, file_extension: .pdf, image_src: null, youtube_id: null}
    - {courserun_readable_id: b89637d2d64abf7896f604f5d40d48a9, content_file_key: courses/a-course/resources/figure/,
      content_type: file, title: Figure, description: "", url: "https://ocw.mit.edu/courses/a-course/resources/figure/",
      content: null, file_extension: .jpg, image_src: null, youtube_id: null}
    - {courserun_readable_id: b89637d2d64abf7896f604f5d40d48a9, content_file_key: courses/a-course/resources/lecture-2/,
      content_type: video, title: Lecture 2, description: "", url: "https://ocw.mit.edu/courses/a-course/resources/lecture-2/",
      content: Transcript, file_extension: .mp4, image_src: "https://i.ytimg.com/vi/def456/hqdefault.jpg",
      youtube_id: def456}
- name: test_int__ocw__live_courses_reads_what_learn_reads
  description: >
    The run id prefers legacy_uid, cross-listed numbers are split and trimmed,
    topic paths are flattened, absent keys give empty values, and the directory
    a renamed site left behind is not a course.
  model: int__ocw__live_courses
  given:
  - input: ref('stg__ocw__studio__postgres__websites_website')
    rows:
    - {website_url_path: courses/a-course}
    - {website_url_path: courses/b-course}
    # Two sites holding one url_path do not double the course.
    - {website_url_path: courses/b-course}
  - input: ref('stg__ocw__s3__course_content')
    rows:
    - course_slug: a-course
      coursecontent_kind: course
      course_site_uid: 23d385b4-4328-4fb0-b398-f5ca46ecae9a
      course_legacy_uid: b89637d2-d64a-bf78-96f6-04f5d40d48a9
      course_data_json: >-
        {"course_title": "A Course", "primary_course_number": "1.401J",
        "extra_course_numbers": "ESD.018J, 11.380J", "term": "January IAP",
        "year": "2007", "level": ["Graduate"], "department_numbers": ["1", "11"],
        "topics": [["Engineering", "Civil Engineering"], ["Engineering"]],
        "mit_learn_topics": [["Engineering"]], "hide_download": true,
        "image_src": "/courses/a-course/a.jpg",
        "course_image_metadata": {"description": "A bridge.",
        "image_metadata": {"image-alt": "Bridge"}}}
    - course_slug: b-course
      coursecontent_kind: course
      course_site_uid: a062e4e8-db04-4bcd-bb1d-4d6f80c18083
      course_legacy_uid: ""
      course_data_json: >-
        {"course_title": "B Course", "primary_course_number": "6.1810",
        "extra_course_numbers": "", "term": "", "year": "", "image_src": "",
        "instructors": null, "course_image_metadata": {"image_metadata": {"image-alt":
        null}}}
    - course_slug: b-course-2016
      coursecontent_kind: course
      course_site_uid: a062e4e8-db04-4bcd-bb1d-4d6f80c18083
      course_legacy_uid: ""
      course_data_json: >-
        {"course_title": "B Course", "primary_course_number": "6.1810"}
    # Pages and resources are not courses.
    - {course_slug: a-course, coursecontent_kind: page, course_data_json: null}
  expect:
    rows:
    - {course_slug: a-course, courserun_readable_id: b89637d2d64abf7896f604f5d40d48a9,
