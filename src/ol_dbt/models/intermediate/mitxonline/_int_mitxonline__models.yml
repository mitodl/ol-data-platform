- name: int__mitxonline__courses
  description: Intermediate model for MITxOnline courses
  columns:
  - name: course_id
    description: int, primary key representing a single MITx Online course
    tests:
    - unique
    - not_null
  - name: course_is_live
    description: boolean, indicating whether course is available to users on MITxOnline
      website
  - name: course_title
    description: str, title of the course
    tests:
    - not_null
  - name: course_readable_id
    description: str, Open edX ID formatted as course-v1:{org}+{course code}
    tests:
    - unique
    - not_null
  - name: course_number
    description: str, unique string for the course. It can contain letters, numbers,
      or periods. e.g. 18.03.1x. May not be unique for UAI course.
    tests:
    - not_null
  - name: course_description
    description: text, the description shown on the home page and product page.
  - name: course_price
    description: str, product price in plain text. e.g. $250 - $1000 (financial assistance
      available). QA has live course pages with no price block (71 of 162 on 2026-10-07),
      so the test below only warns there.
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        arguments:
          row_condition: "course_page_is_live=true"
        config:
          severity: "{{ 'warn' if target.database == 'ol_data_lake_qa' else 'error'\
            \ }}"
  - name: course_length
    description: str, a short description indicating how long it takes to complete
      (e.g. '4 weeks').
  - name: course_effort
    description: str, a short description indicating how much effort is required (e.g.
      1-3 hours per week).
  - name: course_prerequisites
    description: text, a short description indicating prerequisites of this course.
  - name: course_about
    description: text, details about this course.
  - name: course_what_you_learn
    description: text, what you will learn from this course.
  - name: course_certification_type
    description: str, either 'MicroMasters Credential' or 'Certificate of Completion'.
    tests:
    - not_null
  - name: course_topics
    description: str, list of topic names for a course.
  - name: course_instructors
    description: str, list of instructor names for a course.
  - name: course_page_slug
    description: str, used for constructing the program page’s URL.
  - name: course_page_url_path
    description: str, url path for the page
  - name: course_page_is_live
    description: boolean, if set to true this program page is published
  - name: course_page_first_published_on
    description: timestamp, date and time when the course page was first published
  - name: course_page_last_published_on
    description: timestamp, date and time when the course page was last published
  - name: course_image_url
    description: str, fully-qualified URL for the course's featured image, resolved
      from the course page's feature image in the Wagtail CMS

