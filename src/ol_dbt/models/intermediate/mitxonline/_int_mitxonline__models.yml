- name: test_int__mitxonline__ecommerce_order_discount_amount_is_dollars_off
  description: >
    discount_amount is the dollar amount taken off product_price for every discount
    type. A fixed-price discount's stored amount is the price the learner pays, so
    the amount off is product_price minus it, and 0 when it is above product_price,
    as MITx Online charges the lower of the two. dollars-off cannot take more than
    product_price off, as MITx Online charges max(0, price - amount).
