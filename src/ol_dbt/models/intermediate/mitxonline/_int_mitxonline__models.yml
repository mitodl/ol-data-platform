- name: test_int__mitxonline__program_course_run_orders_matches_program_purchase
  description: >
    A course run order with a program's internal discount links to the learner's
    latest fulfilled or refunded order for that program placed before it. An exact
    program match wins over a parent program purchase, and a parent purchase matches
    when there is no exact one. Orders with no earlier program purchase, or with no
    internal discount, are left out.
  model: int__mitxonline__program_course_run_orders
  given:
  - input: ref('int__mitxonline__ecommerce_order')
    rows:
    # user 1: exact match, latest purchase before the run; order 13 comes after it
    - {line_id: 11, order_id: 11, user_id: 1, order_state: fulfilled, order_created_on: "2026-01-01T00:00:00",
      product_type: program, program_id: 10}
    - {line_id: 12, order_id: 12, user_id: 1, order_state: fulfilled, order_created_on: "2026-02-01T00:00:00",
      product_type: program, program_id: 10}
    - {line_id: 13, order_id: 13, user_id: 1, order_state: fulfilled, order_created_on: "2026-04-01T00:00:00",
      product_type: program, program_id: 10}
    - {line_id: 14, order_id: 14, user_id: 1, order_state: fulfilled, order_created_on: "2026-03-01T00:00:00",
      product_type: course run, discount_id: 1, discount_redemption_type: internal}
    - {line_id: 15, order_id: 15, user_id: 1, order_state: fulfilled, order_created_on: "2026-03-01T00:00:00",
      product_type: course run, discount_id: 9, discount_redemption_type: one-time}
    # user 2: owns the child (21) and its newer parent (20); the exact child match wins
    - {line_id: 21, order_id: 21, user_id: 2, order_state: fulfilled, order_created_on: "2026-02-01T00:00:00",
      product_type: program, program_id: 20}
    - {line_id: 22, order_id: 22, user_id: 2, order_state: fulfilled, order_created_on: "2026-01-01T00:00:00",
      product_type: program, program_id: 21}
    - {line_id: 23, order_id: 23, user_id: 2, order_state: fulfilled, order_created_on: "2026-03-01T00:00:00",
      product_type: course run, discount_id: 2, discount_redemption_type: internal}
    # user 3: owns only the parent (20)
    - {line_id: 31, order_id: 31, user_id: 3, order_state: fulfilled, order_created_on: "2026-01-01T00:00:00",
      product_type: program, program_id: 20}
    - {line_id: 32, order_id: 32, user_id: 3, order_state: fulfilled, order_created_on: "2026-02-01T00:00:00",
      product_type: course run, discount_id: 2, discount_redemption_type: internal}
    # user 4: only a pending program order, so no match
    - {line_id: 41, order_id: 41, user_id: 4, order_state: pending, order_created_on: "2026-01-01T00:00:00",
      product_type: program, program_id: 10}
    - {line_id: 42, order_id: 42, user_id: 4, order_state: fulfilled, order_created_on: "2026-02-01T00:00:00",
      product_type: course run, discount_id: 1, discount_redemption_type: internal}
  - input: ref('stg__mitxonline__app__postgres__ecommerce_discountproduct')
    rows:
    - {discount_id: 1, product_id: 100}
    - {discount_id: 2, product_id: 210}
    - {discount_id: 9, product_id: 100}
  - input: ref('int__mitxonline__ecommerce_product')
    rows:
    - {product_id: 100, product_type: program, program_id: 10}
    - {product_id: 210, product_type: program, program_id: 21}
  - input: ref('stg__mitxonline__app__postgres__courses_programrequirement')
    rows:
    - {program_id: 20, required_program_id: 21}
    - {program_id: 10, required_program_id: null}
  expect:
    rows:
    - {line_id: 14, order_id: 14, program_order_id: 12}
    - {line_id: 23, order_id: 23, program_order_id: 22}
    - {line_id: 32, order_id: 32, program_order_id: 31}
- name: test_int__mitxonline__program_requirements_nested_core_is_not_required
  description: >
    A course is required on its own only when every operator above it is all_of.
    Courses under an all_of nested in a "choose 1 of" elective set read Core from
    their innermost operator but are not required, like the elective set's other
    option.
  model: int__mitxonline__program_requirements
  given:
  - input: ref('stg__mitxonline__app__postgres__courses_programrequirement')
    rows:
    - {programrequirement_id: 1, program_id: 1, programrequirement_node_type: program_root,
      programrequirement_path: "0001"}
    - {programrequirement_id: 2, program_id: 1, programrequirement_node_type: operator,
      programrequirement_path: "00010001", programrequirement_title: Required, programrequirement_operator: all_of}
    - {programrequirement_id: 3, program_id: 1, course_id: 10, programrequirement_node_type: course,
      programrequirement_path: "000100010001"}
    - {programrequirement_id: 4, program_id: 1, programrequirement_node_type: operator,
      programrequirement_path: "00010002", programrequirement_title: Electives, programrequirement_operator: min_number_of,
      programrequirement_operator_value: 1}
    - {programrequirement_id: 5, program_id: 1, course_id: 11, programrequirement_node_type: course,
      programrequirement_path: "000100020001"}
    - {programrequirement_id: 6, program_id: 1, programrequirement_node_type: operator,
      programrequirement_path: "000100020002", programrequirement_title: Pair, programrequirement_operator: all_of}
    - {programrequirement_id: 7, program_id: 1, course_id: 12, programrequirement_node_type: course,
      programrequirement_path: "0001000200020001"}
    - {programrequirement_id: 8, program_id: 1, course_id: 13, programrequirement_node_type: course,
      programrequirement_path: "0001000200020002"}
  expect:
    rows:
    - {course_id: 10, programrequirement_type: Core, programrequirement_is_required: true,
      programrequirement_is_a_nested_requirement: false}
    - {course_id: 11, programrequirement_type: Elective, programrequirement_is_required: false,
      programrequirement_is_a_nested_requirement: false}
    - {course_id: 12, programrequirement_type: Core, programrequirement_is_required: false,
      programrequirement_is_a_nested_requirement: true}
    - {course_id: 13, programrequirement_type: Core, programrequirement_is_required: false,
      programrequirement_is_a_nested_requirement: true}
