- name: test_int__mitxonline__program_requirements_course_in_two_tracks
  description: >
    MITx Online program tracks: a top-level "Minimum # of 1" group holds track nodes,
    each track holds groups, and the program requires any one whole track. A track
    node is not an operator, so a track's group is nested in the top-level group.
    Course 30 sits in both tracks. Its row takes the group of its first course node
    in tree order, and that group's parent, the same as its sibling course 31. No
    track course is required on its own.
  model: int__mitxonline__program_requirements
  given:
  - input: ref('stg__mitxonline__app__postgres__courses_programrequirement')
    rows:
    - {programrequirement_id: 1, program_id: 1, programrequirement_node_type: program_root,
      programrequirement_path: "0001"}
    - {programrequirement_id: 2, program_id: 1, programrequirement_node_type: operator,
      programrequirement_path: "00010001", programrequirement_title: Choose a track,
      programrequirement_operator: min_number_of, programrequirement_operator_value: 1}
    - {programrequirement_id: 3, program_id: 1, programrequirement_node_type: track,
      programrequirement_path: "000100010001", programrequirement_title: Track A}
    - {programrequirement_id: 4, program_id: 1, programrequirement_node_type: operator,
      programrequirement_path: "0001000100010001", programrequirement_title: Group
        A, programrequirement_operator: all_of}
    - {programrequirement_id: 5, program_id: 1, course_id: 30, programrequirement_node_type: course,
      programrequirement_path: "00010001000100010001"}
    - {programrequirement_id: 6, program_id: 1, course_id: 31, programrequirement_node_type: course,
      programrequirement_path: "00010001000100010002"}
    - {programrequirement_id: 7, program_id: 1, programrequirement_node_type: track,
      programrequirement_path: "000100010002", programrequirement_title: Track B}
    - {programrequirement_id: 8, program_id: 1, programrequirement_node_type: operator,
      programrequirement_path: "0001000100020001", programrequirement_title: Group
        B, programrequirement_operator: all_of}
    - {programrequirement_id: 9, program_id: 1, course_id: 30, programrequirement_node_type: course,
      programrequirement_path: "00010001000200010001"}
    - {programrequirement_id: 10, program_id: 1, course_id: 32, programrequirement_node_type: course,
      programrequirement_path: "00010001000200010002"}
  expect:
    rows:
    - {course_id: 30, programrequirement_requirement_id: 4, programrequirement_type: Core,
      programrequirement_is_required: false, programrequirement_is_a_nested_requirement: true,
      programrequirement_parent_requirement_id: 2, course_order_in_program: 1}
    - {course_id: 31, programrequirement_requirement_id: 4, programrequirement_type: Core,
      programrequirement_is_required: false, programrequirement_is_a_nested_requirement: true,
      programrequirement_parent_requirement_id: 2, course_order_in_program: 2}
    - {course_id: 32, programrequirement_requirement_id: 8, programrequirement_type: Core,
      programrequirement_is_required: false, programrequirement_is_a_nested_requirement: true,
      programrequirement_parent_requirement_id: 2, course_order_in_program: 3}
