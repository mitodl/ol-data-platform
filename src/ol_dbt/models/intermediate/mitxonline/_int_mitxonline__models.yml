    tests:
    - not_null
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["user_username", "courserun_readable_id", "courseactivity_date"]

- name: int__mitxonline__course_structure
  description: this table contains historical changes to open edX's course content
    data. It adds coursestructure_chapter_id that identifies chapter each subsection
    belongs to
  columns:
  - name: courserun_readable_id
    description: str, Open edX Course ID formatted as course-v1:{org}+{course code}+{run_tag}
    tests:
    - not_null
  - name: coursestructure_content_hash
    description: str, sha256 hashed string of the course content.
    tests:
    - not_null
  - name: coursestructure_block_content_hash
    description: str, sha256 hashed string of the block content in a course
    tests:
    - not_null
  - name: coursestructure_block_id
    description: str, Unique ID for a distinct piece of content in a course, formatted
      as block-v1:{org}+{course}+{run}type@{block type}+block@{hash code}
    tests:
    - not_null
  - name: coursestructure_parent_block_id
    description: str, parent block ID, same format as block_id
  - name: coursestructure_block_index
    description: int, sequence number giving order in which this block content appears
      within the course
    tests:
    - not_null
  - name: coursestructure_block_category
    description: str, category/type of the block, it identifies core structural elements
      of a course. Value includes but not limited to course, chapter, sequential,
      vertical, discussion, html, problem, video, etc.
    tests:
    - not_null
  - name: coursestructure_block_title
    description: str, title of the block extracted from the metadata of the block.
      This field comes from name field for the section, subsection, or unit on the
      Studio 'Course Outline' page.
  - name: coursestructure_block_metadata
    description: str, json string of the metadata field for the block. It provides
      additional information about this block, different block type may have different
      member fields inside metadata.
    tests:
    - not_null
  - name: courserun_title
    description: str, title of the course extracted from the metadata of 'course'
      block
  - name: courserun_start_on
    description: timestamp, indicating when the course run starts extracted from the
      metadata of 'course' block
  - name: coursestructure_retrieved_at
    description: timestamp, indicating when this course structure was initially retrieved
      from REST API.
    tests:
    - not_null
  - name: coursestructure_chapter_id
    description: str, block id of chapter within which this child block belongs to.
      Null for the 'course' block as it's the top block that doesn't belong to any
      chapter.
  - name: coursestructure_chapter_title
    description: str, title of chapter within which this child block belongs to.
  - name: coursestructure_is_latest
    description: boolean, indicating if the course content is the latest version
  tests:
  - dbt_expectations.expect_table_row_count_to_equal_other_table:
      arguments:
        compare_model: ref('stg__mitxonline__openedx__api__course_structure')
- name: int__mitxonline__courserun_subsection_grades
  description: Persistent values for learners' subsection (aka sequential) grades
    combined with override grades
  config:
    meta:
      qa_branches:
      - mitxonline/course_structure
      - mitxonline/mysql
  columns:
  - name: courserun_readable_id
    description: str, Open edX Course ID formatted as course-v1:{org}+{course code}+{run_tag}
    tests:
    - not_null
  - name: coursestructure_block_id
    description: str, block ID of the subsection (sequential) - foreign key to course_structure
    tests:
    - not_null
  - name: visibleblocks_hash
    description: str, SHA1 hash of visible blocks within the subsection at the time
      of computing the subsection grade. This field might be useful for identifying
      whether the course content was the same for two grades.
    tests:
    - not_null
  - name: coursestructure_block_title
    description: str, title of the subsection
  - name: coursestructure_chapter_id
    description: str, block id of chapter within which this subsection belongs to
  - name: openedx_user_id
    description: int, foreign key to auth_user from open edX platform
    tests:
    - not_null
  - name: subsectiongrade_total_score
    description: float, total score of all problems (both graded and ungraded) for
      the subsection
    tests:
    - not_null
  - name: subsectiongrade_total_earned_score
    description: float, user's total earned score of all problems (both graded and
      ungraded) for the subsection
    tests:
    - not_null
  - name: subsectiongrade_total_graded_score
    description: float, total score of all graded problems for the subsection.
    tests:
    - not_null
  - name: subsectiongrade_total_earned_graded_score
    description: float, user's total earned score of all graded problems for the subsection.
    tests:
    - not_null
  - name: subsectiongrade_is_overridden
    description: boolean, indicating whether this subsection grades are overridden
  - name: subsectiongrade_first_attempted_on
    description: timestamp, time of the user's first attempt at a problem in the subsection.
  - name: subsectiongrade_created_on
    description: timestamp, datetime of the subsection grade was first calculated
      for this user for this subsection.
    tests:
    - not_null
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["openedx_user_id", "courserun_readable_id", "coursestructure_block_id"]

- name: int__mitxonline__courserun_videos
  description: course videos on MITx Online open edx
  config:
    meta:
      qa_branches:
      - mitxonline/mysql
      - ovs/app_postgres
  columns:
  - name: courserun_readable_id
    description: str, open edX Course ID formatted as course-v1:{org}+{course code}+{run_tag}
    tests:
    - not_null
  - name: coursevideo_is_hidden
    description: boolean, indicating if the video is hidden for the course.
    tests:
    - not_null
  - name: video_edx_uuid
    description: str, hashed ID for the edx video
    tests:
    - not_null
  - name: video_client_id
    description: str, human readable name for video. e.g. 14.310x_Lect9_Seg8_Final.mp4
  - name: video_status
    description: str, values are external, imported, file_complete, and upload_failed.
    tests:
    - not_null
  - name: video_duration
    description: float, the length of the video, in seconds. Populated with data from
      ODL Video Service (OVS) if the video is uploaded there. May be 0.0 for small
      amounts of videos.
    tests:
    - not_null
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["courserun_readable_id", "video_edx_uuid"]

- name: int__mitxonline__proctored_exam_grades
  description: exam grades either from MITx Online exam course runs or the proctored
    exam unit in MITx Online courses
  config:
    meta:
      qa_branches:
      - micromasters/app_postgres
      - mitxonline/app_postgres
      - mitxonline/course_structure
      - mitxonline/mysql
  columns:
  - name: course_number
    description: str, unique string for the course. It can contain letters, numbers,
      or periods. e.g. 14.310x
    tests:
    - not_null
  - name: course_title
    description: str, title of the course associated with the exam grade
    tests:
    - not_null
  - name: semester
    description: str, semester for the exam, e.g., 2T2022.
    tests:
    - not_null
  - name: courserun_readable_id
    description: str, either representing the exam courserun, e.g. course-v1:MITxT+14.100PEx+2T2022,
      or the courserun that contains the proctored exam unit, e.g. course-v1:MITxT+14.100x+1T2024.
    tests:
    - not_null
  - name: openedx_user_id
    description: int, foreign key to auth_user on MITx Online open edx platform.
    tests:
    - not_null
  - name: user_id
    description: int, foreign key to users_user on MITx Online application.
    tests:
    - not_null
  - name: user_full_name
    description: str, user full name on MITx Online
  - name: user_username
    description: str, username on MITx Online
    tests:
    - not_null
  - name: user_edxorg_username
    description: str, username on edX.org
  - name: user_email
    description: str, user email on MITx Online
    tests:
    - not_null
  - name: proctoredexamgrade_passing_grade
    description: float, passing grade for the exam run, range between 0 to 1. Null
      for MITx Online courses after 2T2022.
  - name: proctoredexamgrade_grade
    description: float, user's grade for the proctored exam, range between 0 to 1
      with 4 decimals,  e.g., 0.8251
    tests:
    - not_null
  - name: proctoredexamgrade_created_on
    description: timestamp, date and time when this proctored exam grade was created.
    tests:
    - not_null
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["user_username", "courserun_readable_id"]

- name: int__mitxonline__course_instructors
  columns:
  - name: course_id
    description: int, foreign key to the courses_course table
    tests:
    - not_null
  - name: instructor_source_id
    description: str, platform-native stable identifier for the instructor (the Wagtail
      page ID of the instructor's CMS page, cast to varchar)
  - name: instructor_name
    description: str, the name of the instructor.
    tests:
    - not_null
  - name: instructor_title
    description: str, the instructor's title (academic or otherwise).
  - name: instructor_bio_short
    description: str, a short biography of the instructor. May be blank.
  - name: instructor_bio_long
    description: str, a longer biography of the instructor.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["course_id", "instructor_name"]

- name: int__mitxonline__course_to_topics
  columns:
  - name: course_id
    description: int, foreign key to courses_course
    tests:
    - not_null
  - name: coursetopic_id
    description: int, foreign key to courses_coursetopic
    tests:
    - not_null
  - name: coursetopic_name
    description: str, name of a course topic
    tests:
    - not_null
  - name: coursetopic_parent_id
    description: int, id for the parent coursetopic of the subtopic. For example 'Computer
      Science' is the parent topic of 'AI'
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["course_id", "coursetopic_id"]

- name: int__mitxonline__program_instructors
  columns:
  - name: program_id
    description: int, foreign key to the courses_program table
    tests:
    - not_null
  - name: instructor_name
    description: str, the name of the instructor.
    tests:
    - not_null
  - name: instructor_title
    description: str, the instructor's title (academic or otherwise).
  - name: instructor_bio_short
    description: str, a short biography of the instructor. May be blank.
  - name: instructor_bio_long
    description: str, a longer biography of the instructor.
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["program_id", "instructor_name"]

- name: int__mitxonline__b2b_contract_to_courseruns
  description: The B2B contracts each MITx Online course run is offered under. One
    row per (course run, contract); a run can belong to several contracts.
  columns:
  - name: courserun_readable_id
    data_type: varchar
    description: Open edX Course ID formatted as course-v1:UAI_{org}+{course code}+{run_tag}
    data_tests:
    - not_null
  - name: b2b_contract_id
    data_type: bigint
    description: foreign key to b2b_contractpage
    data_tests:
    - not_null
  - name: organization_key
    data_type: varchar
    description: short key used for the b2b customer organization. e.g. demo, Eme502
    data_tests:
    - not_null
  - name: organization_name
    data_type: varchar
    description: name of the b2b customer organization
    data_tests:
    - not_null
  - name: b2b_contract_name
    data_type: varchar
    description: name of the b2b contract
    data_tests:
    - not_null
  - name: b2b_contract_is_active
    data_type: boolean
    description: whether the contract is active or not. Date rules still apply.
  - name: b2b_contract_start_date
    data_type: date
    description: the start date of the contract
  - name: b2b_contract_end_date
    data_type: date
    description: the end date of the contract
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      arguments:
        column_list: ["courserun_readable_id", "b2b_contract_id"]

- name: int__mitxonline__catalog_course_runs
  description: Every MITx Online course run, source and B2B runs included, with the
    state MITx Online's catalog API and MIT Learn's ETL derive for it. One row per
    run. The enrollable columns are evaluated when the model builds.
  columns:
  - name: courserun_id
    description: int, primary key of the course run
    tests: [unique, not_null]
  - name: course_id
    description: int, foreign key to courses_course
    tests: [not_null]
  - name: courserun_readable_id
    description: str, the run's courseware id
  - name: courserun_title
    description: str, title of the run
  - name: courserun_start_on
    description: timestamp, when the run starts
  - name: courserun_end_on
    description: timestamp, when the run ends
  - name: courserun_enrollment_start_on
    description: timestamp, when enrollment starts
  - name: courserun_enrollment_end_on
    description: timestamp, when enrollment ends
  - name: courserun_is_live
    description: boolean, whether the run is live
  - name: courserun_is_self_paced
    description: boolean, whether the run is self-paced
  - name: courserun_is_source_run
    description: boolean, whether the run is the source other runs are cloned from
  - name: courserun_language
    description: str, language code of the run
  - name: courserun_is_enrollable
    description: boolean, whether the run is live, has a start date, has started enrollment
      and has not ended it (CourseRun.is_enrollable in mitxonline)
    tests: [not_null]
  - name: courserun_course_number
    description: str, the course part of the courseware id
  - name: courserun_is_b2b_only
    description: boolean, whether the run is offered only under a B2B contract
    tests: [not_null]
  - name: courserun_is_variant
    description: boolean, whether the run is B2B-only or its language matches a variant
      set of its course that is not the default
    tests: [not_null]
  - name: courserun_is_fully_enrollable
    description: boolean, whether the run is enrollable and not past its enrollment
      end, or its end when it has no enrollment end (is_fully_enrollable in MIT Learn)
    tests: [not_null]
  - name: courserun_enrollment_modes
    description: array(str), slugs of the run's enrollment modes, sorted; null without
      any
  - name: courserun_has_verified_mode
    description: boolean, whether the run offers the verified enrollment mode
    tests: [not_null]
  - name: courserun_has_audit_mode
    description: boolean, whether the run offers the audit enrollment mode
    tests: [not_null]

- name: int__mitxonline__catalog_pages
  description: The CMS page of each MITx Online course and program with what MITx
    Online's catalog API reads off it. One row per course or program page; exactly
    one of course_id and program_id is set.
  columns:
  - name: course_id
    description: int, the page's course; null for a program page
    tests:
    - unique
  - name: program_id
    description: int, the page's program; null for a course page
    tests:
    - unique
  - name: wagtail_page_id
    description: int, primary key of the page in wagtailcore_page
    tests: [unique, not_null]
  - name: page_is_live
    description: boolean, whether the page is published
  - name: page_first_published_on
    description: timestamp, when the page was first published
  - name: page_last_published_on
    description: timestamp, when the page was last published
  - name: page_description
    description: str, the page's description, as HTML
  - name: page_about
    description: str, the page's About section, as stored HTML (Wagtail's database
      representation, before the API expands internal links and embeds)
  - name: page_what_you_learn
    description: str, the page's What you'll learn section, as stored HTML
  - name: page_prerequisites
    description: str, the page's Prerequisites section, as stored HTML
  - name: page_length
    description: str, free-text length of the course or program
  - name: page_effort
    description: str, free-text weekly effort
  - name: page_min_weeks
    description: int, shortest length in weeks
  - name: page_max_weeks
    description: int, longest length in weeks
  - name: page_min_weekly_hours
    description: str, least weekly hours
  - name: page_max_weekly_hours
    description: str, most weekly hours
  - name: page_min_price
    description: double, lowest certificate price in USD
  - name: page_max_price
    description: double, highest certificate price in USD
  - name: page_is_in_learn_catalog
    description: boolean, whether the page is included in the MIT Learn catalog
    tests: [not_null]
  - name: page_ingests_content_files_for_ai
    description: boolean, whether MIT Learn ingests the course's content files regardless
      of the catalog flag; false for a program page
    tests: [not_null]
  - name: page_feature_image_src
    description: str, URL of the page's feature image with the ?v=<file hash> suffix
      the API adds; null without an image
  - name: page_instructors
    description: array(str), names of the instructor pages linked to the page, in
      link order; null without any
  - name: page_faqs
    description: str, the page's FAQs as a JSON array of {"question", "answer"} objects
      in sort_order, which is the order MITx Online's pages API returns them in. The
      answer is the stored rich-text HTML. Null for a page without any.

unit_tests:
- name: test_int__mitxonline__catalog_pages_faqs_in_page_order
  description: >
    A page's FAQs come in sort_order, with the id breaking ties and a missing
    sort_order last, as a JSON array of question and answer. A page without
    FAQs has none.
  model: int__mitxonline__catalog_pages
  given:
  - input: ref('stg__mitxonline__app__postgres__cms_wagtail_page')
    rows:
    - {wagtail_page_id: 10, wagtail_page_is_live: true}
    - {wagtail_page_id: 11, wagtail_page_is_live: true}
  - input: ref('stg__mitxonline__app__postgres__wagtailimages_image')
    rows: []
  - input: ref('stg__mitxonline__app__postgres__cms_coursepage')
    rows:
    - {course_id: 1, wagtail_page_id: 10, course_is_in_learn_catalog: true, course_ingests_content_files_for_ai: false}
  - input: ref('stg__mitxonline__app__postgres__cms_programpage')
    rows:
    - {program_id: 7, wagtail_page_id: 11, program_is_in_learn_catalog: true}
  - input: ref('stg__mitxonline__app__postgres__cms_instructorpagelink')
    rows: []
  - input: ref('stg__mitxonline__app__postgres__cms_instructorpage')
    rows: []
  - input: ref('stg__mitxonline__app__postgres__cms_productpagefaq')
    rows:
    - {productpagefaq_id: 1, wagtail_page_id: 10, productpagefaq_question: "Last?",
      productpagefaq_answer: <p>Unordered</p>, productpagefaq_sort_order: null}
    - {productpagefaq_id: 2, wagtail_page_id: 10, productpagefaq_question: "Second?",
      productpagefaq_answer: <p>Two</p>, productpagefaq_sort_order: 1}
    - {productpagefaq_id: 3, wagtail_page_id: 10, productpagefaq_question: "First?",
      productpagefaq_answer: '<p>One "quoted"</p>', productpagefaq_sort_order: 0}
    - {productpagefaq_id: 4, wagtail_page_id: 10, productpagefaq_question: "Third?",
      productpagefaq_answer: <p>Three</p>, productpagefaq_sort_order: 1}
  expect:
    rows:
    - {wagtail_page_id: 10, page_faqs: '[{"question":"First?","answer":"<p>One \"quoted\"</p>"},{"question":"Second?","answer":"<p>Two</p>"},{"question":"Third?","answer":"<p>Three</p>"},{"question":"Last?","answer":"<p>Unordered</p>"}]'}
    - {wagtail_page_id: 11, page_faqs: null}

- name: test_int__mitxonline__catalog_course_runs_enrollable_and_variant
  description: >
    A run is enrollable when it is live, has a start date, enrollment has started
    and has not ended. It is fully enrollable while not past its enrollment end,
    or its end without one. A B2B-only run is a variant, and so is a run whose
    language matches a non-default variant set of its own course; a b2b.contractpage
    variant with the same object id does not count.
  model: int__mitxonline__catalog_course_runs
  given:
  - input: ref('stg__mitxonline__app__postgres__courses_courserun')
    rows:
    - {courserun_id: 1, course_id: 1, courserun_readable_id: "course-v1:MITxT+1.01x+1T2000",
      courserun_is_live: true, courserun_start_on: "2000-01-01T00:00:00.000", courserun_enrollment_start_on: "2000-01-01T00:00:00.000",
      courserun_language: en, courserun_is_b2b_only: false}
    - {courserun_id: 2, course_id: 1, courserun_readable_id: "MITx/1.02x/1T2000",
      courserun_is_live: true, courserun_start_on: "2000-01-01T00:00:00.000", courserun_enrollment_start_on: "2000-01-01T00:00:00.000",
      courserun_end_on: "2000-06-01T00:00:00.000", courserun_language: es, courserun_is_b2b_only: false}
    - {courserun_id: 3, course_id: 1, courserun_readable_id: "course-v1:MITxT+1.01x+2T2000",
      courserun_is_live: true, courserun_start_on: "2000-01-01T00:00:00.000", courserun_enrollment_start_on: "2000-01-01T00:00:00.000",
      courserun_enrollment_end_on: "2000-06-01T00:00:00.000", courserun_language: en,
      courserun_is_b2b_only: true}
    - {courserun_id: 4, course_id: 1, courserun_readable_id: "course-v1:MITxT+1.01x+3T2000",
      courserun_is_live: true, courserun_start_on: "2000-01-01T00:00:00.000", courserun_language: en,
      courserun_is_b2b_only: false}
    - {courserun_id: 5, course_id: 2, courserun_readable_id: "course-v1:MITxT+2.01x+1T2000",
      courserun_is_live: false, courserun_start_on: "2000-01-01T00:00:00.000", courserun_enrollment_start_on: "2000-01-01T00:00:00.000",
      courserun_language: es, courserun_is_b2b_only: false}
  - input: ref('stg__mitxonline__app__postgres__courses_courserun_enrollment_modes')
    rows:
    - {courserun_id: 1, enrollmentmode_id: 1}
    - {courserun_id: 1, enrollmentmode_id: 2}
    - {courserun_id: 2, enrollmentmode_id: 1}
  - input: ref('stg__mitxonline__app__postgres__courses_enrollmentmode')
    rows:
    - {enrollmentmode_id: 1, enrollmentmode_slug: audit}
    - {enrollmentmode_id: 2, enrollmentmode_slug: verified}
  - input: ref('stg__mitxonline__app__postgres__variants_supportedvariant')
    rows:
    - {supportedvariant_id: 1, contenttype_id: 10, supportedvariant_object_id: 1,
      supportedvariant_language: en, supportedvariant_is_default: true}
    - {supportedvariant_id: 2, contenttype_id: 10, supportedvariant_object_id: 1,
      supportedvariant_language: en, supportedvariant_is_default: false}
    - {supportedvariant_id: 3, contenttype_id: 10, supportedvariant_object_id: 1,
      supportedvariant_language: es, supportedvariant_is_default: false}
    - {supportedvariant_id: 4, contenttype_id: 20, supportedvariant_object_id: 2,
      supportedvariant_language: es, supportedvariant_is_default: false}
  - input: ref('stg__mitxonline__app__postgres__django_contenttype')
    rows:
    - {contenttype_id: 10, contenttype_full_name: courses_course}
    - {contenttype_id: 20, contenttype_full_name: b2b_contractpage}
  expect:
    rows:
    - {courserun_id: 1, courserun_course_number: "1.01x", courserun_is_enrollable: true,
      courserun_is_fully_enrollable: true, courserun_is_variant: false, courserun_has_verified_mode: true,
      courserun_has_audit_mode: true}
