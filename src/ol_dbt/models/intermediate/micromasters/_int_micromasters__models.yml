    - {user_micromasters_id: 103, user_mitxonline_id: 10, user_edxorg_id: null, user_micromasters_edxorg_id: null,
      user_micromasters_email: own@example.com, is_mitxonline_user: true, is_micromasters_linked_by_email: false}
    - {user_micromasters_id: null, user_mitxonline_id: 11, user_edxorg_id: 30, user_micromasters_edxorg_id: null,
      user_micromasters_email: null, is_mitxonline_user: true, is_micromasters_linked_by_email: false}
    - {user_micromasters_id: 104, user_mitxonline_id: 12, user_edxorg_id: null, user_micromasters_edxorg_id: 30,
