      user_micromasters_edxorg_id: null, user_micromasters_email: Case@Example.com,
      is_mitxonline_user: false, is_micromasters_linked_by_email: false}
    - {user_micromasters_id: 106, user_mitxonline_id: 13, user_edxorg_id: null, user_micromasters_edxorg_id: null,
      user_micromasters_email: other@example.com, is_mitxonline_user: true, is_micromasters_linked_by_email: false}
    - {user_micromasters_id: 107, user_mitxonline_id: null, user_edxorg_id: null,
