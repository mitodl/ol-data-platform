    - {program_certificate_hashed_id: mxo-after-cutoff, user_mitxonline_id: 30, micromasters_program_id: 2,
      mitxonline_program_id: 1, program_title: DEDP ID, program_completion_timestamp: "2023-02-01T00:00:00Z",
      programcertificate_is_revoked: false}
    - {program_certificate_hashed_id: mxo-other-time-same-email-other-case, user_mitxonline_id: 31,
      micromasters_program_id: 2, mitxonline_program_id: 1, program_title: DEDP ID,
      program_completion_timestamp: "2018-07-01T00:00:00Z", programcertificate_is_revoked: false}
  - input: ref('__micromasters_program_certificates_non_dedp')
    rows: []
  - input: ref('int__mitx__users')
    rows:
