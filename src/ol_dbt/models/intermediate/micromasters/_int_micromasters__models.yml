    - {user_micromasters_id: 17, user_mitxonline_id: 29, user_micromasters_email: i-other@example,
      user_mitxonline_email: i@example}
    - {user_micromasters_id: 18, user_mitxonline_id: null, user_micromasters_email: i@example,
