- name: test_int__micromasters__program_enrollments_email_link_stays_on_edxorg
  description: >
    The combined program enrollment mart keeps only edX.org rows from mm_dedp_records.
    An email
    link gives a learner a MITx Online account without moving the enrollment there,
    so the row
    stays edX.org. A link through social auth or edX.org still reads as MITx Online.
  model: int__micromasters__program_enrollments
  given:
  - input: ref('int__edxorg__mitx_program_enrollments')
    rows: []
  - input: ref('stg__micromasters__app__postgres__dashboard_programenrollment')
    rows:
    - {user_id: 100, program_id: 1}
    - {user_id: 101, program_id: 1}
    - {user_id: 102, program_id: 1}
    - {user_id: 108, program_id: 1}
  - input: ref('int__mitxonline__programenrollments')
    rows: []
  - input: ref('int__mitx__programs')
    rows:
    - {micromasters_program_id: 1, mitxonline_program_id: 2, program_title: DEDP,
      is_dedp_program: true}
  - input: ref('int__mitx__users')
    rows:
    - {user_micromasters_id: 100, user_micromasters_email: linked@example.com, is_mitxonline_user: true,
      is_micromasters_linked_by_email: true, user_edxorg_id: null, user_edxorg_username: null,
      user_micromasters_edxorg_id: 20, user_micromasters_edxorg_username: edx_linked}
    - {user_micromasters_id: 101, user_micromasters_email: social@example.com, is_mitxonline_user: true,
      is_micromasters_linked_by_email: false, user_edxorg_id: 21, user_edxorg_username: edx_social,
      user_micromasters_edxorg_id: null, user_micromasters_edxorg_username: null}
    - {user_micromasters_id: 102, user_micromasters_email: alone@example.com, is_mitxonline_user: false,
      is_micromasters_linked_by_email: false, user_edxorg_id: null, user_edxorg_username: null,
      user_micromasters_edxorg_id: null, user_micromasters_edxorg_username: null}
    # 108's MicroMasters login has no edX.org row, and the MITx Online row links another account.
    - {user_micromasters_id: 108, user_micromasters_email: other-edx@example.com,
      is_mitxonline_user: true, is_micromasters_linked_by_email: true, user_edxorg_id: 22,
      user_edxorg_username: edx_other, user_micromasters_edxorg_id: null, user_micromasters_edxorg_username: edx_no_row}
  expect:
    rows:
    - {micromasters_user_id: 100, platform_name: edX.org, user_edxorg_id: 20, user_edxorg_username: edx_linked}
    - {micromasters_user_id: 101, platform_name: MITx Online, user_edxorg_id: 21,
      user_edxorg_username: edx_social}
    - {micromasters_user_id: 102, platform_name: edX.org, user_edxorg_id: null, user_edxorg_username: null}
    - {micromasters_user_id: 108, platform_name: edX.org, user_edxorg_id: null, user_edxorg_username: edx_no_row}

