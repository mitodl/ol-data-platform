---
version: 2
sources:
- name: dimensional
  description: >
    Dimensional-layer Iceberg tables, accessed from StarRocks via the
    `ol_data_lake_{qa,production}` external catalog. Same physical tables the
    Trino-backed ol_dbt project materializes into `ol_warehouse_{env}_dimensional`.

    Which catalog is read comes from DBT_DATA_LAKE_ENV, NOT from the target
    name. The target names a CLUSTER and its auth; this names the lake the
    cluster reads through its external catalog, and the two axes diverge: the
    `ci` environment's target is starrocks_production but it reads the QA
    lake. Inferring the lake from `'qa' in target.name` conflated them
    (RFC 12711 step 1). Set from a per-environment map that raises on an unknown
    environment by lakehouse/assets/lakehouse/dbt.py (Dagster) and
    ol_dbt_cli/commands/starrocks.py (local, CI); the default below is reached
    only by a bare `dbt` invocation outside both, where reading production is
    the sanctioned practice and a wrong value fails as a missing relation.
  database: "ol_data_lake_{{ env_var('DBT_DATA_LAKE_ENV', 'production') }}"
  schema: "ol_warehouse_{{ env_var('DBT_DATA_LAKE_ENV', 'production') }}_dimensional"
  tables:
  - name: dim_organization
    description: One row per organization per platform. organization_key is null for
      xPro.
  - name: dim_contract
    description: "MITx Online B2B contracts. Grain: one row per contract."
  - name: dim_course_run
    description: Course run dimension. Filter to platform='mitxonline' and is_current=true
      for B2B joins.
  - name: dim_program
    description: Program metadata.
  - name: bridge_organization_courserun
    description: >
      Maps MITx Online B2B organizations to course runs via contracts.
      Grain: one row per (organization, contract, course_run). xPro B2B is out of
      scope.
  - name: bridge_program_course
    description: "Program-to-course membership. Grain: one row per (program, course)."
  - name: tfact_enrollment
    description: >
      Enrollment fact. Grain: one row per enrollment. Read only where a view
      needs the enrollment's program_fk; the rest read
      afact_learner_courserun_progress.
  - name: tfact_certificate
    description: >
      Certificate fact. Grain: one row per certificate. Read only for program
      certificates; course certificates are read through
      afact_learner_courserun_progress.
  - name: dim_user
    description: >
      User dimension. Grain: one row per person across platforms. Only the
      learner-grain views read it, and user_global_id, not user_pk, is the
      stable learner identifier.
  - name: bridge_user_organization
    description: >
      MITx Online organization membership roster. Grain: one row per (user,
      organization). Includes members with no enrollments.
  - name: bridge_user_contract
    description: >
      MITx Online contract membership with the learner's data-sharing consent.
      Grain: one row per (user, contract). consented_to_data_sharing is null when
      no decision is recorded. Only the learner-grain views read it.
  - name: afact_learner_courserun_daily_activity
    description: >
      Per-learner course activity. Grain: one row per (platform, user, course
      run, day) with any tracked activity. activity_date_key is a dim_date key
      for the day the event happened in the source system's local time, not in
      UTC.
  - name: afact_learner_courserun_progress
    description: >
      Where a learner stands in a course run. Grain: one row per (user, course
      run) enrollment, with the enrollment, grade, current course certificate,
      last_active_on, is_certified, completion_status and needs_attention_since.
