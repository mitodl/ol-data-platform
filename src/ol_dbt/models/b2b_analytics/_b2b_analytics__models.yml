    description: >
      total_problems_attempted divided by engaged_learners. Derived from both
      cohorts, for the same reason as avg_videos_per_engaged_learner.
    config:
      meta:
        api_description: Average problems attempted per learner who did anything in
          the course. Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - engaged_learners
          - problem_attempters
  - name: total_chatbot_interactions
    description: >
      Chatbot interactions in this course run, an EVENT count. Floor it via
      chatbot_users.
    config:
      meta:
        api_description: Chatbot interactions in this course run. Withheld when the
          learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - chatbot_users
  - name: chatbot_users
    description: >
      Distinct learners who used the chatbot. They are the cohort
      total_chatbot_interactions is attributable to.
    config:
      meta:
        api_description: Learners who used the chatbot in this course run. Only activity
          in an enrollment that is still active counts. Withheld when too few learners
          are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: engaged_learners
  - name: chatbot_adoption_pct
    description: chatbot_users as a percentage of total_enrolled_learners.
    config:
      meta:
        api_description: Percentage of enrolled learners who used the chatbot. Withheld
          when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - chatbot_users
  - name: certificates_earned
    description: >
      Learners holding an unrevoked certificate for this course run, whether
      or not their enrollment is still active. It is not a strict subset of
      total_enrolled_learners: a learner who certified and then unenrolled is
      counted here and not there. ol-analytics-api declares it contained in
      total_enrolled_learners anyway (ol-analytics-api #95, decided
      2026-10-15), so besides its own floor it is withheld when
      total_enrolled_learners minus it is below the floor and not 0, which
      includes below zero. That gap is the enrolled learners without a
      certificate minus the unenrolled certificate holders, never more than
      the true one, so the declaration over-suppresses on runs with unenrolled
      holders. The exception is a gap of exactly 0, which is published though
      it hides as many uncertified enrolled learners as there are unenrolled
      holders.
    config:
      meta:
        api_description: Certificates earned in this course run. Withheld when too
          few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: total_enrolled_learners
