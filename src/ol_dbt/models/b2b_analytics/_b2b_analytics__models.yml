---
# Every column each model emits is documented here, in SELECT order. That is a
# contract, not a courtesy: the Dagster StarRocks asset compares this list
# against the live materialized view and rebuilds the view when the two differ
# (lakehouse/lib/starrocks_dbt.py). ol-dbt validate errors in both directions,
# so the lists cannot fall out of step without CI saying so.
#
# Every column also declares config.meta.cohort: what a consumer that publishes
# these rows under a k-anonymity floor has to do with it. ol-analytics-api
# declares the same thing per response model as a CohortPolicy
# (tenants/b2b_dashboard/models.py). `ol-dbt exposures export` copies these
# declarations, with the column lists, to exposures/ol_analytics_api_b2b_dashboard.json
# for the API to check its CohortPolicy against; regenerate it after a change here.
# Where the two differ, the declaration here is the one checked against this SQL.
#   role: primary     the row's headline cohort; the row is withheld under the floor
#   role: secondary   another distinct-learner count, withheld on its own under the
#                     floor. contained_in names the cohort it is a subset of, so the
#                     learners in that cohort and not in this one are also checked
#                     against the floor. The depth views' certificates_earned is
#                     the one exception, declared contained in a cohort it is not
#                     a subset of on purpose; its description says why. uncontained: true says no such check
#                     applies: it is a subset of no cohort in the row, or only of
#                     one the consumer does not publish (contributing_learners).
#   role: derived     a total, rate or average that gives away the size of the
#                     cohorts in derived_from, and is withheld whenever one of them is
#   role: measure     computed, and needs no rule beyond the row being published
#   role: dimension   a key, label or attribute of the grain
# ol-dbt validate (cohort_policy) holds the declarations of one model together.
#
# config.meta.api_description is the description ol-analytics-api publishes for
# the response field a column feeds, written for an organization's managers
# rather than for analysts. The API's exposure contract test asserts that the
# description of each field its declarative endpoints (organizations, contracts,
# MIT admin contract health) read from these views equals it, so change that
# wording here first, then copy the exported file into ol-analytics-api. A
# column the API reads only as a filter (sso_organization_id) has none. The
# learner views its hand-written queries read (mv_b2b_learner_enrollment,
# mv_b2b_learner, mv_b2b_contract_courserun) declare none and are not checked
# yet (witan task tk-api-description-for-the-b2b-learner-views-behind-5fbac0).
version: 2
models:
- name: mv_b2b_contract_utilization
  description: >
    Seat utilization and completion rate per org x contract. Manual-refresh
    materialized view, refreshed by the Dagster b2b_organization MV-refresh asset.
    Consumers: L&D manager dashboard header card, MIT admin overview.
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
    config:
      meta:
        api_description: Internal identifier for the organization.
        cohort:
          role: dimension
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id). This
      is the identifier the ol-analytics-api filters organizations on. Null for
      organization_keys that don't resolve to a mitxonline org.
    config:
      meta:
        cohort:
          role: dimension
  - name: organization_name
    description: Display name of the organization.
    config:
      meta:
        api_description: The organization's name.
        cohort:
          role: dimension
  - name: contract_pk
    description: Surrogate key of the B2B contract.
    config:
      meta:
        api_description: Internal identifier for the contract.
        cohort:
          role: dimension
  - name: contract_id
    description: >
      mitxonline's ContractPage.page_ptr_id (dim_contract.contract_id). This is
      the identifier that appears in mitxonline manager-dashboard URLs and that
      ol-analytics-api filters contracts on. contract_pk above is the
      dimensional surrogate (md5 of this value) and is the join key to
      dim_contract; a caller holding a contract from mitxonline has this one.
    config:
      meta:
        api_description: The contract's ID in MITx Online.
        cohort:
          role: dimension
  - name: b2b_contract_name
    description: Display name of the contract.
    config:
      meta:
        api_description: The contract's name.
        cohort:
          role: dimension
  - name: b2b_contract_is_active
    description: Whether the contract is currently active.
    config:
      meta:
        api_description: Whether the contract is currently active.
        cohort:
          role: dimension
  - name: b2b_contract_start_date
    description: Contract start date.
    config:
      meta:
        api_description: When the contract starts. Empty if no start date is set.
        cohort:
          role: dimension
  - name: b2b_contract_end_date
    description: >
      Contract end date. It drives the at_risk window in
      mv_b2b_mit_admin_contract_health.
    config:
      meta:
        api_description: When the contract ends. Empty if it has no end date.
        cohort:
          role: dimension
  - name: seat_limit
    description: b2b_contract_max_learners, with 0 (unlimited) published as null.
    config:
      meta:
        api_description: How many seats the contract includes. Empty or zero means
          unlimited.
        cohort:
          role: dimension
  - name: b2b_contract_membership_type
    description: Contract membership type.
    config:
      meta:
        api_description: The contract's membership type. Empty if not set.
        cohort:
          role: dimension
  - name: seats_consumed
    description: Distinct learners enrolled in any course run under this contract.
    config:
      meta:
        api_description: Learners enrolled in at least one course under the contract.
          When too few learners are in the group, the whole row is withheld to avoid
          identifying them.
        cohort:
          role: primary
  - name: active_learners
    description: Distinct learners with an active enrollment under this contract.
    config:
      meta:
        api_description: Learners on the contract whose enrollment is still active.
          Withheld when too few learners are in the group to report without identifying
          them.
        cohort:
          role: secondary
          contained_in: seats_consumed
  - name: learners_certified
    description: Deprecated, the old name for certified_learners and always equal
      to it. Removed once ol-analytics-api and mit-learn read certified_learners.
    config:
      meta:
        api_description: 'Deprecated: use certified_learners, which this always equals.'
        cohort:
          role: secondary
          contained_in: seats_consumed
  - name: certified_learners
    description: Distinct learners enrolled in a course run under this contract who
      hold its non-revoked certificate.
    config:
      meta:
        api_description: Learners on the contract who earned a certificate that hasn't
          been revoked. Withheld when too few learners are in the group to report
          without identifying them.
        cohort:
          role: secondary
          contained_in: seats_consumed
  - name: seat_utilization_pct
    description: seats_consumed / seat_limit * 100.
    config:
      meta:
        api_description: Percentage of the contract's seats in use. Empty when the
          contract has unlimited seats.
        cohort:
          role: measure
  - name: completion_rate_pct
    description: certified_learners / seats_consumed * 100.
    config:
      meta:
        api_description: Percentage of enrolled learners who earned a certificate.
          Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - certified_learners

- name: mv_b2b_enrollment_completion_funnel
  description: >
    Enrollment, active, passing, and certified learner counts per org x contract x
    course_run. Manual-refresh materialized view. Consumers: L&D manager course-level
    drill-down.
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
    config:
      meta:
        api_description: Internal identifier for the organization.
        cohort:
          role: dimension
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id). This
      is the identifier the ol-analytics-api filters organizations on. Null for
      organization_keys that don't resolve to a mitxonline org.
    config:
      meta:
        cohort:
          role: dimension
  - name: organization_name
    description: Display name of the organization.
    config:
      meta:
        api_description: The organization's name.
        cohort:
          role: dimension
  - name: contract_pk
    description: Surrogate key of the B2B contract.
    config:
      meta:
        api_description: Internal identifier for the contract.
        cohort:
          role: dimension
  - name: contract_id
    description: >
      mitxonline's ContractPage.page_ptr_id (dim_contract.contract_id). This is
      the identifier that appears in mitxonline manager-dashboard URLs and that
      ol-analytics-api filters contracts on. contract_pk above is the
      dimensional surrogate (md5 of this value) and is the join key to
      dim_contract; a caller holding a contract from mitxonline has this one.
    config:
      meta:
        api_description: The contract's ID in MITx Online.
        cohort:
          role: dimension
  - name: b2b_contract_name
    description: Display name of the contract.
    config:
      meta:
        api_description: The contract's name.
        cohort:
          role: dimension
  - name: courserun_pk
    description: Surrogate key of the course run.
    config:
      meta:
        api_description: Internal identifier for the course run.
        cohort:
          role: dimension
  - name: courserun_readable_id
    description: Human-readable course run identifier.
    config:
      meta:
        api_description: The course run's ID, e.g. course-v1:MITxT+14.310x+2T2026.
        cohort:
          role: dimension
  - name: courserun_title
    description: Course run title.
    config:
      meta:
        api_description: The course's title.
        cohort:
          role: dimension
  - name: enrolled_learners
    description: Distinct learners enrolled in this course run.
    config:
      meta:
        api_description: Learners enrolled in this course run. When too few learners
          are in the group, the whole row is withheld to avoid identifying them.
        cohort:
          role: primary
  - name: active_learners
    description: Distinct learners with an active enrollment.
    config:
      meta:
        api_description: Enrolled learners whose enrollment is still active. Withheld
          when too few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: enrolled_learners
  - name: passing_learners
    description: Distinct learners with a passing grade.
    config:
      meta:
        api_description: Enrolled learners with a passing grade. Withheld when too
          few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: enrolled_learners
  - name: certified_learners
    description: Distinct learners with a non-revoked certificate.
    config:
      meta:
        api_description: Enrolled learners who earned a certificate that hasn't been
          revoked. Withheld when too few learners are in the group to report without
          identifying them.
        cohort:
          role: secondary
          contained_in: enrolled_learners
  - name: active_rate_pct
    description: active_learners / enrolled_learners * 100.
    config:
      meta:
        api_description: Percentage of enrolled learners whose enrollment is still
          active. Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - active_learners
  - name: completion_rate_pct
    description: certified_learners / enrolled_learners * 100.
    config:
      meta:
        api_description: Percentage of enrolled learners who earned a certificate.
          Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - certified_learners

- name: mv_b2b_monthly_engagement_trend
  description: >
    Monthly engagement, enrollment, and content-interaction totals per org.
    Manual-refresh materialized view. Source: afact_learner_courserun_progress
    (enrollments, certificates) and afact_learner_courserun_daily_activity
    (activity), for learners who enrolled in a course run owned by one of the
    organization's contracts. The enrollment and activity counts cover active
    enrollments only. An unrevoked certificate counts even after the learner
    unenrolled. Consumers: L&D manager engagement trend chart.
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
    config:
      meta:
        api_description: Internal identifier for the organization.
        cohort:
          role: dimension
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id). This
      is the identifier the ol-analytics-api filters organizations on.
    config:
      meta:
        cohort:
          role: dimension
  - name: organization_name
    description: Display name of the organization.
    config:
      meta:
        api_description: The organization's name.
        cohort:
          role: dimension
  - name: activity_year_and_month
    description: The month this row aggregates, as YYYY-MM.
    config:
      meta:
        api_description: The month, e.g. 2026-08.
        cohort:
          role: dimension
  - name: monthly_active_learners
    description: >
      Distinct learners with tracked course activity in an active enrollment
      in the month (a video play, problem check, navigation, discussion event
      or chatbot submit). Enrolling or being issued a certificate does not
      count as activity.
    config:
      meta:
        api_description: 'Learners who did course work this month: watched a video,
          attempted a problem, posted in a discussion, used the chatbot or moved through
          course pages. Only activity in an enrollment that is still active counts.
          Enrolling or earning a certificate alone doesn''t count. Withheld when too
          few learners are in the group to report without identifying them.'
        cohort:
          role: secondary
          uncontained: true
  - name: new_enrollments
    description: >
      Active enrollments created in the month, an EVENT count
      (learner x course run), not a learner count. Floor it via
      enrolling_learners, not via its own value.
    config:
      meta:
        api_description: Course enrollments made this month that are still active.
          A learner who enrolled in six courses counts six times. Withheld when the
          learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - enrolling_learners
  - name: enrolling_learners
    description: >
      Distinct learners with an active enrollment created in the month. They
      are the cohort new_enrollments is attributable to. Enrolling is not
      activity, so this is not a subset of monthly_active_learners.
    config:
      meta:
        api_description: Learners with at least one course enrollment made this month
          that is still active. Withheld when too few learners are in the group to
          report without identifying them.
        cohort:
          role: secondary
          uncontained: true
  - name: certificates_earned
    description: >
      Unrevoked certificates earned in the month, an EVENT count (learner x
      course run), whether or not the enrollment is still active. Floor it via
      newly_certified_learners.
    config:
      meta:
        api_description: Certificates earned this month. A learner who earned two
          counts twice. Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - newly_certified_learners
  - name: certified_learners
    description: >
      Deprecated, the old name for newly_certified_learners and always equal to
      it. mv_b2b_mit_admin_contract_health, mv_b2b_enrollment_completion_funnel
      and mv_b2b_contract_utilization publish certified_learners as the learners
      holding an unrevoked certificate for a run, which is not this month's
      count. Removed once ol-analytics-api and mit-learn read
      newly_certified_learners.
    config:
      meta:
        api_description: 'Deprecated: use newly_certified_learners, which this always
          equals.'
        cohort:
          role: secondary
          uncontained: true
  - name: newly_certified_learners
    description: >
      Distinct learners who earned a certificate in the month. Earning a
      certificate is not activity, so this is not a subset of
      monthly_active_learners.
    config:
      meta:
        api_description: Learners who earned at least one certificate this month.
          Withheld when too few learners are in the group to report without identifying
          them.
        cohort:
          role: secondary
          uncontained: true
  - name: total_videos_watched
    description: >
      Videos played in the month (distinct videos per learner per day,
      summed), an EVENT count. Floor it via
      video_watchers.
    config:
      meta:
        api_description: 'Videos watched this month. A video counts once for each
          day a learner plays it, so replaying it the same day doesn''t add to the
          total. Withheld when the learner count it is based on is withheld.'
        cohort:
          role: derived
          derived_from:
          - video_watchers
  - name: video_watchers
    description: >
      Distinct learners who watched a video in the month. They are the cohort
      total_videos_watched is attributable to, and a subset of
      monthly_active_learners.
    config:
      meta:
        api_description: Learners who watched at least one video this month. Only
          activity in an enrollment that is still active counts. Withheld when too
          few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: monthly_active_learners
  - name: total_problems_attempted
    description: >
      Problems checked in the month (distinct problems per learner per day,
      summed; viewing an answer is not an attempt), an EVENT count. Floor it via
      problem_attempters.
    config:
      meta:
        api_description: 'Problems attempted this month. A problem counts once for
          each day a learner submits an answer to it, so resubmitting it the same
          day doesn''t add to the total. Withheld when the learner count it is based
          on is withheld.'
        cohort:
          role: derived
          derived_from:
          - problem_attempters
  - name: problem_attempters
    description: >
      Distinct learners who attempted a problem in the month. They are the
      cohort total_problems_attempted is attributable to.
    config:
      meta:
        api_description: Learners who attempted at least one problem this month. Only
          activity in an enrollment that is still active counts. Withheld when too
          few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: monthly_active_learners
  - name: total_chatbot_interactions
    description: >
      Chatbot interactions in the month, an EVENT count. Floor it via
      chatbot_users.
    config:
      meta:
        api_description: Chatbot interactions this month. Withheld when the learner
          count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - chatbot_users
  - name: chatbot_users
    description: >
      Distinct learners who used the chatbot in the month. They are the cohort
      total_chatbot_interactions is attributable to.
    config:
      meta:
        api_description: Learners who used the chatbot this month. Only activity in
          an enrollment that is still active counts. Withheld when too few learners
          are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: monthly_active_learners
  - name: contributing_learners
    description: >
      Distinct learners with any row behind this month: tracked activity, a new
      enrollment or a certificate. Every other learner count in the row is a
      subset of it, so ol-analytics-api gates the whole row on it.
    config:
      meta:
        api_description: Learners who did course work, enrolled or earned a certificate
          this month.
        cohort:
          role: primary

- name: mv_b2b_program_funnel
  description: >
    Program enrollment and completion approximation per org x contract x program.
    Manual-refresh materialized view. program_course_completers is an approximation
    (cert in any program course) until tfact_program_certificate ships.
    Consumers: L&D manager program progression view.
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
    config:
      meta:
        api_description: Internal identifier for the organization.
        cohort:
          role: dimension
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id). This
      is the identifier the ol-analytics-api filters organizations on. Null for
      organization_keys that don't resolve to a mitxonline org.
    config:
      meta:
        cohort:
          role: dimension
  - name: organization_name
    description: Display name of the organization.
    config:
      meta:
        api_description: The organization's name.
        cohort:
          role: dimension
  - name: contract_pk
    description: Surrogate key of the B2B contract.
    config:
      meta:
        api_description: Internal identifier for the contract.
        cohort:
          role: dimension
  - name: contract_id
    description: >
      mitxonline's ContractPage.page_ptr_id (dim_contract.contract_id). This is
      the identifier that appears in mitxonline manager-dashboard URLs and that
      ol-analytics-api filters contracts on. contract_pk above is the
      dimensional surrogate (md5 of this value) and is the join key to
      dim_contract; a caller holding a contract from mitxonline has this one.
    config:
      meta:
        api_description: The contract's ID in MITx Online.
        cohort:
          role: dimension
  - name: b2b_contract_name
    description: Display name of the contract.
    config:
      meta:
        api_description: The contract's name.
        cohort:
          role: dimension
  - name: program_pk
    description: Surrogate key of the program.
    config:
      meta:
        api_description: Internal identifier for the program.
        cohort:
          role: dimension
  - name: program_title
    description: Program title.
    config:
      meta:
        api_description: The program's title.
        cohort:
          role: dimension
  - name: total_courses
    description: >
      Distinct courses in this program that the contract actually covers. The
      denominator is scoped to (contract, program), not to the full program, so
      completion rates aren't understated for partial-program contracts.
    config:
      meta:
        api_description: Courses in the program that the contract covers.
        cohort:
          role: dimension
  - name: enrolled_in_contract_courses
    description: Learners enrolled in any contract course belonging to this program.
    config:
      meta:
        api_description: Learners enrolled in at least one of the program's courses
          under the contract. When too few learners are in the group, the whole row
          is withheld to avoid identifying them.
        cohort:
          role: primary
  - name: enrolled_via_program
    description: Learners who explicitly enrolled via the program pathway (tfact_enrollment.program_fk).
    config:
      meta:
        api_description: Of those learners, how many enrolled in the program itself
          rather than directly in one of its courses. Withheld when too few learners
          are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: enrolled_in_contract_courses
  - name: program_course_completers
    description: Learners holding a non-revoked certificate in any course in this
      program (approximation).
    config:
      meta:
        api_description: Learners who earned a certificate in at least one of the
          program's courses under the contract. This isn't the same as completing
          the whole program. Withheld when too few learners are in the group to report
          without identifying them.
        cohort:
          role: secondary
          contained_in: enrolled_in_contract_courses

- name: mv_b2b_content_engagement_depth
  description: >
    All-time content engagement depth per org x course_run. Manual-refresh
    materialized view. Source: afact_learner_courserun_progress (enrollments,
    certificates) and afact_learner_courserun_daily_activity (activity), for
    learners who enrolled in a course run owned by one of the organization's
    contracts. The enrollment and activity counts cover active enrollments
    only. An unrevoked certificate counts even after the learner unenrolled, so
    a course run can have certificates and no enrolled learners. Consumers: L&D
    manager course detail panel.
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
    config:
      meta:
        api_description: Internal identifier for the organization.
        cohort:
          role: dimension
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id). This
      is the identifier the ol-analytics-api filters organizations on.
    config:
      meta:
        cohort:
          role: dimension
  - name: organization_name
    description: Display name of the organization.
    config:
      meta:
        api_description: The organization's name.
        cohort:
          role: dimension
  - name: courserun_readable_id
    description: Human-readable course run identifier.
    config:
      meta:
        api_description: The course run's ID, e.g. course-v1:MITxT+14.310x+2T2026.
        cohort:
          role: dimension
  - name: courserun_title
    description: Course run title.
    config:
      meta:
        api_description: The course's title.
        cohort:
          role: dimension
  - name: total_enrolled_learners
    description: Distinct learners with an active enrollment in this course run.
    config:
      meta:
        api_description: Learners whose enrollment in this course run is still active.
          When too few learners are in the group, the whole row is withheld to avoid
          identifying them.
        cohort:
          role: primary
  - name: engaged_learners
    description: >
      Distinct learners with an active enrollment and at least one day of
      tracked course activity in the run. A certificate alone does not count.
      They are the denominator of both avg_* columns and of
      engagement_rate_pct.
    config:
      meta:
        api_description: 'Learners whose enrollment in this course run is still active
          and who did anything in the course: watched a video, attempted a problem,
          posted in a discussion, used the chatbot or moved through course pages.
          Withheld when too few learners are in the group to report without identifying
          them.'
        cohort:
          role: secondary
          contained_in: total_enrolled_learners
  - name: engagement_rate_pct
    description: engaged_learners / total_enrolled_learners * 100.
    config:
      meta:
        api_description: Percentage of enrolled learners who did anything in the course.
          Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - engaged_learners
  - name: total_videos_watched
    description: >
      Videos played, all-time (distinct videos per learner per day, summed).
      This is an EVENT count. Floor it via video_watchers.
    config:
      meta:
        api_description: 'Videos watched in this course run. A video counts once for
          each day a learner plays it, so replaying it the same day doesn''t add to
          the total. Withheld when the learner count it is based on is withheld.'
        cohort:
          role: derived
          derived_from:
          - video_watchers
  - name: video_watchers
    description: >
      Distinct learners who watched at least one video. They are the cohort
      total_videos_watched is attributable to, and a subset of
      engaged_learners.
    config:
      meta:
        api_description: Learners who watched at least one video in this course run.
          Only activity in an enrollment that is still active counts. Withheld when
          too few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: engaged_learners
  - name: avg_videos_per_engaged_learner
    description: >
      total_videos_watched / engaged_learners, averaged across every engaged
      learner, so learners who watched nothing count as 0.
    config:
      meta:
        api_description: Average videos watched per learner who did anything in the
          course. Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - engaged_learners
          - video_watchers
  - name: total_problems_attempted
    description: >
      Problems checked, all-time (distinct problems per learner per day,
      summed; viewing an answer is not an attempt). This is an EVENT count. Floor
      it via
      problem_attempters.
    config:
      meta:
        api_description: 'Problems attempted in this course run. A problem counts
          once for each day a learner submits an answer to it, so resubmitting it
          the same day doesn''t add to the total. Withheld when the learner count
          it is based on is withheld.'
        cohort:
          role: derived
          derived_from:
          - problem_attempters
  - name: problem_attempters
    description: >
      Distinct learners who attempted at least one problem. They are the
      cohort total_problems_attempted is attributable to.
    config:
      meta:
        api_description: Learners who attempted at least one problem in this course
          run. Only activity in an enrollment that is still active counts. Withheld
          when too few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: engaged_learners
  - name: avg_problems_per_engaged_learner
    description: >
      total_problems_attempted / engaged_learners, averaged across every
      engaged learner, so learners who attempted nothing count as 0.
    config:
      meta:
        api_description: Average problems attempted per learner who did anything in
          the course. Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - engaged_learners
          - problem_attempters
  - name: total_chatbot_interactions
    description: >
      Chatbot interactions, all-time, an EVENT count. Floor it via
      chatbot_users.
    config:
      meta:
        api_description: Chatbot interactions in this course run. Withheld when the
          learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - chatbot_users
  - name: chatbot_users
    description: >
      Distinct learners who used the chatbot. They are the cohort
      total_chatbot_interactions is attributable to.
    config:
      meta:
        api_description: Learners who used the chatbot in this course run. Only activity
          in an enrollment that is still active counts. Withheld when too few learners
          are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: engaged_learners
  - name: chatbot_adoption_pct
    description: chatbot_users / total_enrolled_learners * 100.
    config:
      meta:
        api_description: Percentage of enrolled learners who used the chatbot. Withheld
          when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - chatbot_users
  - name: certificates_earned
    description: >
      Learners holding an unrevoked certificate for this course run, whether
      or not their enrollment is still active. It is not a strict subset of
      total_enrolled_learners: a learner who certified and then unenrolled is
      counted here and not there. ol-analytics-api declares it contained in
      total_enrolled_learners anyway (ol-analytics-api #95, decided
      2026-10-15), so besides its own floor it is withheld when
      total_enrolled_learners minus it is below the floor and not 0, which
      includes below zero. That gap is the enrolled learners without a
      certificate minus the unenrolled certificate holders, never more than
      the true one, so the declaration over-suppresses on runs with unenrolled
      holders. The exception is a gap of exactly 0, which is published though
      it hides as many uncertified enrolled learners as there are unenrolled
      holders.
    config:
      meta:
        api_description: Certificates earned in this course run. Withheld when too
          few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: total_enrolled_learners

- name: mv_b2b_mit_admin_contract_health
  description: >
    Contract health signal per org x contract, across all orgs (not scoped to
    the requesting org). MIT admin view only. Manual-refresh materialized view.
    Consumers: MIT contract admin dashboard.
  columns:
  # The model selects * from its contract_stats CTE, so unlike the other five
  # there is no literal column list in the SQL to read these off. The CTE's
  # own SELECT is the source of truth.
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
    config:
      meta:
        api_description: Internal identifier for the organization.
        cohort:
          role: dimension
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id). This
      is the identifier the ol-analytics-api filters organizations on. Null for
      organization_keys that don't resolve to a mitxonline org.
    config:
      meta:
        cohort:
          role: dimension
  - name: organization_name
    description: Display name of the organization.
    config:
      meta:
        api_description: The organization's name.
        cohort:
          role: dimension
  - name: contract_pk
    description: Surrogate key of the B2B contract.
    config:
      meta:
        api_description: Internal identifier for the contract.
        cohort:
          role: dimension
  - name: contract_id
    description: >
      mitxonline's ContractPage.page_ptr_id (dim_contract.contract_id). This is
      the identifier that appears in mitxonline manager-dashboard URLs and that
      ol-analytics-api filters contracts on. contract_pk above is the
      dimensional surrogate (md5 of this value) and is the join key to
      dim_contract; a caller holding a contract from mitxonline has this one.
    config:
      meta:
        api_description: The contract's ID in MITx Online.
        cohort:
          role: dimension
  - name: b2b_contract_name
    description: Display name of the contract.
    config:
      meta:
        api_description: The contract's name.
        cohort:
          role: dimension
  - name: b2b_contract_is_active
    description: >
      Whether the contract is currently active. It drives the inactive
      health_status.
    config:
      meta:
        api_description: Whether the contract is currently active.
        cohort:
          role: dimension
  - name: b2b_contract_start_date
    description: Contract start date.
    config:
      meta:
        api_description: When the contract starts. Empty if no start date is set.
        cohort:
          role: dimension
  - name: b2b_contract_end_date
    description: >
      Contract end date. It drives the at_risk 90-day window.
    config:
      meta:
        api_description: When the contract ends. Empty if it has no end date.
        cohort:
          role: dimension
  - name: seat_limit
    description: b2b_contract_max_learners, with 0 (unlimited) published as null.
    config:
      meta:
        api_description: How many seats the contract includes. Empty or zero means
          unlimited.
        cohort:
          role: dimension
  - name: b2b_contract_membership_type
    description: Contract membership type.
    config:
      meta:
        api_description: The contract's membership type. Empty if not set.
        cohort:
          role: dimension
  - name: seats_consumed
    description: Distinct learners enrolled in any course run under this contract.
    config:
      meta:
        api_description: Learners enrolled in at least one course under the contract.
          When too few learners are in the group, the whole row is withheld to avoid
          identifying them.
        cohort:
          role: primary
  - name: active_learners
    description: Distinct learners with an active enrollment under this contract.
    config:
      meta:
        api_description: Learners on the contract whose enrollment is still active.
          Withheld when too few learners are in the group to report without identifying
          them.
        cohort:
          role: secondary
          contained_in: seats_consumed
  - name: certified_learners
    description: Distinct learners holding a non-revoked certificate under this contract.
    config:
      meta:
        api_description: Learners on the contract who earned a certificate that hasn't
          been revoked. Withheld when too few learners are in the group to report
          without identifying them.
        cohort:
          role: secondary
          contained_in: seats_consumed
  - name: seat_utilization_pct
    description: seats_consumed / seat_limit * 100.
    config:
      meta:
        api_description: Percentage of the contract's seats in use. Empty when the
          contract has unlimited seats.
        cohort:
          role: measure
  - name: completion_rate_pct
    description: certified_learners / seats_consumed * 100.
    config:
      meta:
        api_description: Percentage of enrolled learners who earned a certificate.
          Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - certified_learners
  - name: health_status
    description: >
      One of: inactive (contract not active), at_risk (utilization < 25% and
      expiring within 90 days), high_utilization (utilization >= 90%), healthy
      (utilization >= 50% and not at_risk), early_stage (everything else).
    config:
      meta:
        api_description: 'Overall contract health: inactive (the contract isn''t active),
          high_utilization (90% or more of seats in use), at_risk (under 25% of seats
          in use and the contract ends within 90 days), healthy (50% or more of seats
          in use), or early_stage (anything else).'
        cohort:
          role: measure
- name: mv_b2b_contract_monthly_engagement_trend
  description: >
    Monthly engagement, enrollment, and content-interaction totals per org x
    contract. This is the contract-scoped sibling of
    mv_b2b_monthly_engagement_trend, which stays at org x month. Both grains
    exist because the MIT Learn dashboard mirrors mitxonline's manager
    dashboard, which is nested under
    manager/organizations/{org}/contracts/{contract}, while the org-level
    panels remain in service. Manual-refresh materialized view. Source: the
    same facts as the org-level view, grouped by the contract that owns the
    course run. Publishing both grains makes a suppressed contract recoverable
    by subtraction from the org row once an org holds more than one contract;
    see the complement-disclosure work in ol-analytics-api. Consumers: L&D
    manager engagement trend chart, contract-scoped.
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
    config:
      meta:
        api_description: Internal identifier for the organization.
        cohort:
          role: dimension
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id). This
      is the identifier the ol-analytics-api filters organizations on.
    config:
      meta:
        cohort:
          role: dimension
  - name: organization_name
    description: Display name of the organization.
    config:
      meta:
        api_description: The organization's name.
        cohort:
          role: dimension
  - name: contract_pk
    description: Surrogate key of the B2B contract.
    config:
      meta:
        api_description: Internal identifier for the contract.
        cohort:
          role: dimension
  - name: contract_id
    description: >
      mitxonline's ContractPage.page_ptr_id (dim_contract.contract_id). This is
      the identifier that appears in mitxonline manager-dashboard URLs and that
      ol-analytics-api filters contracts on.
    config:
      meta:
        api_description: The contract's ID in MITx Online.
        cohort:
          role: dimension
  - name: b2b_contract_name
    description: Display name of the contract.
    config:
      meta:
        api_description: The contract's name.
        cohort:
          role: dimension
  - name: activity_year_and_month
    description: The month this row aggregates, as YYYY-MM.
    config:
      meta:
        api_description: The month, e.g. 2026-08.
        cohort:
          role: dimension
  - name: monthly_active_learners
    description: >
      Distinct learners with tracked course activity in an active enrollment
      in the month (enrolling or being issued a certificate does not count),
      under course runs belonging to this contract. A learner active under two
      contracts counts in both rows, so contract rows do not partition the
      org's learner count.
    config:
      meta:
        api_description: 'Learners who did course work this month: watched a video,
          attempted a problem, posted in a discussion, used the chatbot or moved through
          course pages. Only activity in an enrollment that is still active counts.
          Enrolling or earning a certificate alone doesn''t count. Withheld when too
          few learners are in the group to report without identifying them.'
        cohort:
          role: secondary
          uncontained: true
  - name: new_enrollments
    description: >
      Active enrollments created in the month, an EVENT count
      (learner x course run), not a learner count. Floor it via
      enrolling_learners, not via its own value.
    config:
      meta:
        api_description: Course enrollments made this month that are still active.
          A learner who enrolled in six courses counts six times. Withheld when the
          learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - enrolling_learners
  - name: enrolling_learners
    description: >
      Distinct learners with an active enrollment created in the month. They
      are the cohort new_enrollments is attributable to. Enrolling is not
      activity, so this is not a subset of monthly_active_learners.
    config:
      meta:
        api_description: Learners with at least one course enrollment made this month
          that is still active. Withheld when too few learners are in the group to
          report without identifying them.
        cohort:
          role: secondary
          uncontained: true
  - name: certificates_earned
    description: >
      Unrevoked certificates earned in the month, an EVENT count (learner x
      course run), whether or not the enrollment is still active. Floor it via
      newly_certified_learners.
    config:
      meta:
        api_description: Certificates earned this month. A learner who earned two
          counts twice. Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - newly_certified_learners
  - name: certified_learners
    description: >
      Deprecated, the old name for newly_certified_learners and always equal to
      it. mv_b2b_mit_admin_contract_health, mv_b2b_enrollment_completion_funnel
      and mv_b2b_contract_utilization publish certified_learners as the learners
      holding an unrevoked certificate for a run, which is not this month's
      count. Removed once ol-analytics-api and mit-learn read
      newly_certified_learners.
    config:
      meta:
        api_description: 'Deprecated: use newly_certified_learners, which this always
          equals.'
        cohort:
          role: secondary
          uncontained: true
  - name: newly_certified_learners
    description: >
      Distinct learners who earned a certificate in the month. Earning a
      certificate is not activity, so this is not a subset of
      monthly_active_learners.
    config:
      meta:
        api_description: Learners who earned at least one certificate this month.
          Withheld when too few learners are in the group to report without identifying
          them.
        cohort:
          role: secondary
          uncontained: true
  - name: total_videos_watched
    description: >
      Videos played in the month (distinct videos per learner per day,
      summed), an EVENT count. Floor it via
      video_watchers.
    config:
      meta:
        api_description: 'Videos watched this month. A video counts once for each
          day a learner plays it, so replaying it the same day doesn''t add to the
          total. Withheld when the learner count it is based on is withheld.'
        cohort:
          role: derived
          derived_from:
          - video_watchers
  - name: video_watchers
    description: >
      Distinct learners who watched a video in the month. They are the cohort
      total_videos_watched is attributable to, and a subset of
      monthly_active_learners.
    config:
      meta:
        api_description: Learners who watched at least one video this month. Only
          activity in an enrollment that is still active counts. Withheld when too
          few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: monthly_active_learners
  - name: total_problems_attempted
    description: >
      Problems checked in the month (distinct problems per learner per day,
      summed; viewing an answer is not an attempt), an EVENT count. Floor it via
      problem_attempters.
    config:
      meta:
        api_description: 'Problems attempted this month. A problem counts once for
          each day a learner submits an answer to it, so resubmitting it the same
          day doesn''t add to the total. Withheld when the learner count it is based
          on is withheld.'
        cohort:
          role: derived
          derived_from:
          - problem_attempters
  - name: problem_attempters
    description: >
      Distinct learners who attempted a problem in the month. They are the
      cohort total_problems_attempted is attributable to.
    config:
      meta:
        api_description: Learners who attempted at least one problem this month. Only
          activity in an enrollment that is still active counts. Withheld when too
          few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: monthly_active_learners
  - name: total_chatbot_interactions
    description: >
      Chatbot interactions in the month, an EVENT count. Floor it via
      chatbot_users.
    config:
      meta:
        api_description: Chatbot interactions this month. Withheld when the learner
          count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - chatbot_users
  - name: chatbot_users
    description: >
      Distinct learners who used the chatbot in the month. They are the cohort
      total_chatbot_interactions is attributable to.
    config:
      meta:
        api_description: Learners who used the chatbot this month. Only activity in
          an enrollment that is still active counts. Withheld when too few learners
          are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: monthly_active_learners
  - name: contributing_learners
    description: >
      Distinct learners with any row behind this month: tracked activity, a new
      enrollment or a certificate. Every other learner count in the row is a
      subset of it, so ol-analytics-api gates the whole row on it.
    config:
      meta:
        api_description: Learners who did course work, enrolled or earned a certificate
          this month.
        cohort:
          role: primary
- name: mv_b2b_contract_content_engagement_depth
  description: >
    All-time content engagement depth per org x contract x course run. This is
    the contract-scoped sibling of mv_b2b_content_engagement_depth, which stays
    at org x course run. Each learner's course run is attributed to the one
    contract they enrolled under, so the contract rows partition the org-level
    rows: a run offered under one of the org's contracts is only labelled, and
    a run offered under several is split into rows that sum to the org row.
    Either way the complement is recoverable when only some contracts are
    suppressed. Manual-refresh materialized view. Source: the same facts as
    the org-level view, grouped by the contract each learner enrolled under.
    Consumers: L&D manager content-engagement
    panel, contract-scoped.
  columns:
  - name: organization_key
    description: Org identifier, joined via dim_organization (platform='mitxonline'
      only).
    config:
      meta:
        api_description: Internal identifier for the organization.
        cohort:
          role: dimension
  - name: sso_organization_id
    description: >
      Keycloak organization UUID (dim_organization.sso_organization_id). This
      is the identifier the ol-analytics-api filters organizations on.
    config:
      meta:
        cohort:
          role: dimension
  - name: organization_name
    description: Display name of the organization.
    config:
      meta:
        api_description: The organization's name.
        cohort:
          role: dimension
  - name: contract_pk
    description: Surrogate key of the B2B contract.
    config:
      meta:
        api_description: Internal identifier for the contract.
        cohort:
          role: dimension
  - name: contract_id
    description: >
      mitxonline's ContractPage.page_ptr_id (dim_contract.contract_id). This is
      the identifier that appears in mitxonline manager-dashboard URLs and that
      ol-analytics-api filters contracts on.
    config:
      meta:
        api_description: The contract's ID in MITx Online.
        cohort:
          role: dimension
  - name: b2b_contract_name
    description: Display name of the contract.
    config:
      meta:
        api_description: The contract's name.
        cohort:
          role: dimension
  - name: courserun_readable_id
    description: Course run identifier (e.g. course-v1:MITx+6.00+2026).
    config:
      meta:
        api_description: The course run's ID, e.g. course-v1:MITxT+14.310x+2T2026.
        cohort:
          role: dimension
  - name: courserun_title
    description: Display title of the course run.
    config:
      meta:
        api_description: The course's title.
        cohort:
          role: dimension
  - name: total_enrolled_learners
    description: Distinct learners with an active enrollment in this course run under
      this contract.
    config:
      meta:
        api_description: Learners whose enrollment in this course run is still active.
          When too few learners are in the group, the whole row is withheld to avoid
          identifying them.
        cohort:
          role: primary
  - name: engaged_learners
    description: >
      Distinct learners with an active enrollment and at least one day of
      tracked course activity in this course run. A certificate alone does
      not count.
    config:
      meta:
        api_description: 'Learners whose enrollment in this course run is still active
          and who did anything in the course: watched a video, attempted a problem,
          posted in a discussion, used the chatbot or moved through course pages.
          Withheld when too few learners are in the group to report without identifying
          them.'
        cohort:
          role: secondary
          contained_in: total_enrolled_learners
  - name: engagement_rate_pct
    description: engaged_learners as a percentage of total_enrolled_learners.
    config:
      meta:
        api_description: Percentage of enrolled learners who did anything in the course.
          Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - engaged_learners
  - name: total_videos_watched
    description: >
      Videos played in this course run (distinct videos per learner per day,
      summed), an EVENT count. Floor it via
      video_watchers.
    config:
      meta:
        api_description: 'Videos watched in this course run. A video counts once for
          each day a learner plays it, so replaying it the same day doesn''t add to
          the total. Withheld when the learner count it is based on is withheld.'
        cohort:
          role: derived
          derived_from:
          - video_watchers
  - name: video_watchers
    description: >
      Distinct learners who watched a video. They are the cohort
      total_videos_watched is attributable to, and a subset of
      engaged_learners.
    config:
      meta:
        api_description: Learners who watched at least one video in this course run.
          Only activity in an enrollment that is still active counts. Withheld when
          too few learners are in the group to report without identifying them.
        cohort:
          role: secondary
          contained_in: engaged_learners
  - name: avg_videos_per_engaged_learner
    description: >
      total_videos_watched divided by engaged_learners. Derived from BOTH
      cohorts: the denominator is engaged_learners, but the numerator is
      contributed only by video_watchers, so an unsuppressed average times a
      published engaged_learners recovers the total.
    config:
      meta:
        api_description: Average videos watched per learner who did anything in the
          course. Withheld when the learner count it is based on is withheld.
        cohort:
          role: derived
          derived_from:
          - engaged_learners
          - video_watchers
  - name: total_problems_attempted
    description: >
      Problems checked in this course run (distinct problems per learner per
      day, summed; viewing an answer is not an attempt), an EVENT count. Floor it
      via
      problem_attempters.
    config:
      meta:
        api_description: 'Problems attempted in this course run. A problem counts
          once for each day a learner submits an answer to it, so resubmitting it
          the same day doesn''t add to the total. Withheld when the learner count
          it is based on is withheld.'
        cohort:
          role: derived
          derived_from:
          - problem_attempters
  - name: problem_attempters
    description: >
      Distinct learners who attempted a problem. They are the cohort
