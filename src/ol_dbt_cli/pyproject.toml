[project]
name = "ol-dbt-cli"
version = "0.1.0"
description = "CLI for dbt project analysis, validation, and impact assessment"
authors = [{ name = "MIT Open Learning Engineering", email = "ol-data@mit.edu" }]
requires-python = "~=3.15,<3.16"
license = "BSD-3-Clause"
dependencies = [
    "boto3>=1.35",
    "cyclopts>=4.0",
    "duckdb>=1.0,!=1.5.0,!=1.5.1",
    "factory-boy>=3.3.3,<4",
    "hvac[parser]>=2.0.0,<3",
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "markupsafe>=2.1",
    # Exact: the fixture generator's seeded rows are only the same on one mimesis version.
    "mimesis==22.2.0",
    "mysql-connector-python>=9.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "ruamel.yaml>=0.18",
    # >=25.26 for qualify(allow_partial_qualification=...) used by consumed_columns_by_ref_via_scope
    "sqlglot>=25.26",
    "trino>=0.329",
]

[dependency-groups]
# The scaffold test runs ruff on what `ol-dbt fixtures scaffold` writes, since
# that file is committed and has to pass the prek hooks unchanged.
dev = ["ruff"]

[project.scripts]
ol-dbt = "ol_dbt_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["ol_dbt_cli"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "S", "B", "UP", "D"]
ignore = ["S603", "S607", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
