    Its Airbyte source still exists but carries zero connections, and its Dagster
    interval-map entry `bootcamps_production_app_db__s3_data_lake` matches nothing.
    Nothing was lost when ingestion stopped, but nothing was written down either,
    so these 19 tables read as current to anyone who does not already know — which
    is exactly what this file exists to prevent. dbt still models all 19; retiring
    them here does not remove those models, it makes them findable (tk-bootcamps-ingestion-has-disappeared-while-dbt-st-25d016).
