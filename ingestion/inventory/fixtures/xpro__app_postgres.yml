---
# Raw tables of the xpro/app_postgres unit for the local lake: the 18 that
# +integrations__learn__xpro_courses, _programs and _runs read. Loaded by
# `ol-dbt fixtures load`. The columns are from `ol-dbt fixtures capture`, which
# leaves out Airbyte's _airbyte_meta struct. Every row is invented: nothing here
# is copied from a deployed xPRO.
schema_version: 1
tables:
  raw__xpro__app__postgres__cms_certificatepage:
    columns:
      _airbyte_raw_id: string
      _airbyte_extracted_at: long
      _airbyte_generation_id: long
      ceus: double
      overrides: string
      page_ptr_id: long
      signatories: string
      product_name: string
      institute_text: string
      partner_logo_id: long
      partner_logo_placement: long
      display_mit_seal: boolean
    rows:
    # `signatories` is a Wagtail StreamField, stored as a JSON list of blocks.
    - page_ptr_id: 11
      product_name: Local Fixtures I
      ceus: 2.5
      signatories:
      - type: signatory
        value: 5
        id: 0f0e0d0c-0b0a-4909-8807-060504030201
      display_mit_seal: true
    - page_ptr_id: 21
      product_name: Local Fixtures Professional Certificate
      ceus: 10.0
      signatories:
      - type: signatory
        value: 5
        id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
