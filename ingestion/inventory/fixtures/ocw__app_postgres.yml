---
# Raw tables of the ocw/app_postgres unit for the local lake: the one that
# +integrations__learn__ocw_courses and _ocw_content_files read. Loaded by
# `ol-dbt fixtures load`. The columns are from `ol-dbt fixtures capture`, which
# leaves out Airbyte's _airbyte_meta struct. Every site is invented: nothing
# here is copied from ocw-studio. A site's uuid is the site_uid of its
# data.json in ocw__s3.yml, and its url_path is that file's directory.
schema_version: 1
tables:
  raw__ocw__studio__postgres__websites_website:
    columns:
      _airbyte_raw_id: string
      _airbyte_extracted_at: long
      _airbyte_generation_id: long
      name: string
      uuid: string
      title: string
      source: string
      metadata: string
      owner_id: long
      short_id: string
      url_path: string
      synced_on: timestamp
      created_on: timestamp
      starter_id: long
      updated_on: timestamp
      sync_errors: string
      sync_status: string
      publish_date: timestamp
      gdrive_folder: string
      live_build_date: timestamp
      draft_build_date: timestamp
      unpublish_status: string
      draft_publish_date: timestamp
      live_publish_status: string
      draft_publish_status: string
      has_unpublished_live: boolean
      latest_build_id_live: long
      has_unpublished_draft: boolean
      latest_build_id_draft: long
      last_unpublished_by_id: long
      live_last_published_by_id: long
      draft_last_published_by_id: long
      unpublish_status_updated_on: timestamp
      first_published_to_production: timestamp
      live_publish_status_updated_on: timestamp
      draft_publish_status_updated_on: timestamp
      site_type: string
    rows:
    - uuid: 0f0e0d0c-0b0a-4909-8807-060504030201
      name: 99-001-local-fixtures-fall-2025
      title: Local Fixtures
      short_id: 99.001-fall-2025
