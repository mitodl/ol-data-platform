---
# Raw tables of the mitxonline/app_postgres unit for the local lake: the 12 that
# +integrations__learn__mitxonline_courses and _programs read. Loaded by
# `ol-dbt fixtures load`. The columns are from `ol-dbt fixtures capture`, which
# leaves out Airbyte's _airbyte_meta struct. Every row is invented: nothing here
# is copied from a deployed MITx Online.
schema_version: 1
tables:
  raw__mitxonline__app__postgres__cms_coursepage:
    columns:
      _airbyte_raw_id: string
      _airbyte_extracted_at: long
      _airbyte_generation_id: long
