      ingest_content_files_for_ai: boolean
      hyl_choice_learn_by_doing: boolean
      hyl_choice_learn_on_demand: boolean
      hyl_choice_learn_from_others: boolean
      hyl_choice_ai_enabled_support: boolean
      hyl_choice_realworld_learning: boolean
      hyl_choice_stackable_credentials: boolean
      max_price: double
      min_price: double
      hubspot_form_id: string
      show_course_outline: boolean
      show_stay_updated: boolean
    rows:
    # `price` is a Wagtail StreamField, stored as a JSON list of blocks.
    - page_ptr_id: 10
      course_id: 1
      description: <p>A course that exists only in the local lake.</p>
      length: 4 weeks
      effort: 5 hours per week
      prerequisites: <p>None.</p>
