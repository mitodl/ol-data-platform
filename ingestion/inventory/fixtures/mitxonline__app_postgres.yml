  raw__mitxonline__app__postgres__courses_programrequirement:
    columns:
      _airbyte_raw_id: string
      _airbyte_extracted_at: long
      _airbyte_generation_id: long
      id: long
      path: string
      depth: long
      title: string
      numchild: long
      operator: string
      course_id: long
      node_type: string
      program_id: long
      elective_flag: boolean
      operator_value: string
      required_program_id: long
    rows:
    # A treebeard tree per program: a root, operator nodes under it and course
    # nodes under those. `path` is four characters per level.
    # Program 1: course 1 is required, course 2 is one of one elective.
    - id: 1
      program_id: 1
      path: '0001'
      depth: 1
      numchild: 2
      node_type: program_root
      elective_flag: false
    - id: 2
      program_id: 1
      path: '00010001'
      depth: 2
      numchild: 1
      node_type: operator
      operator: all_of
      title: Required Courses
      elective_flag: false
    - id: 3
      program_id: 1
      course_id: 1
      path: '000100010001'
      depth: 3
      numchild: 0
      node_type: course
      elective_flag: false
    - id: 4
      program_id: 1
      path: '00010002'
      depth: 2
      numchild: 1
      node_type: operator
      operator: min_number_of
      operator_value: '1'
      title: Elective Courses
      elective_flag: true
    - id: 5
      program_id: 1
      course_id: 2
      path: '000100020001'
      depth: 3
      numchild: 0
      node_type: course
      elective_flag: false
    # Program 2: courses 1 and 4 are required. Course 1 is then in both
    # programs and keeps the certification type of the one that is not a
    # MicroMasters.
    - id: 6
      program_id: 2
      path: '0002'
      depth: 1
      numchild: 1
      node_type: program_root
      elective_flag: false
    - id: 7
      program_id: 2
      path: '00020001'
      depth: 2
      numchild: 2
      node_type: operator
      operator: all_of
      title: Required Courses
      elective_flag: false
    - id: 8
      program_id: 2
      course_id: 1
      path: '000200010001'
      depth: 3
      numchild: 0
      node_type: course
      elective_flag: false
    - id: 9
      program_id: 2
      course_id: 4
      path: '000200010002'
      depth: 3
      numchild: 0
      node_type: course
      elective_flag: false
