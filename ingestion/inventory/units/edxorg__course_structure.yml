---
# Hand-written: this unit is a Dagster asset pipeline
# (dg_projects/edxorg/edxorg/assets/openedx_course_archives.py), not an Airbyte
# connection, so bin/airbyte-inventory.py cannot produce it. See
# docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: edxorg
scope: singleton
layer: course_structure
strategies:
  qa: mirror
  local: fixture
mirror_max_age_days: 90
loader: dagster
table_prefix: raw__edxorg__s3__course_
tables:
- name: raw__edxorg__s3__course_structure__course_certificate_signatory
  raw_table: raw__edxorg__s3__course_structure__course_certificate_signatory
  sync_mode: full_refresh_overwrite
  modeled: true
  mirror:
    columns:
      _airbyte_extracted_at: copy
      id: copy
      name: copy
      title: copy
      course_id: copy
      organization: copy
      certificate_id: copy
      signature_image_path: copy
      _ab_source_file_last_modified: copy
- name: raw__edxorg__s3__course_structure__course_metadata
  raw_table: raw__edxorg__s3__course_structure__course_metadata
  sync_mode: full_refresh_overwrite
  modeled: true
  mirror:
    columns:
      title: copy
      semester: copy
      course_id: copy
      course_end: copy
      self_paced: copy
      institution: copy
      course_start: copy
      course_number: copy
      enrollment_end: copy
      instructor_info: copy
      enrollment_start: copy
- name: raw__edxorg__s3__course_structure__course_policy
  raw_table: raw__edxorg__s3__course_structure__course_policy
  sync_mode: full_refresh_overwrite
  modeled: true
  mirror:
    columns:
      tabs: copy
      course_id: copy
      self_paced: copy
      advanced_modules: copy
      discussions_settings: copy
      display_coursenumber: copy
- name: raw__edxorg__s3__course_structure__course_video
  raw_table: raw__edxorg__s3__course_structure__course_video
  sync_mode: full_refresh_overwrite
  modeled: true
  mirror:
    columns:
      duration: copy
      course_id: copy
      edx_video_id: copy
      video_block_id: copy
