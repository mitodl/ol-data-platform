---
# Generated from a live Airbyte snapshot by bin/airbyte-inventory.py, then
# resolved by hand. See docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: edxorg
scope: singleton
layer: google_sheets
strategies:
  qa: mirror
  local: fixture
mirror_max_age_days: 90
loader: airbyte
table_prefix: raw__edxorg__program_entitlement
airbyte:
  source_kind: source-google-sheets
  replication_method: n/a
  connections:
  - environment: production
    name: MITx Program Entitlements → S3 Data Lake
    status: active
    sync_interval_hours: 24
    streams:
    - raw__edxorg__program_entitlement
tables:
- name: raw__edxorg__program_entitlement
  raw_table: raw__edxorg__program_entitlement
  sync_mode: full_refresh_overwrite
  primary_key:
  - - Email
  - - Program Title
  modeled: true
  mirror:
    columns:
      _airbyte_extracted_at: copy
      partner key: copy
      program type: copy
      program title: copy
      email: hash
      user id: copy
      username: hash
      last name: nullify
      first name: nullify
      entitlements: copy
      purchase date: copy
      expiration date: copy
      redeemed entitlements: copy
