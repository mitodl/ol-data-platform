---
# Hand-written: this unit has no Airbyte connection, so bin/airbyte-inventory.py
# cannot produce it. See docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: ocw
layer: s3
scope: scoped
strategies:
  qa: omit
  local: fixture
loader: dlt
# The load appends a full set of rows each time a course changes, stamped with
# one course_retrieved_at, and staging keeps each course's newest set.
raw_metadata_column: course_retrieved_at
table_prefix: raw__ocw__s3__
dlt:
  source_module: ol_dlt.sources.ocw_content
  write_disposition: append
tables:
- name: raw__ocw__s3__course_content
  raw_table: raw__ocw__s3__course_content
  sync_mode: incremental_append
  cursor_field:
  - course_retrieved_at
  modeled: true
