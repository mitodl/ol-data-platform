---
# Hand-written: this unit has no Airbyte connection, so bin/airbyte-inventory.py
# cannot produce it. See docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: openedx
layer: s3
scope: scoped
strategies:
  qa: ingest
  local: fixture
loader: dlt
# The openedx code location lands one JSON Lines file per course version, and
# the load appends every file, so staging keeps the rows of each course's
# newest file. Same reasoning as edxorg/mysql. The document and transcript text
# tables are the static-file text extracted for MIT Learn's ContentFiles.
raw_metadata_column: _file_modified_at
table_prefix: raw__openedx__s3__
dlt:
  source_module: ol_dlt.sources.course_xml_blocks
  write_disposition: append
tables:
- name: raw__openedx__s3__course_xml_blocks
  raw_table: raw__openedx__s3__course_xml_blocks
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
- name: raw__openedx__s3__course_document_text
  raw_table: raw__openedx__s3__course_document_text
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
- name: raw__openedx__s3__course_transcript_text
  raw_table: raw__openedx__s3__course_transcript_text
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
