---
# Hand-written: a dlt source has no Airbyte connection, so
# bin/airbyte-inventory.py cannot produce this unit. See
# docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: edxorg
scope: singleton
layer: mysql
strategies:
  qa: mirror
  local: fixture
mirror_max_age_days: 90
loader: dlt
# `_file_modified_at` rather than `_dlt_load_id`: the load appends and the
# backfill walks the landing zone in whatever order it likes, so the load id
# records when a row was ingested, not which export it came from. Ordering
# staging by the source file's mtime is what picks the newest version of a
# record, and it is the only thing deduplicating these tables now that the
# load appends -- raw keeps every row of every export until the compaction
# pass exists.
#
# All seven production tables carry the column (Glue, 2026-10-07), which is
# what lets the QA mirror copy them: its allowlists have to name the dedup
# column, and the asset fails on an allowlisted column production lacks.
#
# courseware_studentmodule declares no `mirror:` block, so it is not copied.
# It holds 13.8B rows in 1,124 GB (current snapshot, 2026-10-07), and its
# `state` column is the learner's saved answer, which the staging model reads
# and no column mode masks. QA_DATA_TOPOLOGY_SPEC.md §8.
#
# Rows written under the old merge disposition carry a null here and lose the
# dedup to freshly stamped rows: Trino orders NULLS LAST in both directions,
# and a key with only old rows still yields its single row.
raw_metadata_column: _file_modified_at
table_prefix: raw__edxorg__s3__tables__
dlt:
  source_module: ol_dlt.sources.edxorg_s3
  write_disposition: append
tables:
- name: raw__edxorg__s3__tables__auth_user
  raw_table: raw__edxorg__s3__tables__auth_user
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
  mirror:
    columns:
      id: copy
      username: hash
      email: hash
      is_staff: copy
      is_active: copy
      is_superuser: copy
      last_login: copy
      date_joined: copy
      _file_modified_at: copy
- name: raw__edxorg__s3__tables__auth_userprofile
  raw_table: raw__edxorg__s3__tables__auth_userprofile
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
  mirror:
    columns:
      id: copy
      user_id: copy
      name: redact
      meta: nullify
      gender: copy
      year_of_birth: nullify
      level_of_education: copy
      goals: redact
      country: copy
      bio: redact
      _file_modified_at: copy
- name: raw__edxorg__s3__tables__certificates_generatedcertificate
  raw_table: raw__edxorg__s3__tables__certificates_generatedcertificate
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
  mirror:
    columns:
      id: copy
      user_id: copy
      download_url: nullify
      grade: copy
      course_id: copy
      key: hash
      status: copy
      verify_uuid: hash
      download_uuid: hash
      name: redact
      created_date: copy
      modified_date: copy
      mode: copy
      _file_modified_at: copy
- name: raw__edxorg__s3__tables__courseware_studentmodule
  raw_table: raw__edxorg__s3__tables__courseware_studentmodule
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
- name: raw__edxorg__s3__tables__grades_persistentcoursegrade
  raw_table: raw__edxorg__s3__tables__grades_persistentcoursegrade
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
  mirror:
    columns:
      course_id: copy
      user_id: copy
      grading_policy_hash: copy
      percent_grade: copy
      letter_grade: copy
      passed_timestamp: copy
      created: copy
      modified: copy
      _file_modified_at: copy
- name: raw__edxorg__s3__tables__student_courseaccessrole
  raw_table: raw__edxorg__s3__tables__student_courseaccessrole
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
  mirror:
    columns:
      org: copy
      course_id: copy
      user_id: copy
      role: copy
      _file_modified_at: copy
- name: raw__edxorg__s3__tables__student_courseenrollment
  raw_table: raw__edxorg__s3__tables__student_courseenrollment
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
  mirror:
    columns:
      id: copy
      user_id: copy
      course_id: copy
      created: copy
      is_active: copy
      mode: copy
      _file_modified_at: copy
