---
# Hand-written: a dlt source has no Airbyte connection, so
# bin/airbyte-inventory.py cannot produce this unit. See
# docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: edxorg
scope: singleton
layer: mysql
strategies:
  qa: omit
  local: fixture
loader: dlt
# TRANSITIONAL — remove once this unit has run once with
# `normalize.parquet_normalizer.add_dlt_load_id = true` (src/ol_dlt/.dlt/config.toml).
#
# These tables were loaded before that flag existed, so they carry no
# `_dlt_load_id` column and the 7 staging models that read them cannot order by
# it: dropping this line before a reload reinstates the exact COLUMN_NOT_FOUND
# that ol-data-platform#2443 was filed for. Explicit null means "no metadata
# column, do not deduplicate", which is what the tables actually support today.
#
# Deleting the line restores the loader default (`_dlt_load_id`). Safe to do the
# first time an edxorg_s3 load completes on the new config: the disposition is
# `merge`, so rows that predate the flag keep a null load id, and Trino orders
# NULLS LAST by default in both directions -- freshly stamped rows win the
# dedup, and a key with only old rows still yields its single row.
raw_metadata_column:
table_prefix: raw__edxorg__s3__tables__
dlt:
  source_module: ol_dlt.sources.edxorg_s3
  write_disposition: merge
tables:
- name: raw__edxorg__s3__tables__auth_user
  raw_table: raw__edxorg__s3__tables__auth_user
  sync_mode: full_refresh_overwrite
  modeled: true
- name: raw__edxorg__s3__tables__auth_userprofile
  raw_table: raw__edxorg__s3__tables__auth_userprofile
  sync_mode: full_refresh_overwrite
  modeled: true
- name: raw__edxorg__s3__tables__certificates_generatedcertificate
  raw_table: raw__edxorg__s3__tables__certificates_generatedcertificate
  sync_mode: full_refresh_overwrite
  modeled: true
- name: raw__edxorg__s3__tables__courseware_studentmodule
  raw_table: raw__edxorg__s3__tables__courseware_studentmodule
  sync_mode: full_refresh_overwrite
  modeled: true
- name: raw__edxorg__s3__tables__grades_persistentcoursegrade
  raw_table: raw__edxorg__s3__tables__grades_persistentcoursegrade
  sync_mode: full_refresh_overwrite
  modeled: true
- name: raw__edxorg__s3__tables__student_courseaccessrole
  raw_table: raw__edxorg__s3__tables__student_courseaccessrole
  sync_mode: full_refresh_overwrite
  modeled: true
- name: raw__edxorg__s3__tables__student_courseenrollment
  raw_table: raw__edxorg__s3__tables__student_courseenrollment
  sync_mode: full_refresh_overwrite
  modeled: true
