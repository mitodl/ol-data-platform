---
# Hand-written: a dlt source has no Airbyte connection, so
# bin/airbyte-inventory.py cannot produce this unit. See
# docs/specs/INGESTION_INVENTORY_SPEC.md §3.
#
# Split out of edxorg/course_structure because a different loader owns it: the
# edxorg code location parses these blocks out of the course archives, and
# ol_dlt.sources.course_xml_blocks loads the JSON Lines files it lands. The
# other course_structure tables have neither.
#
# raw__edxorg__s3__course_structure_blocks is the same arrangement for the
# un-nested course structure documents (edxorg/processed_data/course_blocks/).
# It replaced edxorg/s3's Airbyte-loaded raw__edxorg__s3__course_blocks (see
# retired.yml).
schema_version: 1
deployment: edxorg
scope: singleton
layer: course_xml
strategies:
  qa: mirror
  local: fixture
mirror_max_age_days: 90
loader: dlt
# The load appends one file per course version, so staging picks each block's
# newest copy by the file it came from. Same reasoning as edxorg/mysql.
raw_metadata_column: _file_modified_at
table_prefix: raw__edxorg__s3__course_
dlt:
  source_module: ol_dlt.sources.course_xml_blocks
  write_disposition: append
tables:
- name: raw__edxorg__s3__course_xml_blocks
  raw_table: raw__edxorg__s3__course_xml_blocks
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
- name: raw__edxorg__s3__course_structure_blocks
  raw_table: raw__edxorg__s3__course_structure_blocks
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
  mirror:
    columns:
      _file_modified_at: copy
      _source_file: copy
      block_id: copy
      course_id: copy
      block_type: copy
      block_index: copy
      block_title: copy
      block_parent: copy
      course_title: copy
      retrieved_at: copy
      block_details: copy
      block_content_hash: copy
      course_content_hash: copy
