    - ui_collectionedxendpoint
    - ui_edxendpoint
    - ui_encodejob
    - ui_moiralist
    - ui_video
    - ui_video_view_lists
    - ui_videofile
    - ui_videosubtitle
    - ui_videothumbnail
    - ui_youtubevideo
