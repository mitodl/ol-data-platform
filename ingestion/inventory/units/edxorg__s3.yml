---
# Generated from a live Airbyte snapshot by bin/airbyte-inventory.py, then
# resolved by hand. See docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: edxorg
scope: singleton
layer: s3
strategies:
  qa: mirror
  local: fixture
mirror_max_age_days: 90
loader: airbyte
table_prefix: raw__edxorg__
airbyte:
  source_kind: source-s3
  replication_method: n/a
  connections:
  - environment: production
    name: edx.org Production Course Structure→ S3 Data Lake
    status: active
    sync_interval_hours: 24
    streams:
    - raw__edxorg__s3__course_blocks
  - environment: production
    name: S3 edX.org Program Credentials → S3 Data Lake
    status: active
    sync_interval_hours: 24
    streams:
    - raw__edxorg__program_learner_report
tables:
- name: raw__edxorg__s3__course_blocks
  raw_table: raw__edxorg__s3__course_blocks
  sync_mode: incremental_append
  cursor_field:
  - _ab_source_file_last_modified
  modeled: true
  mirror:
    columns:
      _airbyte_extracted_at: copy
      block_id: copy
      course_id: copy
      block_type: copy
      block_index: copy
      block_title: copy
      block_parent: copy
      course_title: copy
      retrieved_at: copy
      block_details: copy
      block_content_hash: copy
      course_content_hash: copy
- name: raw__edxorg__program_learner_report
  raw_table: raw__edxorg__program_learner_report
  sync_mode: incremental_append
  cursor_field:
  - _ab_source_file_last_modified
  modeled: true
  raw_metadata_column:
  - _airbyte_extracted_at
  - _ab_source_file_last_modified
  mirror:
    columns:
      _airbyte_extracted_at: copy
      name: redact
      grade: copy
      track: copy
      user id: copy
      username: hash
      completed: copy
      user roles: copy
      course title: copy
      letter grade: copy
      program type: copy
      program uuid: copy
      program title: copy
      course run key: copy
      date completed: copy
      completed program: copy
      currently enrolled: copy
      last activity date: copy
      date first enrolled: copy
      purchased as bundle: copy
      date last unenrolled: copy
      authoring institution: copy
      course run start date: copy
      _ab_source_file_last_modified: copy
      date first upgraded to verified: copy
      date program certificate awarded: copy
    # Airbyte re-reads the same report files every day (their mtimes stop at
    # 2025-03-13) and appends ~15M rows per sync, 14.4B in all. The last day of
    # syncs is one full report. _airbyte_extracted_at is epoch milliseconds.
    where: >-
      _airbyte_extracted_at >=
      (SELECT max(_airbyte_extracted_at) FROM {source}) - 86400000
