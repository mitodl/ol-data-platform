---
# Hand-written: this unit has no Airbyte connection, so bin/airbyte-inventory.py
# cannot produce it. See docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: youtube
layer: api
scope: scoped
strategies:
  qa: ingest
  local: fixture
loader: dlt
table_prefix: raw__youtube__api__
# Each load pages through every configured playlist to its end, so a video or
# playlist missing from a load was removed.
history:
  absence: deleted
dlt:
  source_module: ol_dlt.sources.youtube
  write_disposition: merge
tables:
- name: raw__youtube__api__channels
  raw_table: raw__youtube__api__channels
  sync_mode: full_refresh_overwrite_deduped
  primary_key:
  - - channel_id
  modeled: true
- name: raw__youtube__api__playlists
  raw_table: raw__youtube__api__playlists
  sync_mode: full_refresh_overwrite_deduped
  primary_key:
  - - playlist_id
  modeled: true
- name: raw__youtube__api__playlist_items
  raw_table: raw__youtube__api__playlist_items
  sync_mode: full_refresh_overwrite_deduped
  primary_key:
  - - playlist_id
  - - video_id
  modeled: true
- name: raw__youtube__api__videos
  raw_table: raw__youtube__api__videos
  sync_mode: full_refresh_overwrite_deduped
  primary_key:
  - - video_id
  modeled: true
# Upserted by key: a transcript stays until it is fetched again, and each video
# has one status row (empty language_code) for the latest attempt. YouTube
# refuses production's transcript requests (IpBlocked), so in production it
# holds mostly blocked status rows until the official captions API replaces the
# scraper.
- name: raw__youtube__api__transcripts
  raw_table: raw__youtube__api__transcripts
  sync_mode: incremental_deduped_history
  cursor_field:
  - fetched_at
  primary_key:
  - - video_id
  - - language_code
  - - is_generated
  modeled: false
