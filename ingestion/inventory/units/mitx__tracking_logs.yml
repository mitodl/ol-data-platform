---
# Hand-written: a dlt source has no Airbyte connection, so
# bin/airbyte-inventory.py cannot produce this unit. See
# docs/specs/INGESTION_INVENTORY_SPEC.md §3.
#
# ol_dlt.sources.tracking_logs loads the MITx tracking log into
# raw__mitx__openedx__tracking_log_events. It replaced the Airbyte-loaded
# raw__mitx__openedx__tracking_logs, which stays in place as the archive (see
# retired.yml).
schema_version: 1
deployment: mitx
layer: tracking_logs
scope: scoped
strategies:
  qa: ingest
  local: fixture
loader: dlt
# The load appends each log file once. Staging dedups events on their
# business columns and reads new rows by _dlt_load_id, so this only orders
# copies of the same event.
raw_metadata_column: _file_modified_at
table_prefix: raw__mitx__openedx__tracking_log
dlt:
  source_module: ol_dlt.sources.tracking_logs
  write_disposition: append
tables:
- name: raw__mitx__openedx__tracking_log_events
  raw_table: raw__mitx__openedx__tracking_log_events
  sync_mode: incremental_append
  cursor_field:
  - _file_modified_at
  modeled: true
