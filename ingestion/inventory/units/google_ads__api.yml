  cursor_field:
  - snapshot_date
  primary_key:
  - - customer_id
  - - snapshot_date
  - - ad_group_criterion__resource_name
  modeled: false
- name: raw__google_ads__api__campaign_criterion_snapshots
  raw_table: raw__google_ads__api__campaign_criterion_snapshots
  sync_mode: incremental_deduped_history
  cursor_field:
  - snapshot_date
  primary_key:
  - - customer_id
  - - snapshot_date
  - - campaign_criterion__resource_name
  modeled: false
- name: raw__google_ads__api__campaign_shared_set_snapshots
  raw_table: raw__google_ads__api__campaign_shared_set_snapshots
