---
# Generated from a live Airbyte snapshot by bin/airbyte-inventory.py, then
# resolved by hand. See docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: xpro
layer: hubspot
scope: scoped
strategies:
  qa: omit
  local: fixture
loader: airbyte
table_prefix: raw__xpro__hubspot__
airbyte:
  source_kind: source-hubspot
  replication_method: n/a
  connections:
  - environment: production
    name: HubSpot xPro → S3 Data Lake
    status: inactive
    sync_interval_hours: 24
    streams:
    - campaigns
    - companies
    - companies_property_history
    - contact_lists
    - contacts
    - deal_pipelines
    - deal_splits
    - deals
    - deals_archived
    - deals_property_history
    - email_subscriptions
    - engagements_calls
    - engagements_emails
    - engagements_meetings
    - engagements_notes
    - engagements_tasks
    - leads
    - line_items
    - marketing_emails
    - products
    - workflows
tables:
- name: campaigns
  raw_table: raw__xpro__hubspot__campaigns
  sync_mode: incremental_deduped_history
  cursor_field:
  - lastUpdatedTime
  primary_key:
  - - id
  modeled: false
- name: companies
  raw_table: raw__xpro__hubspot__companies
  sync_mode: incremental_deduped_history
  cursor_field:
  - updatedAt
  primary_key:
  - - id
  modeled: false
- name: companies_property_history
  raw_table: raw__xpro__hubspot__companies_property_history
  sync_mode: incremental_deduped_history
  cursor_field:
  - timestamp
  primary_key:
  - - companyId
  - - property
  - - timestamp
  modeled: false
- name: contact_lists
  raw_table: raw__xpro__hubspot__contact_lists
  sync_mode: incremental_deduped_history
  cursor_field:
  - updatedAt
  primary_key:
  - - listId
  modeled: false
- name: contacts
  raw_table: raw__xpro__hubspot__contacts
  sync_mode: incremental_deduped_history
