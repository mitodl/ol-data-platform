---
# Generated from a live Airbyte snapshot by bin/airbyte-inventory.py, then
# resolved by hand. See docs/specs/INGESTION_INVENTORY_SPEC.md §3.
schema_version: 1
deployment: github
layer: api
scope: scoped
strategies:
  qa: omit
  local: fixture
loader: airbyte
table_prefix: raw__thirdparty__github__
airbyte:
  source_kind: source-github
  replication_method: n/a
  connections:
  - name: GitHub - MIT ODL → S3 Data Lake
    status: inactive
    sync_interval_hours: 24
    streams:
    - assignees
    - branches
    - collaborators
    - comments
    - commit_comment_reactions
    - commit_comments
    - commits
    - deployments
    - events
    - issue_comment_reactions
    - issue_events
    - issue_labels
    - issue_milestones
    - issue_reactions
    - issue_timeline_events
    - issues
    - organizations
    - project_cards
    - project_columns
    - projects
    - projects_v2
    - pull_request_comment_reactions
    - pull_request_commits
    - pull_request_stats
    - pull_requests
    - releases
    - repositories
    - review_comments
    - reviews
    - stargazers
    - tags
    - team_members
    - team_memberships
    - teams
    - users
    - workflow_jobs
    - workflows
tables:
- name: assignees
  raw_table: raw__thirdparty__github__assignees
  sync_mode: full_refresh_overwrite_deduped
  primary_key:
  - - id
  modeled: false
- name: branches
