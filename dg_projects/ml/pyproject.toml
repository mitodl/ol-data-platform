[project]
name = "ml"
requires-python = ">=3.14,<3.15"
version = "0.1.0"
dependencies = [
    "dagster>=1.12.10",
    "dagster-aws ~=0.29.0",
    "dagster-k8s>=0.27.15",
    "dagster-postgres>=0.27.13",
    "dagster-iceberg>=0.3.8",
    "httpx>=0.28",
    "httpx2 >= 2.2.0",
    "scikit-learn>=1.3",  # sklearn.cluster.HDBSCAN was added in 1.3
    # embeddings: OlLlmEmbedder and EmbeddingModelSpec for feedback_embeddings.
    "ol-orchestrate-lib[embeddings]",
    "polars<2.2",
    "umap-learn",
    "anthropic",
    "openai",
    "presidio-analyzer",
    "presidio-anonymizer",
    "spacy>=3.7",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "opik>=2.2.58",
    # anthropic for local runs on an API key, bedrock in deployed environments,
    # openai for OpenAI, Azure, and an OpenAI-compatible gateway, google for
    # Gemini embeddings on the Gemini API or Vertex AI.
    "ol-llm[anthropic,bedrock,google,openai]==0.0.13",
    "azure-identity>=1.25.3",
    "networkit>=11.2",
    "ahocorasick-rs>=1.0.3",
]

[project.entry-points]
"dagster.components" = { ml = "ml.lib"}

[dependency-groups]
dev = [
    "cyclopts>=5.2.0",
    "dagster-dg-cli>=1.12.10",
    "dagster-webserver",
    "pytest>=9.0.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["ml_tests"]
# Lets the tests import shared helpers as ml_tests.<module>.
pythonpath = ["."]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "ml.definitions"
project_name = "ml"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ml"

[tool.setuptools.packages.find]
exclude=["ml_tests"]

# The embedding strategies, the common-word list and the exported prompts are
# read from the installed package, and the image installs the project as a wheel.
[tool.setuptools.package-data]
ml = [
  "embedding_strategies.yaml",
  "lib/courseware/common_words.txt",
  "prompts/*.prompt.yaml",
]

[tool.uv.sources]
ol-orchestrate-lib = { path = "../../packages/ol-orchestrate-lib", editable = true }

# Override dagster-iceberg's <0.11 upper bound until upstream loosens it.
# See https://github.com/dagster-io/community-integrations/pull/289
#
# Pin grpcio-health-checking below 1.82.0: that release bundles health_pb2.py
# pre-generated with protobuf 7.35.0 gencode while declaring protobuf>=6.33.5,
# so it crashes at import time under dagster's required protobuf<7 (upstream
# metadata/gencode mismatch in the 1.82.0 release).
#
# Strip litellm: opik hard-requires it but the tracing and prompt paths never
# import it, and nothing in this location does. The embedding assets call Azure
# OpenAI through ol-llm, which needs openai, so only litellm is dropped from the
# list ol-llm's README gives.
#
# The rest replace the version caps (name<=X) opik puts on each of its
# dependencies, which come in through ol-llm's exact opik pin. Without them the
# lock downgrades to the capped versions. An override replaces every requirement
# on that package, so each entry restates the bounds the rest of this lock's
# graph puts on it. litellm has no cap entry because the slimming entry drops
# it. Regenerate them from the block in ol-llm's README when ol-llm moves to a
# new opik release:
# https://github.com/mitodl/ol-llm/blob/main/python/README.md#overriding-opiks-version-caps
[tool.uv]
override-dependencies = [
    "pyiceberg>=0.11.1",
    "grpcio-health-checking<1.82.0",
    "litellm; sys_platform == 'never'",
    "boto3-stubs[bedrock-runtime]>=1.34.110",
    "click>=8.2.1,<9",
    "httpx[http2]>=0.28,<1",
    "jinja2",
    "openai>=3.31.0",
    "orjson>=3.11.0; platform_python_implementation == 'CPython' and platform_machine in 'x86_64 AMD64 aarch64 arm64 ARM64 i686 x86' and (sys_platform != 'win32' or platform_machine != 'ARM64' or python_version >= '3.11')",
    "pydantic>=2.14.1,<2.15",
    "pydantic-settings>=2.0.0,!=2.9.0,<3",
    "pytest>=9.0.1,<10",
    "rapidfuzz>=3.0.0,<4",
    "rich>=13.8.0",
    "sentry-sdk>=2.66,<3",
    "tenacity>=8.5.0,<9.2.0",
    "tqdm>=4.38.0,<5",
    "tree-sitter>=0.23,<1.0; platform_machine != 'aarch64' or sys_platform != 'linux'",
    "tree-sitter-javascript>=0.23,<1.0; platform_machine != 'aarch64' or sys_platform != 'linux'",
    "tree-sitter-typescript>=0.23,<1.0; platform_machine != 'aarch64' or sys_platform != 'linux'",
    "uuid6",
    "watchfiles>=1.0.0,<2",
]

# Keep sqlalchemy below 2.1: 2.1 makes a bare postgresql:// URL default to
# psycopg 3, and dagster-postgres 1.13.24 breaks on it (bound NOTIFY payload,
# psycopg2-only pgcode, and set_pg_statement_timeout closing the connection).
# Tracked upstream in dagster-io/dagster#34232, #34235 and #33959.
constraint-dependencies = [
    "sqlalchemy<2.1",
    "certifi>=2026.10.19",  # eMudhra CA compromise: never resolve a certifi that trusts the compromised CAs
    "filelock>=4.2.1",  # GHSA-v4x8-3wr5-3wq8; litellm 1.108.0-1.108.2 capped it below 4
]
