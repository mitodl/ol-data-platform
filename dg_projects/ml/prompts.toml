# The version of each managed prompt that Production runs. Merging a change here
# moves Opik's production label (.github/workflows/prompt-promotion.yaml). Commit
# `ol-llm-prompts export prompts.toml`'s output with the change; it is the
# embedded default a run falls back to when Opik cannot be reached. See
# https://github.com/mitodl/ol-llm/blob/main/docs/prompt-promotion.md.
app = "dagster-ml"
exports = "ml/prompts"

[prompts]
feedback-summary = "v4"
