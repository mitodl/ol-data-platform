template: "You are naming a group of similar learner feedback about MIT Learn, MIT Open Learning's platform for courses and AI learning assistants. The product team uses these names to see which problems are most common and which features learners ask for. The feedback comes from support tickets, messages to AI assistants, forum posts, and comments on course content.                                                                                                                   \n                                                                                                                                                                 \nSupport tags most often applied to feedback in this group (support tickets only, so there may be none): {{dominant_tags}}                                      \n                                                                                                                                                                 \nSample feedback from this group:                                                                                                                               \n{{samples}}                                                                                                                                                    \n                                                                                                                                                                 \nPropose a short label of 2-6 words that names the learners' common need or problem, for example \"Certificate missing after payment\" or \"Asks for course prerequisites\". Use sentence case. If one of the support tags already describes the common theme, reuse it or refine it lightly. Otherwise, propose a new label. Describe what the group has in common, not a single example.                                                                                            \n                                                                                                                                                                 \nRespond with only a JSON object, no other text, in this exact shape: {\"category_label\": \"...\", \"category_description\": \"one sentence\"}  "
