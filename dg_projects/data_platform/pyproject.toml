[project]
name = "data-platform"
requires-python = ">=3.14,<3.15"
version = "0.1.0"
dependencies = [
    "dagster>=1.12.10",
    "dagster-k8s>=0.27.15",
    "dagster-postgres>=0.27.13",
    "ol-orchestrate-lib",
    # slack-sdk directly rather than dagster-slack: the only thing we used from
    # dagster-slack was make_slack_on_run_failure_sensor, and its sensor gives
    # no way to skip a tick, which is what retry suppression needs.
    "slack-sdk ~=3.36",
]

[project.entry-points]
"dagster.components" = { data_platform = "data_platform.lib"}

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.12.10",
    "dagster-webserver",
    "pytest>=9.0.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["data_platform_tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "data_platform.definitions"
project_name = "data-platform"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "data_platform"

[tool.setuptools.packages.find]
exclude=["data_platform_tests"]

[tool.uv.sources]
ol-orchestrate-lib = { path = "../../packages/ol-orchestrate-lib", editable = true }

# Pin grpcio-health-checking below 1.82.0: that release bundles health_pb2.py
# pre-generated with protobuf 7.35.0 gencode while declaring protobuf>=6.33.5,
# so it crashes at import time under dagster's required protobuf<7 (upstream
# metadata/gencode mismatch in the 1.82.0 release).
[tool.uv]
override-dependencies = [
    "grpcio-health-checking<1.82.0",
]
