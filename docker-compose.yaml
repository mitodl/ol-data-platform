    - ./dg_projects/data_loading/data_loading:/app/data_loading

  postgres:
    image: postgres
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
    - 5432
    environment:
      PGUSER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
      POSTGRES_DB: dagster
    volumes:
    - pgdata:/var/lib/postgresql

secrets:
  dbt_trino_username:
    environment: DBT_TRINO_USERNAME
  dbt_trino_password:
    environment: DBT_TRINO_PASSWORD

volumes:
  pgdata:
