---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: src/ol_superset/assets
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: check-toml
  - id: debug-statements
- repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
  rev: 0.2.3
  hooks:
  - id: yamlfmt
    exclude: src/ol_superset/assets
    args:
    - --mapping
    - '2'
    - --sequence
    - '2'
    - --offset
    - '0'
    - --width
    - '80'
    - --preserve-quotes
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0
  hooks:
  - id: yamllint
    language_version: "python3.13"
    exclude: src/ol_superset/assets
    args: [--format, parsable, -d, relaxed]
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    exclude: src/ol_superset/assets
    args:
    - --exclude-files
    - uv.lock
    - --exclude-files
    - src/ol_dbt/package-lock.yml
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 'v0.16.10'
  hooks:
  - id: ruff-format
  - id: ruff-check
    args: [--extend-ignore=D1, --fix]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.0
  hooks:
  - id: mypy
    args:
    - --explicit-package-bases
    - --namespace-packages
    - --scripts-are-modules
    - --config-file=pyproject.toml
    - --warn-unused-configs
    additional_dependencies:
    - pydantic
    - types-PyYAML
    - types-pytz
    - types-pymysql
    - types-requests
- repo: local
  hooks:
  - id: sqlfluff-fix
    name: sqlfluff-fix
    # Local hooks instead of sqlfluff's own, which can pass without linting anything
    # (see bin/sqlfluff-dbt-hook.py). Tool versions come from the sqlfluff group in
    # uv.lock. Single-process, because each run compiles the whole dbt project.
    entry: uv run --frozen --only-group sqlfluff python bin/sqlfluff-dbt-hook.py fix
      --show-lint-violations --disable-progress-bar
    language: system
    types: [sql]
    files: ^src/ol_dbt/(models|tests)/
    # Models and tests with findings from before these hooks worked. Remove a file
    # from this list once its findings are fixed.
    exclude: &sqlfluff_baseline |
      (?x)^src/ol_dbt/(models/(
      dimensional/afact_feedback_conversation|
      dimensional/afact_learner_courserun_daily_activity|
      dimensional/dim_certificate_type|
      dimensional/dim_contract|
      dimensional/dim_discount_type|
      dimensional/dim_feedback_category|
      dimensional/dim_payment_method|
      dimensional/dim_user|
      dimensional/tfact_certificate|
      dimensional/tfact_discussion_events|
      dimensional/tfact_enrollment|
      dimensional/tfact_enrollment_order|
      dimensional/tfact_grade|
      dimensional/tfact_order|
      dimensional/tfact_payment|
      integrations/learn/integrations__learn__youtube_channels|
      integrations/learn/integrations__learn__youtube_playlist_videos|
      integrations/learn/integrations__learn__youtube_playlists|
      intermediate/combined/int__combined__user_course_roles|
      intermediate/edxorg/int__edxorg__mitx_learn_course_best_runs|
      intermediate/edxorg/int__edxorg__mitx_learn_programs|
      intermediate/feedback/int__feedback__learn_ai_tutor|
      intermediate/learn-ai/int__learn_ai__chatbot|
      intermediate/mitxonline/int__mitxonline__program_requirements|
      intermediate/zendesk/int__zendesk__ticket|
      intermediate/zendesk/int__zendesk__ticket_comment|
      marts/combined/marts__combined__products|
      marts/combined/marts__combined__users|
      migration/edxorg_to_mitxonline_enrollments|
      reporting/chatbot_usage_report|
      reporting/combined_enrollments_with_gender_and_date|
      reporting/edxorg_mitlearn_user_mapping|
      reporting/enrollment_detail_report|
      reporting/mitxonline_video_engagements_w_video_counts|
      staging/zendesk/stg__zendesk__brand|
      staging/zendesk/stg__zendesk__group
      )|tests/assert_dim_user_identity_keys_cover_idless_learners)\.sql$
    require_serial: true
  - id: sqlfluff-lint
    name: sqlfluff-lint
    entry: uv run --frozen --only-group sqlfluff python bin/sqlfluff-dbt-hook.py lint
      --disable-progress-bar
    language: system
    types: [sql]
    files: ^src/ol_dbt/(models|tests)/
    exclude: *sqlfluff_baseline
    require_serial: true
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
  - id: zizmor
    args: [--no-progress, --min-severity=medium, --min-confidence=medium]
