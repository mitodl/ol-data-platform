---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: src/ol_superset/assets
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: check-toml
  - id: debug-statements
- repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
  rev: 0.2.3
  hooks:
  - id: yamlfmt
    exclude: src/ol_superset/assets
    args:
    - --mapping
    - '2'
    - --sequence
    - '2'
    - --offset
    - '0'
    - --width
    - '80'
    - --preserve-quotes
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0
  hooks:
  - id: yamllint
    language_version: "python3.13"
    exclude: src/ol_superset/assets
    args: [--format, parsable, -d, relaxed]
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    exclude: src/ol_superset/assets
    args:
    - --exclude-files
    - uv.lock
    - --exclude-files
    - src/ol_dbt/package-lock.yml
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 'v0.16.10'
  hooks:
  - id: ruff-format
  - id: ruff-check
    args: [--extend-ignore=D1, --fix]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.0
  hooks:
  - id: mypy
    args:
    - --explicit-package-bases
    - --namespace-packages
    - --scripts-are-modules
    - --config-file=pyproject.toml
    - --warn-unused-configs
    additional_dependencies:
    - pydantic
    - types-PyYAML
    - types-pytz
    - types-pymysql
    - types-requests
- repo: local
  hooks:
  - id: sqlfluff-fix
    name: sqlfluff-fix
    # Local hooks instead of sqlfluff's own, which can pass without linting anything
    # (see bin/sqlfluff-dbt-hook.py). Tool versions come from the sqlfluff group in
    # uv.lock. Single-process, because each run compiles the whole dbt project.
    entry: uv run --frozen --only-group sqlfluff python bin/sqlfluff-dbt-hook.py fix
      --show-lint-violations --disable-progress-bar
    language: system
    types: [sql]
    files: ^src/ol_dbt/(models|tests)/
    # Models with findings from before these hooks worked. Remove a file
    # from this list once its findings are fixed.
    exclude: &sqlfluff_baseline ^$
    require_serial: true
  - id: sqlfluff-lint
    name: sqlfluff-lint
    entry: uv run --frozen --only-group sqlfluff python bin/sqlfluff-dbt-hook.py lint
      --disable-progress-bar
    language: system
    types: [sql]
    files: ^src/ol_dbt/(models|tests)/
    exclude: *sqlfluff_baseline
    require_serial: true
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
  - id: zizmor
    args: [--no-progress, --min-severity=medium, --min-confidence=medium]
