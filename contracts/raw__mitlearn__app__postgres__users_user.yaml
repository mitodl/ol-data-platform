  - name: global_id
    dataType: VARCHAR
  - name: scim_external_id
    dataType: VARCHAR
  semantics:
  - name: hasOwner
    description: The table has at least one owner to route contract failures to.
    rule: '{"!!": [{"var": "owners.0"}]}'
    enabled: true
  - name: hasDescription
    description: The table has a description.
    rule: '{"!!": [{"var": "description"}]}'
    enabled: true
