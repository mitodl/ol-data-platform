# Installed as /etc/uv/uv.toml in images/marimo-jupyterlab and
# images/marimo-runtime, next to this package's wheel. Under uv's default
# first-index strategy, a package found here is never looked up on PyPI, so
# notebooks get the wheel built from the same commit as the image rather than
# the latest PyPI release (.github/workflows/publish_ol_notebook.yaml). Every
# other package still comes from PyPI.
[[index]]
name = "ol-notebook"
url = "/opt/ol-notebook/wheels"
format = "flat"
